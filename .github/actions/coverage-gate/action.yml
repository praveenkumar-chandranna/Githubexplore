name: Apex Coverage Gate
description: >
  Enforces a minimum Apex test coverage PER CLASS (every class and trigger in the
  deployment must individually reach the minimum). The minimum is an input, so it can
  be raised from 75 to 80 or 85 without touching this file. Hard-fails the pipeline,
  lists the failing classes, writes a summary to GitHub Actions and, on failure,
  posts the breakdown as a Jira comment.
  The gate is NOT enforced when the test level is NoTestRun (no tests ran, so there is
  no coverage to judge) and, in report-only mode, for retrieval branches (retrieve/...).

inputs:
  coverage-results-dir:
    description: Path to the coverage-results directory written by sf project deploy validate
    required: false
    default: coverage-results
  minimum-coverage:
    description: >
      Minimum coverage percentage that EACH class must reach (whole number 1-100).
      Default 75 (Lodha standard). Pass 80 or 85 to raise the bar.
    required: false
    default: '75'
  environment:
    description: Environment name (DEV / QA / UAT / PRODUCTION)
    required: true
  feature-branch:
    description: Feature branch / package name for context
    required: true
  test-level:
    description: >
      The Apex test level used for the deployment (NoTestRun, RunSpecifiedTests, RunLocalTests, ...).
      When this is NoTestRun the gate is not enforced. Leave blank if unknown (the gate is then enforced).
    required: false
    default: ''
  non-blocking-branch-prefixes:
    description: >
      Comma-separated branch prefixes for which coverage is reported but never blocks
      (case-insensitive). Default retrieve/ covers the branches created by the retrieval pipeline.
      Set to an empty string to enforce on every branch.
    required: false
    default: 'retrieve/'
  jira-base-url:
    description: Jira base URL (for example https://yourorg.atlassian.net)
    required: false
    default: ''
  jira-user-email:
    description: Jira user email for API auth
    required: false
    default: ''
  jira-api-token:
    description: Jira API token
    required: false
    default: ''
  jira-ticket:
    description: Jira ticket key to comment on (for example LODHA-123). Auto-extracted from the branch name if blank.
    required: false
    default: ''
  run-id:
    description: GitHub Actions run ID
    required: false
    default: ''
  repo:
    description: GitHub repository (owner/repo)
    required: false
    default: ''

outputs:
  coverage-pct:
    description: Overall coverage percentage (informational - the gate is per class)
    value: ${{ steps.gate.outputs.coverage_pct }}
  passed:
    description: 'true when every class meets the minimum, false when one or more do not, error when the coverage file could not be read'
    value: ${{ steps.gate.outputs.passed }}
  failed-count:
    description: Number of classes below the minimum
    value: ${{ steps.gate.outputs.failed_count }}
  failed-classes:
    description: Comma-separated names of the classes below the minimum
    value: ${{ steps.gate.outputs.failed_classes }}
  enforced:
    description: 'true when the gate could block the run, false when it was skipped or report-only'
    value: ${{ steps.gate.outputs.enforced }}
  skip-reason:
    description: Why the gate was not enforced (empty when it was)
    value: ${{ steps.gate.outputs.skip_reason }}

runs:
  using: composite
  steps:

    # ── Step 1: Parse coverage JSON, enforce the PER-CLASS gate, build report ──
    - name: Evaluate per-class coverage (minimum ${{ inputs.minimum-coverage }}% each)
      id: gate
      shell: bash
      env:
        COVERAGE_DIR:     ${{ inputs.coverage-results-dir }}
        MIN_COVERAGE:     ${{ inputs.minimum-coverage }}
        ENVIRONMENT:      ${{ inputs.environment }}
        FEATURE_BRANCH:   ${{ inputs.feature-branch }}
        TEST_LEVEL:       ${{ inputs.test-level }}
        NON_BLOCKING_PREFIXES: ${{ inputs.non-blocking-branch-prefixes }}
        RUN_ID:           ${{ inputs.run-id }}
        REPO:             ${{ inputs.repo }}
      run: |
        # ── Case 1: NoTestRun → no Apex tests ran, so there is no coverage to judge ──
        TL="${TEST_LEVEL//[[:space:]]/}"
        if [[ "${TL,,}" == "notestrun" ]]; then
          echo "ℹ️  Test level is NoTestRun — no Apex tests were run, so coverage is not enforced."
          {
            echo "coverage_pct=not-run"
            echo "passed=true"
            echo "failed_count=0"
            echo "failed_classes="
            echo "enforced=false"
            echo "skip_reason=Test level is NoTestRun"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## 📊 Apex Test Coverage Report"
            echo ""
            echo "ℹ️ **Coverage gate not enforced** — test level is \`NoTestRun\` (environment: \`${ENVIRONMENT}\`)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # ── Case 2: retrieval branches (retrieve/...) → report coverage, never block ──
        ENFORCE=true
        REASON=""
        IFS=',' read -ra _PREFIXES <<< "$NON_BLOCKING_PREFIXES"
        for _P in "${_PREFIXES[@]}"; do
          _P="${_P//[[:space:]]/}"
          [[ -z "$_P" ]] && continue
          if [[ "${FEATURE_BRANCH,,}" == "${_P,,}"* ]]; then
            ENFORCE=false
            REASON="Branch '${FEATURE_BRANCH}' matches non-blocking prefix '${_P}'"
            break
          fi
        done
        export ENFORCE REASON
        [[ "$ENFORCE" == "false" ]] && echo "ℹ️  ${REASON} — coverage will be REPORTED but will not block."

        # ── Validate the threshold ───────────────────────────────────────────
        MIN_COVERAGE="${MIN_COVERAGE//[[:space:]]/}"
        if ! [[ "$MIN_COVERAGE" =~ ^[0-9]+$ ]] || (( 10#$MIN_COVERAGE < 1 || 10#$MIN_COVERAGE > 100 )); then
          echo "::error title=Coverage gate::minimum-coverage must be a whole number between 1 and 100 (got '${MIN_COVERAGE}')"
          echo "passed=error" >> "$GITHUB_OUTPUT"
          echo "enforced=$ENFORCE" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        MIN_COVERAGE=$((10#$MIN_COVERAGE))
        export MIN_COVERAGE

        # ── Locate the coverage JSON (prefer coverage*.json; never abort if the folder is missing)
        echo "🔍 Locating coverage file in: $COVERAGE_DIR"
        COVERAGE_FILE=$(find "$COVERAGE_DIR" -name "coverage*.json" 2>/dev/null | sort | head -1 || true)
        [[ -z "$COVERAGE_FILE" ]] && COVERAGE_FILE=$(find "$COVERAGE_DIR" -name "*.json" 2>/dev/null | sort | head -1 || true)
        [[ -z "$COVERAGE_FILE" ]] && COVERAGE_FILE=$(find . -name "coverage*.json" -not -path "./node_modules/*" 2>/dev/null | sort | head -1 || true)

        if [[ -z "$COVERAGE_FILE" ]]; then
          echo "⚠️  No coverage JSON found — nothing to check, gate skipped"
          {
            echo "coverage_pct=unknown"
            echo "passed=true"
            echo "failed_count=0"
            echo "failed_classes="
            echo "enforced=$ENFORCE"
            echo "skip_reason=$REASON"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "📄 Coverage file: $COVERAGE_FILE"
        export COVERAGE_FILE

        # ── Evaluate every class against the minimum ────────────────────────
        python3 - <<'PY'
        import json, os, sys, uuid

        path     = os.environ["COVERAGE_FILE"]
        min_cov  = int(os.environ["MIN_COVERAGE"])
        env_name = os.environ.get("ENVIRONMENT", "")
        branch   = os.environ.get("FEATURE_BRANCH", "")
        run_id   = os.environ.get("RUN_ID", "")
        repo     = os.environ.get("REPO", "")
        actor    = os.environ.get("GITHUB_ACTOR", "")
        out_file = os.environ.get("GITHUB_OUTPUT")
        sum_file = os.environ.get("GITHUB_STEP_SUMMARY")
        enforce  = os.environ.get("ENFORCE", "true") == "true"
        reason   = os.environ.get("REASON", "")


        def set_output(name, value):
            if not out_file:
                return
            value = str(value)
            with open(out_file, "a", encoding="utf-8") as fh:
                if "\n" in value:
                    delim = "EOF_" + uuid.uuid4().hex
                    fh.write(name + "<<" + delim + "\n" + value + "\n" + delim + "\n")
                else:
                    fh.write(name + "=" + value + "\n")


        set_output("enforced", "true" if enforce else "false")
        set_output("skip_reason", reason)


        def class_name(key):
            n = key.replace("\\", "/")
            if n.startswith("no-map/"):
                n = n[len("no-map/"):]
            n = n.rsplit("/", 1)[-1]
            for ext in (".cls", ".trigger"):
                if n.endswith(ext):
                    n = n[: -len(ext)]
            return n


        def covered_total(entry):
            """(covered, total) for a coverage entry, or None if the format is not recognised."""
            if not isinstance(entry, dict):
                return None
            s = entry.get("s")                       # Istanbul: {"s": {"0": 1, "1": 0, ...}}
            if isinstance(s, dict):
                vals = [v for v in s.values() if isinstance(v, (int, float))]
                return sum(1 for v in vals if v > 0), len(vals)
            lines = entry.get("lines")               # Salesforce native: {"lines": {"covered": 10, "total": 12}}
            if isinstance(lines, dict):
                if "covered" in lines and "total" in lines:
                    return int(lines["covered"] or 0), int(lines["total"] or 0)
                vals = [v for v in lines.values() if isinstance(v, (int, float))]
                if vals:
                    return sum(1 for v in vals if v > 0), len(vals)
            return None


        def fail_format(msg):
            set_output("coverage_pct", "unknown")
            set_output("failed_count", "0")
            set_output("failed_classes", "")
            if not enforce:
                print("::warning title=Coverage gate (report only)::" + msg)
                set_output("passed", "true")
                sys.exit(0)
            print("::error title=Coverage gate::" + msg)
            set_output("passed", "error")
            sys.exit(1)


        try:
            with open(path, encoding="utf-8") as fh:
                data = json.load(fh)
        except Exception as exc:
            fail_format("Cannot read coverage file " + path + ": " + str(exc))

        if not isinstance(data, dict):
            fail_format("Unrecognised coverage JSON (top level is not an object): " + path)

        rows, unrecognised = [], 0
        for key, entry in data.items():
            ct = covered_total(entry)
            if ct is None:
                unrecognised += 1
                continue
            covered, total = ct
            if total <= 0:
                continue
            rows.append({"name": class_name(key), "covered": covered, "total": total,
                         "pct": covered * 100 // total})          # floor: 74.9% counts as 74%

        if not rows:
            if unrecognised:
                first = next(iter(data))
                keys = ", ".join(sorted(data[first].keys())) if isinstance(data[first], dict) else type(data[first]).__name__
                fail_format("Unrecognised coverage JSON format. First entry '" + str(first) + "' has keys: " + keys)
            print("⚠️  Coverage file has no Apex classes with executable lines — gate skipped")
            set_output("coverage_pct", "skipped")
            set_output("passed", "true")
            set_output("failed_count", "0")
            set_output("failed_classes", "")
            sys.exit(0)

        rows.sort(key=lambda r: (r["pct"], r["name"]))            # weakest first
        failed = [r for r in rows if r["pct"] < min_cov]
        tot_cov = sum(r["covered"] for r in rows)
        tot_all = sum(r["total"] for r in rows)
        overall = tot_cov * 100 // tot_all

        # ── Console report ──────────────────────────────────────────────────
        print("")
        print("=" * 62)
        print("APEX COVERAGE GATE — " + env_name + "  (each class must reach " + str(min_cov) + "%)"
              + ("" if enforce else "  [REPORT ONLY]"))
        print("=" * 62)
        for r in rows:
            icon = "❌" if r["pct"] < min_cov else "✅"
            print("  %s %-42s %5d/%-5d %3d%%" % (icon, r["name"], r["covered"], r["total"], r["pct"]))
        print("=" * 62)
        print("  Classes checked : %d" % len(rows))
        print("  Below %d%%       : %d" % (min_cov, len(failed)))
        print("  Overall (info)  : %d%%  (%d/%d lines)" % (overall, tot_cov, tot_all))
        print("=" * 62)

        # ── GitHub step summary ─────────────────────────────────────────────
        run_url = "https://github.com/" + repo + "/actions/runs/" + run_id
        md_rows = "\n".join(
            "| %s %s | %d/%d | %d%% | %s |" % ("❌" if r["pct"] < min_cov else "✅", r["name"], r["covered"], r["total"], r["pct"],
                                                "Below " + str(min_cov) + "%" if r["pct"] < min_cov else "OK")
            for r in rows)
        summary = [
            "## 📊 Apex Test Coverage Report",
            "",
            "| Field | Value |",
            "|---|---|",
            "| **Environment** | `" + env_name + "` |",
            "| **Package** | `" + branch + "` |",
            "| **Deployed by** | " + actor + " |",
            "| **Minimum per class** | **" + str(min_cov) + "%** (repo variable `APEX_COVERAGE_MIN`) |",
            "| **Mode** | " + ("Enforced" if enforce else "ℹ️ Report only — " + reason) + " |",
            "| **Classes checked** | " + str(len(rows)) + " |",
            "| **Classes below minimum** | **" + str(len(failed)) + "** |",
            "| **Overall (informational)** | " + str(overall) + "% (" + str(tot_cov) + "/" + str(tot_all) + " lines) |",
            "| **Workflow Run** | [" + run_id + "](" + run_url + ") |",
            "",
        ]
        if failed and not enforce:
            summary.append("### ℹ️ Coverage NOT enforced — %d class(es) are below %d%%" % (len(failed), min_cov))
            summary.append("")
            summary.append("Failing: " + ", ".join("`%s` (%d%%)" % (r["name"], r["pct"]) for r in failed))
        elif failed:
            summary.append("### ❌ Coverage gate FAILED — %d class(es) below %d%%" % (len(failed), min_cov))
            summary.append("")
            summary.append("Failing: " + ", ".join("`%s` (%d%%)" % (r["name"], r["pct"]) for r in failed))
        else:
            summary.append("### ✅ Coverage gate PASSED — every class is at or above %d%%" % min_cov)
        summary += ["", "### Per-Class Breakdown (weakest first)", "",
                    "| Class | Lines Covered | Coverage | Status |", "|---|---|---|---|", md_rows, ""]
        if sum_file:
            with open(sum_file, "a", encoding="utf-8") as fh:
                fh.write("\n".join(summary) + "\n")

        # ── Outputs ─────────────────────────────────────────────────────────
        jira_src = failed + [r for r in rows if r["pct"] >= min_cov] if len(rows) <= 150 else failed
        jira_rows = "\n".join(
            "|%s|%d/%d|%d%%|%s|" % (r["name"], r["covered"], r["total"], r["pct"], "FAIL" if r["pct"] < min_cov else "PASS")
            for r in jira_src)
        set_output("coverage_pct", overall)
        set_output("failed_count", len(failed))
        set_output("failed_classes", ",".join(r["name"] for r in failed))
        set_output("class_table", md_rows)
        set_output("jira_table", jira_rows)
        set_output("passed", "false" if (failed and enforce) else "true")

        if failed and not enforce:
            print("::warning title=Apex coverage (report only)::%d class(es) below %d%% — not blocking: %s"
                  % (len(failed), min_cov, ", ".join("%s (%d%%)" % (r["name"], r["pct"]) for r in failed)))
            print("")
            print("ℹ️  REPORT ONLY: %d class(es) are below %d%% but the gate is not enforced (%s)." % (len(failed), min_cov, reason))
            sys.exit(0)
        if failed:
            print("::error title=Apex coverage gate::%d class(es) below %d%%: %s"
                  % (len(failed), min_cov, ", ".join("%s (%d%%)" % (r["name"], r["pct"]) for r in failed)))
            print("")
            print("❌ HARD GATE: every class must reach %d%% — %d class(es) are below it." % (min_cov, len(failed)))
            sys.exit(1)
        print("✅ Coverage gate passed: all %d classes are at or above %d%%" % (len(rows), min_cov))
        PY

    # ── Step 2: Post the failing-class breakdown to Jira ─────────────────────
    # always() is required: the gate step exits 1 on failure, and without a status
    # function GitHub adds an implicit success() that would skip this step.
    - name: Post coverage breakdown to Jira
      if: always() && inputs.jira-base-url != '' && inputs.jira-api-token != '' && steps.gate.outputs.passed == 'false'
      shell: bash
      env:
        JIRA_BASE_URL:   ${{ inputs.jira-base-url }}
        JIRA_EMAIL:      ${{ inputs.jira-user-email }}
        JIRA_TOKEN:      ${{ inputs.jira-api-token }}
        JIRA_TICKET:     ${{ inputs.jira-ticket }}
        FEATURE_BRANCH:  ${{ inputs.feature-branch }}
        ENVIRONMENT:     ${{ inputs.environment }}
        COVERAGE_PCT:    ${{ steps.gate.outputs.coverage_pct }}
        FAILED_COUNT:    ${{ steps.gate.outputs.failed_count }}
        FAILED_CLASSES:  ${{ steps.gate.outputs.failed_classes }}
        JIRA_TABLE:      ${{ steps.gate.outputs.jira_table }}
        MIN_COVERAGE:    ${{ inputs.minimum-coverage }}
        RUN_ID:          ${{ inputs.run-id }}
        REPO:            ${{ inputs.repo }}
      run: |
        # Auto-extract the ticket from the branch name if not provided
        TICKET="$JIRA_TICKET"
        if [[ -z "$TICKET" ]]; then
          TICKET=$(echo "$FEATURE_BRANCH" | grep -oP '[A-Z]+-\d+' | head -1 || true)
        fi
        if [[ -z "$TICKET" ]]; then
          echo "⚠️  No Jira ticket found — skipping Jira comment"
          exit 0
        fi

        RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
        REPORT_DATE=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')

        BODY_FILE=$(mktemp)
        {
          printf '*📊 Apex Coverage Gate — %s* ❌ FAILED\n\n' "$ENVIRONMENT"
          printf '|| Field || Value ||\n'
          printf '| Environment | %s |\n' "$ENVIRONMENT"
          printf '| Package | %s |\n' "$FEATURE_BRANCH"
          printf '| Minimum per class | *%s%%* |\n' "$MIN_COVERAGE"
          printf '| Classes below minimum | *%s* |\n' "$FAILED_COUNT"
          printf '| Failing classes | %s |\n' "${FAILED_CLASSES//,/, }"
          printf '| Overall (informational) | %s%% |\n' "$COVERAGE_PCT"
          printf '| Reported at | %s |\n' "$REPORT_DATE"
          printf '| Workflow Run | [%s|%s] |\n\n' "$RUN_ID" "$RUN_URL"
          printf '*Per-Class Breakdown (failing classes first)*\n\n'
          printf '||Class||Lines Covered||Coverage||Status||\n'
          printf '%s\n' "$JIRA_TABLE"
        } > "$BODY_FILE"

        PAYLOAD_FILE=$(mktemp)
        python3 -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))' < "$BODY_FILE" > "$PAYLOAD_FILE"

        echo "📝 Posting coverage comment to Jira ticket: $TICKET"
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST \
          -u "${JIRA_EMAIL}:${JIRA_TOKEN}" \
          -H "Content-Type: application/json" \
          "${JIRA_BASE_URL}/rest/api/2/issue/${TICKET}/comment" \
          --data-binary @"$PAYLOAD_FILE" || echo "000")
        rm -f "$BODY_FILE" "$PAYLOAD_FILE"

        if [[ "$HTTP_CODE" == "201" ]]; then
          echo "✅ Coverage comment posted to ${TICKET}"
        else
          echo "⚠️  Jira comment failed (HTTP ${HTTP_CODE}) — non-blocking"
        fi
