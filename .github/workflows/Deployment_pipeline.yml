name: Lodha Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      Feature_Branch:
        type: string
        description: >
          Branch name(s) to deploy. Single: feature/LODHA-123  |  Multiple: feature/LODHA123,feature/LODHA4321
        required: true
      environment:
        type: choice
        description: Deployment environment
        options:
          - DEV
          - QA
          - UAT
          - PRODUCTION
          - HOTFIX
        default: DEV
        required: true
      testlevel:
        type: choice
        description: Test class run level
        options:
          - RunLocalTests
          - RunSpecifiedTests
          - RunAllTestsInOrg
        default: RunSpecifiedTests
        required: true

jobs:
  Deployment_Build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SF_LOGIN_URL_TEST: ${{ secrets.SANDBOX_URL }}
      SF_LOGIN_URL_PROD: ${{ secrets.LOGIN_URL }}
      SF_ALIAS: lodhaOrg

    if: >
      (github.event_name == 'workflow_dispatch' &&
       (
         (github.ref == 'refs/heads/DEV' && github.event.inputs.environment == 'DEV') ||
         (github.ref == 'refs/heads/QA' && github.event.inputs.environment == 'QA') ||
         (github.ref == 'refs/heads/UAT' && github.event.inputs.environment == 'UAT') ||
         (github.ref == 'refs/heads/main' && github.event.inputs.environment == 'PRODUCTION') ||
         (github.ref == 'refs/heads/main' && github.event.inputs.environment == 'HOTFIX')
       ))

    outputs:
      deploy_package: ${{ steps.resolve-package.outputs.deploy_package }}
      environment: ${{ steps.set-env.outputs.environment }}
      tag_name: ${{ steps.release-tag.outputs.tag_name }}
      run_id: ${{ steps.set-run-meta.outputs.run_id }}
      actor: ${{ steps.set-run-meta.outputs.actor }}
      ref_name: ${{ steps.set-run-meta.outputs.ref_name }}
      repo: ${{ steps.set-run-meta.outputs.repo }}
      source_branches: ${{ steps.resolve-package.outputs.source_branches }}

    steps:
      - name: Validate branch-environment consistency
        id: set-run-meta
        shell: bash
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_FEATURE: ${{ github.event.inputs.Feature_Branch }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "Manual run: Environment=${INPUT_ENV}, Package(s)=${INPUT_FEATURE}"
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "actor=${ACTOR}" >> $GITHUB_OUTPUT
          echo "ref_name=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "repo=${REPO}" >> $GITHUB_OUTPUT

      - name: Set environment variables
        id: set-env
        shell: bash
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_TESTLEVEL: ${{ github.event.inputs.testlevel }}
        run: |
          echo "ENVIRONMENT=$INPUT_ENV" >> $GITHUB_ENV
          echo "environment=$INPUT_ENV" >> $GITHUB_OUTPUT
          echo "TEST_LEVEL=$INPUT_TESTLEVEL" >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Consolidate or Resolve Package
        id: resolve-package
        shell: bash
        env:
          FEATURE_INPUT: ${{ github.event.inputs.Feature_Branch }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          MANIFEST_DIR: ${{ github.workspace }}/manifest/feature
          OUTPUT_DIR: ${{ github.workspace }}/manifest
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          FEATURE_INPUT=$(echo "$FEATURE_INPUT" | xargs)

          if [[ "$FEATURE_INPUT" == *","* ]]; then
            echo "📦 Multiple branches detected — consolidating..."

            RELEASE_DATE=$(TZ='Asia/Kolkata' date +'%d%m%Y_%H%M')
            OUTPUT_NAME="Release_${ENVIRONMENT}_${RELEASE_DATE}"
            OUTPUT_PKG="${OUTPUT_DIR}/${OUTPUT_NAME}_package.xml"
            OUTPUT_TEST="${OUTPUT_DIR}/${OUTPUT_NAME}_TestClass.txt"

            echo "=========================================="
            echo "PACKAGE CONSOLIDATION"
            echo "=========================================="
            echo "Environment : $ENVIRONMENT"
            echo "Branches    : $FEATURE_INPUT"
            echo "Output      : $OUTPUT_NAME"
            echo "=========================================="

            IFS=',' read -ra BRANCHES <<< "$FEATURE_INPUT"

            echo ""
            echo "🔍 Validating input files..."
            for BRANCH in "${BRANCHES[@]}"; do
              BRANCH=$(echo "$BRANCH" | xargs)
              PKG_FILE="${OUTPUT_DIR}/${BRANCH}_package.xml"
              if [[ ! -f "$PKG_FILE" ]]; then
                echo "❌ Package file not found: $PKG_FILE"
                exit 1
              fi
              echo "  ✅ Found: ${BRANCH}_package.xml"
            done

            MAX_VERSION="0"
            ALL_MEMBERS_RAW=""

            for BRANCH in "${BRANCHES[@]}"; do
              BRANCH=$(echo "$BRANCH" | xargs)
              PKG_FILE="${OUTPUT_DIR}/${BRANCH}_package.xml"
              echo "  Processing: ${BRANCH}_package.xml"

              VERSION=$(grep -oP '(?<=<version>)[^<]+' "$PKG_FILE" || echo "0")
              if awk "BEGIN {exit !($VERSION > $MAX_VERSION)}"; then
                MAX_VERSION="$VERSION"
              fi

              IN_BLOCK=0
              CUR_TYPE=""
              CUR_MEMBERS=""
              while IFS= read -r LINE; do
                LINE=$(echo "$LINE" | sed 's/^[[:space:]]*//')
                if echo "$LINE" | grep -q '<types>'; then
                  IN_BLOCK=1; CUR_TYPE=""; CUR_MEMBERS=""
                elif [[ $IN_BLOCK -eq 1 ]]; then
                  if echo "$LINE" | grep -q '<name>'; then
                    CUR_TYPE=$(echo "$LINE" | grep -oP '(?<=<name>)[^<]+')
                  elif echo "$LINE" | grep -q '<members>'; then
                    M=$(echo "$LINE" | grep -oP '(?<=<members>)[^<]+')
                    CUR_MEMBERS+="$M"$'\n'
                  elif echo "$LINE" | grep -q '</types>'; then
                    if [[ -n "$CUR_TYPE" ]]; then
                      while IFS= read -r MEMBER; do
                        [[ -n "$MEMBER" ]] && ALL_MEMBERS_RAW+="${CUR_TYPE}|||${MEMBER}"$'\n'
                      done <<< "$CUR_MEMBERS"
                    fi
                    IN_BLOCK=0; CUR_TYPE=""; CUR_MEMBERS=""
                  fi
                fi
              done < "$PKG_FILE"
            done

            printf '<?xml version="1.0" encoding="UTF-8"?>\n' > "$OUTPUT_PKG"
            printf '<Package xmlns="http://soap.sforce.com/2006/04/metadata">\n' >> "$OUTPUT_PKG"

            SORTED_TYPES=$(echo "$ALL_MEMBERS_RAW" | grep -v '^$' | cut -d'|' -f1 | sort -u)
            while IFS= read -r TYPE_NAME; do
              [[ -z "$TYPE_NAME" ]] && continue
              printf '    <types>\n' >> "$OUTPUT_PKG"
              echo "$ALL_MEMBERS_RAW" | grep -v '^$' | grep -F "${TYPE_NAME}|||" | cut -d'|' -f4 | sort -u | while read -r MEMBER; do
                [[ -n "$MEMBER" ]] && printf '        <members>%s</members>\n' "$MEMBER" >> "$OUTPUT_PKG"
              done
              printf '        <name>%s</name>\n' "$TYPE_NAME" >> "$OUTPUT_PKG"
              printf '    </types>\n' >> "$OUTPUT_PKG"
            done <<< "$SORTED_TYPES"

            printf '    <version>%s</version>\n' "$MAX_VERSION" >> "$OUTPUT_PKG"
            printf '</Package>\n' >> "$OUTPUT_PKG"

            ALL_TESTS=""
            for BRANCH in "${BRANCHES[@]}"; do
              BRANCH=$(echo "$BRANCH" | xargs)
              TEST_FILE="${OUTPUT_DIR}/${BRANCH}_TestClass.txt"
              if [[ -f "$TEST_FILE" ]]; then
                CONTENT=$(cat "$TEST_FILE" | tr ' ' '\n' | tr ',' '\n')
                ALL_TESTS+=$'\n'"$CONTENT"
              fi
            done

            UNIQUE_TESTS=$(echo "$ALL_TESTS" | sort -u | grep -v '^$' | tr '\n' ' ' | xargs)
            [[ -n "$UNIQUE_TESTS" ]] && echo "$UNIQUE_TESTS" > "$OUTPUT_TEST"

            echo ""
            echo "=========================================="
            echo "📦 CONSOLIDATED PACKAGE.XML"
            echo "=========================================="
            cat "$OUTPUT_PKG"
            if [[ -f "$OUTPUT_TEST" ]]; then
              echo ""
              echo "=========================================="
              echo "🧪 CONSOLIDATED TESTCLASS.TXT"
              echo "=========================================="
              cat "$OUTPUT_TEST"
            fi

            echo "FEATURE_BRANCH=${OUTPUT_NAME}" >> $GITHUB_ENV
            echo "deploy_package=${OUTPUT_NAME}" >> $GITHUB_OUTPUT
            echo "source_branches=${FEATURE_INPUT}" >> $GITHUB_OUTPUT
            echo "✅ Consolidation complete: $OUTPUT_NAME"
            echo ""
            echo "=========================================="
            echo "🌿 SOURCE FEATURE BRANCHES"
            echo "=========================================="
            IFS=',' read -ra DISPLAY_BRANCHES <<< "$FEATURE_INPUT"
            for B in "${DISPLAY_BRANCHES[@]}"; do
              echo "  - $(echo "$B" | xargs)"
            done
            echo "=========================================="

          else
            echo "📄 Single branch detected — using directly: $FEATURE_INPUT"
            echo "FEATURE_BRANCH=${FEATURE_INPUT}" >> $GITHUB_ENV
            echo "deploy_package=${FEATURE_INPUT}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf --version

      - name: Generate JWT private key file
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
          chmod 600 server.key

      - name: Set org credentials and login URL based on environment
        id: set-org
        shell: bash
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          SF_LOGIN_URL_TEST_VAL: ${{ env.SF_LOGIN_URL_TEST }}
          SF_LOGIN_URL_PROD_VAL: ${{ env.SF_LOGIN_URL_PROD }}
          KEY_DEV: ${{ secrets.SALESFORCE_CONSUMER_KEY_DEV }}
          KEY_QA: ${{ secrets.SALESFORCE_CONSUMER_KEY_QA }}
          KEY_UAT: ${{ secrets.SALESFORCE_CONSUMER_KEY_UAT }}
          KEY_PROD: ${{ secrets.SALESFORCE_CONSUMER_KEY_PROD }}
          KEY_HOTFIX: ${{ secrets.SALESFORCE_CONSUMER_KEY_HOTFIX }}
          USER_DEV: ${{ secrets.SFDX_AUTH_DEV_USERNAME }}
          USER_QA: ${{ secrets.SFDX_AUTH_QA_USERNAME }}
          USER_UAT: ${{ secrets.SFDX_AUTH_UAT_USERNAME }}
          USER_PROD: ${{ secrets.SFDX_AUTH_PROD_USERNAME }}
          USER_HOTFIX: ${{ secrets.SFDX_AUTH_HOTFIX_USERNAME }}
        run: |
          case "$ENVIRONMENT" in
            DEV)        echo "CLIENT_ID=$KEY_DEV"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_DEV"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            QA)         echo "CLIENT_ID=$KEY_QA"     >> $GITHUB_OUTPUT; echo "USERNAME=$USER_QA"     >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            UAT)        echo "CLIENT_ID=$KEY_UAT"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_UAT"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            PRODUCTION) echo "CLIENT_ID=$KEY_PROD"   >> $GITHUB_OUTPUT; echo "USERNAME=$USER_PROD"   >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_PROD_VAL" >> $GITHUB_OUTPUT ;;
            HOTFIX)     echo "CLIENT_ID=$KEY_HOTFIX" >> $GITHUB_OUTPUT; echo "USERNAME=$USER_HOTFIX" >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            *) echo "Unsupported environment $ENVIRONMENT"; exit 1 ;;
          esac

      - name: Clear Prior Salesforce Sessions
        shell: bash
        run: |
          echo "🧹 Clearing existing Salesforce org sessions..."
          sf org logout --all --no-prompt || true

      - name: Authenticate to - ${{ github.event.inputs.environment }} Org
        env:
          CLIENT_ID: ${{ steps.set-org.outputs.CLIENT_ID }}
          USERNAME: ${{ steps.set-org.outputs.USERNAME }}
          LOGIN_URL: ${{ steps.set-org.outputs.LOGIN_URL }}
        run: |
          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$USERNAME" \
            --instance-url "$LOGIN_URL" \
            --set-default

      - name: Check Manifest Exists and Prepare Test Classes
        id: prepare-tests
        shell: bash
        env:
          TEST_LEVEL: ${{ env.TEST_LEVEL }}
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          MANIFEST="${WORKSPACE}/manifest/${FEATURE_BRANCH}_package.xml"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "ERROR: Manifest file $MANIFEST not found."
            exit 1
          fi
          echo "✅ Manifest found: $MANIFEST"

          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" ]]; then
            TEST_CLASS_FILE="${WORKSPACE}/manifest/${FEATURE_BRANCH}_TestClass.txt"
            if [[ ! -f "$TEST_CLASS_FILE" ]]; then
              echo "ERROR: Test class file $TEST_CLASS_FILE not found."
              exit 1
            fi
            TEST_CLASSES=$(paste -sd ' ' "$TEST_CLASS_FILE")
            echo "✅ Test classes: $TEST_CLASSES"
            echo "test_classes=$TEST_CLASSES" >> $GITHUB_OUTPUT
          else
            echo "test_classes=" >> $GITHUB_OUTPUT
          fi

      - name: Validation Deployment - ${{ github.event.inputs.environment }} Org
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          TEST_LEVEL: ${{ env.TEST_LEVEL }}
          TEST_CLASSES: ${{ steps.prepare-tests.outputs.test_classes }}
          ORG_USERNAME: ${{ steps.set-org.outputs.USERNAME }}
        run: |
          MANIFEST="${WORKSPACE}/manifest/${FEATURE_BRANCH}_package.xml"
          echo "Validating: $MANIFEST"
          CMD=(sf project deploy validate --manifest "$MANIFEST" --target-org "$ORG_USERNAME" --test-level "$TEST_LEVEL" --wait 30 --ignore-warnings --verbose)
          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" && -n "$TEST_CLASSES" ]]; then
            CMD+=(--tests $TEST_CLASSES)
          fi
          "${CMD[@]}"

      - name: Deploy to Salesforce - ${{ github.event.inputs.environment }} Org
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          TEST_LEVEL: ${{ env.TEST_LEVEL }}
          TEST_CLASSES: ${{ steps.prepare-tests.outputs.test_classes }}
          ORG_USERNAME: ${{ steps.set-org.outputs.USERNAME }}
        run: |
          MANIFEST="${WORKSPACE}/manifest/${FEATURE_BRANCH}_package.xml"
          echo "Deploying: $MANIFEST"
          CMD=(sf project deploy start --manifest "$MANIFEST" --target-org "$ORG_USERNAME" --test-level "$TEST_LEVEL" --wait 60 --ignore-conflicts --coverage-formatters json --results-dir coverage-results)
          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" && -n "$TEST_CLASSES" ]]; then
            CMD+=(--tests $TEST_CLASSES)
          fi
          "${CMD[@]}"

      - name: Apex Coverage Gate (75% Lodha Standard)
        if: env.TEST_LEVEL != 'NoTestRun'
        uses: ./.github/actions/coverage-gate
        with:
          coverage-results-dir: coverage-results
          minimum-coverage:     '75'
          environment:          ${{ github.event.inputs.environment }}
          feature-branch:       ${{ env.FEATURE_BRANCH }}
          jira-base-url:        ${{ secrets.JIRA_BASE_URL }}
          jira-user-email:      ${{ secrets.JIRA_USER_EMAIL }}
          jira-api-token:       ${{ secrets.ATLASSIAN_API_TOKEN }}
          run-id:               ${{ github.run_id }}
          repo:                 ${{ github.repository }}

      - name: Cleanup JWT key
        if: always()
        run: rm -f server.key

      - name: Create Release Tag
        id: release-tag
        if: github.event.inputs.environment == 'PRODUCTION'
        shell: bash
        env:
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_BRANCHES: ${{ steps.resolve-package.outputs.source_branches }}
        run: |
          TAG_DATE=$(TZ='Asia/Kolkata' date +'%d%m%Y')
          TAG_TIME=$(TZ='Asia/Kolkata' date +'%H%M')
          TAG_PREFIX="${ENVIRONMENT}/${TAG_DATE}"

          echo "🔍 Fetching existing tags for prefix: ${TAG_PREFIX}"
          EXISTING_TAGS=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/git/refs/tags" \
            | jq -r '.[].ref | ltrimstr("refs/tags/")' 2>/dev/null || echo "")

          MAX_PATCH=-1
          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^${ENVIRONMENT}/[0-9]{8}_[0-9]{4}_v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              TAG_DAY=$(echo "$TAG" | sed 's|.*/\([0-9]\{8\}\)_.*|\1|')
              if [[ "$TAG_DAY" == "$TAG_DATE" ]]; then
                PATCH=${BASH_REMATCH[3]}
                if [[ $PATCH -gt $MAX_PATCH ]]; then
                  MAX_PATCH=$PATCH
                fi
              fi
            fi
          done <<< "$EXISTING_TAGS"

          if [[ $MAX_PATCH -eq -1 ]]; then
            VERSION="v1.0.0"
          else
            NEXT_PATCH=$((MAX_PATCH + 1))
            VERSION="v1.0.${NEXT_PATCH}"
          fi

          TAG_NAME="${ENVIRONMENT}/${TAG_DATE}_${TAG_TIME}_${VERSION}"
          SAFE_BRANCH=$(echo "$FEATURE_BRANCH" | sed 's|/|-|g')

          echo "=========================================="
          echo "RELEASE TAG"
          echo "=========================================="
          echo "  Environment : $ENVIRONMENT"
          echo "  Date (IST)  : $TAG_DATE"
          echo "  Version     : $VERSION"
          echo "  Tag         : $TAG_NAME"
          echo "=========================================="

          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git tag -a "$TAG_NAME" -m "${ENVIRONMENT} release ${TAG_DATE}_${TAG_TIME} IST | ${VERSION} | Package: ${FEATURE_BRANCH} | Deployed by: ${ACTOR}"
          git push origin "$TAG_NAME"
          echo "✅ Tag pushed: $TAG_NAME"

          echo "🚀 Creating GitHub Release..."
          RELEASE_BODY="## 🚀 ${ENVIRONMENT} Release ${VERSION}\n\n"
          RELEASE_BODY+="| Field | Value |\n|---|---|\n"
          RELEASE_BODY+="| **Tag** | \`${TAG_NAME}\` |\n"
          RELEASE_BODY+="| **Environment** | ${ENVIRONMENT} |\n"
          RELEASE_BODY+="| **Version** | ${VERSION} |\n"
          RELEASE_BODY+="| **Date (IST)** | $(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST') |\n"
          RELEASE_BODY+="| **Package** | ${FEATURE_BRANCH} |\n"
          RELEASE_BODY+="| **Branch** | ${REF_NAME} |\n"
          if [[ -n "$SOURCE_BRANCHES" ]]; then
            BRANCHES_MD=""
            IFS=',' read -ra BS <<< "$SOURCE_BRANCHES"
            for B in "${BS[@]}"; do
              BRANCHES_MD+="$(echo "$B" | xargs), "
            done
            BRANCHES_MD=$(echo "$BRANCHES_MD" | sed 's/, $//')
            RELEASE_BODY+="| **Feature Branches** | ${BRANCHES_MD} |\n"
          fi
          RELEASE_BODY+="| **Deployed by** | ${ACTOR} |\n"
          RELEASE_BODY+="| **Workflow Run** | [${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID}) |\n"

          IS_PROD="false"
          [[ "$ENVIRONMENT" == "PRODUCTION" ]] && IS_PROD="true"

          RELEASE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/releases" \
            -d "$(jq -n \
              --arg tag  "$TAG_NAME" \
              --arg name "🚀 ${ENVIRONMENT} | ${TAG_DATE}_${TAG_TIME} | ${VERSION} | ${SAFE_BRANCH}" \
              --arg body "$(printf '%b' "$RELEASE_BODY")" \
              --arg latest "$IS_PROD" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, make_latest: $latest}')")

          RELEASE_HTTP=$(echo "$RELEASE_RESPONSE" | tail -1)
          if [[ "$RELEASE_HTTP" == "201" ]]; then
            echo "✅ GitHub Release created: $TAG_NAME"
            echo "🔗 https://github.com/${REPO}/releases/tag/${TAG_NAME}"
          else
            echo "❌ GitHub Release API failed (HTTP $RELEASE_HTTP)"
            echo "$RELEASE_RESPONSE" | sed '$d'
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "actor=${ACTOR}" >> $GITHUB_OUTPUT
          echo "ref_name=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "repo=${REPO}" >> $GITHUB_OUTPUT


  Post_Deployment_Health_Check:
    name: Post-Deploy Health Check - PRODUCTION
    runs-on: ubuntu-latest
    needs: Deployment_Build
    if: needs.Deployment_Build.result == 'success' && needs.Deployment_Build.outputs.environment == 'PRODUCTION'
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest --silent

      - name: Generate JWT Key
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
          chmod 600 server.key

      - name: Set Org Credentials
        id: set-org
        shell: bash
        env:
          ENVIRONMENT: ${{ needs.Deployment_Build.outputs.environment }}
          KEY_DEV:     ${{ secrets.SALESFORCE_CONSUMER_KEY_DEV }}
          KEY_QA:      ${{ secrets.SALESFORCE_CONSUMER_KEY_QA }}
          KEY_UAT:     ${{ secrets.SALESFORCE_CONSUMER_KEY_UAT }}
          KEY_PROD:    ${{ secrets.SALESFORCE_CONSUMER_KEY_PROD }}
          KEY_HOTFIX:  ${{ secrets.SALESFORCE_CONSUMER_KEY_HOTFIX }}
          USER_DEV:    ${{ secrets.SFDX_AUTH_DEV_USERNAME }}
          USER_QA:     ${{ secrets.SFDX_AUTH_QA_USERNAME }}
          USER_UAT:    ${{ secrets.SFDX_AUTH_UAT_USERNAME }}
          USER_PROD:   ${{ secrets.SFDX_AUTH_PROD_USERNAME }}
          USER_HOTFIX: ${{ secrets.SFDX_AUTH_HOTFIX_USERNAME }}
          URL_TEST:    ${{ secrets.SANDBOX_URL }}
          URL_PROD:    ${{ secrets.LOGIN_URL }}
        run: |
          case "$ENVIRONMENT" in
            DEV)        echo "CLIENT_ID=$KEY_DEV"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_DEV"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$URL_TEST" >> $GITHUB_OUTPUT ;;
            QA)         echo "CLIENT_ID=$KEY_QA"     >> $GITHUB_OUTPUT; echo "USERNAME=$USER_QA"     >> $GITHUB_OUTPUT; echo "LOGIN_URL=$URL_TEST" >> $GITHUB_OUTPUT ;;
            UAT)        echo "CLIENT_ID=$KEY_UAT"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_UAT"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$URL_TEST" >> $GITHUB_OUTPUT ;;
            PRODUCTION) echo "CLIENT_ID=$KEY_PROD"   >> $GITHUB_OUTPUT; echo "USERNAME=$USER_PROD"   >> $GITHUB_OUTPUT; echo "LOGIN_URL=$URL_PROD" >> $GITHUB_OUTPUT ;;
            HOTFIX)     echo "CLIENT_ID=$KEY_HOTFIX" >> $GITHUB_OUTPUT; echo "USERNAME=$USER_HOTFIX" >> $GITHUB_OUTPUT; echo "LOGIN_URL=$URL_TEST" >> $GITHUB_OUTPUT ;;
          esac

      - name: Authenticate to Salesforce
        shell: bash
        env:
          CLIENT_ID:    ${{ steps.set-org.outputs.CLIENT_ID }}
          USERNAME:     ${{ steps.set-org.outputs.USERNAME }}
          LOGIN_URL:    ${{ steps.set-org.outputs.LOGIN_URL }}
        run: |
          sf org logout --all --no-prompt || true
          sf org login jwt \
            --client-id    "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username     "$USERNAME" \
            --instance-url "$LOGIN_URL" \
            --set-default

      - name: Collect Health Metrics
        id: collect
        shell: bash
        env:
          USERNAME: ${{ steps.set-org.outputs.USERNAME }}
          ENV:      ${{ needs.Deployment_Build.outputs.environment }}
          PACKAGE:  ${{ needs.Deployment_Build.outputs.deploy_package }}
        run: |
          set +e
          SCAN_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          echo "📊 Post-deploy health check for $ENV at $SCAN_TIME..."

          safe_array() { echo "$1" | jq -c "$2 // []" 2>/dev/null || echo '[]'; }
          safe_obj()   { echo "$1" | jq -c "$2 // {}" 2>/dev/null || echo '{}'; }
          safe_int()   { echo "$1" | jq -r "$2 // 0"  2>/dev/null || echo '0';  }

          # -- Org Info -------------------------------------------------------
          RAW_ORG=$(sf org display --target-org "$USERNAME" --json 2>/dev/null)
          ORG_JSON=$(safe_obj "$RAW_ORG" '.result')

          # -- Governor Limits ------------------------------------------------
          RAW_LIMITS=$(sf org list limits --target-org "$USERNAME" --json 2>/dev/null)
          LIMITS_JSON=$(echo "$RAW_LIMITS" | jq -c '[.result[]? | {name: (.name // .Name // ""), remaining: ((.remaining // .Remaining // 0) | tonumber), max: ((.max // .Max // 0) | tonumber)}] | map(select(.name != ""))' 2>/dev/null || echo '[]')

          # -- Active Apex Classes --------------------------------------------
          RAW_APEX=$(sf data query --query "SELECT COUNT() FROM ApexClass WHERE Status='Active'" --target-org "$USERNAME" --json 2>/dev/null)
          APEX_COUNT=$(safe_int "$RAW_APEX" '.result.totalSize')

          # -- Active Apex Triggers -------------------------------------------
          RAW_TRIGGER=$(sf data query --query "SELECT COUNT() FROM ApexTrigger WHERE Status='Active'" --target-org "$USERNAME" --json 2>/dev/null)
          TRIGGER_COUNT=$(safe_int "$RAW_TRIGGER" '.result.totalSize')

          # -- Active Flows (Tooling API) -------------------------------------
          RAW_FLOWS=$(sf data query --query "SELECT COUNT() FROM FlowDefinition WHERE ActiveVersionId != null" --target-org "$USERNAME" --use-tooling-api --json 2>/dev/null)
          FLOW_COUNT=$(safe_int "$RAW_FLOWS" '.result.totalSize')

          # -- Active Users ---------------------------------------------------
          RAW_USERS=$(sf data query --query "SELECT COUNT() FROM User WHERE IsActive=true AND Profile.UserLicense.LicenseDefinitionKey != 'PID_CHATTER'" --target-org "$USERNAME" --json 2>/dev/null)
          USER_COUNT=$(safe_int "$RAW_USERS" '.result.totalSize')

          # -- Security Metrics -----------------------------------------------
          RAW_PRIV=$(sf data query --query "SELECT COUNT() FROM Profile WHERE PermissionsModifyAllData=true" --target-org "$USERNAME" --json 2>/dev/null)
          PRIV_COUNT=$(safe_int "$RAW_PRIV" '.result.totalSize')

          RAW_INACTIVE=$(sf data query --query "SELECT COUNT() FROM User WHERE IsActive=false AND LastLoginDate != null AND Profile.UserLicense.UserLicenseKey != 'PID_CHATTER'" --target-org "$USERNAME" --json 2>/dev/null)
          INACTIVE_COUNT=$(safe_int "$RAW_INACTIVE" '.result.totalSize')

          RAW_NO_MFA=$(sf data query --query "SELECT COUNT() FROM User WHERE IsActive=true AND Profile.PermissionsMultiFactorAuthentication=false AND Profile.UserLicense.UserLicenseKey != 'PID_CHATTER'" --target-org "$USERNAME" --json 2>/dev/null)
          NO_MFA_COUNT=$(safe_int "$RAW_NO_MFA" '.result.totalSize')

          # -- Guest User Access ----------------------------------------------
          RAW_GUEST=$(sf data query --query "SELECT COUNT() FROM User WHERE IsActive=true AND Profile.UserType='Guest'" --target-org "$USERNAME" --json 2>/dev/null)
          GUEST_COUNT=$(safe_int "$RAW_GUEST" '.result.totalSize')

          # -- Connected Apps without IP Restrictions -------------------------
          RAW_CONN=$(sf data query --query "SELECT COUNT() FROM ConnectedApplication WHERE OptionsAllowAdminApprovedUsersOnly=false" --target-org "$USERNAME" --use-tooling-api --json 2>/dev/null)
          CONN_APP_COUNT=$(safe_int "$RAW_CONN" '.result.totalSize')

          # -- Deprecated API Versions (< 50.0) ------------------------------
          RAW_OLD_API=$(sf data query --query "SELECT COUNT() FROM ApexClass WHERE ApiVersion < 50.0 AND Status='Active'" --target-org "$USERNAME" --json 2>/dev/null)
          OLD_API_COUNT=$(safe_int "$RAW_OLD_API" '.result.totalSize')

          # -- Sharing Settings: Public Read/Write objects -------------------
          RAW_OWD=$(sf data query --query "SELECT QualifiedApiName, InternalSharingModel FROM EntityDefinition WHERE InternalSharingModel IN ('ReadWrite','ControlledByLeadOrContact') AND IsCustomizable=true" --target-org "$USERNAME" --use-tooling-api --json 2>/dev/null)
          OWD_PUBLIC_COUNT=$(echo "$RAW_OWD" | jq -r '.result.totalSize // 0' 2>/dev/null || echo '0')

          # -- Salesforce Native Security Health Check Score (Tooling API) ------
          echo "👀 Querying SecurityHealthCheck record via Tooling API..."

          RAW_SF_SEC=$(sf data query \
            --use-tooling-api \
            --query "SELECT Score FROM SecurityHealthCheck WHERE CustomBaselineId = null LIMIT 1" \
            --target-org "$USERNAME" --json 2>/dev/null || echo '{}')

          echo "🔍 Raw SecurityHealthCheck JSON response:"
          echo "$RAW_SF_SEC"

          SF_SEC_SCORE_RAW=$(echo "$RAW_SF_SEC" | jq -r '.result.records[0].Score // empty' 2>/dev/null || true)

          echo "🔍 Extracted SecurityHealthCheck Score: '$SF_SEC_SCORE_RAW'"

          if [[ -n "$SF_SEC_SCORE_RAW" && "$SF_SEC_SCORE_RAW" != "null" ]]; then
            SF_SEC_SCORE=$(awk "BEGIN {printf \"%d\", int(${SF_SEC_SCORE_RAW}+0)}")
            echo "✅ Using Salesforce SecurityHealthCheck Score from Tooling API: $SF_SEC_SCORE"
          else
            echo "⚠️ SecurityHealthCheck Score missing or null — falling back to formula calculation."

            echo "🧮 Fallback counts for manual score calculation:"
            echo "  PRIV_COUNT=$PRIV_COUNT"
            echo "  INACTIVE_COUNT=$INACTIVE_COUNT"
            echo "  NO_MFA_COUNT=$NO_MFA_COUNT"
            echo "  GUEST_COUNT=$GUEST_COUNT"
            echo "  CONN_APP_COUNT=$CONN_APP_COUNT"
            echo "  OWD_PUBLIC_COUNT=$OWD_PUBLIC_COUNT"

            SF_SEC_SCORE=$(awk "BEGIN {v=100-(${PRIV_COUNT}*10)-(${INACTIVE_COUNT}*2)-(${NO_MFA_COUNT}*1)-(${GUEST_COUNT}*5)-(${CONN_APP_COUNT}*3)-(${OWD_PUBLIC_COUNT}*2); if(v<0)v=0; printf \"%d\", int(v)}")
            echo "⚙️ Calculated fallback SecurityHealthCheck Score: $SF_SEC_SCORE"
          fi

          # -- Password Policy (Tooling API) ----------------------------------
          RAW_PWD=$(sf data query --use-tooling-api \
            --query "SELECT MinPasswordLength,PasswordComplexity,PasswordExpiration,MaxLoginAttempts FROM PasswordPolicy LIMIT 1" \
            --target-org "$USERNAME" --json 2>/dev/null || echo '{}')
          PWD_MIN_LEN=$(echo "$RAW_PWD"    | jq -r '.result.records[0].MinPasswordLength  // "N/A"' 2>/dev/null || echo 'N/A')
          PWD_COMPLEX=$(echo "$RAW_PWD"    | jq -r '.result.records[0].PasswordComplexity  // "N/A"' 2>/dev/null || echo 'N/A')
          PWD_EXPIRY=$(echo "$RAW_PWD"     | jq -r '.result.records[0].PasswordExpiration   // "N/A"' 2>/dev/null || echo 'N/A')
          PWD_MAX_ATTEMPTS=$(echo "$RAW_PWD" | jq -r '.result.records[0].MaxLoginAttempts  // "N/A"' 2>/dev/null || echo 'N/A')

          # -- Session Settings (Tooling API) ---------------------------------
          RAW_SESS=$(sf data query --use-tooling-api \
            --query "SELECT SessionTimeout,ForceRelogin,RequireHttps,EnableClickjackNonsetupSFDC,EnableClickjackNonsetupUser FROM SecuritySettings LIMIT 1" \
            --target-org "$USERNAME" --json 2>/dev/null || echo '{}')
          SESS_TIMEOUT=$(echo "$RAW_SESS"       | jq -r '.result.records[0].SessionTimeout                  // "N/A"' 2>/dev/null || echo 'N/A')
          SESS_FORCE_RELOGIN=$(echo "$RAW_SESS" | jq -r '.result.records[0].ForceRelogin                    // "N/A"' 2>/dev/null || echo 'N/A')
          SESS_HTTPS=$(echo "$RAW_SESS"         | jq -r '.result.records[0].RequireHttps                    // "N/A"' 2>/dev/null || echo 'N/A')
          SESS_CJ_SETUP=$(echo "$RAW_SESS"      | jq -r '.result.records[0].EnableClickjackNonsetupSFDC     // "N/A"' 2>/dev/null || echo 'N/A')
          SESS_CJ_USER=$(echo "$RAW_SESS"       | jq -r '.result.records[0].EnableClickjackNonsetupUser     // "N/A"' 2>/dev/null || echo 'N/A')

          # -- Apex Test Coverage (last run) ----------------------------------
          RAW_COV=$(sf data query \
            --query "SELECT PercentCovered FROM ApexOrgWideCoverage LIMIT 1" \
            --target-org "$USERNAME" --json 2>/dev/null || echo '{}')
          COVERAGE_PCT=$(echo "$RAW_COV" | jq -r '.result.records[0].PercentCovered // 0' 2>/dev/null || echo '0')

          # -- Recent Test Runs -----------------------------------------------
          RAW_TESTS=$(sf data query \
            --query "SELECT Id,Status,TestTime,MethodsCompleted,MethodsFailed FROM ApexTestRunResult ORDER BY CreatedDate DESC LIMIT 5" \
            --target-org "$USERNAME" --json 2>/dev/null || echo '{}')
          TESTS_JSON=$(echo "$RAW_TESTS" | jq -c '[.result.records[]? | {status:.Status,duration_ms:.TestTime,passed:.MethodsCompleted,failed:.MethodsFailed}]' 2>/dev/null || echo '[]')

          # -- Recent Deployments ---------------------------------------------
          RAW_DEPLOY=$(sf data query --use-tooling-api \
            --query "SELECT Id,Status,StartDate,CompletedDate,NumberComponentsDeployed,NumberComponentErrors FROM DeployRequest ORDER BY StartDate DESC LIMIT 5" \
            --target-org "$USERNAME" --json 2>/dev/null || echo '{}')
          DEPLOY_JSON=$(echo "$RAW_DEPLOY" | jq -c '[.result.records[]? | {status:.Status,components:.NumberComponentsDeployed,errors:.NumberComponentErrors}]' 2>/dev/null || echo '[]')

          # -- Active Batch Jobs ----------------------------------------------
          RAW_BATCH=$(sf data query \
            --query "SELECT COUNT() FROM AsyncApexJob WHERE JobType='BatchApex' AND Status IN ('Processing','Queued','Preparing')" \
            --target-org "$USERNAME" --json 2>/dev/null || echo '{}')
          BATCH_COUNT=$(safe_int "$RAW_BATCH" '.result.totalSize')

          # -- Health Band ----------------------------------------------------
          if   [[ $SF_SEC_SCORE -ge 90 ]]; then HEALTH_BAND="Excellent"
          elif [[ $SF_SEC_SCORE -ge 75 ]]; then HEALTH_BAND="Good"
          elif [[ $SF_SEC_SCORE -ge 50 ]]; then HEALTH_BAND="Fair"
          else                                   HEALTH_BAND="Poor"
          fi

          # -- Build JSON artifact --------------------------------------------
          SCAN_TS=$(TZ='Asia/Kolkata' date +'%Y-%m-%dT%H:%M:%S+05:30')
          jq -n \
            --arg  env          "$ENV" \
            --arg  package      "$PACKAGE" \
            --arg  scan_time    "$SCAN_TS" \
            --arg  score        "$SF_SEC_SCORE" \
            --arg  band         "$HEALTH_BAND" \
            --arg  priv         "$PRIV_COUNT" \
            --arg  inactive     "$INACTIVE_COUNT" \
            --arg  no_mfa       "$NO_MFA_COUNT" \
            --arg  guest        "$GUEST_COUNT" \
            --arg  conn_apps    "$CONN_APP_COUNT" \
            --arg  owd_public   "$OWD_PUBLIC_COUNT" \
            --arg  old_api      "$OLD_API_COUNT" \
            --arg  pwd_min      "$PWD_MIN_LEN" \
            --arg  pwd_complex  "$PWD_COMPLEX" \
            --arg  pwd_expiry   "$PWD_EXPIRY" \
            --arg  pwd_attempts "$PWD_MAX_ATTEMPTS" \
            --arg  sess_timeout "$SESS_TIMEOUT" \
            --arg  sess_relogin "$SESS_FORCE_RELOGIN" \
            --arg  sess_https   "$SESS_HTTPS" \
            --arg  sess_cj_sf   "$SESS_CJ_SETUP" \
            --arg  sess_cj_usr  "$SESS_CJ_USER" \
            --argjson apex      "$APEX_COUNT" \
            --argjson triggers  "$TRIGGER_COUNT" \
            --argjson flows     "$FLOW_COUNT" \
            --argjson users     "$USER_COUNT" \
            --argjson coverage  "$COVERAGE_PCT" \
            --argjson batch     "$BATCH_COUNT" \
            --argjson tests     "$TESTS_JSON" \
            --argjson deploys   "$DEPLOY_JSON" \
            --argjson limits    "$LIMITS_JSON" \
            '{
              security: {
                score:           ($score|tonumber),
                band:            $band,
                privileged_profiles: ($priv|tonumber),
                inactive_users:  ($inactive|tonumber),
                users_no_mfa:    ($no_mfa|tonumber),
                guest_users:     ($guest|tonumber),
                conn_apps_unrestricted: ($conn_apps|tonumber),
                owd_public_objects: ($owd_public|tonumber),
                deprecated_api_classes: ($old_api|tonumber),
                password_policy: {
                  min_length:    ($pwd_min|tonumber? // $pwd_min),
                  complexity:    ($pwd_complex|tonumber? // $pwd_complex),
                  expiration:    ($pwd_expiry|tonumber? // $pwd_expiry),
                  max_attempts:  ($pwd_attempts|tonumber? // $pwd_attempts)
                },
                session_settings: {
                  timeout:       $sess_timeout,
                  force_relogin: $sess_relogin,
                  require_https: $sess_https,
                  clickjack_sf:  $sess_cj_sf,
                  clickjack_user: $sess_cj_usr
                }
              },
              metrics: {
                apex_classes:    $apex,
                apex_triggers:   $triggers,
                active_flows:    $flows,
                active_users:    $users,
                apex_coverage_pct: $coverage,
                active_batch_jobs: $batch,
                recent_test_runs:  $tests,
                recent_deployments: $deploys,
                governor_limits:   $limits
              },
              metadata: {
                environment: $env,
                package:     $package,
                scanned_at:  $scan_time
              }
            }' > health_post_deploy.json

          echo "✅ Health JSON written:"
          cat health_post_deploy.json

          echo "health_score=$SF_SEC_SCORE"   >> $GITHUB_OUTPUT
          echo "health_band=$HEALTH_BAND"     >> $GITHUB_OUTPUT
          echo "coverage_pct=$COVERAGE_PCT"   >> $GITHUB_OUTPUT
          echo "apex_count=$APEX_COUNT"       >> $GITHUB_OUTPUT
          echo "trigger_count=$TRIGGER_COUNT" >> $GITHUB_OUTPUT
          echo "flow_count=$FLOW_COUNT"       >> $GITHUB_OUTPUT
          echo "user_count=$USER_COUNT"       >> $GITHUB_OUTPUT
          echo "batch_count=$BATCH_COUNT"     >> $GITHUB_OUTPUT

      - name: Write Post-Deploy Health Summary
        if: always()
        shell: bash
        env:
          ENV:          ${{ needs.Deployment_Build.outputs.environment }}
          PACKAGE:      ${{ needs.Deployment_Build.outputs.deploy_package }}
          SCORE:        ${{ steps.collect.outputs.health_score }}
          BAND:         ${{ steps.collect.outputs.health_band }}
          COVERAGE:     ${{ steps.collect.outputs.coverage_pct }}
          APEX:         ${{ steps.collect.outputs.apex_count }}
          TRIGGERS:     ${{ steps.collect.outputs.trigger_count }}
          FLOWS:        ${{ steps.collect.outputs.flow_count }}
          USERS:        ${{ steps.collect.outputs.user_count }}
          BATCH:        ${{ steps.collect.outputs.batch_count }}
          RUN_ID:       ${{ github.run_id }}
          REPO:         ${{ github.repository }}
        run: |
          SCAN_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          case "$BAND" in
            Excellent) BAND_ICON="🟢" ;;
            Good)      BAND_ICON="🟡" ;;
            Fair)      BAND_ICON="🟠" ;;
            *)         BAND_ICON="🔴" ;;
          esac

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🏥 Post-Deploy Health Check — ${ENV}

          | Field              | Value                          |
          |--------------------|--------------------------------|
          | **Environment**    | ${ENV}                         |
          | **Package**        | ${PACKAGE}                     |
          | **Scanned At**     | ${SCAN_TIME}                   |
          | **Security Score** | ${BAND_ICON} **${SCORE}/100** (${BAND}) |
          | **Apex Coverage**  | ${COVERAGE}%                   |
          | **Apex Classes**   | ${APEX}                        |
          | **Apex Triggers**  | ${TRIGGERS}                    |
          | **Active Flows**   | ${FLOWS}                       |
          | **Active Users**   | ${USERS}                       |
          | **Batch Jobs**     | ${BATCH}                       |
          | **Workflow Run**   | [${RUN_ID}](${RUN_URL})        |

          > Score bands: 🟢 Excellent ≥90 | 🟡 Good ≥75 | 🟠 Fair ≥50 | 🔴 Poor <50
          EOF

      - name: Upload Health Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-${{ needs.Deployment_Build.outputs.environment }}-${{ github.run_id }}
          path: health_post_deploy.json
          retention-days: 30

      - name: Publish Health Check to Confluence
        if: always()
        shell: bash
        env:
          SCORE:               ${{ steps.collect.outputs.health_score }}
          BAND:                ${{ steps.collect.outputs.health_band }}
          COVERAGE:            ${{ steps.collect.outputs.coverage_pct }}
          APEX:                ${{ steps.collect.outputs.apex_count }}
          TRIGGERS:            ${{ steps.collect.outputs.trigger_count }}
          FLOWS:               ${{ steps.collect.outputs.flow_count }}
          USERS:               ${{ steps.collect.outputs.user_count }}
          BATCH:               ${{ steps.collect.outputs.batch_count }}
          ENV:                 ${{ needs.Deployment_Build.outputs.environment }}
          PACKAGE:             ${{ needs.Deployment_Build.outputs.deploy_package }}
          RUN_ID:              ${{ github.run_id }}
          REPO:                ${{ github.repository }}
          JIRA_USER_EMAIL:     ${{ secrets.JIRA_USER_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          HEALTH_PAGE_ID:      ${{ secrets.CONFLUENCE_HEALTH_PAGE_ID }}
        run: |
          if [[ -z "$CONFLUENCE_BASE_URL" || -z "$HEALTH_PAGE_ID" ]]; then
            echo "⚠️ CONFLUENCE_BASE_URL or CONFLUENCE_HEALTH_PAGE_ID not set — skipping"
            exit 0
          fi

          SCAN_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          case "$BAND" in
            Excellent) BAND_COLOR="#00875A" ;;
            Good)      BAND_COLOR="#FF991F" ;;
            Fair)      BAND_COLOR="#FF7452" ;;
            *)         BAND_COLOR="#DE350B" ;;
          esac

          HEALTH_HTML="<h2>🏥 Health Check — ${ENV} | ${SCAN_TIME}</h2>"
          HEALTH_HTML+="<table><tr><th>Metric</th><th>Value</th></tr>"
          HEALTH_HTML+="<tr><td><strong>Security Score</strong></td><td><span style='color:${BAND_COLOR}'><strong>${SCORE}/100 (${BAND})</strong></span></td></tr>"
          HEALTH_HTML+="<tr><td>Apex Coverage</td><td>${COVERAGE}%</td></tr>"
          HEALTH_HTML+="<tr><td>Apex Classes</td><td>${APEX}</td></tr>"
          HEALTH_HTML+="<tr><td>Apex Triggers</td><td>${TRIGGERS}</td></tr>"
          HEALTH_HTML+="<tr><td>Active Flows</td><td>${FLOWS}</td></tr>"
          HEALTH_HTML+="<tr><td>Active Users</td><td>${USERS}</td></tr>"
          HEALTH_HTML+="<tr><td>Active Batch Jobs</td><td>${BATCH}</td></tr>"
          HEALTH_HTML+="<tr><td>Package</td><td>${PACKAGE}</td></tr>"
          HEALTH_HTML+="<tr><td>Workflow Run</td><td><a href='${RUN_URL}'>${RUN_ID}</a></td></tr>"
          HEALTH_HTML+="</table><hr/>"

          PAGE_RESP=$(curl -s \
            -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${HEALTH_PAGE_ID}?expand=body.storage,version")

          CUR_VER=$(echo "$PAGE_RESP" | jq -r '.version.number')
          CUR_BODY=$(echo "$PAGE_RESP" | jq -r '.body.storage.value')
          PAGE_TITLE=$(echo "$PAGE_RESP" | jq -r '.title')

          if [[ -z "$CUR_VER" || "$CUR_VER" == "null" ]]; then
            echo "❌ Could not fetch Confluence health page (ID: $HEALTH_PAGE_ID)"
            echo "$PAGE_RESP"
            exit 1
          fi

          NEW_VER=$((CUR_VER + 1))
          NEW_BODY="${HEALTH_HTML}${CUR_BODY}"

          UPD_RESP=$(curl -s -w "\n%{http_code}" -X PUT \
            -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --argjson version "{\"number\": ${NEW_VER}}" \
              --arg title "${PAGE_TITLE}" \
              --arg value "${NEW_BODY}" \
              '{version: $version, title: $title, type: "page", body: {storage: {value: $value, representation: "storage"}}}')" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${HEALTH_PAGE_ID}")

          UPD_CODE=$(echo "$UPD_RESP" | tail -1)
          if [[ "$UPD_CODE" == "200" ]]; then
            echo "✅ Confluence health page updated (v${NEW_VER})"
          else
            echo "❌ Confluence update failed (HTTP $UPD_CODE)"
            echo "$UPD_RESP" | sed '$d'
            exit 1
          fi

      - name: Send Health Check Email
        if: always()
        shell: bash
        env:
          SCORE:        ${{ steps.collect.outputs.health_score }}
          BAND:         ${{ steps.collect.outputs.health_band }}
          COVERAGE:     ${{ steps.collect.outputs.coverage_pct }}
          APEX:         ${{ steps.collect.outputs.apex_count }}
          TRIGGERS:     ${{ steps.collect.outputs.trigger_count }}
          FLOWS:        ${{ steps.collect.outputs.flow_count }}
          USERS:        ${{ steps.collect.outputs.user_count }}
          BATCH:        ${{ steps.collect.outputs.batch_count }}
          ENV:          ${{ needs.Deployment_Build.outputs.environment }}
          PACKAGE:      ${{ needs.Deployment_Build.outputs.deploy_package }}
          RUN_ID:       ${{ github.run_id }}
          REPO:         ${{ github.repository }}
          ACTOR:        ${{ needs.Deployment_Build.outputs.actor }}
        run: |
          SCAN_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          case "$BAND" in
            Excellent) BAND_COLOR="#00875A"; BAND_ICON="🟢" ;;
            Good)      BAND_COLOR="#FF991F"; BAND_ICON="🟡" ;;
            Fair)      BAND_COLOR="#FF7452"; BAND_ICON="🟠" ;;
            *)         BAND_COLOR="#DE350B"; BAND_ICON="🔴" ;;
          esac

          cat > email_body.html << HTMLEOF
          <!DOCTYPE html><html><body style="font-family:Arial,sans-serif;max-width:700px;margin:auto">
          <h2 style="color:#0070D2">🏥 Post-Deploy Health Check — ${ENV}</h2>
          <p><strong>Scanned:</strong> ${SCAN_TIME} &nbsp;|&nbsp; <strong>Package:</strong> ${PACKAGE} &nbsp;|&nbsp; <strong>Deployed by:</strong> ${ACTOR}</p>
          <table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%">
            <tr style="background:#f4f6f9"><th>Metric</th><th>Value</th></tr>
            <tr><td><strong>Security Score</strong></td><td style="color:${BAND_COLOR}"><strong>${BAND_ICON} ${SCORE}/100 (${BAND})</strong></td></tr>
            <tr><td>Apex Coverage</td><td>${COVERAGE}%</td></tr>
            <tr><td>Apex Classes</td><td>${APEX}</td></tr>
            <tr><td>Apex Triggers</td><td>${TRIGGERS}</td></tr>
            <tr><td>Active Flows</td><td>${FLOWS}</td></tr>
            <tr><td>Active Users</td><td>${USERS}</td></tr>
            <tr><td>Active Batch Jobs</td><td>${BATCH}</td></tr>
          </table>
          <p style="margin-top:16px">📎 Full JSON artifact attached to <a href="${RUN_URL}">GitHub Actions Run ${RUN_ID}</a></p>
          <p style="color:#888;font-size:12px">Score bands: 🟢 Excellent ≥90 | 🟡 Good ≥75 | 🟠 Fair ≥50 | 🔴 Poor &lt;50</p>
          </body></html>
          HTMLEOF
          echo "✅ Email body written to email_body.html"

      - name: Dispatch Health Check Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port:    ${{ secrets.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          subject:        "🏥 Health Check | ${{ needs.Deployment_Build.outputs.environment }} | Score: ${{ steps.collect.outputs.health_score }}/100 (${{ steps.collect.outputs.health_band }})"
          to:             ${{ secrets.HEALTH_CHECK_EMAIL_TO }}
          from:           ${{ secrets.SMTP_USERNAME }}
          html_body:      file://email_body.html
          attachments:    health_post_deploy.json

      - name: Cleanup JWT Key
        if: always()
        run: rm -f server.key

  Jira_Transition:
    runs-on: ubuntu-latest
    needs: [Deployment_Build, Post_Deployment_Health_Check]
    if: |
      always() &&
      needs.Deployment_Build.result == 'success' &&
      contains(fromJSON('["DEV","QA","UAT","PRODUCTION","HOTFIX"]'), needs.Deployment_Build.outputs.environment) &&
      (needs.Post_Deployment_Health_Check.result == 'success' || needs.Post_Deployment_Health_Check.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Jira Tickets
        id: extract_tickets
        shell: bash
        env:
          PACKAGE: ${{ needs.Deployment_Build.outputs.deploy_package }}
          SOURCE_BRANCHES: ${{ needs.Deployment_Build.outputs.source_branches }}
          ENVIRONMENT: ${{ needs.Deployment_Build.outputs.environment }}
        run: |
          ALL_TICKETS=""

          if [[ "$ENVIRONMENT" == "PRODUCTION" ]]; then
            # PROD: extract from package name + commits
            BRANCH_INPUT="${SOURCE_BRANCHES:-$PACKAGE}"
            BRANCH_TICKETS=$(echo "$BRANCH_INPUT" | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u || true)

            LAST_TAG=$(git tag --list "PRODUCTION/*" --sort=-creatordate | head -1 || true)
            if [[ -n "$LAST_TAG" ]]; then
              echo "  Scanning commits since tag: $LAST_TAG"
              COMMIT_LOG=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s %b" 2>/dev/null || git log -50 --pretty=format:"%s %b")
            else
              echo "  No prior tag found — scanning last 50 commits"
              COMMIT_LOG=$(git log -50 --pretty=format:"%s %b")
            fi
            COMMIT_TICKETS=$(echo "$COMMIT_LOG" | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u || true)

            ALL_TICKETS=$(printf '%s\n%s\n' "$BRANCH_TICKETS" "$COMMIT_TICKETS" \
              | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u | tr '\n' ',' | sed 's/,$//' || true)
          else
            # Lower orgs (DEV/QA/UAT/HOTFIX): extract only from package name
            # Package name format: feature/JIRANUMBER (single) or Release_ENV_date (multi)
            BRANCH_INPUT="${SOURCE_BRANCHES:-$PACKAGE}"
            ALL_TICKETS=$(echo "$BRANCH_INPUT" | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u | tr '\n' ',' | sed 's/,$//' || true)
          fi

          if [[ -z "$ALL_TICKETS" ]]; then
            echo "⚠️ No Jira tickets found — skipping transition"
            echo "has_tickets=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Tickets: $ALL_TICKETS"
            echo "tickets=$ALL_TICKETS" >> "$GITHUB_OUTPUT"
            echo "has_tickets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Transition Jira Tickets
        if: steps.extract_tickets.outputs.has_tickets == 'true'
        shell: bash
        env:
          TICKETS:             ${{ steps.extract_tickets.outputs.tickets }}
          ENVIRONMENT:         ${{ needs.Deployment_Build.outputs.environment }}
          JIRA_BASE_URL:       ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL:     ${{ secrets.JIRA_USER_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          TRANSITION_ID_QA:    ${{ secrets.JIRA_QA_TRANSITION_ID }}
          TRANSITION_ID_UAT:   ${{ secrets.JIRA_UAT_TRANSITION_ID }}
          TRANSITION_ID_PROD:  ${{ secrets.JIRA_PROD_TRANSITION_ID }}
        run: |
          case "$ENVIRONMENT" in
            QA)         TRANSITION_ID="$TRANSITION_ID_QA" ;;
            UAT)        TRANSITION_ID="$TRANSITION_ID_UAT" ;;
            PRODUCTION) TRANSITION_ID="$TRANSITION_ID_PROD" ;;
          esac

          if [[ -z "$TRANSITION_ID" ]]; then
            echo "⚠️ Transition ID not set for $ENVIRONMENT — skipping"
            exit 0
          fi

          echo "🔄 Transitioning tickets to $ENVIRONMENT status..."
          IFS=',' read -ra TICKET_ARRAY <<< "$TICKETS"
          for TICKET in "${TICKET_ARRAY[@]}"; do
            TICKET=$(echo "$TICKET" | xargs)
            ISSUE_RESP=$(curl -s \
              -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "${JIRA_BASE_URL}/rest/api/3/issue/${TICKET}?fields=status")
            CURRENT_STATUS=$(echo "$ISSUE_RESP" | jq -r '.fields.status.name // "Unknown"')

            TRANS_HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"transition\": {\"id\": \"${TRANSITION_ID}\"}}" \
              "${JIRA_BASE_URL}/rest/api/3/issue/${TICKET}/transitions")

            if [[ "$TRANS_HTTP" == "204" ]]; then
              echo "  ✅ $TICKET → $ENVIRONMENT (was: $CURRENT_STATUS)"
            else
              echo "  ⚠️ $TICKET transition failed (HTTP $TRANS_HTTP) — was: $CURRENT_STATUS"
            fi
          done


  Update_Release_Notes:
    runs-on: ubuntu-latest
    needs: [Deployment_Build, Post_Deployment_Health_Check, Jira_Transition]
    if: |
      needs.Deployment_Build.result == 'success' &&
      needs.Post_Deployment_Health_Check.result == 'success' &&
      needs.Jira_Transition.result == 'success' &&
      needs.Deployment_Build.outputs.environment == 'PRODUCTION'

    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_PAGE_ID: ${{ secrets.CONFLUENCE_PAGE_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Extract Jira Tickets from Branch Names and Commits
        id: extract_tickets
        shell: bash
        env:
          PACKAGE: ${{ needs.Deployment_Build.outputs.deploy_package }}
          SOURCE_BRANCHES: ${{ needs.Deployment_Build.outputs.source_branches }}
        run: |
          echo "🔍 Extracting Jira tickets from branch names AND git commits..."

          BRANCH_INPUT="${SOURCE_BRANCHES:-$PACKAGE}"
          BRANCH_TICKETS=$(echo "$BRANCH_INPUT" | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u || true)
          echo "  Branch tickets : $(echo "$BRANCH_TICKETS" | tr '\n' ' ')"

          LAST_TAG=$(git tag --list 'PRODUCTION/*' --sort=-creatordate | head -1 || true)
          if [[ -n "$LAST_TAG" ]]; then
            echo "  Scanning commits since tag: $LAST_TAG"
            COMMIT_LOG=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s %b" 2>/dev/null || git log -50 --pretty=format:"%s %b")
          else
            echo "  No prior tag found — scanning last 50 commits"
            COMMIT_LOG=$(git log -50 --pretty=format:"%s %b")
          fi
          COMMIT_TICKETS=$(echo "$COMMIT_LOG" | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u || true)
          echo "  Commit tickets : $(echo "$COMMIT_TICKETS" | tr '\n' ' ')"

          ALL_TICKETS=$(printf '%s\n%s\n' "$BRANCH_TICKETS" "$COMMIT_TICKETS" \
            | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u | tr '\n' ',' | sed 's/,$//' || true)

          if [[ -z "$ALL_TICKETS" ]]; then
            echo "⚠️ No Jira tickets found in branch names or commits"
            echo "has_tickets=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ All tickets (deduplicated): $ALL_TICKETS"
            echo "tickets=$ALL_TICKETS" >> "$GITHUB_OUTPUT"
            echo "has_tickets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Jira Details and Update Confluence
        if: always()
        shell: bash
        env:
          TICKETS: ${{ steps.extract_tickets.outputs.tickets }}
          ENVIRONMENT: ${{ needs.Deployment_Build.outputs.environment }}
          PAGE_ID: ${{ secrets.CONFLUENCE_PAGE_ID }}
          PACKAGE: ${{ needs.Deployment_Build.outputs.deploy_package }}
          TAG_NAME: ${{ needs.Deployment_Build.outputs.tag_name }}
          RUN_ID: ${{ needs.Deployment_Build.outputs.run_id }}
          ACTOR: ${{ needs.Deployment_Build.outputs.actor }}
          REF_NAME: ${{ needs.Deployment_Build.outputs.ref_name }}
          REPO: ${{ needs.Deployment_Build.outputs.repo }}
          SOURCE_BRANCHES: ${{ needs.Deployment_Build.outputs.source_branches }}
        run: |
          echo "📋 Fetching Jira ticket details..."

          RELEASE_DATE=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M:%S IST')
          TAG_URL="https://github.com/${REPO}/releases/tag/${TAG_NAME}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          RELEASE_HTML="<h2>🚀 Release — ${ENVIRONMENT} | ${RELEASE_DATE}</h2>"
          RELEASE_HTML+="<table>"
          RELEASE_HTML+="<tr><th>Field</th><th>Details</th></tr>"
          RELEASE_HTML+="<tr><td><strong>Environment</strong></td><td>${ENVIRONMENT}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Deployed by</strong></td><td>${ACTOR}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Branch</strong></td><td>${REF_NAME}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Package(s)</strong></td><td>${PACKAGE}</td></tr>"
          if [[ -n "$SOURCE_BRANCHES" ]]; then
            BRANCHES_HTML=""
            IFS=',' read -ra BS <<< "$SOURCE_BRANCHES"
            for B in "${BS[@]}"; do
              BRANCHES_HTML+="<li>$(echo "$B" | xargs)</li>"
            done
            RELEASE_HTML+="<tr><td><strong>Feature Branches</strong></td><td><ul>${BRANCHES_HTML}</ul></td></tr>"
          fi
          if [[ -n "$TAG_NAME" ]]; then
            RELEASE_HTML+="<tr><td><strong>Release Tag</strong></td><td><a href=\"${TAG_URL}\">${TAG_NAME}</a></td></tr>"
          fi
          RELEASE_HTML+="<tr><td><strong>GitHub Actions Run</strong></td><td><a href=\"${RUN_URL}\">${RUN_ID}</a></td></tr>"
          RELEASE_HTML+="</table>"

          TICKET_COUNT=0
          if [[ -n "$TICKETS" ]]; then
            RELEASE_HTML+="<h3>📋 Jira Tickets</h3>"
            RELEASE_HTML+="<table><tr><th>Ticket</th><th>Summary</th><th>Type</th><th>Status</th><th>Priority</th></tr>"

            IFS=',' read -ra TICKET_ARRAY <<< "$TICKETS"
            for TICKET in "${TICKET_ARRAY[@]}"; do
              TICKET=$(echo "$TICKET" | xargs)
              echo "  Fetching: $TICKET"
              RESPONSE=$(curl -s -w "\n%{http_code}" \
                -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "${JIRA_BASE_URL}/rest/api/3/issue/${TICKET}?fields=summary,issuetype,status,priority")

              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | sed '$d')

              if [[ "$HTTP_CODE" == "200" ]]; then
                SUMMARY=$(echo "$BODY" | jq -r '.fields.summary // "N/A"')
                ISSUE_TYPE=$(echo "$BODY" | jq -r '.fields.issuetype.name // "N/A"')
                STATUS=$(echo "$BODY" | jq -r '.fields.status.name // "N/A"')
                PRIORITY=$(echo "$BODY" | jq -r '.fields.priority.name // "N/A"')
                TICKET_URL="${JIRA_BASE_URL}/browse/${TICKET}"
                RELEASE_HTML+="<tr><td><a href=\"${TICKET_URL}\">${TICKET}</a></td><td>${SUMMARY}</td><td>${ISSUE_TYPE}</td><td>${STATUS}</td><td>${PRIORITY}</td></tr>"
                TICKET_COUNT=$((TICKET_COUNT + 1))
              else
                echo "    ⚠️ Could not fetch $TICKET (HTTP $HTTP_CODE)"
                RELEASE_HTML+="<tr><td>${TICKET}</td><td colspan=\"4\">Could not fetch details</td></tr>"
              fi
            done
            RELEASE_HTML+="</table><p><em>Total tickets: ${TICKET_COUNT}</em></p>"
          else
            RELEASE_HTML+="<p><em>No Jira tickets found in recent commits.</em></p>"
          fi
          RELEASE_HTML+="<hr/>"
          echo "✅ Built release notes for ${TICKET_COUNT} tickets"

          if [[ -z "$CONFLUENCE_BASE_URL" || -z "$PAGE_ID" ]]; then
            echo "⚠️ Confluence secrets not configured — skipping page update"
            exit 0
          fi

          echo "📄 Fetching current Confluence page..."
          PAGE_RESPONSE=$(curl -s \
            -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${PAGE_ID}?expand=body.storage,version")

          CURRENT_VERSION=$(echo "$PAGE_RESPONSE" | jq -r '.version.number')
          CURRENT_BODY=$(echo "$PAGE_RESPONSE" | jq -r '.body.storage.value')
          PAGE_TITLE=$(echo "$PAGE_RESPONSE" | jq -r '.title')

          if [[ -z "$CURRENT_VERSION" || "$CURRENT_VERSION" == "null" ]]; then
            echo "❌ Failed to fetch Confluence page"
            echo "$PAGE_RESPONSE"
            exit 1
          fi

          NEW_VERSION=$((CURRENT_VERSION + 1))
          echo "📝 Updating: $PAGE_TITLE (v$CURRENT_VERSION → v$NEW_VERSION)"
          NEW_BODY="${RELEASE_HTML}${CURRENT_BODY}"

          UPDATE_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X PUT \
            -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --argjson version "{\"number\": ${NEW_VERSION}}" \
              --arg title "${PAGE_TITLE}" \
              --arg value "${NEW_BODY}" \
              '{version: $version, title: $title, type: "page", body: {storage: {value: $value, representation: "storage"}}}')" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${PAGE_ID}")

          UPDATE_CODE=$(echo "$UPDATE_RESPONSE" | tail -1)
          if [[ "$UPDATE_CODE" == "200" ]]; then
            echo "✅ Confluence page updated successfully!"
            echo "🔗 ${CONFLUENCE_BASE_URL}/pages/viewpage.action?pageId=${PAGE_ID}"
          else
            echo "❌ Failed to update Confluence page (HTTP $UPDATE_CODE)"
            echo "$UPDATE_RESPONSE" | sed '$d'
            exit 1
          fi

