          T_TOTAL=$(jq -r  '.scores.test_total         // 0'    "$FILE")
          D_RATE=$(jq -r   '.scores.deploy_rate        // "0"'  "$FILE")
          PMD_C=$(jq -r    '.scores.pmd_critical       // 0'    "$FILE")
          PMD_H=$(jq -r    '.scores.pmd_high           // 0'    "$FILE")
          PMD_M=$(jq -r    '.scores.pmd_medium         // 0'    "$FILE")
          APEX_EX=$(jq -r  '.scores.apex_exceptions    // 0'    "$FILE")
          BATCHES=$(jq -r  '.scores.failed_batch_count // 0'    "$FILE")
          CRIT_LIM=$(jq -r '.scores.critical_limits    // 0'    "$FILE")
          SEC_RAW=$(jq -r  '.scores.sec_raw            // "0"'  "$FILE")
          SF_SEC_SCORE=$(jq -r '.scores.sf_sec_score       // "0"'  "$FILE")
          SF_SEC_RISKS=$(jq -r '.scores.sf_sec_risks       // "0"'  "$FILE")
          SF_SEC_COMPLIANT=$(jq -r '.scores.sf_sec_compliant // "0"' "$FILE")
          PWD_ISSUES=$(jq -r   '.scores.pwd_issues         // "0"'  "$FILE")
          PWD_MIN_LEN=$(jq -r  '.scores.pwd_min_len        // "0"'  "$FILE")
          PWD_COMPLEXITY=$(jq -r '.scores.pwd_complexity   // "0"'  "$FILE")
          PWD_EXPIRY=$(jq -r   '.scores.pwd_expiry         // "0"'  "$FILE")
          PWD_LOCKOUT=$(jq -r  '.scores.pwd_lockout        // "0"'  "$FILE")
          SESSION_ISSUES=$(jq -r '.scores.session_issues   // "0"'  "$FILE")
          SESSION_HTTPS=$(jq -r  '.scores.session_https    // "false"' "$FILE")
          SESSION_CLICKJACK=$(jq -r '.scores.session_clickjack // "false"' "$FILE")
          SESSION_TIMEOUT=$(jq -r  '.scores.session_timeout  // "N/A"' "$FILE")
          PRIV_C=$(jq -r   '.scores.priv_count             // "0"'  "$FILE")
          INACT_C=$(jq -r  '.scores.inactive_count         // "0"'  "$FILE")
          NOMFA_C=$(jq -r  '.scores.no_mfa_count           // "0"'  "$FILE")
          GUEST_C=$(jq -r  '.scores.guest_count            // "0"'  "$FILE")
          CONN_C=$(jq -r   '.scores.conn_app_count         // "0"'  "$FILE")
          OWD_C=$(jq -r    '.scores.owd_public_count       // "0"'  "$FILE")
          OLD_API_C=$(jq -r '.scores.old_api_count         // "0"'  "$FILE")
          DS_USED_C=$(jq -r '.scores.data_storage_used // "0"'  "$FILE")
          DS_MAX_C=$(jq -r  '.scores.data_storage_max  // "0"'  "$FILE")
          FS_USED_C=$(jq -r '.scores.file_storage_used // "0"'  "$FILE")
          FS_MAX_C=$(jq -r  '.scores.file_storage_max  // "0"'  "$FILE")
          APEX=$(jq -r     '.metadata.apex_classes     // 0'    "$FILE")
          TRIG=$(jq -r     '.metadata.apex_triggers    // 0'    "$FILE")
          FLOWS=$(jq -r    '.metadata.active_flows     // 0'    "$FILE")
          USERS=$(jq -r    '.metadata.active_users     // 0'    "$FILE")
          BATCH_COUNT=$(jq '.failed_batches | length'           "$FILE")
          TEST_COUNT=$(jq  '.test_failures  | length'           "$FILE")

          if   [[ $SCORE -ge 90 ]]; then BAND_COLOR="#28a745"
          elif [[ $SCORE -ge 75 ]]; then BAND_COLOR="#5cb85c"
          elif [[ $SCORE -ge 50 ]]; then BAND_COLOR="#f0ad4e"
          else                           BAND_COLOR="#dc3545"
          fi

          GAUGE_CFG=$(printf '{"type":"doughnut","data":{"datasets":[{"data":[%s,%s],"backgroundColor":["%s","#e9ecef"],"borderWidth":0}]},"options":{"circumference":180,"rotation":-90,"cutout":"75%%","plugins":{"title":{"display":true,"text":"SF Health Check Score"},"legend":{"display":false}}}}' \
            "$SCORE" "$((100 - SCORE))" "${BAND_COLOR}")
          GAUGE_URL="https://quickchart.io/chart?w=300&h=180&c=$(printf '%s' "$GAUGE_CFG" | jq -sRr @uri 2>/dev/null)"

          FAILED_BATCHES_HTML=""
          if [[ $BATCH_COUNT -gt 0 ]]; then
            FAILED_BATCHES_HTML+="<h3 style='color:#e67e22'>⚙️ Failed Batch Jobs (last 24h)</h3>"
            FAILED_BATCHES_HTML+="<table border='1' cellpadding='6' cellspacing='0' style='border-collapse:collapse;width:100%'>"
            FAILED_BATCHES_HTML+="<tr style='background:#f5f5f5'><th>Apex Class</th><th>Errors</th><th>Total Items</th><th>Created</th></tr>"
            while IFS= read -r ROW; do
              FAILED_BATCHES_HTML+="$ROW"
            done < <(jq -r '.failed_batches[] | "<tr><td>\(.ApexClass.Name // "Unknown")</td><td>\(.NumberOfErrors)</td><td>\(.TotalJobItems)</td><td>\(.CreatedDate // "")</td></tr>"' "$FILE")
            FAILED_BATCHES_HTML+="</table>"
          fi

          TEST_FAILURES_HTML=""
          if [[ $TEST_COUNT -gt 0 ]]; then
            TEST_FAILURES_HTML+="<h3 style='color:#dc3545'>🧪 Apex Test Failures (last 24h)</h3>"
            TEST_FAILURES_HTML+="<table border='1' cellpadding='6' cellspacing='0' style='width:100%;border-collapse:collapse'>"
            TEST_FAILURES_HTML+="<tr style='background:#f5f5f5'><th>Class</th><th>Method</th><th>Message</th></tr>"
            while IFS= read -r ROW; do
              TEST_FAILURES_HTML+="$ROW"
            done < <(jq -r '.test_failures[] | "<tr><td>\(.ApexClass.Name // "Unknown")</td><td>\(.MethodName)</td><td>\(.Message // "" | .[0:120])</td></tr>"' "$FILE")
            TEST_FAILURES_HTML+="</table>"
          fi

          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          EMAIL_BODY="<html><body style='font-family:Arial,sans-serif;max-width:800px;margin:auto'>"
          EMAIL_BODY+="<div style='background:${BAND_COLOR};color:#fff;padding:20px;border-radius:8px 8px 0 0'>"
          EMAIL_BODY+="<h1 style='margin:0'>🏥 Post-Deployment Health Check</h1>"
          EMAIL_BODY+="<p style='margin:4px 0 0'>Environment: <strong>${ENV}</strong> | Package: <strong>${PACKAGE}</strong></p>"
          EMAIL_BODY+="<p style='margin:4px 0 0'>Scanned: ${SCAN_TIME} | Deployed by: ${ACTOR}</p>"
          EMAIL_BODY+="</div>"
          EMAIL_BODY+="<div style='border:1px solid #ddd;padding:20px'>"
          EMAIL_BODY+="<div style='text-align:center'><img src='${GAUGE_URL}' alt='Health Score' style='max-width:300px'/>"
          EMAIL_BODY+="<h2 style='color:${BAND_COLOR};margin:0'>${SCORE}/100 — ${BAND}</h2>"
          EMAIL_BODY+="<p style='color:#666;font-size:12px'>Salesforce Security Health Check Score (Setup → Security → Health Check)</p></div>"
          EMAIL_BODY+="<h3>🔒 Security Health Check Detail</h3>"
          EMAIL_BODY+="<table border='1' cellpadding='6' cellspacing='0' style='border-collapse:collapse;width:100%'>"
          EMAIL_BODY+="<tr style='background:#f5f5f5'><th>Factor</th><th>Value</th></tr>"
          EMAIL_BODY+="<tr><td>SF Health Check Score</td><td><strong>${SF_SEC_SCORE}/100</strong></td></tr>"
          EMAIL_BODY+="<tr><td>Non-compliant Settings</td><td>${SF_SEC_RISKS}</td></tr>"
          EMAIL_BODY+="<tr><td>Compliant Settings</td><td>${SF_SEC_COMPLIANT}</td></tr>"
          EMAIL_BODY+="<tr><td>Password Issues</td><td>${PWD_ISSUES} (MinLen:${PWD_MIN_LEN} Complexity:${PWD_COMPLEXITY} Expiry:${PWD_EXPIRY}d Lockout:${PWD_LOCKOUT})</td></tr>"
          EMAIL_BODY+="<tr><td>Session Issues</td><td>${SESSION_ISSUES} (HTTPS:${SESSION_HTTPS} Clickjack:${SESSION_CLICKJACK} Timeout:${SESSION_TIMEOUT})</td></tr>"
          EMAIL_BODY+="<tr><td>Profiles w/ Modify All</td><td>${PRIV_C}</td></tr>"
          EMAIL_BODY+="<tr><td>Inactive Users w/ Login</td><td>${INACT_C}</td></tr>"
          EMAIL_BODY+="<tr><td>Users without MFA</td><td>${NOMFA_C}</td></tr>"
          EMAIL_BODY+="<tr><td>Guest Users</td><td>${GUEST_C}</td></tr>"
          EMAIL_BODY+="<tr><td>Connected Apps (no IP)</td><td>${CONN_C}</td></tr>"
          EMAIL_BODY+="<tr><td>OWD Public Read/Write</td><td>${OWD_C}</td></tr>"
          EMAIL_BODY+="</table>"
          EMAIL_BODY+="<h3>📊 Additional Org Metrics (Informational)</h3>"
          EMAIL_BODY+="<table border='1' cellpadding='6' cellspacing='0' style='border-collapse:collapse;width:100%'>"
          EMAIL_BODY+="<tr style='background:#f5f5f5'><th>Metric</th><th>Value</th></tr>"
          EMAIL_BODY+="<tr><td>Apex Coverage</td><td>${COV}%</td></tr>"
          EMAIL_BODY+="<tr><td>Test Pass Rate</td><td>${T_PASS}/${T_TOTAL}</td></tr>"
          EMAIL_BODY+="<tr><td>Deployment Success Rate</td><td>${D_RATE}%</td></tr>"
          EMAIL_BODY+="<tr><td>PMD Critical/High/Med</td><td>${PMD_C}/${PMD_H}/${PMD_M}</td></tr>"
          EMAIL_BODY+="<tr><td>Deprecated API Classes</td><td>${OLD_API_C}</td></tr>"
          EMAIL_BODY+="<tr><td>Failed Batch Jobs (24h)</td><td>${BATCHES}</td></tr>"
          EMAIL_BODY+="<tr><td>Apex Exceptions (24h)</td><td>${APEX_EX}</td></tr>"
          EMAIL_BODY+="<tr><td>Critical Governor Limits</td><td>${CRIT_LIM}</td></tr>"
          EMAIL_BODY+="<tr><td>Active Apex Classes</td><td>${APEX}</td></tr>"
          EMAIL_BODY+="<tr><td>Active Flows</td><td>${FLOWS}</td></tr>"
          EMAIL_BODY+="<tr><td>Active Users</td><td>${USERS}</td></tr>"
          EMAIL_BODY+="</table>"
          EMAIL_BODY+="<h3>💾 Storage Usage</h3>"
          EMAIL_BODY+="<table border='1' cellpadding='6' cellspacing='0' style='border-collapse:collapse'>"
          EMAIL_BODY+="<tr style='background:#f5f5f5'><th>Type</th><th>Used (MB)</th><th>Max (MB)</th></tr>"
          EMAIL_BODY+="<tr><td>Data Storage</td><td><strong>${DS_USED_C}</strong></td><td>${DS_MAX_C}</td></tr>"
          EMAIL_BODY+="<tr><td>File Storage</td><td><strong>${FS_USED_C}</strong></td><td>${FS_MAX_C}</td></tr>"
          EMAIL_BODY+="</table>"
          EMAIL_BODY+="${FAILED_BATCHES_HTML}"
          EMAIL_BODY+="${TEST_FAILURES_HTML}"
          EMAIL_BODY+="<p style='margin-top:20px'><a href='${RUN_URL}' style='background:#0366d6;color:#fff;padding:8px 16px;border-radius:4px;text-decoration:none'>View Full Run →</a></p>"
          EMAIL_BODY+="</div></body></html>"

          echo "$EMAIL_BODY" > email_body.html
          echo "email_subject=Post-Deploy Health: ${ENV} | Score: ${SCORE}/100 | ${PACKAGE}" >> $GITHUB_OUTPUT

      - name: Dispatch Health Check Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port:    ${{ secrets.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          subject:        "Post-Deploy Health: ${{ needs.Deployment_Build.outputs.environment }} | ${{ needs.Deployment_Build.outputs.deploy_package }}"
          to:             ${{ secrets.NOTIFY_EMAILS }}
          from:           "Do not Reply <${{ secrets.GMAIL_USERNAME }}>"
          html_body:      file://email_body.html
          convert_markdown: false

      - name: Cleanup JWT Key
        if: always()
        run: rm -f server.key


  Jira_Transition:
    runs-on: ubuntu-latest
    needs: [Deployment_Build, Post_Deployment_Health_Check]
    if: |
      always() &&
      needs.Deployment_Build.result == 'success' &&
      contains(fromJSON('["DEV","QA","UAT","PRODUCTION","HOTFIX"]'), needs.Deployment_Build.outputs.environment) &&
      (needs.Post_Deployment_Health_Check.result == 'success' || needs.Post_Deployment_Health_Check.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Jira Tickets
        id: extract_tickets
        shell: bash
        env:
          PACKAGE: ${{ needs.Deployment_Build.outputs.deploy_package }}
          SOURCE_BRANCHES: ${{ needs.Deployment_Build.outputs.source_branches }}
          ENVIRONMENT: ${{ needs.Deployment_Build.outputs.environment }}
        run: |
          ALL_TICKETS=""

          if [[ "$ENVIRONMENT" == "PRODUCTION" ]]; then
            # PROD: extract from package name + commits
            BRANCH_INPUT="${SOURCE_BRANCHES:-$PACKAGE}"
            BRANCH_TICKETS=$(echo "$BRANCH_INPUT" | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u || true)

            LAST_TAG=$(git tag --list "PRODUCTION/*" --sort=-creatordate | head -1 || true)
            if [[ -n "$LAST_TAG" ]]; then
              echo "  Scanning commits since tag: $LAST_TAG"
              COMMIT_LOG=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s %b" 2>/dev/null || git log -50 --pretty=format:"%s %b")
            else
              echo "  No prior tag found — scanning last 50 commits"
              COMMIT_LOG=$(git log -50 --pretty=format:"%s %b")
            fi
            COMMIT_TICKETS=$(echo "$COMMIT_LOG" | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u || true)

            ALL_TICKETS=$(printf '%s\n%s\n' "$BRANCH_TICKETS" "$COMMIT_TICKETS" \
              | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u | tr '\n' ',' | sed 's/,$//' || true)
          else
            # Lower orgs (DEV/QA/UAT/HOTFIX): extract only from package name
            # Package name format: feature/JIRANUMBER (single) or Release_ENV_date (multi)
            BRANCH_INPUT="${SOURCE_BRANCHES:-$PACKAGE}"
            ALL_TICKETS=$(echo "$BRANCH_INPUT" | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u | tr '\n' ',' | sed 's/,$//' || true)
          fi

          if [[ -z "$ALL_TICKETS" ]]; then
            echo "⚠️ No Jira tickets found — skipping transition"
            echo "has_tickets=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Tickets: $ALL_TICKETS"
            echo "tickets=$ALL_TICKETS" >> "$GITHUB_OUTPUT"
            echo "has_tickets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Transition Jira Tickets
        if: steps.extract_tickets.outputs.has_tickets == 'true'
        shell: bash
        env:
          TICKETS:             ${{ steps.extract_tickets.outputs.tickets }}
          ENVIRONMENT:         ${{ needs.Deployment_Build.outputs.environment }}
          JIRA_BASE_URL:       ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL:     ${{ secrets.JIRA_USER_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          TRANSITION_ID_QA:    ${{ secrets.JIRA_QA_TRANSITION_ID }}
          TRANSITION_ID_UAT:   ${{ secrets.JIRA_UAT_TRANSITION_ID }}
          TRANSITION_ID_PROD:  ${{ secrets.JIRA_PROD_TRANSITION_ID }}
        run: |
          case "$ENVIRONMENT" in
            QA)         TRANSITION_ID="$TRANSITION_ID_QA" ;;
            UAT)        TRANSITION_ID="$TRANSITION_ID_UAT" ;;
            PRODUCTION) TRANSITION_ID="$TRANSITION_ID_PROD" ;;
          esac

          if [[ -z "$TRANSITION_ID" ]]; then
            echo "⚠️ Transition ID not set for $ENVIRONMENT — skipping"
            exit 0
          fi

          echo "🔄 Transitioning tickets to $ENVIRONMENT status..."
          IFS=',' read -ra TICKET_ARRAY <<< "$TICKETS"
          for TICKET in "${TICKET_ARRAY[@]}"; do
            TICKET=$(echo "$TICKET" | xargs)
            ISSUE_RESP=$(curl -s \
              -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "${JIRA_BASE_URL}/rest/api/3/issue/${TICKET}?fields=status")
            CURRENT_STATUS=$(echo "$ISSUE_RESP" | jq -r '.fields.status.name // "Unknown"')

            TRANS_HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"transition\": {\"id\": \"${TRANSITION_ID}\"}}" \
              "${JIRA_BASE_URL}/rest/api/3/issue/${TICKET}/transitions")

            if [[ "$TRANS_HTTP" == "204" ]]; then
              echo "  ✅ $TICKET → $ENVIRONMENT (was: $CURRENT_STATUS)"
            else
              echo "  ⚠️ $TICKET transition failed (HTTP $TRANS_HTTP) — was: $CURRENT_STATUS"
            fi
          done


  Update_Release_Notes:
    runs-on: ubuntu-latest
    needs: [Deployment_Build, Post_Deployment_Health_Check, Jira_Transition]
    if: |
      needs.Deployment_Build.result == 'success' &&
      needs.Post_Deployment_Health_Check.result == 'success' &&
      needs.Jira_Transition.result == 'success' &&
      needs.Deployment_Build.outputs.environment == 'PRODUCTION'

    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_PAGE_ID: ${{ secrets.CONFLUENCE_PAGE_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Extract Jira Tickets from Branch Names and Commits
        id: extract_tickets
        shell: bash
        env:
          PACKAGE: ${{ needs.Deployment_Build.outputs.deploy_package }}
          SOURCE_BRANCHES: ${{ needs.Deployment_Build.outputs.source_branches }}
        run: |
          echo "🔍 Extracting Jira tickets from branch names AND git commits..."

          BRANCH_INPUT="${SOURCE_BRANCHES:-$PACKAGE}"
          BRANCH_TICKETS=$(echo "$BRANCH_INPUT" | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u || true)
          echo "  Branch tickets : $(echo "$BRANCH_TICKETS" | tr '\n' ' ')"

          LAST_TAG=$(git tag --list 'PRODUCTION/*' --sort=-creatordate | head -1 || true)
          if [[ -n "$LAST_TAG" ]]; then
            echo "  Scanning commits since tag: $LAST_TAG"
            COMMIT_LOG=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s %b" 2>/dev/null || git log -50 --pretty=format:"%s %b")
          else
            echo "  No prior tag found — scanning last 50 commits"
            COMMIT_LOG=$(git log -50 --pretty=format:"%s %b")
          fi
          COMMIT_TICKETS=$(echo "$COMMIT_LOG" | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u || true)
          echo "  Commit tickets : $(echo "$COMMIT_TICKETS" | tr '\n' ' ')"

          ALL_TICKETS=$(printf '%s\n%s\n' "$BRANCH_TICKETS" "$COMMIT_TICKETS" \
            | grep -oP '(?<![A-Z0-9])[A-Z][A-Z0-9]+[-_]\d+(?![A-Z0-9-])' | sort -u | tr '\n' ',' | sed 's/,$//' || true)

          if [[ -z "$ALL_TICKETS" ]]; then
            echo "⚠️ No Jira tickets found in branch names or commits"
            echo "has_tickets=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ All tickets (deduplicated): $ALL_TICKETS"
            echo "tickets=$ALL_TICKETS" >> "$GITHUB_OUTPUT"
            echo "has_tickets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Jira Details and Update Confluence
        if: always()
        shell: bash
        env:
          TICKETS: ${{ steps.extract_tickets.outputs.tickets }}
          ENVIRONMENT: ${{ needs.Deployment_Build.outputs.environment }}
          PAGE_ID: ${{ secrets.CONFLUENCE_PAGE_ID }}
          PACKAGE: ${{ needs.Deployment_Build.outputs.deploy_package }}
          TAG_NAME: ${{ needs.Deployment_Build.outputs.tag_name }}
          RUN_ID: ${{ needs.Deployment_Build.outputs.run_id }}
          ACTOR: ${{ needs.Deployment_Build.outputs.actor }}
          REF_NAME: ${{ needs.Deployment_Build.outputs.ref_name }}
          REPO: ${{ needs.Deployment_Build.outputs.repo }}
          SOURCE_BRANCHES: ${{ needs.Deployment_Build.outputs.source_branches }}
        run: |
          echo "📋 Fetching Jira ticket details..."

          RELEASE_DATE=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M:%S IST')
          TAG_URL="https://github.com/${REPO}/releases/tag/${TAG_NAME}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          RELEASE_HTML="<h2>🚀 Release — ${ENVIRONMENT} | ${RELEASE_DATE}</h2>"
          RELEASE_HTML+="<table>"
          RELEASE_HTML+="<tr><th>Field</th><th>Details</th></tr>"
          RELEASE_HTML+="<tr><td><strong>Environment</strong></td><td>${ENVIRONMENT}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Deployed by</strong></td><td>${ACTOR}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Branch</strong></td><td>${REF_NAME}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Package(s)</strong></td><td>${PACKAGE}</td></tr>"
          if [[ -n "$SOURCE_BRANCHES" ]]; then
            BRANCHES_HTML=""
            IFS=',' read -ra BS <<< "$SOURCE_BRANCHES"
            for B in "${BS[@]}"; do
              BRANCHES_HTML+="<li>$(echo "$B" | xargs)</li>"
            done
            RELEASE_HTML+="<tr><td><strong>Feature Branches</strong></td><td><ul>${BRANCHES_HTML}</ul></td></tr>"
          fi
          if [[ -n "$TAG_NAME" ]]; then
            RELEASE_HTML+="<tr><td><strong>Release Tag</strong></td><td><a href=\"${TAG_URL}\">${TAG_NAME}</a></td></tr>"
          fi
          RELEASE_HTML+="<tr><td><strong>GitHub Actions Run</strong></td><td><a href=\"${RUN_URL}\">${RUN_ID}</a></td></tr>"
          RELEASE_HTML+="</table>"

          TICKET_COUNT=0
          if [[ -n "$TICKETS" ]]; then
            RELEASE_HTML+="<h3>📋 Jira Tickets</h3>"
            RELEASE_HTML+="<table><tr><th>Ticket</th><th>Summary</th><th>Type</th><th>Status</th><th>Priority</th></tr>"

            IFS=',' read -ra TICKET_ARRAY <<< "$TICKETS"
            for TICKET in "${TICKET_ARRAY[@]}"; do
              TICKET=$(echo "$TICKET" | xargs)
              echo "  Fetching: $TICKET"
              RESPONSE=$(curl -s -w "\n%{http_code}" \
                -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "${JIRA_BASE_URL}/rest/api/3/issue/${TICKET}?fields=summary,issuetype,status,priority")

              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | sed '$d')

              if [[ "$HTTP_CODE" == "200" ]]; then
                SUMMARY=$(echo "$BODY" | jq -r '.fields.summary // "N/A"')
                ISSUE_TYPE=$(echo "$BODY" | jq -r '.fields.issuetype.name // "N/A"')
                STATUS=$(echo "$BODY" | jq -r '.fields.status.name // "N/A"')
                PRIORITY=$(echo "$BODY" | jq -r '.fields.priority.name // "N/A"')
                TICKET_URL="${JIRA_BASE_URL}/browse/${TICKET}"
                RELEASE_HTML+="<tr><td><a href=\"${TICKET_URL}\">${TICKET}</a></td><td>${SUMMARY}</td><td>${ISSUE_TYPE}</td><td>${STATUS}</td><td>${PRIORITY}</td></tr>"
                TICKET_COUNT=$((TICKET_COUNT + 1))
              else
                echo "    ⚠️ Could not fetch $TICKET (HTTP $HTTP_CODE)"
                RELEASE_HTML+="<tr><td>${TICKET}</td><td colspan=\"4\">Could not fetch details</td></tr>"
              fi
            done
            RELEASE_HTML+="</table><p><em>Total tickets: ${TICKET_COUNT}</em></p>"
          else
            RELEASE_HTML+="<p><em>No Jira tickets found in recent commits.</em></p>"
          fi
          RELEASE_HTML+="<hr/>"
          echo "✅ Built release notes for ${TICKET_COUNT} tickets"

          if [[ -z "$CONFLUENCE_BASE_URL" || -z "$PAGE_ID" ]]; then
            echo "⚠️ Confluence secrets not configured — skipping page update"
            exit 0
          fi

          echo "📄 Fetching current Confluence page..."
          PAGE_RESPONSE=$(curl -s \
            -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${PAGE_ID}?expand=body.storage,version")

          CURRENT_VERSION=$(echo "$PAGE_RESPONSE" | jq -r '.version.number')
          CURRENT_BODY=$(echo "$PAGE_RESPONSE" | jq -r '.body.storage.value')
          PAGE_TITLE=$(echo "$PAGE_RESPONSE" | jq -r '.title')

          if [[ -z "$CURRENT_VERSION" || "$CURRENT_VERSION" == "null" ]]; then
            echo "❌ Failed to fetch Confluence page"
            echo "$PAGE_RESPONSE"
            exit 1
          fi

          NEW_VERSION=$((CURRENT_VERSION + 1))
          echo "📝 Updating: $PAGE_TITLE (v$CURRENT_VERSION → v$NEW_VERSION)"
          NEW_BODY="${RELEASE_HTML}${CURRENT_BODY}"

          UPDATE_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X PUT \
            -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --argjson version "{\"number\": ${NEW_VERSION}}" \
              --arg title "${PAGE_TITLE}" \
              --arg value "${NEW_BODY}" \
              '{version: $version, title: $title, type: "page", body: {storage: {value: $value, representation: "storage"}}}')" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${PAGE_ID}")

          UPDATE_CODE=$(echo "$UPDATE_RESPONSE" | tail -1)
          if [[ "$UPDATE_CODE" == "200" ]]; then
            echo "✅ Confluence page updated successfully!"
            echo "🔗 ${CONFLUENCE_BASE_URL}/pages/viewpage.action?pageId=${PAGE_ID}"
          else
            echo "❌ Failed to update Confluence page (HTTP $UPDATE_CODE)"
            echo "$UPDATE_RESPONSE" | sed '$d'
            exit 1
          fi

