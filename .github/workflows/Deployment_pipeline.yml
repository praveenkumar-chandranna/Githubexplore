name: Lodha Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      Feature_Branch:
        type: string
        description: >
          Branch name(s) to deploy. Single: feature/LODHA-123  |  Multiple: feature/LODHA123,feature/LODHA4321
        required: true
      environment:
        type: choice
        description: Deployment environment
        options:
          - DEV
          - QA
          - UAT
          - PRODUCTION
          - HOTFIX
        default: DEV
        required: true
      testlevel:
        type: choice
        description: Test class run level
        options:
          - RunLocalTests
          - RunSpecifiedTests
          - RunAllTestsInOrg
        default: RunSpecifiedTests
        required: true

jobs:
  Deployment_Build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SF_LOGIN_URL_TEST: ${{ secrets.SANDBOX_URL }}
      SF_LOGIN_URL_PROD: ${{ secrets.LOGIN_URL }}
      SF_ALIAS: lodhaOrg

    if: >
      (github.event_name == 'workflow_dispatch' &&
       (
         (github.ref == 'refs/heads/DEV' && github.event.inputs.environment == 'DEV') ||
         (github.ref == 'refs/heads/QA' && github.event.inputs.environment == 'QA') ||
         (github.ref == 'refs/heads/UAT' && github.event.inputs.environment == 'UAT') ||
         (github.ref == 'refs/heads/main' && github.event.inputs.environment == 'PRODUCTION') ||
         (github.ref == 'refs/heads/main' && github.event.inputs.environment == 'HOTFIX')
       ))

    outputs:
      deploy_package: ${{ steps.resolve-package.outputs.deploy_package }}
      environment: ${{ steps.set-env.outputs.environment }}
      tag_name: ${{ steps.release-tag.outputs.tag_name }}
      run_id: ${{ steps.set-run-meta.outputs.run_id }}
      actor: ${{ steps.set-run-meta.outputs.actor }}
      ref_name: ${{ steps.set-run-meta.outputs.ref_name }}
      repo: ${{ steps.set-run-meta.outputs.repo }}
      source_branches: ${{ steps.resolve-package.outputs.source_branches }}

    steps:
      - name: Validate branch-environment consistency
        id: set-run-meta
        shell: bash
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_FEATURE: ${{ github.event.inputs.Feature_Branch }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "Manual run: Environment=${INPUT_ENV}, Package(s)=${INPUT_FEATURE}"
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "actor=${ACTOR}" >> $GITHUB_OUTPUT
          echo "ref_name=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "repo=${REPO}" >> $GITHUB_OUTPUT


      - name: Set environment variables
        id: set-env
        shell: bash
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_TESTLEVEL: ${{ github.event.inputs.testlevel }}
        run: |
          echo "ENVIRONMENT=$INPUT_ENV" >> $GITHUB_ENV
          echo "environment=$INPUT_ENV" >> $GITHUB_OUTPUT
          echo "TEST_LEVEL=$INPUT_TESTLEVEL" >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Consolidate or Resolve Package
        id: resolve-package
        shell: bash
        env:
          FEATURE_INPUT: ${{ github.event.inputs.Feature_Branch }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          MANIFEST_DIR: ${{ github.workspace }}/manifest/feature
          OUTPUT_DIR: ${{ github.workspace }}/manifest
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          FEATURE_INPUT=$(echo "$FEATURE_INPUT" | xargs)

          if [[ "$FEATURE_INPUT" == *","* ]]; then
            echo "📦 Multiple branches detected — consolidating..."

            RELEASE_DATE=$(TZ='Asia/Kolkata' date +'%d%m%Y_%H%M')
            OUTPUT_NAME="Release_${ENVIRONMENT}_${RELEASE_DATE}"
            OUTPUT_PKG="${OUTPUT_DIR}/${OUTPUT_NAME}_package.xml"
            OUTPUT_TEST="${OUTPUT_DIR}/${OUTPUT_NAME}_TestClass.txt"

            echo "=========================================="
            echo "PACKAGE CONSOLIDATION"
            echo "=========================================="
            echo "Environment : $ENVIRONMENT"
            echo "Branches    : $FEATURE_INPUT"
            echo "Output      : $OUTPUT_NAME"
            echo "=========================================="

            IFS=',' read -ra BRANCHES <<< "$FEATURE_INPUT"

            echo ""
            echo "🔍 Validating input files..."
            for BRANCH in "${BRANCHES[@]}"; do
              BRANCH=$(echo "$BRANCH" | xargs)
              PKG_FILE="${OUTPUT_DIR}/${BRANCH}_package.xml"
              if [[ ! -f "$PKG_FILE" ]]; then
                echo "❌ Package file not found: $PKG_FILE"
                exit 1
              fi
              echo "  ✅ Found: ${BRANCH}_package.xml"
            done

            MAX_VERSION="0"
            ALL_MEMBERS_RAW=""

            for BRANCH in "${BRANCHES[@]}"; do
              BRANCH=$(echo "$BRANCH" | xargs)
              PKG_FILE="${OUTPUT_DIR}/${BRANCH}_package.xml"
              echo "  Processing: ${BRANCH}_package.xml"

              VERSION=$(grep -oP '(?<=<version>)[^<]+' "$PKG_FILE" || echo "0")
              if awk "BEGIN {exit !($VERSION > $MAX_VERSION)}"; then
                MAX_VERSION="$VERSION"
              fi

              # Parse <types> blocks line by line — no awk/sed multi-char RS needed
              IN_BLOCK=0
              CUR_TYPE=""
              CUR_MEMBERS=""
              while IFS= read -r LINE; do
                LINE=$(echo "$LINE" | sed 's/^[[:space:]]*//')
                if echo "$LINE" | grep -q '<types>'; then
                  IN_BLOCK=1; CUR_TYPE=""; CUR_MEMBERS=""
                elif [[ $IN_BLOCK -eq 1 ]]; then
                  if echo "$LINE" | grep -q '<name>'; then
                    CUR_TYPE=$(echo "$LINE" | grep -oP '(?<=<name>)[^<]+')
                  elif echo "$LINE" | grep -q '<members>'; then
                    M=$(echo "$LINE" | grep -oP '(?<=<members>)[^<]+')
                    CUR_MEMBERS+="$M"$'\n'
                  elif echo "$LINE" | grep -q '</types>'; then
                    if [[ -n "$CUR_TYPE" ]]; then
                      while IFS= read -r MEMBER; do
                        [[ -n "$MEMBER" ]] && ALL_MEMBERS_RAW+="${CUR_TYPE}|||${MEMBER}"$'\n'
                      done <<< "$CUR_MEMBERS"
                    fi
                    IN_BLOCK=0; CUR_TYPE=""; CUR_MEMBERS=""
                  fi
                fi
              done < "$PKG_FILE"
            done

            printf '<?xml version="1.0" encoding="UTF-8"?>\n' > "$OUTPUT_PKG"
            printf '<Package xmlns="http://soap.sforce.com/2006/04/metadata">\n' >> "$OUTPUT_PKG"

            SORTED_TYPES=$(echo "$ALL_MEMBERS_RAW" | grep -v '^$' | cut -d'|' -f1 | sort -u)
            while IFS= read -r TYPE_NAME; do
              [[ -z "$TYPE_NAME" ]] && continue
              printf '    <types>\n' >> "$OUTPUT_PKG"
              echo "$ALL_MEMBERS_RAW" | grep -v '^$' | grep -F "${TYPE_NAME}|||" | cut -d'|' -f4 | sort -u | while read -r MEMBER; do
                [[ -n "$MEMBER" ]] && printf '        <members>%s</members>\n' "$MEMBER" >> "$OUTPUT_PKG"
              done
              printf '        <name>%s</name>\n' "$TYPE_NAME" >> "$OUTPUT_PKG"
              printf '    </types>\n' >> "$OUTPUT_PKG"
            done <<< "$SORTED_TYPES"

            printf '    <version>%s</version>\n' "$MAX_VERSION" >> "$OUTPUT_PKG"
            printf '</Package>\n' >> "$OUTPUT_PKG"

            ALL_TESTS=""
            for BRANCH in "${BRANCHES[@]}"; do
              BRANCH=$(echo "$BRANCH" | xargs)
              TEST_FILE="${OUTPUT_DIR}/${BRANCH}_TestClass.txt"
              if [[ -f "$TEST_FILE" ]]; then
                CONTENT=$(cat "$TEST_FILE" | tr ' ' '\n' | tr ',' '\n')
                ALL_TESTS+=$'\n'"$CONTENT"
              fi
            done

            UNIQUE_TESTS=$(echo "$ALL_TESTS" | sort -u | grep -v '^$' | tr '\n' ' ' | xargs)
            [[ -n "$UNIQUE_TESTS" ]] && echo "$UNIQUE_TESTS" > "$OUTPUT_TEST"

            echo ""
            echo "=========================================="
            echo "📦 CONSOLIDATED PACKAGE.XML"
            echo "=========================================="
            cat "$OUTPUT_PKG"
            if [[ -f "$OUTPUT_TEST" ]]; then
              echo ""
              echo "=========================================="
              echo "🧪 CONSOLIDATED TESTCLASS.TXT"
              echo "=========================================="
              cat "$OUTPUT_TEST"
            fi

            echo "FEATURE_BRANCH=${OUTPUT_NAME}" >> $GITHUB_ENV
            echo "deploy_package=${OUTPUT_NAME}" >> $GITHUB_OUTPUT
            echo "source_branches=${FEATURE_INPUT}" >> $GITHUB_OUTPUT
            echo "✅ Consolidation complete: $OUTPUT_NAME"
            echo ""
            echo "=========================================="
            echo "🌿 SOURCE FEATURE BRANCHES"
            echo "=========================================="
            IFS=',' read -ra DISPLAY_BRANCHES <<< "$FEATURE_INPUT"
            for B in "${DISPLAY_BRANCHES[@]}"; do
              echo "  - $(echo "$B" | xargs)"
            done
            echo "=========================================="

          else
            echo "📄 Single branch detected — using directly: $FEATURE_INPUT"
            echo "FEATURE_BRANCH=${FEATURE_INPUT}" >> $GITHUB_ENV
            echo "deploy_package=${FEATURE_INPUT}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf --version

      - name: Generate JWT private key file
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
          chmod 600 server.key

      - name: Set org credentials and login URL based on environment
        id: set-org
        shell: bash
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          SF_LOGIN_URL_TEST_VAL: ${{ env.SF_LOGIN_URL_TEST }}
          SF_LOGIN_URL_PROD_VAL: ${{ env.SF_LOGIN_URL_PROD }}
          KEY_DEV: ${{ secrets.SALESFORCE_CONSUMER_KEY_DEV }}
          KEY_QA: ${{ secrets.SALESFORCE_CONSUMER_KEY_QA }}
          KEY_UAT: ${{ secrets.SALESFORCE_CONSUMER_KEY_UAT }}
          KEY_PROD: ${{ secrets.SALESFORCE_CONSUMER_KEY_PROD }}
          KEY_HOTFIX: ${{ secrets.SALESFORCE_CONSUMER_KEY_HOTFIX }}
          USER_DEV: ${{ secrets.SFDX_AUTH_DEV_USERNAME }}
          USER_QA: ${{ secrets.SFDX_AUTH_QA_USERNAME }}
          USER_UAT: ${{ secrets.SFDX_AUTH_UAT_USERNAME }}
          USER_PROD: ${{ secrets.SFDX_AUTH_PROD_USERNAME }}
          USER_HOTFIX: ${{ secrets.SFDX_AUTH_HOTFIX_USERNAME }}
        run: |
          case "$ENVIRONMENT" in
            DEV)        echo "CLIENT_ID=$KEY_DEV"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_DEV"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            QA)         echo "CLIENT_ID=$KEY_QA"     >> $GITHUB_OUTPUT; echo "USERNAME=$USER_QA"     >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            UAT)        echo "CLIENT_ID=$KEY_UAT"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_UAT"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            PRODUCTION) echo "CLIENT_ID=$KEY_PROD"   >> $GITHUB_OUTPUT; echo "USERNAME=$USER_PROD"   >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_PROD_VAL" >> $GITHUB_OUTPUT ;;
            HOTFIX)     echo "CLIENT_ID=$KEY_HOTFIX" >> $GITHUB_OUTPUT; echo "USERNAME=$USER_HOTFIX" >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            *) echo "Unsupported environment $ENVIRONMENT"; exit 1 ;;
          esac

      - name: Clear Prior Salesforce Sessions
        shell: bash
        run: |
          echo "🧹 Clearing existing Salesforce org sessions..."
          sf org logout --all --no-prompt || true

      - name: Authenticate to - ${{ github.event.inputs.environment }} Org
        env:
          CLIENT_ID: ${{ steps.set-org.outputs.CLIENT_ID }}
          USERNAME: ${{ steps.set-org.outputs.USERNAME }}
          LOGIN_URL: ${{ steps.set-org.outputs.LOGIN_URL }}
        run: |
          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$USERNAME" \
            --instance-url "$LOGIN_URL" \
            --set-default

      - name: Check Manifest Exists and Prepare Test Classes
        id: prepare-tests
        shell: bash
        env:
          TEST_LEVEL: ${{ env.TEST_LEVEL }}
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          MANIFEST="${WORKSPACE}/manifest/${FEATURE_BRANCH}_package.xml"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "ERROR: Manifest file $MANIFEST not found."
            exit 1
          fi
          echo "✅ Manifest found: $MANIFEST"

          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" ]]; then
            TEST_CLASS_FILE="${WORKSPACE}/manifest/${FEATURE_BRANCH}_TestClass.txt"
            if [[ ! -f "$TEST_CLASS_FILE" ]]; then
              echo "ERROR: Test class file $TEST_CLASS_FILE not found."
              exit 1
            fi
            TEST_CLASSES=$(paste -sd ' ' "$TEST_CLASS_FILE")
            echo "✅ Test classes: $TEST_CLASSES"
            echo "test_classes=$TEST_CLASSES" >> $GITHUB_OUTPUT
          else
            echo "test_classes=" >> $GITHUB_OUTPUT
          fi

      - name: Validation Deployment - ${{ github.event.inputs.environment }} Org
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          TEST_LEVEL: ${{ env.TEST_LEVEL }}
          TEST_CLASSES: ${{ steps.prepare-tests.outputs.test_classes }}
          ORG_USERNAME: ${{ steps.set-org.outputs.USERNAME }}
        run: |
          MANIFEST="${WORKSPACE}/manifest/${FEATURE_BRANCH}_package.xml"
          echo "Validating: $MANIFEST"
          CMD=(sf project deploy validate --manifest "$MANIFEST" --target-org "$ORG_USERNAME" --test-level "$TEST_LEVEL" --wait 30 --ignore-warnings --verbose)
          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" && -n "$TEST_CLASSES" ]]; then
            CMD+=(--tests $TEST_CLASSES)
          fi
          "${CMD[@]}"

      - name: Deploy to Salesforce - ${{ github.event.inputs.environment }} Org
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          TEST_LEVEL: ${{ env.TEST_LEVEL }}
          TEST_CLASSES: ${{ steps.prepare-tests.outputs.test_classes }}
          ORG_USERNAME: ${{ steps.set-org.outputs.USERNAME }}
        run: |
          MANIFEST="${WORKSPACE}/manifest/${FEATURE_BRANCH}_package.xml"
          echo "Deploying: $MANIFEST"
          CMD=(sf project deploy start --manifest "$MANIFEST" --target-org "$ORG_USERNAME" --test-level "$TEST_LEVEL" --wait 60 --ignore-conflicts --coverage-formatters json --results-dir coverage-results)
          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" && -n "$TEST_CLASSES" ]]; then
            CMD+=(--tests $TEST_CLASSES)
          fi
          "${CMD[@]}"

      - name: Apex Coverage Gate (75% Lodha Standard)
        if: env.TEST_LEVEL != 'NoTestRun'
        uses: ./.github/actions/coverage-gate
        with:
          coverage-results-dir: coverage-results
          minimum-coverage:     '75'
          environment:          ${{ github.event.inputs.environment }}
          feature-branch:       ${{ env.FEATURE_BRANCH }}
          jira-base-url:        ${{ secrets.JIRA_BASE_URL }}
          jira-user-email:      ${{ secrets.JIRA_USER_EMAIL }}
          jira-api-token:       ${{ secrets.ATLASSIAN_API_TOKEN }}
          run-id:               ${{ github.run_id }}
          repo:                 ${{ github.repository }}

      - name: Cleanup JWT key
        if: always()
        run: rm -f server.key

      - name: Create Release Tag
        id: release-tag
        if: github.event.inputs.environment == 'PRODUCTION'
        shell: bash
        env:
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_BRANCHES: ${{ steps.resolve-package.outputs.source_branches }}
        run: |
          TAG_DATE=$(TZ='Asia/Kolkata' date +'%d%m%Y')
          TAG_TIME=$(TZ='Asia/Kolkata' date +'%H%M')
          TAG_PREFIX="${ENVIRONMENT}/${TAG_DATE}"

          echo "🔍 Fetching existing tags for prefix: ${TAG_PREFIX}"
          EXISTING_TAGS=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/git/refs/tags" \
            | jq -r '.[].ref | ltrimstr("refs/tags/")' 2>/dev/null || echo "")

          # Find highest patch version for today's date + env prefix
          MAX_PATCH=-1
          while IFS= read -r TAG; do
            # Match pattern: ENV/DDMMYYYY_HHMM_vMAJOR.MINOR.PATCH
            if [[ "$TAG" =~ ^${ENVIRONMENT}/[0-9]{8}_[0-9]{4}_v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              # Check same day (date portion matches)
              TAG_DAY=$(echo "$TAG" | sed 's|.*/\([0-9]\{8\}\)_.*|\1|')
              if [[ "$TAG_DAY" == "$TAG_DATE" ]]; then
                PATCH=${BASH_REMATCH[3]}
                if [[ $PATCH -gt $MAX_PATCH ]]; then
                  MAX_PATCH=$PATCH
                fi
              fi
            fi
          done <<< "$EXISTING_TAGS"

          # Determine version
          if [[ $MAX_PATCH -eq -1 ]]; then
            VERSION="v1.0.0"
          else
            NEXT_PATCH=$((MAX_PATCH + 1))
            VERSION="v1.0.${NEXT_PATCH}"
          fi

          TAG_NAME="${ENVIRONMENT}/${TAG_DATE}_${TAG_TIME}_${VERSION}"
          SAFE_BRANCH=$(echo "$FEATURE_BRANCH" | sed 's|/|-|g')

          echo "=========================================="
          echo "RELEASE TAG"
          echo "=========================================="
          echo "  Environment : $ENVIRONMENT"
          echo "  Date (IST)  : $TAG_DATE"
          echo "  Version     : $VERSION"
          echo "  Tag         : $TAG_NAME"
          echo "=========================================="

          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git tag -a "$TAG_NAME" -m "${ENVIRONMENT} release ${TAG_DATE}_${TAG_TIME} IST | ${VERSION} | Package: ${FEATURE_BRANCH} | Deployed by: ${ACTOR}"
          git push origin "$TAG_NAME"
          echo "✅ Tag pushed: $TAG_NAME"

          echo "🚀 Creating GitHub Release..."
          RELEASE_BODY="## 🚀 ${ENVIRONMENT} Release ${VERSION}\n\n"
          RELEASE_BODY+="| Field | Value |\n|---|---|\n"
          RELEASE_BODY+="| **Tag** | \`${TAG_NAME}\` |\n"
          RELEASE_BODY+="| **Environment** | ${ENVIRONMENT} |\n"
          RELEASE_BODY+="| **Version** | ${VERSION} |\n"
          RELEASE_BODY+="| **Date (IST)** | $(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST') |\n"
          RELEASE_BODY+="| **Package** | ${FEATURE_BRANCH} |\n"
          RELEASE_BODY+="| **Branch** | ${REF_NAME} |\n"
          if [[ -n "$SOURCE_BRANCHES" ]]; then
            BRANCHES_MD=""
            IFS=',' read -ra BS <<< "$SOURCE_BRANCHES"
            for B in "${BS[@]}"; do
              BRANCHES_MD+="$(echo "$B" | xargs), "
            done
            BRANCHES_MD=$(echo "$BRANCHES_MD" | sed 's/, $//')
            RELEASE_BODY+="| **Feature Branches** | ${BRANCHES_MD} |\n"
          fi
          RELEASE_BODY+="| **Deployed by** | ${ACTOR} |\n"
          RELEASE_BODY+="| **Workflow Run** | [${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID}) |\n"

          IS_PROD="false"
          [[ "$ENVIRONMENT" == "PRODUCTION" ]] && IS_PROD="true"

          RELEASE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/releases" \
            -d "$(jq -n \
              --arg tag  "$TAG_NAME" \
              --arg name "🚀 ${ENVIRONMENT} | ${TAG_DATE}_${TAG_TIME} | ${VERSION} | ${SAFE_BRANCH}" \
              --arg body "$(printf '%b' "$RELEASE_BODY")" \
              --arg latest "$IS_PROD" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, make_latest: $latest}')")

          RELEASE_HTTP=$(echo "$RELEASE_RESPONSE" | tail -1)
          if [[ "$RELEASE_HTTP" == "201" ]]; then
            echo "✅ GitHub Release created: $TAG_NAME"
            echo "🔗 https://github.com/${REPO}/releases/tag/${TAG_NAME}"
          else
            echo "❌ GitHub Release API failed (HTTP $RELEASE_HTTP)"
            echo "$RELEASE_RESPONSE" | sed '$d'
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "actor=${ACTOR}" >> $GITHUB_OUTPUT
          echo "ref_name=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "repo=${REPO}" >> $GITHUB_OUTPUT

  Deployment_Success:
    runs-on: ubuntu-latest
    needs: Deployment_Build
    if: needs.Deployment_Build.result == 'success' && needs.Deployment_Build.outputs.environment != 'PRODUCTION'
    steps:
      - name: Deployment Successful
        shell: bash
        env:
          ENVIRONMENT: ${{ needs.Deployment_Build.outputs.environment }}
          PACKAGE: ${{ needs.Deployment_Build.outputs.deploy_package }}
          ACTOR: ${{ needs.Deployment_Build.outputs.actor }}
          RUN_ID: ${{ needs.Deployment_Build.outputs.run_id }}
          REPO: ${{ needs.Deployment_Build.outputs.repo }}
          SOURCE_BRANCHES: ${{ needs.Deployment_Build.outputs.source_branches }}
        run: |
          echo "=========================================="
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "  Environment : $ENVIRONMENT"
          echo "  Package     : $PACKAGE"
          echo "  Deployed by : $ACTOR"
          echo "  Run         : https://github.com/${REPO}/actions/runs/${RUN_ID}"
          if [[ -n "$SOURCE_BRANCHES" ]]; then
            echo "  Branches    :"
            IFS=',' read -ra BS <<< "$SOURCE_BRANCHES"
            for B in "${BS[@]}"; do echo "    - $(echo "$B" | xargs)"; done
          fi
          echo "=========================================="
          {
            echo "## ✅ Deployment Successful"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **Environment** | \`${ENVIRONMENT}\` |"
            echo "| **Package** | \`${PACKAGE}\` |"
            echo "| **Deployed by** | ${ACTOR} |"
            echo "| **Run** | [${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID}) |"
            if [[ -n "$SOURCE_BRANCHES" ]]; then
              echo "| **Source Branches** | $(echo "$SOURCE_BRANCHES" | tr ',' '<br>') |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  Update_Release_Notes:
    runs-on: ubuntu-latest
    needs: Deployment_Build
    if: needs.Deployment_Build.result == 'success' && needs.Deployment_Build.outputs.environment == 'PRODUCTION'

    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_PAGE_ID: ${{ secrets.CONFLUENCE_PAGE_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Extract Jira Tickets from Branch Names and Commits
        id: extract_tickets
        shell: bash
        env:
          PACKAGE: ${{ needs.Deployment_Build.outputs.deploy_package }}
          SOURCE_BRANCHES: ${{ needs.Deployment_Build.outputs.source_branches }}
        run: |
          echo "🔍 Extracting Jira tickets from branch names AND git commits..."

          # ── Source 1: branch names ─────────────────────────────────────────
          BRANCH_INPUT="${SOURCE_BRANCHES:-$PACKAGE}"
          BRANCH_TICKETS=$(echo "$BRANCH_INPUT" | grep -oP '[A-Z]+[-_]\d+' | sort -u || true)
          echo "  Branch tickets : $(echo "$BRANCH_TICKETS" | tr '\n' ' ')"

          # ── Source 2: git commit messages (last 50 commits on current branch) ─
          # Find the last PRODUCTION tag to scope commits since last release
          LAST_TAG=$(git tag --list 'PRODUCTION/*' --sort=-creatordate | head -1 || true)
          if [[ -n "$LAST_TAG" ]]; then
            echo "  Scanning commits since tag: $LAST_TAG"
            COMMIT_LOG=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s %b" 2>/dev/null || git log -50 --pretty=format:"%s %b")
          else
            echo "  No prior tag found — scanning last 50 commits"
            COMMIT_LOG=$(git log -50 --pretty=format:"%s %b")
          fi
          COMMIT_TICKETS=$(echo "$COMMIT_LOG" | grep -oP '[A-Z]+[-_]\d+' | sort -u || true)
          echo "  Commit tickets : $(echo "$COMMIT_TICKETS" | tr '\n' ' ')"

          # ── Merge + deduplicate both sources ──────────────────────────────
          ALL_TICKETS=$(printf '%s\n%s\n' "$BRANCH_TICKETS" "$COMMIT_TICKETS" \
            | grep -oP '[A-Z]+[-_]\d+' | sort -u | tr '\n' ',' | sed 's/,$//' || true)

          if [[ -z "$ALL_TICKETS" ]]; then
            echo "⚠️ No Jira tickets found in branch names or commits"
            echo "has_tickets=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ All tickets (deduplicated): $ALL_TICKETS"
            echo "tickets=$ALL_TICKETS" >> "$GITHUB_OUTPUT"
            echo "has_tickets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Jira Details and Update Confluence
        if: always()
        shell: bash
        env:
          TICKETS: ${{ steps.extract_tickets.outputs.tickets }}
          ENVIRONMENT: ${{ needs.Deployment_Build.outputs.environment }}
          PAGE_ID: ${{ secrets.CONFLUENCE_PAGE_ID }}
          PACKAGE: ${{ needs.Deployment_Build.outputs.deploy_package }}
          TAG_NAME: ${{ needs.Deployment_Build.outputs.tag_name }}
          RUN_ID: ${{ needs.Deployment_Build.outputs.run_id }}
          ACTOR: ${{ needs.Deployment_Build.outputs.actor }}
          REF_NAME: ${{ needs.Deployment_Build.outputs.ref_name }}
          REPO: ${{ needs.Deployment_Build.outputs.repo }}
          SOURCE_BRANCHES: ${{ needs.Deployment_Build.outputs.source_branches }}
        run: |
          echo "📋 Fetching Jira ticket details..."

          RELEASE_DATE=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M:%S IST')
          TAG_URL="https://github.com/${REPO}/releases/tag/${TAG_NAME}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          # ── Release header block ────────────────────────────────────────────
          RELEASE_HTML="<h2>🚀 Release — ${ENVIRONMENT} | ${RELEASE_DATE}</h2>"
          RELEASE_HTML+="<table>"
          RELEASE_HTML+="<tr><th>Field</th><th>Details</th></tr>"
          RELEASE_HTML+="<tr><td><strong>Environment</strong></td><td>${ENVIRONMENT}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Deployed by</strong></td><td>${ACTOR}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Branch</strong></td><td>${REF_NAME}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Package(s)</strong></td><td>${PACKAGE}</td></tr>"
          if [[ -n "$SOURCE_BRANCHES" ]]; then
            BRANCHES_HTML=""
            IFS=',' read -ra BS <<< "$SOURCE_BRANCHES"
            for B in "${BS[@]}"; do
              BRANCHES_HTML+="<li>$(echo "$B" | xargs)</li>"
            done
            RELEASE_HTML+="<tr><td><strong>Feature Branches</strong></td><td><ul>${BRANCHES_HTML}</ul></td></tr>"
          fi
          if [[ -n "$TAG_NAME" ]]; then
            RELEASE_HTML+="<tr><td><strong>Release Tag</strong></td><td><a href=\"${TAG_URL}\">${TAG_NAME}</a></td></tr>"
          fi
          RELEASE_HTML+="<tr><td><strong>GitHub Actions Run</strong></td><td><a href=\"${RUN_URL}\">${RUN_ID}</a></td></tr>"
          RELEASE_HTML+="</table>"

          # ── Jira tickets table ───────────────────────────────────────────────
          TICKET_COUNT=0
          if [[ -n "$TICKETS" ]]; then
            RELEASE_HTML+="<h3>📋 Jira Tickets</h3>"
            RELEASE_HTML+="<table><tr><th>Ticket</th><th>Summary</th><th>Type</th><th>Status</th><th>Priority</th></tr>"

            IFS=',' read -ra TICKET_ARRAY <<< "$TICKETS"

            for TICKET in "${TICKET_ARRAY[@]}"; do
              TICKET=$(echo "$TICKET" | xargs)
              echo "  Fetching: $TICKET"
              RESPONSE=$(curl -s -w "\n%{http_code}" \
                -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "${JIRA_BASE_URL}/rest/api/3/issue/${TICKET}?fields=summary,issuetype,status,priority")

              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | sed '$d')

              if [[ "$HTTP_CODE" == "200" ]]; then
                SUMMARY=$(echo "$BODY" | jq -r '.fields.summary // "N/A"')
                ISSUE_TYPE=$(echo "$BODY" | jq -r '.fields.issuetype.name // "N/A"')
                STATUS=$(echo "$BODY" | jq -r '.fields.status.name // "N/A"')
                PRIORITY=$(echo "$BODY" | jq -r '.fields.priority.name // "N/A"')
                TICKET_URL="${JIRA_BASE_URL}/browse/${TICKET}"
                RELEASE_HTML+="<tr><td><a href=\"${TICKET_URL}\">${TICKET}</a></td><td>${SUMMARY}</td><td>${ISSUE_TYPE}</td><td>${STATUS}</td><td>${PRIORITY}</td></tr>"
                TICKET_COUNT=$((TICKET_COUNT + 1))
              else
                echo "    ⚠️ Could not fetch $TICKET (HTTP $HTTP_CODE)"
                RELEASE_HTML+="<tr><td>${TICKET}</td><td colspan=\"4\">Could not fetch details</td></tr>"
              fi
            done

            RELEASE_HTML+="</table><p><em>Total tickets: ${TICKET_COUNT}</em></p>"
          else
            RELEASE_HTML+="<p><em>No Jira tickets found in recent commits.</em></p>"
          fi
          RELEASE_HTML+="<hr/>"
          echo "✅ Built release notes for ${TICKET_COUNT} tickets"

          if [[ -z "$CONFLUENCE_BASE_URL" || -z "$PAGE_ID" ]]; then
            echo "⚠️ Confluence secrets not configured — skipping page update"
            exit 0
          fi

      - name: Transition Jira Tickets to Deployed
        if: always()
        shell: bash
        env:
          TICKETS:            ${{ steps.extract_tickets.outputs.tickets }}
          JIRA_BASE_URL:      ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL:    ${{ secrets.JIRA_USER_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          TRANSITION_ID:      ${{ secrets.JIRA_PROD_TRANSITION_ID }}
        run: |
          if [[ -z "$TICKETS" || -z "$TRANSITION_ID" ]]; then
            echo "⚠️ No tickets or JIRA_PROD_TRANSITION_ID not set — skipping transition"
            exit 0
          fi

          echo "🔄 Transitioning Jira tickets to production status..."
          IFS=',' read -ra TICKET_ARRAY <<< "$TICKETS"

          for TICKET in "${TICKET_ARRAY[@]}"; do
            TICKET=$(echo "$TICKET" | xargs)
            echo "  Transitioning: $TICKET"

            # Check current status first
            ISSUE_RESP=$(curl -s -w "\n%{http_code}" \
              -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "${JIRA_BASE_URL}/rest/api/3/issue/${TICKET}?fields=status")
            ISSUE_HTTP=$(echo "$ISSUE_RESP" | tail -1)
            ISSUE_BODY=$(echo "$ISSUE_RESP" | sed '$d')
            CURRENT_STATUS=$(echo "$ISSUE_BODY" | jq -r '.fields.status.name // "Unknown"')

            # Perform transition
            TRANS_RESP=$(curl -s -w "\n%{http_code}" -X POST \
              -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"transition\": {\"id\": \"${TRANSITION_ID}\"}}" \
              "${JIRA_BASE_URL}/rest/api/3/issue/${TICKET}/transitions")
            TRANS_HTTP=$(echo "$TRANS_RESP" | tail -1)

            if [[ "$TRANS_HTTP" == "204" ]]; then
              echo "  ✅ $TICKET transitioned (was: $CURRENT_STATUS)"
            else
              echo "  ⚠️ $TICKET transition failed (HTTP $TRANS_HTTP) — was: $CURRENT_STATUS"
              echo "$TRANS_RESP" | sed '$d'
            fi
          done

          echo "📄 Fetching current Confluence page..."
          PAGE_RESPONSE=$(curl -s \
            -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${PAGE_ID}?expand=body.storage,version")

          CURRENT_VERSION=$(echo "$PAGE_RESPONSE" | jq -r '.version.number')
          CURRENT_BODY=$(echo "$PAGE_RESPONSE" | jq -r '.body.storage.value')
          PAGE_TITLE=$(echo "$PAGE_RESPONSE" | jq -r '.title')

          if [[ -z "$CURRENT_VERSION" || "$CURRENT_VERSION" == "null" ]]; then
            echo "❌ Failed to fetch Confluence page"
            echo "$PAGE_RESPONSE"
            exit 1
          fi

          NEW_VERSION=$((CURRENT_VERSION + 1))
          echo "📝 Updating: $PAGE_TITLE (v$CURRENT_VERSION → v$NEW_VERSION)"

          NEW_BODY="${RELEASE_HTML}${CURRENT_BODY}"

          UPDATE_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X PUT \
            -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --argjson version "{\"number\": ${NEW_VERSION}}" \
              --arg title "${PAGE_TITLE}" \
              --arg value "${NEW_BODY}" \
              '{version: $version, title: $title, type: "page", body: {storage: {value: $value, representation: "storage"}}}')" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${PAGE_ID}")

          UPDATE_CODE=$(echo "$UPDATE_RESPONSE" | tail -1)

          if [[ "$UPDATE_CODE" == "200" ]]; then
            echo "✅ Confluence page updated successfully!"
            echo "🔗 ${CONFLUENCE_BASE_URL}/pages/viewpage.action?pageId=${PAGE_ID}"
          else
            echo "❌ Failed to update Confluence page (HTTP $UPDATE_CODE)"
            echo "$UPDATE_RESPONSE" | sed '$d'
            exit 1
          fi

  # ── Job: Post-Production Health Check ────────────────────────────────────────
  Production_Health_Check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: Deployment_Build
    if: needs.Deployment_Build.result == 'success' && needs.Deployment_Build.outputs.environment == 'PRODUCTION'
    permissions:
      contents: read

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest --silent

      - name: Generate JWT Key
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
          chmod 600 server.key

      - name: Authenticate to Production
        run: |
          sf org logout --all --no-prompt || true
          sf org login jwt \
            --client-id "${{ secrets.SALESFORCE_CONSUMER_KEY_PROD }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SFDX_AUTH_PROD_USERNAME }}" \
            --instance-url "${{ secrets.LOGIN_URL }}" \
            --set-default

      - name: Collect Production Health Metrics
        id: collect
        shell: bash
        env:
          USERNAME: ${{ secrets.SFDX_AUTH_PROD_USERNAME }}
          PACKAGE:  ${{ needs.Deployment_Build.outputs.deploy_package }}
          TAG_NAME: ${{ needs.Deployment_Build.outputs.tag_name }}
          ACTOR:    ${{ needs.Deployment_Build.outputs.actor }}
        run: |
          set +e
          echo "📊 Collecting FULL org health metrics for PRODUCTION..."
          SCAN_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')

          safe_array() { echo "$1" | jq -c "$2 // []" 2>/dev/null || echo '[]'; }
          safe_obj()   { echo "$1" | jq -c "$2 // {}" 2>/dev/null || echo '{}'; }
          safe_int()   { echo "$1" | jq -r "$2 // 0"  2>/dev/null || echo '0'; }

          # ── Org Info ──────────────────────────────────────────────────────
          RAW_ORG=$(sf org display --target-org "$USERNAME" --json 2>/dev/null)
          ORG_JSON=$(echo "$RAW_ORG" | jq -c '.result // {}' 2>/dev/null || echo '{}')
          echo "=== ORG INFO KEYS ==="
          echo "$ORG_JSON" | jq 'keys' 2>/dev/null || true

          # ── Governor Limits (all limits, normalized) ───────────────────────
          RAW_LIMITS=$(sf org list limits --target-org "$USERNAME" --json 2>/dev/null)
          LIMITS_JSON=$(echo "$RAW_LIMITS" | jq -c '[.result[]? | {name: (.name // .Name // ""), remaining: (.remaining // .Remaining // 0), max: (.max // .Max // 0)}]' 2>/dev/null || echo '[]')

          # ── Metadata Counts ───────────────────────────────────────────────
          RAW_APEX=$(sf data query --query "SELECT COUNT() FROM ApexClass WHERE Status='Active'" --target-org "$USERNAME" --json 2>/dev/null)
          APEX_COUNT=$(safe_int "$RAW_APEX" '.result.totalSize')

          RAW_TRIGGER=$(sf data query --query "SELECT COUNT() FROM ApexTrigger WHERE Status='Active'" --target-org "$USERNAME" --json 2>/dev/null)
          TRIGGER_COUNT=$(safe_int "$RAW_TRIGGER" '.result.totalSize')

          RAW_FLOWS=$(sf data query --query "SELECT COUNT() FROM FlowDefinition" --target-org "$USERNAME" --json 2>/dev/null)
          FLOW_COUNT=$(safe_int "$RAW_FLOWS" '.result.totalSize')

          RAW_ACTIVE_FLOWS=$(sf data query --query "SELECT COUNT() FROM FlowDefinition WHERE ActiveVersionId != null" --target-org "$USERNAME" --json 2>/dev/null)
          ACTIVE_FLOW_COUNT=$(safe_int "$RAW_ACTIVE_FLOWS" '.result.totalSize')

          RAW_VR=$(sf data query --query "SELECT COUNT() FROM ValidationRule WHERE Active=true" --target-org "$USERNAME" --json 2>/dev/null)
          VR_COUNT=$(safe_int "$RAW_VR" '.result.totalSize')

          RAW_CUSTOM_OBJ=$(sf data query --query "SELECT COUNT() FROM CustomObject" --target-org "$USERNAME" --json 2>/dev/null)
          CUSTOM_OBJ_COUNT=$(safe_int "$RAW_CUSTOM_OBJ" '.result.totalSize')

          RAW_CUSTOM_FIELD=$(sf data query --query "SELECT COUNT() FROM CustomField" --target-org "$USERNAME" --json 2>/dev/null)
          CUSTOM_FIELD_COUNT=$(safe_int "$RAW_CUSTOM_FIELD" '.result.totalSize')

          RAW_PERM_SET=$(sf data query --query "SELECT COUNT() FROM PermissionSet WHERE IsOwnedByProfile=false" --target-org "$USERNAME" --json 2>/dev/null)
          PERM_SET_COUNT=$(safe_int "$RAW_PERM_SET" '.result.totalSize')

          RAW_PROFILES=$(sf data query --query "SELECT COUNT() FROM Profile" --target-org "$USERNAME" --json 2>/dev/null)
          PROFILE_COUNT=$(safe_int "$RAW_PROFILES" '.result.totalSize')

          # ── User Health ───────────────────────────────────────────────────
          RAW_ACTIVE_USERS=$(sf data query --query "SELECT COUNT() FROM User WHERE IsActive=true" --target-org "$USERNAME" --json 2>/dev/null)
          ACTIVE_USER_COUNT=$(safe_int "$RAW_ACTIVE_USERS" '.result.totalSize')

          RAW_FROZEN=$(sf data query --query "SELECT COUNT() FROM UserLogin WHERE IsFrozen=true" --target-org "$USERNAME" --json 2>/dev/null)
          FROZEN_USER_COUNT=$(safe_int "$RAW_FROZEN" '.result.totalSize')

          RAW_LOGIN_ERRORS=$(sf data query --query "SELECT UserId, Username, LoginTime, Status FROM LoginHistory WHERE Status!='Success' ORDER BY LoginTime DESC LIMIT 20" --target-org "$USERNAME" --json 2>/dev/null)
          LOGIN_ERRORS_JSON=$(safe_array "$RAW_LOGIN_ERRORS" '.result.records')

          # ── Async Job Health ──────────────────────────────────────────────
          RAW_BATCHES=$(sf data query --query "SELECT Id, ApexClass.Name, Status, NumberOfErrors, TotalJobItems, CreatedDate FROM AsyncApexJob WHERE Status='Failed' ORDER BY CreatedDate DESC LIMIT 20" --target-org "$USERNAME" --json 2>/dev/null)
          BATCHES_JSON=$(safe_array "$RAW_BATCHES" '.result.records')

          RAW_QUEUED=$(sf data query --query "SELECT Id, ApexClass.Name, Status, JobType, CreatedDate FROM AsyncApexJob WHERE Status IN ('Queued','Processing','Preparing') ORDER BY CreatedDate DESC LIMIT 20" --target-org "$USERNAME" --json 2>/dev/null)
          QUEUED_JSON=$(safe_array "$RAW_QUEUED" '.result.records')

          RAW_SCHED=$(sf data query --query "SELECT Id, CronJobDetail.Name, State, NextFireTime, PreviousFireTime FROM CronTrigger ORDER BY NextFireTime ASC LIMIT 20" --target-org "$USERNAME" --json 2>/dev/null)
          SCHED_JSON=$(safe_array "$RAW_SCHED" '.result.records')

          # ── Apex Health ───────────────────────────────────────────────────
          RAW_TESTS=$(sf data query --query "SELECT Id, ApexClass.Name, MethodName, Message, StackTrace, CreatedDate FROM ApexTestResult WHERE Outcome='Fail' ORDER BY CreatedDate DESC LIMIT 20" --target-org "$USERNAME" --json 2>/dev/null)
          TESTS_JSON=$(safe_array "$RAW_TESTS" '.result.records')

          RAW_APEX_ERRORS=$(sf data query --query "SELECT Id, ExceptionType, Message, StackTrace, CreatedDate FROM ApexLog WHERE Operation LIKE '%execute%' ORDER BY CreatedDate DESC LIMIT 10" --target-org "$USERNAME" --json 2>/dev/null)
          APEX_ERRORS_JSON=$(safe_array "$RAW_APEX_ERRORS" '.result.records')

          # ── Platform Events / Error Logs ──────────────────────────────────
          RAW_DEBUG_LOGS=$(sf data query --query "SELECT Id, LogUser.Name, Operation, Status, LogLength, LastModifiedDate FROM ApexLog ORDER BY LastModifiedDate DESC LIMIT 10" --target-org "$USERNAME" --json 2>/dev/null)
          DEBUG_LOGS_JSON=$(safe_array "$RAW_DEBUG_LOGS" '.result.records')

          # ── Storage Usage ─────────────────────────────────────────────────
          RAW_STORAGE=$(sf data query --query "SELECT StorageUsed FROM Organization" --target-org "$USERNAME" --json 2>/dev/null)
          STORAGE_USED=$(safe_int "$RAW_STORAGE" '.result.records[0].StorageUsed')

          # ── Deployment History (last 5) ───────────────────────────────────
          RAW_DEPLOYS=$(sf data query --query "SELECT Id, Status, StartDate, CompletedDate, NumberComponentsDeployed, NumberComponentErrors FROM DeployRequest ORDER BY StartDate DESC LIMIT 5" --target-org "$USERNAME" --json 2>/dev/null)
          DEPLOYS_JSON=$(safe_array "$RAW_DEPLOYS" '.result.records')

          # ── Build final health JSON ───────────────────────────────────────
          HEALTH_JSON=$(jq -n \
            --arg env        "PRODUCTION" \
            --arg scan_time  "$SCAN_TIME" \
            --arg package    "$PACKAGE" \
            --arg tag        "$TAG_NAME" \
            --arg actor      "$ACTOR" \
            --argjson apex              "${APEX_COUNT:-0}" \
            --argjson triggers          "${TRIGGER_COUNT:-0}" \
            --argjson flows             "${FLOW_COUNT:-0}" \
            --argjson active_flows      "${ACTIVE_FLOW_COUNT:-0}" \
            --argjson validation_rules  "${VR_COUNT:-0}" \
            --argjson custom_objects    "${CUSTOM_OBJ_COUNT:-0}" \
            --argjson custom_fields     "${CUSTOM_FIELD_COUNT:-0}" \
            --argjson permission_sets   "${PERM_SET_COUNT:-0}" \
            --argjson profiles          "${PROFILE_COUNT:-0}" \
            --argjson active_users      "${ACTIVE_USER_COUNT:-0}" \
            --argjson frozen_users      "${FROZEN_USER_COUNT:-0}" \
            --argjson storage_used      "${STORAGE_USED:-0}" \
            --argjson limits            "$LIMITS_JSON" \
            --argjson org_info          "$ORG_JSON" \
            --argjson failed_batches    "$BATCHES_JSON" \
            --argjson queued_jobs       "$QUEUED_JSON" \
            --argjson scheduled_jobs    "$SCHED_JSON" \
            --argjson test_failures     "$TESTS_JSON" \
            --argjson apex_errors       "$APEX_ERRORS_JSON" \
            --argjson debug_logs        "$DEBUG_LOGS_JSON" \
            --argjson login_errors      "$LOGIN_ERRORS_JSON" \
            --argjson deploy_history    "$DEPLOYS_JSON" \
            '{
              environment:      $env,
              scan_time:        $scan_time,
              deployed_package: $package,
              release_tag:      $tag,
              deployed_by:      $actor,
              org_info:         $org_info,
              metadata: {
                apex_classes:     $apex,
                apex_triggers:    $triggers,
                flows_total:      $flows,
                flows_active:     $active_flows,
                validation_rules: $validation_rules,
                custom_objects:   $custom_objects,
                custom_fields:    $custom_fields,
                permission_sets:  $permission_sets,
                profiles:         $profiles
              },
              users: {
                active:  $active_users,
                frozen:  $frozen_users
              },
              storage_used_mb:    $storage_used,
              governor_limits:    $limits,
              failed_batch_jobs:  $failed_batches,
              queued_jobs:        $queued_jobs,
              scheduled_jobs:     $scheduled_jobs,
              apex_test_failures: $test_failures,
              apex_errors:        $apex_errors,
              debug_logs:         $debug_logs,
              login_errors:       $login_errors,
              deploy_history:     $deploy_history
            }')

          echo "$HEALTH_JSON" > prod_health.json

          FAILED_BATCH_COUNT=$(echo "$HEALTH_JSON" | jq '.failed_batch_jobs  | length')
          TEST_FAIL_COUNT=$(echo    "$HEALTH_JSON" | jq '.apex_test_failures | length')
          CRITICAL_LIMITS=$(echo   "$HEALTH_JSON" | jq '[.governor_limits[] | select(.remaining != null and .max != null and .max > 0 and ((.remaining / .max) < 0.20))] | length')

          echo "failed_batches=$FAILED_BATCH_COUNT" >> $GITHUB_OUTPUT
          echo "test_failures=$TEST_FAIL_COUNT"     >> $GITHUB_OUTPUT
          echo "critical_limits=$CRITICAL_LIMITS"   >> $GITHUB_OUTPUT
          echo "scan_time=$SCAN_TIME"               >> $GITHUB_OUTPUT

          echo ""
          echo "=== FULL ORG HEALTH SUMMARY ==="
          echo "  Active Apex Classes    : $APEX_COUNT"
          echo "  Active Triggers        : $TRIGGER_COUNT"
          echo "  Flows (Total/Active)   : $FLOW_COUNT / $ACTIVE_FLOW_COUNT"
          echo "  Validation Rules       : $VR_COUNT"
          echo "  Custom Objects         : $CUSTOM_OBJ_COUNT"
          echo "  Custom Fields          : $CUSTOM_FIELD_COUNT"
          echo "  Permission Sets        : $PERM_SET_COUNT"
          echo "  Profiles               : $PROFILE_COUNT"
          echo "  Active Users           : $ACTIVE_USER_COUNT"
          echo "  Frozen Users           : $FROZEN_USER_COUNT"
          echo "  Storage Used (MB)      : $STORAGE_USED"
          echo "  Failed Batch Jobs      : $FAILED_BATCH_COUNT"
          echo "  Queued/Processing Jobs : $(echo "$HEALTH_JSON" | jq '.queued_jobs | length')"
          echo "  Apex Test Failures     : $TEST_FAIL_COUNT"
          echo "  Critical Gov Limits    : $CRITICAL_LIMITS"

      - name: Display Health Results
        if: always()
        shell: bash
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║           🏥  SALESFORCE PRODUCTION HEALTH REPORT           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          if [[ ! -f prod_health.json ]]; then
            echo "❌ prod_health.json not found — collection step may have failed"
            exit 0
          fi

          # ── Org Info ──────────────────────────────────────────────────────
          ORG_ID=$(jq -r   '.org_info.orgId       // .org_info.id          // "N/A"' prod_health.json)
          ORG_NAME=$(jq -r '.org_info.name        // .org_info.username    // "N/A"' prod_health.json)
          ORG_TYPE=$(jq -r '.org_info.orgType     // .org_info.edition     // "N/A"' prod_health.json)
          INSTANCE=$(jq -r '.org_info.instanceUrl // .org_info.instanceUrl // "N/A"' prod_health.json)
          SCAN_TIME=$(jq -r '.scan_time           // "N/A"' prod_health.json)

          echo "📋 ORG INFORMATION"
          echo "  Org Name     : $ORG_NAME"
          echo "  Org ID       : $ORG_ID"
          echo "  Org Type     : $ORG_TYPE"
          echo "  Instance URL : $INSTANCE"
          echo "  Scanned At   : $SCAN_TIME"
          echo ""

          # ── Metadata Counts ───────────────────────────────────────────────
          APEX=$(jq -r   '.metadata.apex_classes  // 0' prod_health.json)
          TRIG=$(jq -r   '.metadata.apex_triggers // 0' prod_health.json)
          echo "📦 METADATA COUNTS"
          echo "  Active Apex Classes  : $APEX"
          echo "  Active Apex Triggers : $TRIG"
          echo ""

          # ── Governor Limits ───────────────────────────────────────────────
          echo "📊 GOVERNOR LIMITS (Top 10 most consumed)"
          printf "  %-45s %10s %10s %6s\n" "Limit Name" "Remaining" "Max" "Used%"
          printf "  %-45s %10s %10s %6s\n" "─────────────────────────────────────────────" "─────────" "───" "─────"
          jq -r '
            .governor_limits
            | map(select(.remaining != null and .max != null and .max > 0))
            | sort_by(.remaining / .max)
            | .[0:10][]
            | . as $l
            | ($l.max - $l.remaining) as $used
            | (($used / $l.max) * 100 | floor) as $pct
            | if ($l.remaining / $l.max) < 0.20 then "🔴" elif ($l.remaining / $l.max) < 0.50 then "🟡" else "🟢" end as $badge
            | "  \($badge) \($l.name | .[0:43] | . + " " * (43 - length)) \($l.remaining | tostring | .[0:10] | . + " " * (10 - length)) \($l.max | tostring | .[0:10] | . + " " * (10 - length)) \($pct)%"
          ' prod_health.json 2>/dev/null || echo "  (no limit data available)"
          echo ""

          # ── Failed Batch Jobs ─────────────────────────────────────────────
          BATCH_COUNT=$(jq '.failed_batch_jobs | length' prod_health.json)
          echo "⚙️  FAILED BATCH JOBS (all time, latest 20): $BATCH_COUNT"
          if [[ $BATCH_COUNT -gt 0 ]]; then
            jq -r '.failed_batch_jobs[] | "  🔴 \(.ApexClass.Name // "Unknown") — Errors: \(.NumberOfErrors)/\(.TotalJobItems) items"' prod_health.json
          else
            echo "  ✅ None"
          fi
          echo ""

          # ── Apex Test Failures ────────────────────────────────────────────
          TEST_COUNT=$(jq '.apex_test_failures | length' prod_health.json)
          echo "🧪 APEX TEST FAILURES (all time, latest 20): $TEST_COUNT"
          if [[ $TEST_COUNT -gt 0 ]]; then
            jq -r '.apex_test_failures[] | "  🔴 \(.ApexClass.Name // "Unknown").\(.MethodName) — \(.Message | .[0:80])"' prod_health.json
          else
            echo "  ✅ None"
          fi
          echo ""

          # ── Scheduled Jobs ────────────────────────────────────────────────
          SCHED_COUNT=$(jq '.scheduled_jobs | length' prod_health.json)
          echo "🕐 SCHEDULED JOBS (WAITING): $SCHED_COUNT"
          if [[ $SCHED_COUNT -gt 0 ]]; then
            jq -r '.scheduled_jobs[] | "  ✅ \(.CronJobDetail.Name // "Unknown") — Next: \(.NextFireTime // "N/A")"' prod_health.json
          else
            echo "  (none)"
          fi
          echo ""
          echo "══════════════════════════════════════════════════════════════"

      - name: Build Health Report
        id: health_report
        if: always()
        shell: bash
        env:
          PACKAGE:  ${{ needs.Deployment_Build.outputs.deploy_package }}
          TAG_NAME: ${{ needs.Deployment_Build.outputs.tag_name }}
          ACTOR:    ${{ needs.Deployment_Build.outputs.actor }}
          REPO:     ${{ needs.Deployment_Build.outputs.repo }}
          RUN_ID:   ${{ needs.Deployment_Build.outputs.run_id }}
        run: |
          SCAN_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          FAILED_BATCHES=${{ steps.collect.outputs.failed_batches }}
          TEST_FAILURES=${{ steps.collect.outputs.test_failures }}
          CRITICAL_LIMITS=${{ steps.collect.outputs.critical_limits }}

          # Determine status
          if [[ $FAILED_BATCHES -gt 0 || $TEST_FAILURES -gt 0 || $CRITICAL_LIMITS -gt 2 ]]; then
            STATUS="critical"
            VERDICT="🔴 ROLLBACK RECOMMENDED"
          elif [[ $CRITICAL_LIMITS -gt 0 ]]; then
            STATUS="warning"
            VERDICT="🟡 MONITOR"
          else
            STATUS="healthy"
            VERDICT="🟢 STABLE"
          fi

          echo "status=$STATUS" >> $GITHUB_OUTPUT

          # Build markdown report
          {
            echo "## 🏥 Post-Deploy Health Check — PRODUCTION"
            echo ""
            echo "### Deployment Summary"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **Package** | ${PACKAGE} |"
            echo "| **Release Tag** | ${TAG_NAME} |"
            echo "| **Deployed by** | ${ACTOR} |"
            echo "| **Checked at** | ${SCAN_TIME} |"
            echo ""
            echo "### 🚦 Health Verdict"
            echo "**Status**: ${VERDICT}"
            echo ""
            echo "### ⚠️ Issues Detected"
            if [[ $FAILED_BATCHES -eq 0 && $TEST_FAILURES -eq 0 && $CRITICAL_LIMITS -eq 0 ]]; then
              echo "✅ No issues detected."
            else
              [[ $FAILED_BATCHES -gt 0 ]] && echo "- 🔴 **Failed Batch Jobs**: ${FAILED_BATCHES}"
              [[ $TEST_FAILURES -gt 0  ]] && echo "- 🔴 **Apex Test Failures**: ${TEST_FAILURES}"
              [[ $CRITICAL_LIMITS -gt 0 ]] && echo "- 🟡 **Governor Limits below 20% remaining**: ${CRITICAL_LIMITS}"
            fi
            echo ""
            echo "### 📊 Governor Limits (Top 10 most consumed)"
            echo "| Limit | Remaining | Max | Status |"
            echo "|---|---|---|---|"
            if [[ -f prod_health.json ]]; then
              jq -r '
                .governor_limits
                | map(select(.remaining != null and .max != null and .max > 0))
                | sort_by(.remaining / .max)
                | .[0:10][]
                | . as $l
                | ($l.remaining / $l.max) as $pct
                | if $pct < 0.20 then "🔴" elif $pct < 0.50 then "🟡" else "🟢" end as $badge
                | "| \($l.name) | \($l.remaining) | \($l.max) | \($badge) |"
              ' prod_health.json 2>/dev/null || echo "| N/A | — | — | — |"
            else
              echo "| N/A | — | — | — |"
            fi
            echo ""
            echo "### 📋 Metadata Counts"
            if [[ -f prod_health.json ]]; then
              APEX=$(jq -r '.metadata.apex_classes'  prod_health.json 2>/dev/null || echo 'N/A')
              TRIG=$(jq -r '.metadata.apex_triggers' prod_health.json 2>/dev/null || echo 'N/A')
              echo "- Active Apex Classes : ${APEX}"
              echo "- Active Apex Triggers: ${TRIG}"
            fi
            echo ""
            echo "### 💡 Recommendations"
            if [[ "$STATUS" == "healthy" ]]; then
              echo "✅ No action required — org is stable."
            else
              COUNT=1
              [[ $FAILED_BATCHES -gt 0 ]] && echo "${COUNT}. Investigate failed batch jobs in Setup > Apex Jobs." && COUNT=$((COUNT+1))
              [[ $TEST_FAILURES -gt 0  ]] && echo "${COUNT}. Review Apex test failures in Setup > Apex Test Execution." && COUNT=$((COUNT+1))
              [[ $CRITICAL_LIMITS -gt 2 ]] && echo "${COUNT}. Consider rollback — multiple governor limits critically low." && COUNT=$((COUNT+1))
              [[ $CRITICAL_LIMITS -gt 0 && $CRITICAL_LIMITS -le 2 ]] && echo "${COUNT}. Monitor governor limits closely over the next hour."
            fi
          } > health_analysis.md

          echo "✅ Health report generated — Status: $STATUS"

      - name: Post Health Check as GitHub Step Summary
        if: always()
        shell: bash
        run: |
          cat health_analysis.md >> $GITHUB_STEP_SUMMARY

      - name: Send Health Report Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port:    ${{ secrets.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          subject:        "🏥 [SF Health] Post-Deploy PRODUCTION — ${{ steps.health_report.outputs.status == 'critical' && '🔴 CRITICAL' || steps.health_report.outputs.status == 'warning' && '🟡 MONITOR' || '🟢 STABLE' }} | ${{ needs.Deployment_Build.outputs.tag_name }}"
          to:             ${{ secrets.NOTIFY_EMAILS }}
          from:           "Do not Reply <${{ secrets.GMAIL_USERNAME }}>"
          html_body: |
            <h2>🏥 Post-Deploy Health Check — PRODUCTION</h2>
            <table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-family:Arial,sans-serif;">
              <tr><th>Field</th><th>Value</th></tr>
              <tr><td><strong>Package</strong></td><td>${{ needs.Deployment_Build.outputs.deploy_package }}</td></tr>
              <tr><td><strong>Release Tag</strong></td><td>${{ needs.Deployment_Build.outputs.tag_name }}</td></tr>
              <tr><td><strong>Deployed by</strong></td><td>${{ needs.Deployment_Build.outputs.actor }}</td></tr>
              <tr><td><strong>Checked at</strong></td><td>${{ steps.collect.outputs.scan_time }}</td></tr>
              <tr><td><strong>Failed Batch Jobs</strong></td><td>${{ steps.collect.outputs.failed_batches }}</td></tr>
              <tr><td><strong>Apex Test Failures</strong></td><td>${{ steps.collect.outputs.test_failures }}</td></tr>
              <tr><td><strong>Critical Limits</strong></td><td>${{ steps.collect.outputs.critical_limits }}</td></tr>
              <tr><td><strong>Workflow Run</strong></td><td><a href="https://github.com/${{ needs.Deployment_Build.outputs.repo }}/actions/runs/${{ needs.Deployment_Build.outputs.run_id }}">View Run</a></td></tr>
            </table>
            <h3>Health Analysis</h3>
            <pre style="background:#f4f4f4;padding:12px;font-family:monospace;font-size:12px;white-space:pre-wrap;">${{ steps.health_report.outputs.status }}</pre>
            <br/>
            <p style="font-size:11px;color:#888;">⚠️ Automated health report. Do not reply.</p>
          attachments: prod_health.json

      - name: Publish Health Check to Confluence
        if: always()
        shell: bash
        env:
          CONFLUENCE_BASE_URL:  ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          CONFLUENCE_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          CONFLUENCE_PAGE_ID:   ${{ secrets.HEALTH_CHECK_CONFLUENCE_PAGE_ID }}
          REPO:    ${{ needs.Deployment_Build.outputs.repo }}
          RUN_ID:  ${{ needs.Deployment_Build.outputs.run_id }}
          TAG_NAME: ${{ needs.Deployment_Build.outputs.tag_name }}
        run: |
          if [[ -z "$CONFLUENCE_BASE_URL" || -z "$CONFLUENCE_PAGE_ID" ]]; then
            echo "⚠️ Confluence secrets not configured — skipping"
            exit 0
          fi

          SCAN_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          REPORT=$(cat health_analysis.md)
          STATUS=${{ steps.health_report.outputs.status }}

          case "$STATUS" in
            critical) BADGE="<span style='color:red;font-weight:bold;'>🔴 CRITICAL</span>" ;;
            warning)  BADGE="<span style='color:orange;font-weight:bold;'>🟡 MONITOR</span>" ;;
            *)        BADGE="<span style='color:green;font-weight:bold;'>🟢 STABLE</span>" ;;
          esac

          NEW_ENTRY="<h2>🏥 Post-Deploy Health — ${SCAN_TIME} | ${BADGE}</h2>"
          NEW_ENTRY+="<p>Tag: <strong>${TAG_NAME}</strong> &nbsp;|&nbsp; Run: <a href='https://github.com/${REPO}/actions/runs/${RUN_ID}'>${RUN_ID}</a></p>"
          NEW_ENTRY+="<ac:structured-macro ac:name='code'><ac:parameter ac:name='language'>text</ac:parameter>"
          NEW_ENTRY+="<ac:plain-text-body><![CDATA[${REPORT}]]></ac:plain-text-body></ac:structured-macro>"
          NEW_ENTRY+="<hr/>"

          PAGE_RESP=$(curl -s \
            -u "${CONFLUENCE_USER_EMAIL}:${CONFLUENCE_API_TOKEN}" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${CONFLUENCE_PAGE_ID}?expand=body.storage,version")

          CUR_VER=$(echo "$PAGE_RESP" | jq -r '.version.number')
          CUR_BODY=$(echo "$PAGE_RESP" | jq -r '.body.storage.value')
          PAGE_TITLE=$(echo "$PAGE_RESP" | jq -r '.title')

          if [[ -z "$CUR_VER" || "$CUR_VER" == "null" ]]; then
            echo "❌ Failed to fetch Confluence page"; exit 1
          fi

          NEW_VER=$((CUR_VER + 1))
          UPDATE_RESP=$(curl -s -w "\n%{http_code}" -X PUT \
            -u "${CONFLUENCE_USER_EMAIL}:${CONFLUENCE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --argjson version "{\"number\": ${NEW_VER}}" \
              --arg title "${PAGE_TITLE}" \
              --arg value "${NEW_ENTRY}${CUR_BODY}" \
              '{version: $version, title: $title, type: "page", body: {storage: {value: $value, representation: "storage"}}}')" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${CONFLUENCE_PAGE_ID}")

          HTTP=$(echo "$UPDATE_RESP" | tail -1)
          [[ "$HTTP" == "200" ]] && echo "✅ Confluence updated" || { echo "❌ Confluence failed (HTTP $HTTP)"; exit 1; }

      - name: Cleanup JWT Key
        if: always()
        run: rm -f server.key

