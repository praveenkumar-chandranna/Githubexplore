name: Lodha Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      Feature_Branch:
        type: string
        description: >
          Branch name(s) to deploy. Single: feature/LODHA-123  |  Multiple: feature/LODHA123,feature/LODHA4321
        required: true
      environment:
        type: choice
        description: Deployment environment
        options:
          - DEV
          - QA
          - UAT
          - PRODUCTION
          - HOTFIX
        default: DEV
        required: true
      testlevel:
        type: choice
        description: Test class run level
        options:
          - RunLocalTests
          - RunSpecifiedTests
          - RunAllTestsInOrg
        default: RunSpecifiedTests
        required: true

jobs:
  Deployment_Build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SF_LOGIN_URL_TEST: ${{ secrets.SANDBOX_URL }}
      SF_LOGIN_URL_PROD: ${{ secrets.LOGIN_URL }}
      SF_ALIAS: lodhaOrg

    if: >
      (github.event_name == 'workflow_dispatch' &&
       (
         (github.ref == 'refs/heads/DEV' && github.event.inputs.environment == 'DEV') ||
         (github.ref == 'refs/heads/QA' && github.event.inputs.environment == 'QA') ||
         (github.ref == 'refs/heads/UAT' && github.event.inputs.environment == 'UAT') ||
         (github.ref == 'refs/heads/main' && github.event.inputs.environment == 'PRODUCTION') ||
         (github.ref == 'refs/heads/main' && github.event.inputs.environment == 'HOTFIX')
       ))

    outputs:
      deploy_package: ${{ steps.resolve-package.outputs.deploy_package }}
      environment: ${{ steps.set-env.outputs.environment }}
      tag_name: ${{ steps.release-tag.outputs.tag_name }}
      run_id: ${{ steps.set-run-meta.outputs.run_id }}
      actor: ${{ steps.set-run-meta.outputs.actor }}
      ref_name: ${{ steps.set-run-meta.outputs.ref_name }}
      repo: ${{ steps.set-run-meta.outputs.repo }}
      source_branches: ${{ steps.resolve-package.outputs.source_branches }}

    steps:
      - name: Validate branch-environment consistency
        id: set-run-meta
        shell: bash
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_FEATURE: ${{ github.event.inputs.Feature_Branch }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "Manual run: Environment=${INPUT_ENV}, Package(s)=${INPUT_FEATURE}"
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "actor=${ACTOR}" >> $GITHUB_OUTPUT
          echo "ref_name=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "repo=${REPO}" >> $GITHUB_OUTPUT

      - name: Set environment variables
        id: set-env
        shell: bash
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_TESTLEVEL: ${{ github.event.inputs.testlevel }}
        run: |
          echo "ENVIRONMENT=$INPUT_ENV" >> $GITHUB_ENV
          echo "environment=$INPUT_ENV" >> $GITHUB_OUTPUT
          echo "TEST_LEVEL=$INPUT_TESTLEVEL" >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Consolidate or Resolve Package
        id: resolve-package
        shell: bash
        env:
          FEATURE_INPUT: ${{ github.event.inputs.Feature_Branch }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          MANIFEST_DIR: ${{ github.workspace }}/manifest/feature
          OUTPUT_DIR: ${{ github.workspace }}/manifest
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          FEATURE_INPUT=$(echo "$FEATURE_INPUT" | xargs)

          if [[ "$FEATURE_INPUT" == *","* ]]; then
            echo "📦 Multiple branches detected — consolidating..."

            RELEASE_DATE=$(TZ='Asia/Kolkata' date +'%d%m%Y_%H%M')
            OUTPUT_NAME="Release_${ENVIRONMENT}_${RELEASE_DATE}"
            OUTPUT_PKG="${OUTPUT_DIR}/${OUTPUT_NAME}_package.xml"
            OUTPUT_TEST="${OUTPUT_DIR}/${OUTPUT_NAME}_TestClass.txt"

            echo "=========================================="
            echo "PACKAGE CONSOLIDATION"
            echo "=========================================="
            echo "Environment : $ENVIRONMENT"
            echo "Branches    : $FEATURE_INPUT"
            echo "Output      : $OUTPUT_NAME"
            echo "=========================================="

            IFS=',' read -ra BRANCHES <<< "$FEATURE_INPUT"

            echo ""
            echo "🔍 Validating input files..."
            for BRANCH in "${BRANCHES[@]}"; do
              BRANCH=$(echo "$BRANCH" | xargs)
              PKG_FILE="${OUTPUT_DIR}/${BRANCH}_package.xml"
              if [[ ! -f "$PKG_FILE" ]]; then
                echo "❌ Package file not found: $PKG_FILE"
                exit 1
              fi
              echo "  ✅ Found: ${BRANCH}_package.xml"
            done

            MAX_VERSION="0"
            ALL_MEMBERS_RAW=""

            for BRANCH in "${BRANCHES[@]}"; do
              BRANCH=$(echo "$BRANCH" | xargs)
              PKG_FILE="${OUTPUT_DIR}/${BRANCH}_package.xml"
              echo "  Processing: ${BRANCH}_package.xml"

              VERSION=$(grep -oP '(?<=<version>)[^<]+' "$PKG_FILE" || echo "0")
              if awk "BEGIN {exit !($VERSION > $MAX_VERSION)}"; then
                MAX_VERSION="$VERSION"
              fi

              IN_BLOCK=0
              CUR_TYPE=""
              CUR_MEMBERS=""
              while IFS= read -r LINE; do
                LINE=$(echo "$LINE" | sed 's/^[[:space:]]*//')
                if echo "$LINE" | grep -q '<types>'; then
                  IN_BLOCK=1; CUR_TYPE=""; CUR_MEMBERS=""
                elif [[ $IN_BLOCK -eq 1 ]]; then
                  if echo "$LINE" | grep -q '<name>'; then
                    CUR_TYPE=$(echo "$LINE" | grep -oP '(?<=<name>)[^<]+')
                  elif echo "$LINE" | grep -q '<members>'; then
                    M=$(echo "$LINE" | grep -oP '(?<=<members>)[^<]+')
                    CUR_MEMBERS+="$M"$'\n'
                  elif echo "$LINE" | grep -q '</types>'; then
                    if [[ -n "$CUR_TYPE" ]]; then
                      while IFS= read -r MEMBER; do
                        [[ -n "$MEMBER" ]] && ALL_MEMBERS_RAW+="${CUR_TYPE}|||${MEMBER}"$'\n'
                      done <<< "$CUR_MEMBERS"
                    fi
                    IN_BLOCK=0; CUR_TYPE=""; CUR_MEMBERS=""
                  fi
                fi
              done < "$PKG_FILE"
            done

            printf '<?xml version="1.0" encoding="UTF-8"?>\n' > "$OUTPUT_PKG"
            printf '<Package xmlns="http://soap.sforce.com/2006/04/metadata">\n' >> "$OUTPUT_PKG"

            SORTED_TYPES=$(echo "$ALL_MEMBERS_RAW" | grep -v '^$' | cut -d'|' -f1 | sort -u)
            while IFS= read -r TYPE_NAME; do
              [[ -z "$TYPE_NAME" ]] && continue
              printf '    <types>\n' >> "$OUTPUT_PKG"
              echo "$ALL_MEMBERS_RAW" | grep -v '^$' | grep -F "${TYPE_NAME}|||" | cut -d'|' -f4 | sort -u | while read -r MEMBER; do
                [[ -n "$MEMBER" ]] && printf '        <members>%s</members>\n' "$MEMBER" >> "$OUTPUT_PKG"
              done
              printf '        <name>%s</name>\n' "$TYPE_NAME" >> "$OUTPUT_PKG"
              printf '    </types>\n' >> "$OUTPUT_PKG"
            done <<< "$SORTED_TYPES"

            printf '    <version>%s</version>\n' "$MAX_VERSION" >> "$OUTPUT_PKG"
            printf '</Package>\n' >> "$OUTPUT_PKG"

            ALL_TESTS=""
            for BRANCH in "${BRANCHES[@]}"; do
              BRANCH=$(echo "$BRANCH" | xargs)
              TEST_FILE="${OUTPUT_DIR}/${BRANCH}_TestClass.txt"
              if [[ -f "$TEST_FILE" ]]; then
                CONTENT=$(cat "$TEST_FILE" | tr ' ' '\n' | tr ',' '\n')
                ALL_TESTS+=$'\n'"$CONTENT"
              fi
            done

            UNIQUE_TESTS=$(echo "$ALL_TESTS" | sort -u | grep -v '^$' | tr '\n' ' ' | xargs)
            [[ -n "$UNIQUE_TESTS" ]] && echo "$UNIQUE_TESTS" > "$OUTPUT_TEST"

            echo ""
            echo "=========================================="
            echo "📦 CONSOLIDATED PACKAGE.XML"
            echo "=========================================="
            cat "$OUTPUT_PKG"
            if [[ -f "$OUTPUT_TEST" ]]; then
              echo ""
              echo "=========================================="
              echo "🧪 CONSOLIDATED TESTCLASS.TXT"
              echo "=========================================="
              cat "$OUTPUT_TEST"
            fi

            echo "FEATURE_BRANCH=${OUTPUT_NAME}" >> $GITHUB_ENV
            echo "deploy_package=${OUTPUT_NAME}" >> $GITHUB_OUTPUT
            echo "source_branches=${FEATURE_INPUT}" >> $GITHUB_OUTPUT
            echo "✅ Consolidation complete: $OUTPUT_NAME"
            echo ""
            echo "=========================================="
            echo "🌿 SOURCE FEATURE BRANCHES"
            echo "=========================================="
            IFS=',' read -ra DISPLAY_BRANCHES <<< "$FEATURE_INPUT"
            for B in "${DISPLAY_BRANCHES[@]}"; do
              echo "  - $(echo "$B" | xargs)"
            done
            echo "=========================================="

          else
            echo "📄 Single branch detected — using directly: $FEATURE_INPUT"
            echo "FEATURE_BRANCH=${FEATURE_INPUT}" >> $GITHUB_ENV
            echo "deploy_package=${FEATURE_INPUT}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf --version

      - name: Generate JWT private key file
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
          chmod 600 server.key

      - name: Set org credentials and login URL based on environment
        id: set-org
        shell: bash
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          SF_LOGIN_URL_TEST_VAL: ${{ env.SF_LOGIN_URL_TEST }}
          SF_LOGIN_URL_PROD_VAL: ${{ env.SF_LOGIN_URL_PROD }}
          KEY_DEV: ${{ secrets.SALESFORCE_CONSUMER_KEY_DEV }}
          KEY_QA: ${{ secrets.SALESFORCE_CONSUMER_KEY_QA }}
          KEY_UAT: ${{ secrets.SALESFORCE_CONSUMER_KEY_UAT }}
          KEY_PROD: ${{ secrets.SALESFORCE_CONSUMER_KEY_PROD }}
          KEY_HOTFIX: ${{ secrets.SALESFORCE_CONSUMER_KEY_HOTFIX }}
          USER_DEV: ${{ secrets.SFDX_AUTH_DEV_USERNAME }}
          USER_QA: ${{ secrets.SFDX_AUTH_QA_USERNAME }}
          USER_UAT: ${{ secrets.SFDX_AUTH_UAT_USERNAME }}
          USER_PROD: ${{ secrets.SFDX_AUTH_PROD_USERNAME }}
          USER_HOTFIX: ${{ secrets.SFDX_AUTH_HOTFIX_USERNAME }}
        run: |
          case "$ENVIRONMENT" in
            DEV)        echo "CLIENT_ID=$KEY_DEV"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_DEV"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            QA)         echo "CLIENT_ID=$KEY_QA"     >> $GITHUB_OUTPUT; echo "USERNAME=$USER_QA"     >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            UAT)        echo "CLIENT_ID=$KEY_UAT"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_UAT"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            PRODUCTION) echo "CLIENT_ID=$KEY_PROD"   >> $GITHUB_OUTPUT; echo "USERNAME=$USER_PROD"   >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_PROD_VAL" >> $GITHUB_OUTPUT ;;
            HOTFIX)     echo "CLIENT_ID=$KEY_HOTFIX" >> $GITHUB_OUTPUT; echo "USERNAME=$USER_HOTFIX" >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            *) echo "Unsupported environment $ENVIRONMENT"; exit 1 ;;
          esac

      - name: Clear Prior Salesforce Sessions
        shell: bash
        run: |
          echo "🧹 Clearing existing Salesforce org sessions..."
          sf org logout --all --no-prompt || true

      - name: Authenticate to - ${{ github.event.inputs.environment }} Org
        env:
          CLIENT_ID: ${{ steps.set-org.outputs.CLIENT_ID }}
          USERNAME: ${{ steps.set-org.outputs.USERNAME }}
          LOGIN_URL: ${{ steps.set-org.outputs.LOGIN_URL }}
        run: |
          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$USERNAME" \
            --instance-url "$LOGIN_URL" \
            --set-default

      - name: Check Manifest Exists and Prepare Test Classes
        id: prepare-tests
        shell: bash
        env:
          TEST_LEVEL: ${{ env.TEST_LEVEL }}
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          MANIFEST="${WORKSPACE}/manifest/${FEATURE_BRANCH}_package.xml"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "ERROR: Manifest file $MANIFEST not found."
            exit 1
          fi
          echo "✅ Manifest found: $MANIFEST"

          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" ]]; then
            TEST_CLASS_FILE="${WORKSPACE}/manifest/${FEATURE_BRANCH}_TestClass.txt"
            if [[ ! -f "$TEST_CLASS_FILE" ]]; then
              echo "ERROR: Test class file $TEST_CLASS_FILE not found."
              exit 1
            fi
            TEST_CLASSES=$(paste -sd ' ' "$TEST_CLASS_FILE")
            echo "✅ Test classes: $TEST_CLASSES"
            echo "test_classes=$TEST_CLASSES" >> $GITHUB_OUTPUT
          else
            echo "test_classes=" >> $GITHUB_OUTPUT
          fi

      - name: Validation Deployment - ${{ github.event.inputs.environment }} Org
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          TEST_LEVEL: ${{ env.TEST_LEVEL }}
          TEST_CLASSES: ${{ steps.prepare-tests.outputs.test_classes }}
          ORG_USERNAME: ${{ steps.set-org.outputs.USERNAME }}
        run: |
          MANIFEST="${WORKSPACE}/manifest/${FEATURE_BRANCH}_package.xml"
          echo "Validating: $MANIFEST"
          CMD=(sf project deploy validate --manifest "$MANIFEST" --target-org "$ORG_USERNAME" --test-level "$TEST_LEVEL" --wait 30 --ignore-warnings --verbose)
          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" && -n "$TEST_CLASSES" ]]; then
            CMD+=(--tests $TEST_CLASSES)
          fi
          "${CMD[@]}"

      - name: Deploy to Salesforce - ${{ github.event.inputs.environment }} Org
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          TEST_LEVEL: ${{ env.TEST_LEVEL }}
          TEST_CLASSES: ${{ steps.prepare-tests.outputs.test_classes }}
          ORG_USERNAME: ${{ steps.set-org.outputs.USERNAME }}
        run: |
          MANIFEST="${WORKSPACE}/manifest/${FEATURE_BRANCH}_package.xml"
          echo "Deploying: $MANIFEST"
          CMD=(sf project deploy start --manifest "$MANIFEST" --target-org "$ORG_USERNAME" --test-level "$TEST_LEVEL" --wait 60 --ignore-conflicts --coverage-formatters json --results-dir coverage-results)
          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" && -n "$TEST_CLASSES" ]]; then
            CMD+=(--tests $TEST_CLASSES)
          fi
          "${CMD[@]}"

      - name: Apex Coverage Gate (75% Lodha Standard)
        if: env.TEST_LEVEL != 'NoTestRun'
        uses: ./.github/actions/coverage-gate
        with:
          coverage-results-dir: coverage-results
          minimum-coverage:     '75'
          environment:          ${{ github.event.inputs.environment }}
          feature-branch:       ${{ env.FEATURE_BRANCH }}
          jira-base-url:        ${{ secrets.JIRA_BASE_URL }}
          jira-user-email:      ${{ secrets.JIRA_USER_EMAIL }}
          jira-api-token:       ${{ secrets.ATLASSIAN_API_TOKEN }}
          run-id:               ${{ github.run_id }}
          repo:                 ${{ github.repository }}

      - name: Cleanup JWT key
        if: always()
        run: rm -f server.key

      - name: Create Release Tag
        id: release-tag
        if: github.event.inputs.environment == 'PRODUCTION'
        shell: bash
        env:
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_BRANCHES: ${{ steps.resolve-package.outputs.source_branches }}
        run: |
          TAG_DATE=$(TZ='Asia/Kolkata' date +'%d%m%Y')
          TAG_TIME=$(TZ='Asia/Kolkata' date +'%H%M')
          TAG_PREFIX="${ENVIRONMENT}/${TAG_DATE}"

          echo "🔍 Fetching existing tags for prefix: ${TAG_PREFIX}"
          EXISTING_TAGS=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/git/refs/tags" \
            | jq -r '.[].ref | ltrimstr("refs/tags/")' 2>/dev/null || echo "")

          MAX_PATCH=-1
          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^${ENVIRONMENT}/[0-9]{8}_[0-9]{4}_v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              TAG_DAY=$(echo "$TAG" | sed 's|.*/\([0-9]\{8\}\)_.*|\1|')
              if [[ "$TAG_DAY" == "$TAG_DATE" ]]; then
                PATCH=${BASH_REMATCH[3]}
                if [[ $PATCH -gt $MAX_PATCH ]]; then
                  MAX_PATCH=$PATCH
                fi
              fi
            fi
          done <<< "$EXISTING_TAGS"

          if [[ $MAX_PATCH -eq -1 ]]; then
            VERSION="v1.0.0"
          else
            NEXT_PATCH=$((MAX_PATCH + 1))
            VERSION="v1.0.${NEXT_PATCH}"
          fi

          TAG_NAME="${ENVIRONMENT}/${TAG_DATE}_${TAG_TIME}_${VERSION}"
          SAFE_BRANCH=$(echo "$FEATURE_BRANCH" | sed 's|/|-|g')

          echo "=========================================="
          echo "RELEASE TAG"
          echo "=========================================="
          echo "  Environment : $ENVIRONMENT"
          echo "  Date (IST)  : $TAG_DATE"
          echo "  Version     : $VERSION"
          echo "  Tag         : $TAG_NAME"
          echo "=========================================="

          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git tag -a "$TAG_NAME" -m "${ENVIRONMENT} release ${TAG_DATE}_${TAG_TIME} IST | ${VERSION} | Package: ${FEATURE_BRANCH} | Deployed by: ${ACTOR}"
          git push origin "$TAG_NAME"
          echo "✅ Tag pushed: $TAG_NAME"

          echo "🚀 Creating GitHub Release..."
          RELEASE_BODY="## 🚀 ${ENVIRONMENT} Release ${VERSION}\n\n"
          RELEASE_BODY+="| Field | Value |\n|---|---|\n"
          RELEASE_BODY+="| **Tag** | \`${TAG_NAME}\` |\n"
          RELEASE_BODY+="| **Environment** | ${ENVIRONMENT} |\n"
          RELEASE_BODY+="| **Version** | ${VERSION} |\n"
          RELEASE_BODY+="| **Date (IST)** | $(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST') |\n"
          RELEASE_BODY+="| **Package** | ${FEATURE_BRANCH} |\n"
          RELEASE_BODY+="| **Branch** | ${REF_NAME} |\n"
          if [[ -n "$SOURCE_BRANCHES" ]]; then
            BRANCHES_MD=""
            IFS=',' read -ra BS <<< "$SOURCE_BRANCHES"
            for B in "${BS[@]}"; do
              BRANCHES_MD+="$(echo "$B" | xargs), "
            done
            BRANCHES_MD=$(echo "$BRANCHES_MD" | sed 's/, $//')
            RELEASE_BODY+="| **Feature Branches** | ${BRANCHES_MD} |\n"
          fi
          RELEASE_BODY+="| **Deployed by** | ${ACTOR} |\n"
          RELEASE_BODY+="| **Workflow Run** | [${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID}) |\n"

          IS_PROD="false"
          [[ "$ENVIRONMENT" == "PRODUCTION" ]] && IS_PROD="true"

          RELEASE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/releases" \
            -d "$(jq -n \
              --arg tag  "$TAG_NAME" \
              --arg name "🚀 ${ENVIRONMENT} | ${TAG_DATE}_${TAG_TIME} | ${VERSION} | ${SAFE_BRANCH}" \
              --arg body "$(printf '%b' "$RELEASE_BODY")" \
              --arg latest "$IS_PROD" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, make_latest: $latest}')")

          RELEASE_HTTP=$(echo "$RELEASE_RESPONSE" | tail -1)
          if [[ "$RELEASE_HTTP" == "201" ]]; then
            echo "✅ GitHub Release created: $TAG_NAME"
            echo "🔗 https://github.com/${REPO}/releases/tag/${TAG_NAME}"
          else
            echo "❌ GitHub Release API failed (HTTP $RELEASE_HTTP)"
            echo "$RELEASE_RESPONSE" | sed '$d'
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "actor=${ACTOR}" >> $GITHUB_OUTPUT
          echo "ref_name=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "repo=${REPO}" >> $GITHUB_OUTPUT


  Post_Deployment_Health_Check:
    name: Post-Deploy Health Check - PRODUCTION
    runs-on: ubuntu-latest
    needs: Deployment_Build
    if: needs.Deployment_Build.result == 'success' && needs.Deployment_Build.outputs.environment == 'PRODUCTION'
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest --silent

      - name: Generate JWT Key
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
          chmod 600 server.key

      - name: Set Org Credentials
        id: set-org
        shell: bash
        env:
          KEY_PROD:    ${{ secrets.SALESFORCE_CONSUMER_KEY_PROD }}
          USER_PROD:   ${{ secrets.SFDX_AUTH_PROD_USERNAME }}
          LOGIN_URL:   ${{ secrets.LOGIN_URL }}
        run: |
          echo "CLIENT_ID=$KEY_PROD"  >> $GITHUB_OUTPUT
          echo "USERNAME=$USER_PROD"  >> $GITHUB_OUTPUT
          echo "INSTANCE_URL=$LOGIN_URL" >> $GITHUB_OUTPUT

      - name: Authenticate to Salesforce
        shell: bash
        env:
          CLIENT_ID:    ${{ steps.set-org.outputs.CLIENT_ID }}
          USERNAME:     ${{ steps.set-org.outputs.USERNAME }}
          INSTANCE_URL: ${{ steps.set-org.outputs.INSTANCE_URL }}
        run: |
          sf org logout --all --no-prompt || true
          sf org login jwt \
            --client-id    "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username     "$USERNAME" \
            --instance-url "$INSTANCE_URL" \
            --set-default


      - name: Collect Health Metrics
        id: collect
        shell: bash
        env:
          USERNAME: ${{ steps.set-org.outputs.USERNAME }}
          ENV:      ${{ needs.Deployment_Build.outputs.environment }}
          PACKAGE:  ${{ needs.Deployment_Build.outputs.deploy_package }}
        run: |
          set +e
          SCAN_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          echo "📊 Post-deploy health check for $ENV at $SCAN_TIME..."

          safe_array() { echo "$1" | jq -c "$2 // []" 2>/dev/null || echo '[]'; }
          safe_obj()   { echo "$1" | jq -c "$2 // {}" 2>/dev/null || echo '{}'; }
          safe_int()   { echo "$1" | jq -r "$2 // 0"  2>/dev/null || echo '0';  }

          # -- Org Info -------------------------------------------------------
          RAW_ORG=$(sf org display --target-org "$USERNAME" --json 2>/dev/null)
          ORG_JSON=$(safe_obj "$RAW_ORG" '.result')

          # -- Governor Limits ------------------------------------------------
          RAW_LIMITS=$(sf org list limits --target-org "$USERNAME" --json 2>/dev/null)
          LIMITS_JSON=$(echo "$RAW_LIMITS" | jq -c '[.result[]? | {name: (.name // .Name // ""), remaining: ((.remaining // .Remaining // 0) | tonumber), max: ((.max // .Max // 0) | tonumber)}] | map(select(.name != ""))' 2>/dev/null || echo '[]')

          # -- Active Apex Classes --------------------------------------------
          RAW_APEX=$(sf data query --query "SELECT COUNT() FROM ApexClass WHERE Status='Active'" --target-org "$USERNAME" --json 2>/dev/null)
          APEX_COUNT=$(safe_int "$RAW_APEX" '.result.totalSize')

          # -- Active Apex Triggers -------------------------------------------
          RAW_TRIGGER=$(sf data query --query "SELECT COUNT() FROM ApexTrigger WHERE Status='Active'" --target-org "$USERNAME" --json 2>/dev/null)
          TRIGGER_COUNT=$(safe_int "$RAW_TRIGGER" '.result.totalSize')

          # -- Active Flows (Tooling API) -------------------------------------
          RAW_FLOWS=$(sf data query --query "SELECT COUNT() FROM FlowDefinition WHERE ActiveVersionId != null" --target-org "$USERNAME" --use-tooling-api --json 2>/dev/null)
          FLOW_COUNT=$(safe_int "$RAW_FLOWS" '.result.totalSize')

          # -- Active Users ---------------------------------------------------
          RAW_USERS=$(sf data query --query "SELECT COUNT() FROM User WHERE IsActive=true AND Profile.UserLicense.LicenseDefinitionKey != 'PID_CHATTER'" --target-org "$USERNAME" --json 2>/dev/null)
          USER_COUNT=$(safe_int "$RAW_USERS" '.result.totalSize')

          # -- Security Metrics -----------------------------------------------
          RAW_PRIV=$(sf data query --query "SELECT COUNT() FROM Profile WHERE PermissionsModifyAllData=true" --target-org "$USERNAME" --json 2>/dev/null)
          PRIV_COUNT=$(safe_int "$RAW_PRIV" '.result.totalSize')

          RAW_INACTIVE=$(sf data query --query "SELECT COUNT() FROM User WHERE IsActive=false AND LastLoginDate != null AND Profile.UserLicense.LicenseDefinitionKey != 'PID_CHATTER'" --target-org "$USERNAME" --json 2>/dev/null)
          INACTIVE_COUNT=$(safe_int "$RAW_INACTIVE" '.result.totalSize')

          RAW_NO_MFA=$(sf data query --query "SELECT COUNT() FROM User WHERE IsActive=true AND Profile.PermissionsMultiFactorAuthentication=false AND Profile.UserLicense.LicenseDefinitionKey != 'PID_CHATTER'" --target-org "$USERNAME" --json 2>/dev/null)
          NO_MFA_COUNT=$(safe_int "$RAW_NO_MFA" '.result.totalSize')

          # -- Guest User Access ----------------------------------------------
          RAW_GUEST=$(sf data query --query "SELECT COUNT() FROM User WHERE IsActive=true AND Profile.UserType='Guest'" --target-org "$USERNAME" --json 2>/dev/null)
          GUEST_COUNT=$(safe_int "$RAW_GUEST" '.result.totalSize')

          # -- Connected Apps without IP Restrictions -------------------------
          RAW_CONN=$(sf data query --query "SELECT COUNT() FROM ConnectedApplication WHERE OptionsAllowAdminApprovedUsersOnly=false" --target-org "$USERNAME" --use-tooling-api --json 2>/dev/null)
          CONN_APP_COUNT=$(safe_int "$RAW_CONN" '.result.totalSize')

          # -- Deprecated API Versions (< 50.0) ------------------------------
          RAW_OLD_API=$(sf data query --query "SELECT COUNT() FROM ApexClass WHERE ApiVersion < 50.0 AND Status='Active'" --target-org "$USERNAME" --json 2>/dev/null)
          OLD_API_COUNT=$(safe_int "$RAW_OLD_API" '.result.totalSize')

          # -- Sharing Settings: Public Read/Write objects -------------------
          RAW_OWD=$(sf data query --query "SELECT QualifiedApiName, InternalSharingModel FROM EntityDefinition WHERE InternalSharingModel IN ('ReadWrite','ControlledByLeadOrContact') AND IsCustomizable=true" --target-org "$USERNAME" --use-tooling-api --json 2>/dev/null)
          OWD_PUBLIC_COUNT=$(echo "$RAW_OWD" | jq -r '.result.totalSize // 0' 2>/dev/null || echo '0')

          # -- Salesforce Native Security Health Check Score (REST API) ------
          SF_API_VERSION="62.0"
          INSTANCE_URL=$(sf org display --target-org "$USERNAME" --json 2>/dev/null | jq -r '.result.instanceUrl // empty')
          ACCESS_TOKEN=$(sf org display --target-org "$USERNAME" --json 2>/dev/null | jq -r '.result.accessToken // empty')
          SF_SEC_SCORE=0
          SF_SEC_RISKS=0
          SF_SEC_COMPLIANT=0
          if [[ -n "$INSTANCE_URL" && -n "$ACCESS_TOKEN" ]]; then
            RAW_SF_SEC=$(curl -s \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "${INSTANCE_URL}/services/data/v${SF_API_VERSION}/security/health-check" 2>/dev/null)
            # Normalise: API may return an object OR a single-element array
            SF_SEC_JSON=$(echo "$RAW_SF_SEC" | jq -r 'if type == "array" then .[0] else . end' 2>/dev/null || echo '{}')
            SF_SEC_SCORE_RAW=$(echo "$SF_SEC_JSON" | jq -r '.score // empty' 2>/dev/null || true)
            echo "🔍 SF Health Check API raw score: $SF_SEC_SCORE_RAW"
            echo "🔍 SF Health Check API response keys: $(echo "$SF_SEC_JSON" | jq -r 'keys // []' 2>/dev/null)"
            if [[ -n "$SF_SEC_SCORE_RAW" && "$SF_SEC_SCORE_RAW" != "null" ]]; then
              SF_SEC_SCORE=$(awk "BEGIN {printf \"%d\", int(${SF_SEC_SCORE_RAW}+0)}")
            fi
            SF_SEC_RISKS=$(echo "$SF_SEC_JSON" | jq -r '[.settings[]? | select(.riskType != null and .riskType != "MEETS_STANDARD")] | length' 2>/dev/null || echo '0')
            SF_SEC_COMPLIANT=$(echo "$SF_SEC_JSON" | jq -r '[.settings[]? | select(.riskType == "MEETS_STANDARD")] | length' 2>/dev/null || echo '0')
            echo "🔍 SF non-compliant: $SF_SEC_RISKS | compliant: $SF_SEC_COMPLIANT"
          fi
          # Fallback: if SF API unavailable, derive from manual checks
          if [[ "$SF_SEC_SCORE" == "0" || "$SF_SEC_SCORE" == "null" || -z "$SF_SEC_SCORE" ]]; then
            SF_SEC_SCORE=$(awk "BEGIN {v=100-(${PRIV_COUNT}*10)-(${INACTIVE_COUNT}*2)-(${NO_MFA_COUNT}*1)-(${GUEST_COUNT}*5)-(${CONN_APP_COUNT}*3)-(${OWD_PUBLIC_COUNT}*2); if(v<0)v=0; printf \"%d\", int(v)}")
            echo "⚠️ SF Health Check API unavailable — using fallback formula: $SF_SEC_SCORE"
          fi

          # -- Password Policy Check (via REST API — PasswordPolicy SOQL not supported in all orgs) --
          # SF stores password policy in org-wide settings; use SecuritySettings Tooling API
          RAW_PWD=$(curl -s \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "${INSTANCE_URL}/services/data/v${SF_API_VERSION}/tooling/query?q=SELECT+MinPasswordLength,PasswordComplexity,PasswordExpiration,MaxLoginAttempts+FROM+PasswordPolicy+LIMIT+1" 2>/dev/null)
          PWD_MIN_LEN=$(echo "$RAW_PWD" | jq -r '.records[0].MinPasswordLength // 0' 2>/dev/null || echo '0')
          PWD_COMPLEXITY=$(echo "$RAW_PWD" | jq -r '.records[0].PasswordComplexity // 0' 2>/dev/null || echo '0')
          PWD_EXPIRY=$(echo "$RAW_PWD" | jq -r '.records[0].PasswordExpiration // 0' 2>/dev/null || echo '0')
          PWD_LOCKOUT=$(echo "$RAW_PWD" | jq -r '.records[0].MaxLoginAttempts // 0' 2>/dev/null || echo '0')
          # SF standard: min length >= 8, complexity >= 3 (alpha+numeric+special), expiry <= 90d, lockout <= 10
          PWD_ISSUES=0
          [[ "${PWD_MIN_LEN:-0}" -lt 8 ]] && PWD_ISSUES=$((PWD_ISSUES + 1))
          [[ "${PWD_COMPLEXITY:-0}" -lt 3 ]] && PWD_ISSUES=$((PWD_ISSUES + 1))
          [[ "${PWD_EXPIRY:-0}" -eq 0 || "${PWD_EXPIRY:-0}" -gt 90 ]] && PWD_ISSUES=$((PWD_ISSUES + 1))
          [[ "${PWD_LOCKOUT:-0}" -eq 0 || "${PWD_LOCKOUT:-0}" -gt 10 ]] && PWD_ISSUES=$((PWD_ISSUES + 1))

          # -- Session Settings Check (via Tooling API REST directly) --------
          RAW_SESSION=$(curl -s \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "${INSTANCE_URL}/services/data/v${SF_API_VERSION}/tooling/query?q=SELECT+SessionTimeout,ForceRelogin,RequireHttps,EnableClickjackNonsetupSFDC,EnableClickjackNonsetupUser+FROM+SecuritySettings+LIMIT+1" 2>/dev/null)
          SESSION_HTTPS=$(echo "$RAW_SESSION" | jq -r '.records[0].RequireHttps // false' 2>/dev/null || echo 'false')
          SESSION_CLICKJACK=$(echo "$RAW_SESSION" | jq -r '.records[0].EnableClickjackNonsetupUser // false' 2>/dev/null || echo 'false')
          SESSION_TIMEOUT=$(echo "$RAW_SESSION" | jq -r '.records[0].SessionTimeout // "02:00"' 2>/dev/null || echo '02:00')
          SESSION_ISSUES=0
          [[ "$SESSION_HTTPS" != "true" ]] && SESSION_ISSUES=$((SESSION_ISSUES + 1))
          [[ "$SESSION_CLICKJACK" != "true" ]] && SESSION_ISSUES=$((SESSION_ISSUES + 1))
          SESSION_HOURS=$(echo "$SESSION_TIMEOUT" | cut -d: -f1 | sed 's/^0*//' | grep -E '^[0-9]+$' || echo '2')
          [[ "${SESSION_HOURS:-2}" -gt 4 ]] && SESSION_ISSUES=$((SESSION_ISSUES + 1))

          # -- Storage Usage (from governor limits) --------------------------
          DATA_STORAGE_USED=$(echo "$LIMITS_JSON" | jq -r '[.[] | select(.name == "DataStorageMB")] | if length > 0 then (.[0] | (.max - .remaining)) else 0 end' 2>/dev/null || echo '0')
          DATA_STORAGE_MAX=$(echo "$LIMITS_JSON" | jq -r '[.[] | select(.name == "DataStorageMB")] | if length > 0 then .[0].max else 0 end' 2>/dev/null || echo '0')
          FILE_STORAGE_USED=$(echo "$LIMITS_JSON" | jq -r '[.[] | select(.name == "FileStorageMB")] | if length > 0 then (.[0] | (.max - .remaining)) else 0 end' 2>/dev/null || echo '0')
          FILE_STORAGE_MAX=$(echo "$LIMITS_JSON" | jq -r '[.[] | select(.name == "FileStorageMB")] | if length > 0 then .[0].max else 0 end' 2>/dev/null || echo '0')

          SEC_RAW="$SF_SEC_SCORE"


          # -- Apex Coverage --------------------------------------------------
          RAW_COV=$(sf data query \
            --query "SELECT NumLinesCovered, NumLinesUncovered FROM ApexOrgWideCoverage" \
            --target-org "$USERNAME" --json 2>/dev/null)
          COV_COVERED=$(safe_int "$RAW_COV" '.result.records[0].NumLinesCovered')
          COV_UNCOVERED=$(safe_int "$RAW_COV" '.result.records[0].NumLinesUncovered')
          COV_TOTAL=$((COV_COVERED + COV_UNCOVERED))
          if [[ $COV_TOTAL -gt 0 ]]; then
            APEX_COVERAGE=$(awk "BEGIN {printf \"%.6f\", ($COV_COVERED / $COV_TOTAL) * 100}")
            APEX_COVERAGE_DISPLAY=$(awk "BEGIN {printf \"%.1f\", ($COV_COVERED / $COV_TOTAL) * 100}")
          else
            APEX_COVERAGE="0.000000"
            APEX_COVERAGE_DISPLAY="0.0"
          fi

          # -- Apex Test Results (last 7 days) --------------------------------
          RAW_TEST_PASS=$(sf data query --query "SELECT COUNT() FROM ApexTestResult WHERE Outcome='Pass' AND CreatedDate = LAST_N_DAYS:7" --target-org "$USERNAME" --json 2>/dev/null)
          RAW_TEST_FAIL=$(sf data query --query "SELECT COUNT() FROM ApexTestResult WHERE Outcome='Fail' AND CreatedDate = LAST_N_DAYS:7" --target-org "$USERNAME" --json 2>/dev/null)
          TEST_PASS=$(safe_int "$RAW_TEST_PASS" '.result.totalSize')
          TEST_FAIL=$(safe_int "$RAW_TEST_FAIL" '.result.totalSize')
          TEST_TOTAL=$((TEST_PASS + TEST_FAIL))

          # -- Apex Test Failure Details (last 24h) ---------------------------
          RAW_TESTS=$(sf data query \
            --query "SELECT Id, ApexClass.Name, MethodName, Outcome, Message, CreatedDate FROM ApexTestResult WHERE Outcome='Fail' AND CreatedDate = LAST_N_DAYS:1 ORDER BY CreatedDate DESC LIMIT 20" \
            --target-org "$USERNAME" --json 2>/dev/null)
          TESTS_JSON=$(safe_array "$RAW_TESTS" '.result.records')

          # -- Recent Deployments ---------------------------------------------
          RAW_DEPLOYS=$(sf data query \
            --query "SELECT Id, Status, StartDate, CompletedDate, NumberComponentsDeployed, NumberComponentErrors FROM DeployRequest ORDER BY StartDate DESC LIMIT 10" \
            --target-org "$USERNAME" --json 2>/dev/null)
          DEPLOYS_JSON=$(safe_array "$RAW_DEPLOYS" '.result.records')

          DEPLOY_TOTAL=$(echo "$DEPLOYS_JSON" | jq 'length')
          DEPLOY_SUCCESS=$(echo "$DEPLOYS_JSON" | jq '[.[] | select(.Status == "Succeeded")] | length')
          if [[ $DEPLOY_TOTAL -gt 0 ]]; then
            DEPLOY_RATE=$(awk "BEGIN {printf \"%.1f\", ($DEPLOY_SUCCESS / $DEPLOY_TOTAL) * 100}")
          else
            DEPLOY_RATE="100.0"
          fi

          # -- Failed Batch Jobs (last 24h) -----------------------------------
          RAW_BATCHES=$(sf data query \
            --query "SELECT Id, ApexClass.Name, Status, NumberOfErrors, TotalJobItems, CreatedDate FROM AsyncApexJob WHERE Status='Failed' AND CreatedDate = LAST_N_DAYS:1 ORDER BY CreatedDate DESC LIMIT 20" \
            --target-org "$USERNAME" --json 2>/dev/null)
          BATCHES_JSON=$(safe_array "$RAW_BATCHES" '.result.records')

          # -- Apex Exceptions (last 24h) -------------------------------------
          RAW_EXCEPTIONS=$(sf data query \
            --query "SELECT COUNT() FROM ApexLog WHERE LogLength > 0 AND Operation='ApexTrigger' AND Status='Unexpected exception' AND StartTime = LAST_N_DAYS:1" \
            --target-org "$USERNAME" --json 2>/dev/null)
          APEX_EXCEPTIONS=$(safe_int "$RAW_EXCEPTIONS" '.result.totalSize')

          # -- Scheduled Jobs -------------------------------------------------
          RAW_SCHED=$(sf data query \
            --query "SELECT Id, CronJobDetail.Name, State, NextFireTime, PreviousFireTime FROM CronTrigger WHERE State IN ('WAITING','ACQUIRED') ORDER BY NextFireTime ASC LIMIT 20" \
            --target-org "$USERNAME" --json 2>/dev/null)
          SCHED_JSON=$(safe_array "$RAW_SCHED" '.result.records')

          # -- Running Batch Jobs ---------------------------------------------
          RAW_RUNNING=$(sf data query \
            --query "SELECT Id, ApexClass.Name, Status, JobItemsProcessed, TotalJobItems, NumberOfErrors, CreatedDate FROM AsyncApexJob WHERE Status IN ('Processing','Queued','Preparing') ORDER BY CreatedDate DESC LIMIT 10" \
            --target-org "$USERNAME" --json 2>/dev/null)
          RUNNING_JSON=$(safe_array "$RAW_RUNNING" '.result.records')

          # -- PMD / Code Analyzer --------------------------------------------
          PMD_CRITICAL=0; PMD_HIGH=0; PMD_MEDIUM=0
          if [[ -d "force-app" ]]; then
            echo "🔍 Running Salesforce Code Analyzer..."
            npm install -g @salesforce/sfdx-scanner --silent 2>/dev/null || true
            sf scanner run \
              --target "force-app/**/*.cls,force-app/**/*.trigger" \
              --format json \
              --severity-threshold 1 \
              --output-file pmd_results.json 2>/dev/null || true
            if [[ -f pmd_results.json ]]; then
              PMD_CRITICAL=$(jq '[.[] | select(.severity == 1)] | length' pmd_results.json 2>/dev/null || echo 0)
              PMD_HIGH=$(jq     '[.[] | select(.severity == 2)] | length' pmd_results.json 2>/dev/null || echo 0)
              PMD_MEDIUM=$(jq   '[.[] | select(.severity == 3)] | length' pmd_results.json 2>/dev/null || echo 0)
            fi
          else
            echo "⚠️ force-app not found — skipping PMD scan"
          fi


          # -- Health Score Calculation ---------------------------------------
          # Use Salesforce's own Security Health Check score directly (matches Setup → Security → Health Check)
          FAILED_BATCH_COUNT=$(echo "$BATCHES_JSON" | jq 'length')
          CRITICAL_LIMITS=$(echo "$LIMITS_JSON" | jq '[.[] | select(.max > 0 and ((.remaining / .max) < 0.20))] | length' 2>/dev/null || echo 0)

          HEALTH_SCORE=${SF_SEC_SCORE:-0}
          # Store component scores for display only (not used in final score)
          COMP_COV=$(awk "BEGIN {cov=${COV_COVERED}+0; unc=${COV_UNCOVERED}+0; tot=cov+unc; printf \"%.1f\", (tot>0)?(cov/tot)*100:0}")
          COMP_TEST=$(awk "BEGIN {t=${TEST_PASS}+${TEST_FAIL}; printf \"%.1f\", (t>0)?(${TEST_PASS}/t)*100:100}")
          COMP_PMD=$(awk "BEGIN {v=100-(${PMD_CRITICAL}*5)-(${PMD_HIGH}*2)-(${OLD_API_COUNT}*1); if(v<0)v=0; printf \"%.1f\", v}")
          COMP_STAB=$(awk "BEGIN {v=100-(${FAILED_BATCH_COUNT}*10)-(${APEX_EXCEPTIONS}*5); if(v<0)v=0; printf \"%.1f\", v}")
          COMP_GOV=$(awk "BEGIN {v=100-(${CRITICAL_LIMITS}*10); if(v<0)v=0; printf \"%.1f\", v}")

          if   [[ $HEALTH_SCORE -ge 90 ]]; then HEALTH_BAND="🟢 Excellent"
          elif [[ $HEALTH_SCORE -ge 75 ]]; then HEALTH_BAND="🟢 Good"
          elif [[ $HEALTH_SCORE -ge 50 ]]; then HEALTH_BAND="🟡 Fair"
          else                                   HEALTH_BAND="🔴 Poor"
          fi

          # -- Build health JSON ----------------------------------------------
          HEALTH_JSON=$(jq -n \
            --arg  env               "$ENV" \
            --arg  scan_time         "$SCAN_TIME" \
            --arg  package           "$PACKAGE" \
            --arg  health_band       "$HEALTH_BAND" \
            --argjson health_score   "$HEALTH_SCORE" \
            --arg  apex_coverage     "$APEX_COVERAGE_DISPLAY" \
            --argjson test_pass      "$TEST_PASS" \
            --argjson test_fail      "$TEST_FAIL" \
            --argjson test_total     "$TEST_TOTAL" \
            --arg  deploy_rate       "$DEPLOY_RATE" \
            --argjson deploy_success "$DEPLOY_SUCCESS" \
            --argjson deploy_total   "$DEPLOY_TOTAL" \
            --argjson pmd_critical   "$PMD_CRITICAL" \
            --argjson pmd_high       "$PMD_HIGH" \
            --argjson pmd_medium     "$PMD_MEDIUM" \
            --argjson apex_exceptions "$APEX_EXCEPTIONS" \
            --argjson failed_batch_count "$FAILED_BATCH_COUNT" \
            --argjson critical_limits    "$CRITICAL_LIMITS" \
            --arg    sec_raw             "$SEC_RAW" \
            --arg    priv_count          "$PRIV_COUNT" \
            --arg    inactive_count      "$INACTIVE_COUNT" \
            --arg    no_mfa_count        "$NO_MFA_COUNT" \
            --argjson guest_count        "$GUEST_COUNT" \
            --argjson conn_app_count     "$CONN_APP_COUNT" \
            --argjson old_api_count      "$OLD_API_COUNT" \
            --argjson owd_public_count   "$OWD_PUBLIC_COUNT" \
            --argjson sf_sec_score       "$SF_SEC_SCORE" \
            --argjson sf_sec_risks       "$SF_SEC_RISKS" \
            --argjson sf_sec_compliant   "$SF_SEC_COMPLIANT" \
            --argjson pwd_issues         "$PWD_ISSUES" \
            --argjson pwd_min_len        "$PWD_MIN_LEN" \
            --argjson pwd_complexity     "$PWD_COMPLEXITY" \
            --argjson pwd_expiry         "$PWD_EXPIRY" \
            --argjson pwd_lockout        "$PWD_LOCKOUT" \
            --argjson session_issues     "$SESSION_ISSUES" \
            --arg    session_https       "$SESSION_HTTPS" \
            --arg    session_clickjack   "$SESSION_CLICKJACK" \
            --arg    session_timeout     "$SESSION_TIMEOUT" \
            --arg    data_storage_used   "$DATA_STORAGE_USED" \
            --arg    data_storage_max    "$DATA_STORAGE_MAX" \
            --arg    file_storage_used   "$FILE_STORAGE_USED" \
            --arg    file_storage_max    "$FILE_STORAGE_MAX" \
            --argjson apex              "$APEX_COUNT" \
            --argjson triggers          "$TRIGGER_COUNT" \
            --argjson flows             "$FLOW_COUNT" \
            --argjson users             "$USER_COUNT" \
            --argjson org_info          "$ORG_JSON" \
            --argjson limits            "$LIMITS_JSON" \
            --argjson failed_batches    "$BATCHES_JSON" \
            --argjson test_failures     "$TESTS_JSON" \
            --argjson scheduled_jobs    "$SCHED_JSON" \
            --argjson running_jobs      "$RUNNING_JSON" \
            --argjson deploy_history    "$DEPLOYS_JSON" \
            '{
              environment:   $env,
              scan_time:     $scan_time,
              package:       $package,
              health_score:  $health_score,
              health_band:   $health_band,
              scores: {
                apex_coverage:      $apex_coverage,
                test_pass:          $test_pass,
                test_fail:          $test_fail,
                test_total:         $test_total,
                deploy_rate:        $deploy_rate,
                deploy_success:     $deploy_success,
                deploy_total:       $deploy_total,
                pmd_critical:       $pmd_critical,
                pmd_high:           $pmd_high,
                pmd_medium:         $pmd_medium,
                apex_exceptions:    $apex_exceptions,
                failed_batch_count: $failed_batch_count,
                critical_limits:    $critical_limits,
                sec_raw:            $sec_raw,
                sf_sec_score:       $sf_sec_score,
                sf_sec_risks:       $sf_sec_risks,
                sf_sec_compliant:   $sf_sec_compliant,
                pwd_issues:         $pwd_issues,
                pwd_min_len:        $pwd_min_len,
                pwd_complexity:     $pwd_complexity,
                pwd_expiry:         $pwd_expiry,
                pwd_lockout:        $pwd_lockout,
                session_issues:     $session_issues,
                session_https:      $session_https,
                session_clickjack:  $session_clickjack,
                session_timeout:    $session_timeout,
                priv_count:         $priv_count,
                inactive_count:     $inactive_count,
                no_mfa_count:       $no_mfa_count,
                guest_count:        $guest_count,
                conn_app_count:     $conn_app_count,
                old_api_count:      $old_api_count,
                owd_public_count:   $owd_public_count,
                data_storage_used:  $data_storage_used,
                data_storage_max:   $data_storage_max,
                file_storage_used:  $file_storage_used,
                file_storage_max:   $file_storage_max
              },
              metadata: {
                apex_classes:  $apex,
                apex_triggers: $triggers,
                active_flows:  $flows,
                active_users:  $users
              },
              org_info:        $org_info,
              governor_limits: $limits,
              failed_batches:  $failed_batches,
              test_failures:   $test_failures,
              scheduled_jobs:  $scheduled_jobs,
              running_jobs:    $running_jobs,
              deploy_history:  $deploy_history
            }')

          echo "$HEALTH_JSON" > health_post_deploy.json
          echo "✅ Post-deploy health collected | Score: $HEALTH_SCORE | $HEALTH_BAND"

          echo "health_score=$HEALTH_SCORE"         >> $GITHUB_OUTPUT
          echo "health_band=$HEALTH_BAND"           >> $GITHUB_OUTPUT
          echo "apex_coverage=$APEX_COVERAGE"       >> $GITHUB_OUTPUT
          echo "failed_batches=$FAILED_BATCH_COUNT" >> $GITHUB_OUTPUT
          echo "test_fail=$TEST_FAIL"               >> $GITHUB_OUTPUT
          echo "critical_limits=$CRITICAL_LIMITS"   >> $GITHUB_OUTPUT
          echo "scan_time=$SCAN_TIME"               >> $GITHUB_OUTPUT


      - name: Write Post-Deploy Health Summary
        shell: bash
        env:
          ENV:     ${{ needs.Deployment_Build.outputs.environment }}
          PACKAGE: ${{ needs.Deployment_Build.outputs.deploy_package }}
          ACTOR:   ${{ needs.Deployment_Build.outputs.actor }}
          RUN_ID:  ${{ needs.Deployment_Build.outputs.run_id }}
          REPO:    ${{ needs.Deployment_Build.outputs.repo }}
        run: |
          FILE="health_post_deploy.json"
          [[ ! -f "$FILE" ]] && echo "❌ No health data" >> $GITHUB_STEP_SUMMARY && exit 0

          SCORE=$(jq -r    '.health_score              // "0"' "$FILE")
          BAND=$(jq -r     '.health_band               // "N/A"' "$FILE")
          SCAN_TIME=$(jq -r '.scan_time                // "N/A"' "$FILE")
          COV=$(jq -r      '.scores.apex_coverage      // "0"' "$FILE")
          T_PASS=$(jq -r   '.scores.test_pass          // 0' "$FILE")
          T_FAIL=$(jq -r   '.scores.test_fail          // 0' "$FILE")
          T_TOTAL=$(jq -r  '.scores.test_total         // 0' "$FILE")
          D_RATE=$(jq -r   '.scores.deploy_rate        // "0"' "$FILE")
          D_OK=$(jq -r     '.scores.deploy_success     // 0' "$FILE")
          D_TOT=$(jq -r    '.scores.deploy_total       // 0' "$FILE")
          PMD_C=$(jq -r    '.scores.pmd_critical       // 0' "$FILE")
          PMD_H=$(jq -r    '.scores.pmd_high           // 0' "$FILE")
          PMD_M=$(jq -r    '.scores.pmd_medium         // 0' "$FILE")
          APEX_EX=$(jq -r  '.scores.apex_exceptions    // 0' "$FILE")
          BATCHES=$(jq -r  '.scores.failed_batch_count // 0' "$FILE")
          CRIT_LIM=$(jq -r '.scores.critical_limits    // 0' "$FILE")
          SEC_RAW=$(jq -r  '.scores.sec_raw            // "0"' "$FILE")
          PRIV_C=$(jq -r   '.scores.priv_count         // "0"' "$FILE")
          INACT_C=$(jq -r  '.scores.inactive_count     // "0"' "$FILE")
          NOMFA_C=$(jq -r  '.scores.no_mfa_count       // "0"' "$FILE")
          GUEST_C=$(jq -r  '.scores.guest_count        // "0"' "$FILE")
          CONN_C=$(jq -r   '.scores.conn_app_count     // "0"' "$FILE")
          OWD_C=$(jq -r    '.scores.owd_public_count   // "0"' "$FILE")
          OLD_API_C=$(jq -r '.scores.old_api_count     // "0"' "$FILE")
          DS_USED_C=$(jq -r '.scores.data_storage_used // "0"' "$FILE")
          DS_MAX_C=$(jq -r  '.scores.data_storage_max  // "0"' "$FILE")
          FS_USED_C=$(jq -r '.scores.file_storage_used // "0"' "$FILE")
          FS_MAX_C=$(jq -r  '.scores.file_storage_max  // "0"' "$FILE")
          APEX=$(jq -r     '.metadata.apex_classes     // 0' "$FILE")
          TRIG=$(jq -r     '.metadata.apex_triggers    // 0' "$FILE")
          FLOWS=$(jq -r    '.metadata.active_flows     // 0' "$FILE")
          USERS=$(jq -r    '.metadata.active_users     // 0' "$FILE")
          BATCH_COUNT=$(jq '.failed_batches | length'        "$FILE")
          TEST_COUNT=$(jq  '.test_failures  | length'        "$FILE")

          SEC_RAW=$(jq -r '.scores.sec_raw       // "0"' "$FILE")
          SF_SEC_SCORE=$(jq -r '.scores.sf_sec_score   // "0"' "$FILE")
          SF_SEC_RISKS=$(jq -r '.scores.sf_sec_risks   // "0"' "$FILE")
          SF_SEC_COMPLIANT=$(jq -r '.scores.sf_sec_compliant // "0"' "$FILE")
          PWD_ISSUES=$(jq -r   '.scores.pwd_issues     // "0"' "$FILE")
          PWD_MIN_LEN=$(jq -r  '.scores.pwd_min_len    // "0"' "$FILE")
          PWD_COMPLEXITY=$(jq -r '.scores.pwd_complexity // "0"' "$FILE")
          PWD_EXPIRY=$(jq -r   '.scores.pwd_expiry     // "0"' "$FILE")
          PWD_LOCKOUT=$(jq -r  '.scores.pwd_lockout    // "0"' "$FILE")
          SESSION_ISSUES=$(jq -r '.scores.session_issues // "0"' "$FILE")
          SESSION_HTTPS=$(jq -r  '.scores.session_https  // "false"' "$FILE")
          SESSION_CLICKJACK=$(jq -r '.scores.session_clickjack // "false"' "$FILE")
          SESSION_TIMEOUT=$(jq -r  '.scores.session_timeout  // "N/A"' "$FILE")
          PRIV_C=$(jq -r  '.scores.priv_count     // "0"' "$FILE")
          INACT_C=$(jq -r '.scores.inactive_count // "0"' "$FILE")
          NOMFA_C=$(jq -r '.scores.no_mfa_count   // "0"' "$FILE")

          {
            echo "## 🏥 Post-Deployment Health Check — ${ENV}"
            echo "_Scanned at: ${SCAN_TIME} | Package: \`${PACKAGE}\` | Deployed by: ${ACTOR}_"
            echo ""
            echo "### 🏆 Salesforce Security Health Check Score: \`$SCORE / 100\` — $BAND"
            echo "> Score sourced directly from Salesforce Setup → Security → Health Check (matches org value exactly)"
            echo ""
            echo "### 🔒 Security Health Check Detail"
            echo "| Factor | Value |"
            echo "|---|---|"
            echo "| SF Health Check Score | **${SF_SEC_SCORE}/100** |"
            echo "| Non-compliant Settings | ${SF_SEC_RISKS} |"
            echo "| Compliant Settings | ${SF_SEC_COMPLIANT} |"
            echo "| Password Issues | ${PWD_ISSUES} (MinLen:${PWD_MIN_LEN} Complexity:${PWD_COMPLEXITY} Expiry:${PWD_EXPIRY}d Lockout:${PWD_LOCKOUT}) |"
            echo "| Session Issues | ${SESSION_ISSUES} (HTTPS:${SESSION_HTTPS} Clickjack:${SESSION_CLICKJACK} Timeout:${SESSION_TIMEOUT}) |"
            echo "| Profiles w/ Modify All | ${PRIV_C} |"
            echo "| Inactive Users w/ Login | ${INACT_C} |"
            echo "| Users without MFA | ${NOMFA_C} |"
            echo "| Guest Users | ${GUEST_C} |"
            echo "| Connected Apps (no IP) | ${CONN_C} |"
            echo "| OWD Public Read/Write | ${OWD_C} |"
            echo ""
            echo "### 📊 Additional Org Metrics (Informational)"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Apex Coverage | ${COV}% |"
            echo "| Test Pass Rate | ${T_PASS}/${T_TOTAL} |"
            echo "| Deployment Success Rate | ${D_RATE}% (${D_OK}/${D_TOT}) |"
            echo "| PMD Critical/High/Med | ${PMD_C}/${PMD_H}/${PMD_M} |"
            echo "| Deprecated API Classes | ${OLD_API_C} |"
            echo "| Failed Batch Jobs (24h) | ${BATCHES} |"
            echo "| Apex Exceptions (24h) | ${APEX_EX} |"
            echo "| Critical Governor Limits | ${CRIT_LIM} |"
            echo ""
            echo ""
            echo "### 💾 Storage Usage"
            echo "| Type | Used (MB) | Max (MB) | Used% |"
            echo "|---|---|---|---|"
            if [[ "${DS_MAX_C}" -gt 0 ]]; then
              DS_PCT=$(awk "BEGIN {printf \"%.1f\", (${DS_USED_C}+0)/(${DS_MAX_C}+0)*100}")
              echo "| Data Storage | ${DS_USED_C} | ${DS_MAX_C} | ${DS_PCT}% |"
            else
              echo "| Data Storage | ${DS_USED_C} | N/A | N/A |"
            fi
            if [[ "${FS_MAX_C}" -gt 0 ]]; then
              FS_PCT=$(awk "BEGIN {printf \"%.1f\", (${FS_USED_C}+0)/(${FS_MAX_C}+0)*100}")
              echo "| File Storage | ${FS_USED_C} | ${FS_MAX_C} | ${FS_PCT}% |"
            else
              echo "| File Storage | ${FS_USED_C} | N/A | N/A |"
            fi
            echo ""
            echo ""
            echo "### 📋 Health Status Bands (Salesforce Standard)"
            echo "| Band | Score Range | Status |"
            echo "|---|---|---|"
            echo "| 🟢 Excellent | 90–100 | $([ "$SCORE" -ge 90 ] && echo "**← YOU ARE HERE**" || echo "") |"
            echo "| 🟢 Good     | 75–89  | $([ "$SCORE" -ge 75 ] && [ "$SCORE" -lt 90 ] && echo "**← YOU ARE HERE**" || echo "") |"
            echo "| 🟡 Fair     | 50–74  | $([ "$SCORE" -ge 50 ] && [ "$SCORE" -lt 75 ] && echo "**← YOU ARE HERE**" || echo "") |"
            echo "| 🔴 Poor     | < 50   | $([ "$SCORE" -lt 50 ] && echo "**← YOU ARE HERE**" || echo "") |"
            echo ""
            echo "### 📦 Metadata Counts"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Active Apex Classes | $APEX |"
            echo "| Active Apex Triggers | $TRIG |"
            echo "| Active Flows | $FLOWS |"
            echo "| Active Users | $USERS |"
            echo "| Apex Exceptions (24h) | $APEX_EX |"
            echo "| Failed Batch Jobs (24h) | $BATCHES |"
            echo "| Apex Test Failures (24h) | $TEST_COUNT |"
            echo "| Critical Governor Limits | $CRIT_LIM |"
            echo ""
            echo "### 📊 Governor Limits (Top 10 most consumed)"
            echo "| Limit | Remaining | Max | Used% | Status |"
            echo "|---|---|---|---|---|"
            jq -r '
              .governor_limits
              | map(select(.max > 0))
              | sort_by(.remaining / .max)
              | .[0:10][]
              | (.max - .remaining) as $used
              | (($used / .max) * 100 | floor) as $pct
              | (.remaining / .max) as $ratio
              | if $ratio < 0.20 then "🔴" elif $ratio < 0.50 then "🟡" else "🟢" end as $badge
              | "| \(.name) | \(.remaining) | \(.max) | \($pct)% | \($badge) |"
            ' "$FILE" 2>/dev/null || echo "| N/A | — | — | — | — |"
            echo ""

            if [[ $BATCH_COUNT -gt 0 ]]; then
              echo "### ⚙️ Failed Batch Jobs (last 24h)"
              echo "| Apex Class | Errors | Total Items | Created |"
              echo "|---|---|---|---|"
              jq -r '.failed_batches[] | "| \(.ApexClass.Name // "Unknown") | \(.NumberOfErrors) | \(.TotalJobItems) | \(.CreatedDate // "") |"' "$FILE"
              echo ""
            fi

            if [[ $TEST_COUNT -gt 0 ]]; then
              echo "### 🧪 Apex Test Failures (last 24h)"
              echo "| Class | Method | Message |"
              echo "|---|---|---|"
              jq -r '.test_failures[] | "| \(.ApexClass.Name // "Unknown") | \(.MethodName) | \(.Message // "" | .[0:120]) |"' "$FILE"
              echo ""
            fi

            echo "[View full run →](https://github.com/${REPO}/actions/runs/${RUN_ID})"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Health Artifact
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-health-${{ github.run_id }}
          path: health_post_deploy.json
          retention-days: 30

      - name: Publish Health Check to Confluence
        shell: bash
        env:
          CONFLUENCE_BASE_URL:  ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_PAGE_ID:   ${{ secrets.POST_DEPLOY_HEALTH_CONFLUENCE_PAGE_ID }}
          JIRA_USER_EMAIL:      ${{ secrets.JIRA_USER_EMAIL }}
          ATLASSIAN_API_TOKEN:  ${{ secrets.ATLASSIAN_API_TOKEN }}
          ENV:     ${{ needs.Deployment_Build.outputs.environment }}
          PACKAGE: ${{ needs.Deployment_Build.outputs.deploy_package }}
          ACTOR:   ${{ needs.Deployment_Build.outputs.actor }}
          RUN_ID:  ${{ needs.Deployment_Build.outputs.run_id }}
          REPO:    ${{ needs.Deployment_Build.outputs.repo }}
        run: |
          FILE="health_post_deploy.json"
          if [[ ! -f "$FILE" ]]; then
            echo "⚠️ No health data — skipping Confluence publish"
            exit 0
          fi
          if [[ -z "$CONFLUENCE_BASE_URL" || -z "$CONFLUENCE_PAGE_ID" ]]; then
            echo "⚠️ Confluence secrets not configured — skipping"
            exit 0
          fi

          SCORE=$(jq -r    '.health_score              // "0"' "$FILE")
          BAND=$(jq -r     '.health_band               // "N/A"' "$FILE")
          SCAN_TIME=$(jq -r '.scan_time                // "N/A"' "$FILE")
          COV=$(jq -r      '.scores.apex_coverage      // "0"' "$FILE")
          T_PASS=$(jq -r   '.scores.test_pass          // 0' "$FILE")
          T_TOTAL=$(jq -r  '.scores.test_total         // 0' "$FILE")
          D_RATE=$(jq -r   '.scores.deploy_rate        // "0"' "$FILE")
          D_OK=$(jq -r     '.scores.deploy_success     // 0' "$FILE")
          D_TOT=$(jq -r    '.scores.deploy_total       // 0' "$FILE")
          PMD_C=$(jq -r    '.scores.pmd_critical       // 0' "$FILE")
          PMD_H=$(jq -r    '.scores.pmd_high           // 0' "$FILE")
          PMD_M=$(jq -r    '.scores.pmd_medium         // 0' "$FILE")
          APEX_EX=$(jq -r  '.scores.apex_exceptions    // 0' "$FILE")
          BATCHES=$(jq -r  '.scores.failed_batch_count // 0' "$FILE")
          CRIT_LIM=$(jq -r '.scores.critical_limits    // 0' "$FILE")
          SEC_RAW=$(jq -r  '.scores.sec_raw            // "0"' "$FILE")
          SF_SEC_SCORE=$(jq -r '.scores.sf_sec_score       // "0"' "$FILE")
          SF_SEC_RISKS=$(jq -r '.scores.sf_sec_risks       // "0"' "$FILE")
          SF_SEC_COMPLIANT=$(jq -r '.scores.sf_sec_compliant // "0"' "$FILE")
          PWD_ISSUES=$(jq -r   '.scores.pwd_issues         // "0"' "$FILE")
          PWD_MIN_LEN=$(jq -r  '.scores.pwd_min_len        // "0"' "$FILE")
          PWD_COMPLEXITY=$(jq -r '.scores.pwd_complexity   // "0"' "$FILE")
          PWD_EXPIRY=$(jq -r   '.scores.pwd_expiry         // "0"' "$FILE")
          PWD_LOCKOUT=$(jq -r  '.scores.pwd_lockout        // "0"' "$FILE")
          SESSION_ISSUES=$(jq -r '.scores.session_issues   // "0"' "$FILE")
          SESSION_HTTPS=$(jq -r  '.scores.session_https    // "false"' "$FILE")
          SESSION_CLICKJACK=$(jq -r '.scores.session_clickjack // "false"' "$FILE")
          SESSION_TIMEOUT=$(jq -r  '.scores.session_timeout  // "N/A"' "$FILE")
          PRIV_C=$(jq -r   '.scores.priv_count             // "0"' "$FILE")
          INACT_C=$(jq -r  '.scores.inactive_count         // "0"' "$FILE")
          NOMFA_C=$(jq -r  '.scores.no_mfa_count           // "0"' "$FILE")
          GUEST_C=$(jq -r  '.scores.guest_count            // "0"' "$FILE")
          CONN_C=$(jq -r   '.scores.conn_app_count         // "0"' "$FILE")
          OWD_C=$(jq -r    '.scores.owd_public_count       // "0"' "$FILE")
          OLD_API_C=$(jq -r '.scores.old_api_count         // "0"' "$FILE")
          DS_USED=$(jq -r  '.scores.data_storage_used      // "0"' "$FILE")
          DS_MAX=$(jq -r   '.scores.data_storage_max       // "0"' "$FILE")
          FS_USED=$(jq -r  '.scores.file_storage_used      // "0"' "$FILE")
          FS_MAX=$(jq -r   '.scores.file_storage_max       // "0"' "$FILE")
          APEX=$(jq -r     '.metadata.apex_classes         // 0' "$FILE")
          TRIG=$(jq -r     '.metadata.apex_triggers        // 0' "$FILE")
          FLOWS=$(jq -r    '.metadata.active_flows         // 0' "$FILE")
          USERS=$(jq -r    '.metadata.active_users         // 0' "$FILE")
          BATCH_COUNT=$(jq '.failed_batches | length'           "$FILE")
          TEST_COUNT=$(jq  '.test_failures  | length'           "$FILE")
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          NEW_ENTRY="<h2>🏥 Post-Deploy Health — ${ENV} | ${SCAN_TIME}</h2>"
          NEW_ENTRY+="<table><tr><th>Field</th><th>Value</th></tr>"
          NEW_ENTRY+="<tr><td><strong>Environment</strong></td><td>${ENV}</td></tr>"
          NEW_ENTRY+="<tr><td><strong>Package</strong></td><td>${PACKAGE}</td></tr>"
          NEW_ENTRY+="<tr><td><strong>Deployed by</strong></td><td>${ACTOR}</td></tr>"
          NEW_ENTRY+="<tr><td><strong>Scanned at</strong></td><td>${SCAN_TIME}</td></tr>"
          NEW_ENTRY+="<tr><td><strong>SF Health Check Score</strong></td><td><strong>${SCORE}/100</strong> — ${BAND}</td></tr>"
          NEW_ENTRY+="<tr><td><strong>Workflow Run</strong></td><td><a href='${RUN_URL}'>${RUN_ID}</a></td></tr>"
          NEW_ENTRY+="</table>"
          NEW_ENTRY+="<h3>🔒 Security Health Check Detail</h3>"
          NEW_ENTRY+="<table><tr><th>Factor</th><th>Value</th></tr>"
          NEW_ENTRY+="<tr><td>SF Health Check Score</td><td><strong>${SF_SEC_SCORE}/100</strong></td></tr>"
          NEW_ENTRY+="<tr><td>Non-compliant Settings</td><td>${SF_SEC_RISKS}</td></tr>"
          NEW_ENTRY+="<tr><td>Compliant Settings</td><td>${SF_SEC_COMPLIANT}</td></tr>"
          NEW_ENTRY+="<tr><td>Password Issues</td><td>${PWD_ISSUES} (MinLen:${PWD_MIN_LEN} Complexity:${PWD_COMPLEXITY} Expiry:${PWD_EXPIRY}d Lockout:${PWD_LOCKOUT})</td></tr>"
          NEW_ENTRY+="<tr><td>Session Issues</td><td>${SESSION_ISSUES} (HTTPS:${SESSION_HTTPS} Clickjack:${SESSION_CLICKJACK} Timeout:${SESSION_TIMEOUT})</td></tr>"
          NEW_ENTRY+="<tr><td>Profiles w/ Modify All</td><td>${PRIV_C}</td></tr>"
          NEW_ENTRY+="<tr><td>Inactive Users w/ Login</td><td>${INACT_C}</td></tr>"
          NEW_ENTRY+="<tr><td>Users without MFA</td><td>${NOMFA_C}</td></tr>"
          NEW_ENTRY+="<tr><td>Guest Users</td><td>${GUEST_C}</td></tr>"
          NEW_ENTRY+="<tr><td>Connected Apps (no IP)</td><td>${CONN_C}</td></tr>"
          NEW_ENTRY+="<tr><td>OWD Public Read/Write</td><td>${OWD_C}</td></tr>"
          NEW_ENTRY+="</table>"
          NEW_ENTRY+="<h3>📊 Additional Org Metrics (Informational)</h3>"
          NEW_ENTRY+="<table><tr><th>Metric</th><th>Value</th></tr>"
          NEW_ENTRY+="<tr><td>Apex Coverage</td><td>${COV}%</td></tr>"
          NEW_ENTRY+="<tr><td>Test Pass Rate</td><td>${T_PASS}/${T_TOTAL}</td></tr>"
          NEW_ENTRY+="<tr><td>Deployment Success Rate</td><td>${D_RATE}% (${D_OK}/${D_TOT})</td></tr>"
          NEW_ENTRY+="<tr><td>PMD Critical/High/Med</td><td>${PMD_C}/${PMD_H}/${PMD_M}</td></tr>"
          NEW_ENTRY+="<tr><td>Deprecated API Classes</td><td>${OLD_API_C}</td></tr>"
          NEW_ENTRY+="<tr><td>Failed Batch Jobs (24h)</td><td>${BATCHES}</td></tr>"
          NEW_ENTRY+="<tr><td>Apex Exceptions (24h)</td><td>${APEX_EX}</td></tr>"
          NEW_ENTRY+="<tr><td>Critical Governor Limits</td><td>${CRIT_LIM}</td></tr>"
          NEW_ENTRY+="</table>"
          NEW_ENTRY+="<h3>📦 Metadata &amp; Storage</h3>"
          NEW_ENTRY+="<table><tr><th>Metric</th><th>Value</th></tr>"
          NEW_ENTRY+="<tr><td>Active Apex Classes</td><td>${APEX}</td></tr>"
          NEW_ENTRY+="<tr><td>Active Apex Triggers</td><td>${TRIG}</td></tr>"
          NEW_ENTRY+="<tr><td>Active Flows</td><td>${FLOWS}</td></tr>"
          NEW_ENTRY+="<tr><td>Active Users</td><td>${USERS}</td></tr>"
          NEW_ENTRY+="<tr><td>Apex Exceptions (24h)</td><td>${APEX_EX}</td></tr>"
          NEW_ENTRY+="<tr><td>Failed Batch Jobs (24h)</td><td>${BATCHES}</td></tr>"
          NEW_ENTRY+="<tr><td>Critical Governor Limits</td><td>${CRIT_LIM}</td></tr>"
          NEW_ENTRY+="<tr><td>Data Storage</td><td>${DS_USED}/${DS_MAX} MB</td></tr>"
          NEW_ENTRY+="<tr><td>File Storage</td><td>${FS_USED}/${FS_MAX} MB</td></tr>"
          NEW_ENTRY+="</table>"

          if [[ $BATCH_COUNT -gt 0 ]]; then
            NEW_ENTRY+="<h3>⚙️ Failed Batch Jobs (last 24h)</h3>"
            NEW_ENTRY+="<table><tr><th>Apex Class</th><th>Errors</th><th>Total Items</th><th>Created</th></tr>"
            NEW_ENTRY+=$(jq -r '.failed_batches[] | "<tr><td>\(.ApexClass.Name // "Unknown")</td><td>\(.NumberOfErrors)</td><td>\(.TotalJobItems)</td><td>\(.CreatedDate // "")</td></tr>"' "$FILE")
            NEW_ENTRY+="</table>"
          fi

          if [[ $TEST_COUNT -gt 0 ]]; then
            NEW_ENTRY+="<h3>🧪 Apex Test Failures (last 24h)</h3>"
            NEW_ENTRY+="<table><tr><th>Class</th><th>Method</th><th>Message</th></tr>"
            NEW_ENTRY+=$(jq -r '.test_failures[] | "<tr><td>\(.ApexClass.Name // "Unknown")</td><td>\(.MethodName)</td><td>\(.Message // "" | .[0:200])</td></tr>"' "$FILE")
            NEW_ENTRY+="</table>"
          fi
          NEW_ENTRY+="<hr/>"

          PAGE_RESPONSE=$(curl -s \
            -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${CONFLUENCE_PAGE_ID}?expand=body.storage,version")

          CURRENT_VERSION=$(echo "$PAGE_RESPONSE" | jq -r '.version.number')
          CURRENT_BODY=$(echo "$PAGE_RESPONSE" | jq -r '.body.storage.value')
          PAGE_TITLE=$(echo "$PAGE_RESPONSE" | jq -r '.title')

          if [[ -z "$CURRENT_VERSION" || "$CURRENT_VERSION" == "null" ]]; then
            echo "❌ Failed to fetch Confluence page (HTTP response below)"
            echo "$PAGE_RESPONSE"
            exit 1
          fi

          NEW_VERSION=$((CURRENT_VERSION + 1))
          echo "📝 Updating: $PAGE_TITLE (v$CURRENT_VERSION → v$NEW_VERSION)"

          UPDATE_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X PUT \
            -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --argjson version "{\"number\": ${NEW_VERSION}}" \
              --arg title "${PAGE_TITLE}" \
              --arg value "${NEW_ENTRY}${CURRENT_BODY}" \
              '{version: $version, title: $title, type: "page", body: {storage: {value: $value, representation: "storage"}}}')" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${CONFLUENCE_PAGE_ID}")

          UPDATE_CODE=$(echo "$UPDATE_RESPONSE" | tail -1)
          if [[ "$UPDATE_CODE" == "200" ]]; then
            echo "✅ Confluence page updated: ${CONFLUENCE_BASE_URL}/pages/viewpage.action?pageId=${CONFLUENCE_PAGE_ID}"
          else
            echo "❌ Confluence update failed (HTTP $UPDATE_CODE)"
            echo "$UPDATE_RESPONSE" | sed '$d'
            exit 1
          fi

      - name: Send Health Check Email
