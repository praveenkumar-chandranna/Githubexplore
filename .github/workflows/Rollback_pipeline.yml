name: Lodha Rollback Pipeline

on:
  workflow_dispatch:
    inputs:
      commit_id:
        type: string
        description: >
          Commit SHA to rollback to. Branch will be force-reset to this commit.
          Example: a3f9c12  or full 40-char SHA
        required: true
      package_path:
        type: string
        description: >
          (Optional) Relative path to package.xml. Leave blank to auto-detect from commit.
          Example: manifest/feature/LODHA-123_package.xml
        required: false
      environment:
        type: choice
        description: Target environment to rollback
        options:
          - DEV
          - QA
          - UAT
          - PRODUCTION
          - HOTFIX
        default: DEV
        required: true
      testlevel:
        type: choice
        description: Test class run level
        options:
          - RunLocalTests
          - RunSpecifiedTests
          - RunAllTestsInOrg
          - NoTestRun
        default: RunSpecifiedTests
        required: true
jobs:
  Rollback_Build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SF_LOGIN_URL_TEST: ${{ secrets.SANDBOX_URL }}
      SF_LOGIN_URL_PROD: ${{ secrets.LOGIN_URL }}

    if: >
      (github.event_name == 'workflow_dispatch' &&
       (
         (github.ref == 'refs/heads/DEV'  && github.event.inputs.environment == 'DEV') ||
         (github.ref == 'refs/heads/QA'   && github.event.inputs.environment == 'QA') ||
         (github.ref == 'refs/heads/UAT'  && github.event.inputs.environment == 'UAT') ||
         (github.ref == 'refs/heads/main' && github.event.inputs.environment == 'PRODUCTION') ||
         (github.ref == 'refs/heads/main' && github.event.inputs.environment == 'HOTFIX')
       ))

    outputs:
      environment:   ${{ github.event.inputs.environment }}
      package_path:  ${{ steps.resolve-pkg.outputs.resolved_pkg }}
      ref_name:      ${{ github.ref_name }}
      actor:         ${{ github.actor }}
      run_id:        ${{ github.run_id }}
      repo:          ${{ github.repository }}
      original_head: ${{ steps.git-reset.outputs.original_head }}
      resolved_commit: ${{ steps.git-reset.outputs.resolved_commit }}
      jira_tickets:  ${{ steps.git-reset.outputs.jira_tickets }}
      notify_emails: ${{ secrets.NOTIFY_EMAILS }}

    steps:

      # ── Step 1: Checkout full branch history ─────────────────────────────────
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # ── Step 2: Validate commit exists, reset branch to it ───────────────────
      - name: Reset branch to commit ${{ github.event.inputs.commit_id }}
        id: git-reset
        shell: bash
        env:
          COMMIT_ID:    ${{ github.event.inputs.commit_id }}
          REF_NAME:     ${{ github.ref_name }}
          ACTOR:        ${{ github.actor }}
          GIT_USER_NAME:  ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GH_PAT:       ${{ secrets.GH_PAT }}
          REPO:         ${{ github.repository }}
        run: |
          if [[ -z "$GH_PAT" ]]; then
            echo "❌ GH_PAT secret is not set — required for force push"
            exit 1
          fi

          if ! git cat-file -e "${COMMIT_ID}^{commit}" 2>/dev/null; then
            echo "❌ Commit '$COMMIT_ID' not found in this repository"
            exit 1
          fi

          COMMIT_MSG=$(git log -1 --pretty=format:"%s" "$COMMIT_ID")
          COMMIT_DATE=$(git log -1 --pretty=format:"%ci" "$COMMIT_ID")
          CURRENT_HEAD=$(git rev-parse HEAD)

          echo "=========================================="
          echo "GIT RESET SUMMARY"
          echo "=========================================="
          echo "  Branch       : $REF_NAME"
          echo "  Current HEAD : $CURRENT_HEAD"
          echo "  Reset to     : $COMMIT_ID"
          echo "  Commit Msg   : $COMMIT_MSG"
          echo "  Commit Date  : $COMMIT_DATE"
          echo "  Triggered by : $ACTOR"
          echo "=========================================="

          echo "Commits that will be removed from branch:"
          git log --oneline "${COMMIT_ID}..HEAD"
          echo ""

          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${REPO}.git"

          ORIGINAL_HEAD=$(git rev-parse HEAD)
          git reset --hard "$COMMIT_ID"
          git push origin "$REF_NAME" --force

          echo "✅ Branch '$REF_NAME' force-reset to commit $COMMIT_ID"
          echo "resolved_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "original_head=${ORIGINAL_HEAD}" >> $GITHUB_OUTPUT

          # ── Extract Jira ticket numbers from removed commits ───────────────
          JIRA_TICKETS=$(git log --pretty=format:"%s" "${COMMIT_ID}..${ORIGINAL_HEAD}" 2>/dev/null \
            | grep -oE '[A-Z]+-[0-9]+' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "jira_tickets=${JIRA_TICKETS}" >> $GITHUB_OUTPUT
          echo "🎫 Jira tickets in rolled-back commits: ${JIRA_TICKETS:-none}"

      # ── Step 3: Resolve package.xml at the reset commit ──────────────────────
      - name: Resolve package.xml
        if: github.event.inputs.package_path != ''
        id: resolve-pkg
        shell: bash
        env:
          INPUT_PKG:   ${{ github.event.inputs.package_path }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          WORKSPACE:   ${{ github.workspace }}
        run: |
          # ── Case 1: package_path explicitly provided ─────────────────────
          if [[ -n "$INPUT_PKG" ]]; then
            MANIFEST="${WORKSPACE}/${INPUT_PKG}"
            if [[ ! -f "$MANIFEST" ]]; then
              echo "❌ Provided package.xml not found: $MANIFEST"
              echo "💡 Available packages at this commit:"
              find "${WORKSPACE}/manifest" -name "*.xml" | sed "s|${WORKSPACE}/||"
              exit 1
            fi
            echo "✅ Using provided package: $INPUT_PKG"
            echo "resolved_pkg=${INPUT_PKG}" >> $GITHUB_OUTPUT

          # ── Case 2: auto-detect ──────────────────────────────────────────
          else
            echo "🔍 Auto-detecting package.xml..."
            ALL_PKGS=$(find "${WORKSPACE}/manifest" -name "*.xml" | sort)

            if [[ -z "$ALL_PKGS" ]]; then
              echo "❌ No package.xml files found in manifest/"
              exit 1
            fi

            echo "📦 All packages at this commit:"
            echo "$ALL_PKGS" | sed "s|${WORKSPACE}/||"
            echo ""

            ENV_PKG=$(echo "$ALL_PKGS" | grep -i "manifest/feature/.*${ENVIRONMENT}" | tail -1 || true)
            [[ -z "$ENV_PKG" ]] && ENV_PKG=$(echo "$ALL_PKGS" | grep -i "manifest/Release.*${ENVIRONMENT}" | tail -1 || true)
            [[ -z "$ENV_PKG" ]] && ENV_PKG=$(echo "$ALL_PKGS" | grep -i "manifest/Release" | tail -1 || true)
            [[ -z "$ENV_PKG" ]] && ENV_PKG="${WORKSPACE}/manifest/package.xml"

            if [[ ! -f "$ENV_PKG" ]]; then
              echo "❌ Could not resolve a valid package.xml"
              exit 1
            fi

            RELATIVE_PKG=$(echo "$ENV_PKG" | sed "s|${WORKSPACE}/||")
            echo "✅ Auto-resolved package: $RELATIVE_PKG"
            echo "resolved_pkg=${RELATIVE_PKG}" >> $GITHUB_OUTPUT
          fi

          RESOLVED_PKG=$(grep 'resolved_pkg=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          echo ""
          echo "=========================================="
          echo "📦 ROLLBACK PACKAGE.XML"
          echo "=========================================="
          cat "${WORKSPACE}/${RESOLVED_PKG}"
          echo "=========================================="

          # ── Auto-resolve TestClass.txt from package path ──────────────────
          TEST_FILE=$(echo "${WORKSPACE}/${RESOLVED_PKG}" | sed 's/_package\.xml$/_TestClass.txt/')
          if [[ -f "$TEST_FILE" ]]; then
            TEST_CLASSES=$(cat "$TEST_FILE" | tr '\n' ' ' | xargs)
            echo "✅ TestClass.txt found: $TEST_FILE"
            echo "✅ Test classes: $TEST_CLASSES"
            echo "resolved_tests=${TEST_CLASSES}" >> $GITHUB_OUTPUT
          else
            echo "⚠️  No TestClass.txt found for this package"
            echo "resolved_tests=" >> $GITHUB_OUTPUT
          fi

      # ── Step 4: Tooling setup (only if package_path provided) ─────────────────
      - name: Setup Node.js
        if: github.event.inputs.package_path != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Salesforce CLI
        if: github.event.inputs.package_path != ''
        run: |
          npm install -g @salesforce/cli@latest
          sf --version

      # ── Step 5: JWT Auth (only if package_path provided) ─────────────────────
      - name: Generate JWT private key file
        if: github.event.inputs.package_path != ''
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
          chmod 600 server.key

      - name: Set org credentials
        if: github.event.inputs.package_path != ''
        id: set-org
        shell: bash
        env:
          ENVIRONMENT:           ${{ github.event.inputs.environment }}
          SF_LOGIN_URL_TEST_VAL: ${{ env.SF_LOGIN_URL_TEST }}
          SF_LOGIN_URL_PROD_VAL: ${{ env.SF_LOGIN_URL_PROD }}
          KEY_DEV:    ${{ secrets.SALESFORCE_CONSUMER_KEY_DEV }}
          KEY_QA:     ${{ secrets.SALESFORCE_CONSUMER_KEY_QA }}
          KEY_UAT:    ${{ secrets.SALESFORCE_CONSUMER_KEY_UAT }}
          KEY_PROD:   ${{ secrets.SALESFORCE_CONSUMER_KEY_PROD }}
          KEY_HOTFIX: ${{ secrets.SALESFORCE_CONSUMER_KEY_HOTFIX }}
          USER_DEV:    ${{ secrets.SFDX_AUTH_DEV_USERNAME }}
          USER_QA:     ${{ secrets.SFDX_AUTH_QA_USERNAME }}
          USER_UAT:    ${{ secrets.SFDX_AUTH_UAT_USERNAME }}
          USER_PROD:   ${{ secrets.SFDX_AUTH_PROD_USERNAME }}
          USER_HOTFIX: ${{ secrets.SFDX_AUTH_HOTFIX_USERNAME }}
        run: |
          case "$ENVIRONMENT" in
            DEV)        echo "CLIENT_ID=$KEY_DEV"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_DEV"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            QA)         echo "CLIENT_ID=$KEY_QA"     >> $GITHUB_OUTPUT; echo "USERNAME=$USER_QA"     >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            UAT)        echo "CLIENT_ID=$KEY_UAT"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_UAT"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            PRODUCTION) echo "CLIENT_ID=$KEY_PROD"   >> $GITHUB_OUTPUT; echo "USERNAME=$USER_PROD"   >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_PROD_VAL" >> $GITHUB_OUTPUT ;;
            HOTFIX)     echo "CLIENT_ID=$KEY_HOTFIX" >> $GITHUB_OUTPUT; echo "USERNAME=$USER_HOTFIX" >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            *) echo "❌ Unsupported environment: $ENVIRONMENT"; exit 1 ;;
          esac

      - name: Clear Prior Salesforce Sessions
        if: github.event.inputs.package_path != ''
        run: sf org logout --all --no-prompt || true

      - name: Authenticate to ${{ github.event.inputs.environment }} Org
        if: github.event.inputs.package_path != ''
        env:
          CLIENT_ID: ${{ steps.set-org.outputs.CLIENT_ID }}
          USERNAME:  ${{ steps.set-org.outputs.USERNAME }}
          LOGIN_URL: ${{ steps.set-org.outputs.LOGIN_URL }}
        run: |
          sf org login jwt \
            --client-id    "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username     "$USERNAME" \
            --instance-url "$LOGIN_URL" \
            --set-default

      # ── Step 6: Validate rollback deployment (only if package_path provided) ──
      - name: Validate Rollback Deployment
        if: github.event.inputs.package_path != ''
        shell: bash
        env:
          WORKSPACE:    ${{ github.workspace }}
          PACKAGE_PATH: ${{ steps.resolve-pkg.outputs.resolved_pkg }}
          TEST_LEVEL:   ${{ github.event.inputs.testlevel }}
          TEST_CLASSES: ${{ steps.resolve-pkg.outputs.resolved_tests }}
          ORG_USERNAME: ${{ steps.set-org.outputs.USERNAME }}
        run: |
          MANIFEST="${WORKSPACE}/${PACKAGE_PATH}"
          echo "🔍 Validating rollback: $MANIFEST"
          CMD=(sf project deploy validate \
            --manifest     "$MANIFEST" \
            --target-org   "$ORG_USERNAME" \
            --test-level   "$TEST_LEVEL" \
            --wait 30 \
            --ignore-warnings \
            --verbose)
          [[ "$TEST_LEVEL" == "RunSpecifiedTests" && -n "$TEST_CLASSES" ]] && CMD+=(--tests $TEST_CLASSES)
          "${CMD[@]}"

      # ── Step 7: Deploy rollback (only if package_path provided) ──────────────
      - name: Deploy Rollback to ${{ github.event.inputs.environment }}
        if: github.event.inputs.package_path != ''
        shell: bash
        env:
          WORKSPACE:    ${{ github.workspace }}
          PACKAGE_PATH: ${{ steps.resolve-pkg.outputs.resolved_pkg }}
          TEST_LEVEL:   ${{ github.event.inputs.testlevel }}
          TEST_CLASSES: ${{ steps.resolve-pkg.outputs.resolved_tests }}
          ORG_USERNAME: ${{ steps.set-org.outputs.USERNAME }}
        run: |
          MANIFEST="${WORKSPACE}/${PACKAGE_PATH}"
          echo "🔄 Deploying rollback: $MANIFEST"
          CMD=(sf project deploy start \
            --manifest          "$MANIFEST" \
            --target-org        "$ORG_USERNAME" \
            --test-level        "$TEST_LEVEL" \
            --wait 30 \
            --ignore-conflicts \
            --coverage-formatters json \
            --results-dir coverage-results)
          [[ "$TEST_LEVEL" == "RunSpecifiedTests" && -n "$TEST_CLASSES" ]] && CMD+=(--tests $TEST_CLASSES)
          "${CMD[@]}"

      - name: Cleanup JWT key
        if: always()
        run: rm -f server.key

      # ── Step 8: Rollback Summary ──────────────────────────────────────────────
      - name: Rollback Summary
        if: always()
        shell: bash
        env:
          ENVIRONMENT:  ${{ github.event.inputs.environment }}
          PACKAGE_PATH: ${{ steps.resolve-pkg.outputs.resolved_pkg }}
          ACTOR:        ${{ github.actor }}
          RUN_ID:       ${{ github.run_id }}
          REPO:         ${{ github.repository }}
          REF_NAME:     ${{ github.ref_name }}
          PREV_HEAD:    ${{ steps.git-reset.outputs.original_head }}
        run: |
          ROLLBACK_STATUS="✅ SUCCESSFUL"
          [[ "${{ job.status }}" != "success" ]] && ROLLBACK_STATUS="❌ FAILED"

          RESET_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          RESET_MSG=$(git log -1 --pretty=format:"%s" 2>/dev/null || echo "")
          RESET_DATE=$(git log -1 --pretty=format:"%ci" 2>/dev/null || echo "")
          RESET_AUTHOR=$(git log -1 --pretty=format:"%an" 2>/dev/null || echo "")

          echo ""
          echo "=========================================="
          echo "ROLLBACK ${ROLLBACK_STATUS}"
          echo "=========================================="
          echo "  Environment   : $ENVIRONMENT"
          echo "  Branch        : $REF_NAME"
          echo "  Triggered by  : $ACTOR"
          echo "  Run URL       : https://github.com/${REPO}/actions/runs/${RUN_ID}"
          echo ""
          echo "── Branch State ──────────────────────────"
          echo "  Reset to commit : $RESET_COMMIT"
          echo "  Commit message  : $RESET_MSG"
          echo "  Committed on    : $RESET_DATE"
          echo "  Committed by    : $RESET_AUTHOR"
          echo ""
          echo "── Commits Removed from Branch ───────────"
          REMOVED=$(git log --oneline "${RESET_COMMIT}..${PREV_HEAD}" 2>/dev/null || true)
          if [[ -n "$REMOVED" ]]; then
            COUNT=$(echo "$REMOVED" | wc -l | xargs)
            echo "  Total removed : $COUNT commit(s)"
            echo ""
            while IFS= read -r LINE; do
              SHA=$(echo "$LINE" | cut -d' ' -f1)
              MSG=$(echo "$LINE" | cut -d' ' -f2-)
              echo "  - [$SHA] $MSG"
            done <<< "$REMOVED"
          else
            echo "  None (already at target commit)"
          fi
          echo ""
          echo "── Salesforce Deployment ─────────────────"
          echo "  Package       : ${PACKAGE_PATH:-N/A (commit-only rollback)}"
          echo "  Status        : $ROLLBACK_STATUS"
          echo "=========================================="

          # ── GitHub Actions Step Summary ────────────────────────────────────
          {
            echo "## 🔄 Rollback Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **Status** | ${ROLLBACK_STATUS} |"
            echo "| **Environment** | \`${ENVIRONMENT}\` |"
            echo "| **Branch** | \`${REF_NAME}\` |"
            echo "| **Reset to commit** | \`${RESET_COMMIT}\` |"
            echo "| **Commit message** | ${RESET_MSG} |"
            echo "| **Committed on** | ${RESET_DATE} |"
            echo "| **Committed by** | ${RESET_AUTHOR} |"
            echo "| **Previous HEAD** | \`${PREV_HEAD}\` |"
            echo "| **Package** | ${PACKAGE_PATH:-N/A (commit-only rollback)} |"
            echo "| **Triggered by** | ${ACTOR} |"
            echo "| **Workflow Run** | [${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID}) |"
            echo ""
            JIRA_TICKETS="${{ steps.git-reset.outputs.jira_tickets }}"
            if [[ -n "$JIRA_TICKETS" ]]; then
              echo "### 🎫 Jira Tickets in Rolled-back Commits"
              echo ""
              IFS=',' read -ra TICKETS <<< "$JIRA_TICKETS"
              for T in "${TICKETS[@]}"; do echo "- \`${T}\`"; done
              echo ""
            fi
            if [[ -n "$REMOVED" ]]; then
              echo "### 🗑️ Commits Removed from Branch"
              echo ""
              while IFS= read -r LINE; do
                SHA=$(echo "$LINE" | cut -d' ' -f1)
                MSG=$(echo "$LINE" | cut -d' ' -f2-)
                echo "- \`${SHA}\` ${MSG}"
              done <<< "$REMOVED"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


  Publish_To_Confluence:
    runs-on: ubuntu-latest
    needs: Rollback_Build
    if: needs.Rollback_Build.result == 'success' || needs.Rollback_Build.result == 'failure'
    env:
      JIRA_USER_EMAIL:     ${{ secrets.JIRA_USER_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_PAGE_ID:  ${{ secrets.CONFLUENCE_PAGE_ID }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.Rollback_Build.outputs.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Publish Rollback Result to Confluence
        shell: bash
        env:
          ENVIRONMENT:     ${{ needs.Rollback_Build.outputs.environment }}
          PACKAGE_PATH:    ${{ needs.Rollback_Build.outputs.package_path }}
          REF_NAME:        ${{ needs.Rollback_Build.outputs.ref_name }}
          ACTOR:           ${{ needs.Rollback_Build.outputs.actor }}
          RUN_ID:          ${{ needs.Rollback_Build.outputs.run_id }}
          REPO:            ${{ needs.Rollback_Build.outputs.repo }}
          PREV_HEAD:       ${{ needs.Rollback_Build.outputs.original_head }}
          RESET_COMMIT:    ${{ needs.Rollback_Build.outputs.resolved_commit }}
          ROLLBACK_RESULT: ${{ needs.Rollback_Build.result }}
        run: |
          ROLLBACK_STATUS="✅ SUCCESSFUL"
          STATUS_COLOR="green"
          [[ "$ROLLBACK_RESULT" != "success" ]] && ROLLBACK_STATUS="❌ FAILED" && STATUS_COLOR="red"

          ROLLBACK_DATE=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          RESET_MSG=$(git log -1 --pretty=format:"%s" "$RESET_COMMIT" 2>/dev/null || echo "")
          RESET_DATE=$(git log -1 --pretty=format:"%ci" "$RESET_COMMIT" 2>/dev/null || echo "")
          RESET_AUTHOR=$(git log -1 --pretty=format:"%an" "$RESET_COMMIT" 2>/dev/null || echo "")

          REMOVED_HTML="<em>None (already at target commit)</em>"
          REMOVED=$(git log --oneline "${RESET_COMMIT}..${PREV_HEAD}" 2>/dev/null || true)
          if [[ -n "$REMOVED" ]]; then
            COUNT=$(echo "$REMOVED" | wc -l | xargs)
            REMOVED_HTML="<ul>"
            while IFS= read -r LINE; do
              SHA=$(echo "$LINE" | cut -d' ' -f1)
              MSG=$(echo "$LINE" | cut -d' ' -f2-)
              REMOVED_HTML+="<li><code>${SHA}</code> ${MSG}</li>"
            done <<< "$REMOVED"
            REMOVED_HTML+="</ul><p><em>Total: ${COUNT} commit(s) removed</em></p>"
          fi

          DEPLOY_ROW=""
          [[ -n "$PACKAGE_PATH" ]] && DEPLOY_ROW="<tr><td><strong>Package Deployed</strong></td><td><code>${PACKAGE_PATH}</code></td></tr>"

          RELEASE_HTML="<h2>🔄 Rollback — ${ENVIRONMENT} | ${ROLLBACK_DATE}</h2>"
          RELEASE_HTML+="<table><tr><th>Field</th><th>Details</th></tr>"
          RELEASE_HTML+="<tr><td><strong>Status</strong></td><td><span style='color:${STATUS_COLOR}'><strong>${ROLLBACK_STATUS}</strong></span></td></tr>"
          RELEASE_HTML+="<tr><td><strong>Environment</strong></td><td>${ENVIRONMENT}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Branch</strong></td><td>${REF_NAME}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Rolled back to commit</strong></td><td><code>${RESET_COMMIT}</code></td></tr>"
          RELEASE_HTML+="<tr><td><strong>Commit message</strong></td><td>${RESET_MSG}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Committed on</strong></td><td>${RESET_DATE}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Committed by</strong></td><td>${RESET_AUTHOR}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Previous HEAD</strong></td><td><code>${PREV_HEAD}</code></td></tr>"
          RELEASE_HTML+="${DEPLOY_ROW}"
          RELEASE_HTML+="<tr><td><strong>Triggered by</strong></td><td>${ACTOR}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Rollback date</strong></td><td>${ROLLBACK_DATE}</td></tr>"
          RELEASE_HTML+="<tr><td><strong>Workflow Run</strong></td><td><a href='${RUN_URL}'>${RUN_ID}</a></td></tr>"
          RELEASE_HTML+="</table>"
          RELEASE_HTML+="<h3>🗑️ Commits Removed from Branch</h3>${REMOVED_HTML}<hr/>"

          PAGE_RESPONSE=$(curl -s \
            -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${CONFLUENCE_PAGE_ID}?expand=body.storage,version")

          CURRENT_VERSION=$(echo "$PAGE_RESPONSE" | jq -r '.version.number')
          CURRENT_BODY=$(echo "$PAGE_RESPONSE" | jq -r '.body.storage.value')
          PAGE_TITLE=$(echo "$PAGE_RESPONSE" | jq -r '.title')

          if [[ -z "$CURRENT_VERSION" || "$CURRENT_VERSION" == "null" ]]; then
            echo "❌ Failed to fetch Confluence page"
            echo "$PAGE_RESPONSE"
            exit 1
          fi

          NEW_VERSION=$((CURRENT_VERSION + 1))
          NEW_BODY_ESCAPED=$(echo "${RELEASE_HTML}${CURRENT_BODY}" | jq -Rs .)

          UPDATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            -u "${JIRA_USER_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --argjson version "{\"number\": ${NEW_VERSION}}" \
              --arg title "$PAGE_TITLE" \
              --argjson body "{\"storage\": {\"value\": ${NEW_BODY_ESCAPED}, \"representation\": \"storage\"}}" \
              '{version: $version, title: $title, type: "page", body: $body}')" \
            "${CONFLUENCE_BASE_URL}/rest/api/content/${CONFLUENCE_PAGE_ID}")

          UPDATE_CODE=$(echo "$UPDATE_RESPONSE" | tail -1)
          if [[ "$UPDATE_CODE" == "200" ]]; then
            echo "✅ Confluence page updated successfully!"
            echo "🔗 ${CONFLUENCE_BASE_URL}/pages/viewpage.action?pageId=${CONFLUENCE_PAGE_ID}"
          else
            echo "⚠️ Confluence update failed (HTTP $UPDATE_CODE)"
            echo "$UPDATE_RESPONSE" | sed '$d'
            exit 1
          fi

  Send_Email_Notification:
    runs-on: ubuntu-latest
    needs: Rollback_Build
    if: needs.Rollback_Build.result == 'success' || needs.Rollback_Build.result == 'failure'
    steps:
      - name: Send Rollback Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port:    ${{ secrets.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          subject: "[${{ needs.Rollback_Build.outputs.environment }}] Rollback ${{ needs.Rollback_Build.result == 'success' && 'Successful ✅' || 'Failed ❌' }} — ${{ github.ref_name }}"
          to:             ${{ secrets.NOTIFY_EMAILS }}
          from:           "Do not Reply <${{ secrets.GMAIL_USERNAME }}>"
          html_body: |
            <h2>🔄 Rollback Notification — ${{ needs.Rollback_Build.outputs.environment }}</h2>
            <table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-family:Arial,sans-serif;">
              <tr><th>Field</th><th>Details</th></tr>
              <tr><td><strong>Status</strong></td><td>${{ needs.Rollback_Build.result == 'success' && '✅ SUCCESSFUL' || '❌ FAILED' }}</td></tr>
              <tr><td><strong>Environment</strong></td><td>${{ needs.Rollback_Build.outputs.environment }}</td></tr>
              <tr><td><strong>Branch</strong></td><td>${{ needs.Rollback_Build.outputs.ref_name }}</td></tr>
              <tr><td><strong>Rolled back to commit</strong></td><td><code>${{ needs.Rollback_Build.outputs.resolved_commit }}</code></td></tr>
              <tr><td><strong>Previous HEAD</strong></td><td><code>${{ needs.Rollback_Build.outputs.original_head }}</code></td></tr>
              <tr><td><strong>Package</strong></td><td>${{ needs.Rollback_Build.outputs.package_path || 'N/A (commit-only rollback)' }}</td></tr>
              <tr><td><strong>Jira Tickets</strong></td><td>${{ needs.Rollback_Build.outputs.jira_tickets || 'N/A' }}</td></tr>
              <tr><td><strong>Triggered by</strong></td><td>${{ needs.Rollback_Build.outputs.actor }}</td></tr>
              <tr><td><strong>Workflow Run</strong></td><td><a href="https://github.com/${{ needs.Rollback_Build.outputs.repo }}/actions/runs/${{ needs.Rollback_Build.outputs.run_id }}">View Run</a></td></tr>
            </table>
            <br/>
            <p style="font-size:12px;color:#888;font-family:Arial,sans-serif;">
              ⚠️ This is an automated notification sent by GitHub Actions. Please do not reply to this email.
            </p>
