name: Dependency Auto-Fix (Dependabot Alternative)

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 6AM UTC
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: SCAN — npm audit + SF CLI plugins + SF packages + PMD
  # ─────────────────────────────────────────────────────────────
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      npm_total:        ${{ steps.npm.outputs.total }}
      npm_critical:     ${{ steps.npm.outputs.critical }}
      npm_high:         ${{ steps.npm.outputs.high }}
      npm_moderate:     ${{ steps.npm.outputs.moderate }}
      npm_low:          ${{ steps.npm.outputs.low }}
      npm_fixable:      ${{ steps.npm.outputs.fixable }}
      npm_has_vulns:    ${{ steps.npm.outputs.has_vulns }}
      sf_outdated:      ${{ steps.sf_plugins.outputs.outdated }}
      sf_has_outdated:  ${{ steps.sf_plugins.outputs.has_outdated }}
      pkg_outdated:     ${{ steps.sf_packages.outputs.outdated }}
      pkg_has_outdated: ${{ steps.sf_packages.outputs.has_outdated }}
      pmd_critical:     ${{ steps.pmd.outputs.critical }}
      pmd_high:         ${{ steps.pmd.outputs.high }}
      pmd_medium:       ${{ steps.pmd.outputs.medium }}
      pmd_has_issues:   ${{ steps.pmd.outputs.has_issues }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest --silent
          sf --version

      # ── npm audit ──────────────────────────────────────────────
      - name: npm Audit Scan
        id: npm
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then
            echo "No package.json — skipping"
            echo "has_vulns=false" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          npm install --ignore-scripts 2>/dev/null || true
          AUDIT=$(npm audit --json 2>/dev/null || true)

          CRITICAL=$(echo "$AUDIT" | jq -r '.metadata.vulnerabilities.critical // 0')
          HIGH=$(echo "$AUDIT"     | jq -r '.metadata.vulnerabilities.high     // 0')
          MODERATE=$(echo "$AUDIT" | jq -r '.metadata.vulnerabilities.moderate // 0')
          LOW=$(echo "$AUDIT"      | jq -r '.metadata.vulnerabilities.low      // 0')
          TOTAL=$(echo "$AUDIT"    | jq -r '.metadata.vulnerabilities.total    // 0')
          FIXABLE=$(echo "$AUDIT"  | jq -r '.metadata.vulnerabilities.total    // 0')

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH"         >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          echo "low=$LOW"           >> $GITHUB_OUTPUT
          echo "total=$TOTAL"       >> $GITHUB_OUTPUT
          echo "fixable=$FIXABLE"   >> $GITHUB_OUTPUT

          if [[ "$TOTAL" -gt 0 ]]; then
            echo "has_vulns=true" >> $GITHUB_OUTPUT
            echo "$AUDIT" > npm_audit.json
          else
            echo "has_vulns=false" >> $GITHUB_OUTPUT
          fi

          echo "npm audit: Critical=$CRITICAL High=$HIGH Moderate=$MODERATE Low=$LOW Total=$TOTAL"

      # ── Salesforce CLI Plugin Version Check ────────────────────
      - name: SF CLI Plugin Check
        id: sf_plugins
        shell: bash
        run: |
          OUTDATED_LIST=""
          PLUGINS=$(sf plugins --json 2>/dev/null || echo "[]")

          while IFS= read -r PLUGIN; do
            NAME=$(echo "$PLUGIN" | jq -r '.name')
            CURRENT=$(echo "$PLUGIN" | jq -r '.version')
            LATEST=$(npm view "$NAME" version 2>/dev/null || echo "")
            if [[ -n "$LATEST" && "$CURRENT" != "$LATEST" ]]; then
              OUTDATED_LIST+="${NAME}:${CURRENT}→${LATEST},"
              echo "  ⚠️ $NAME: $CURRENT → $LATEST"
            fi
          done < <(echo "$PLUGINS" | jq -c '.[]' 2>/dev/null || true)

          OUTDATED_LIST=$(echo "$OUTDATED_LIST" | sed 's/,$//')
          if [[ -n "$OUTDATED_LIST" ]]; then
            echo "has_outdated=true"  >> $GITHUB_OUTPUT
            echo "outdated=$OUTDATED_LIST" >> $GITHUB_OUTPUT
          else
            echo "has_outdated=false" >> $GITHUB_OUTPUT
            echo "outdated="          >> $GITHUB_OUTPUT
            echo "✅ All SF CLI plugins up to date"
          fi

      # ── Salesforce 2GP Package Version Check ──────────────────
      - name: SF Package Version Check
        id: sf_packages
        shell: bash
        run: |
          if [[ ! -f sfdx-project.json ]]; then
            echo "No sfdx-project.json — skipping"
            echo "has_outdated=false" >> $GITHUB_OUTPUT
            echo "outdated="          >> $GITHUB_OUTPUT
            exit 0
          fi

          ALIASES=$(jq -r '.packageAliases // {} | to_entries[] | "\(.key)=\(.value)"' sfdx-project.json 2>/dev/null || true)
          if [[ -z "$ALIASES" ]]; then
            echo "No packageAliases in sfdx-project.json — skipping"
            echo "has_outdated=false" >> $GITHUB_OUTPUT
            echo "outdated="          >> $GITHUB_OUTPUT
            exit 0
          fi

          OUTDATED_PKGS=""
          while IFS='=' read -r ALIAS VERSION_ID; do
            if [[ "$VERSION_ID" == 04t* ]]; then
              echo "  📦 $ALIAS ($VERSION_ID) — pinned subscriber package"
              OUTDATED_PKGS+="${ALIAS}:${VERSION_ID},"
            fi
          done <<< "$ALIASES"

          OUTDATED_PKGS=$(echo "$OUTDATED_PKGS" | sed 's/,$//')
          if [[ -n "$OUTDATED_PKGS" ]]; then
            echo "has_outdated=true"       >> $GITHUB_OUTPUT
            echo "outdated=$OUTDATED_PKGS" >> $GITHUB_OUTPUT
          else
            echo "has_outdated=false" >> $GITHUB_OUTPUT
            echo "outdated="          >> $GITHUB_OUTPUT
          fi

      # ── PMD / Salesforce Code Analyzer ────────────────────────
      - name: PMD Apex Scan
        id: pmd
        shell: bash
        run: |
          PMD_CRITICAL=0; PMD_HIGH=0; PMD_MEDIUM=0

          if [[ ! -d "force-app" ]]; then
            echo "No force-app directory — skipping PMD"
            echo "critical=0" >> $GITHUB_OUTPUT
            echo "high=0"     >> $GITHUB_OUTPUT
            echo "medium=0"   >> $GITHUB_OUTPUT
            echo "has_issues=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🔍 Installing Salesforce Code Analyzer..."
          npm install -g @salesforce/sfdx-scanner --silent 2>/dev/null || true

          sf scanner run \
            --target "force-app/**/*.cls,force-app/**/*.trigger" \
            --format json \
            --severity-threshold 1 \
            --output-file pmd_results.json 2>/dev/null || true

          if [[ -f pmd_results.json ]]; then
            PMD_CRITICAL=$(jq '[.[] | select(.severity == 1)] | length' pmd_results.json 2>/dev/null || echo 0)
            PMD_HIGH=$(jq     '[.[] | select(.severity == 2)] | length' pmd_results.json 2>/dev/null || echo 0)
            PMD_MEDIUM=$(jq   '[.[] | select(.severity == 3)] | length' pmd_results.json 2>/dev/null || echo 0)
          fi

          echo "critical=$PMD_CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$PMD_HIGH"         >> $GITHUB_OUTPUT
          echo "medium=$PMD_MEDIUM"     >> $GITHUB_OUTPUT

          TOTAL_PMD=$((PMD_CRITICAL + PMD_HIGH + PMD_MEDIUM))
          if [[ $TOTAL_PMD -gt 0 ]]; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi
          echo "PMD: Critical=$PMD_CRITICAL High=$PMD_HIGH Medium=$PMD_MEDIUM"

      - name: Upload Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: |
            npm_audit.json
            pmd_results.json
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # JOB 2: AUTO-FIX — npm audit fix → branch → PR (like Dependabot)
  # ─────────────────────────────────────────────────────────────
  auto_fix:
    runs-on: ubuntu-latest
    needs: scan
    if: needs.scan.outputs.npm_has_vulns == 'true'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for Existing Auto-Fix PR
        id: check_pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          EXISTING=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&head=${REPO%%/*}:deps/auto-fix&per_page=5" \
            | jq -r '.[0].number // empty')

          if [[ -n "$EXISTING" ]]; then
            echo "pr_exists=true"      >> $GITHUB_OUTPUT
            echo "pr_number=$EXISTING" >> $GITHUB_OUTPUT
            echo "⚠️ Auto-fix PR #$EXISTING already open — will comment instead"
          else
            echo "pr_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run npm audit fix
        id: fix
        shell: bash
        run: |
          npm install --ignore-scripts 2>/dev/null || true

          BEFORE=$(npm audit --json 2>/dev/null | jq -r '.metadata.vulnerabilities.total // 0' || echo 0)
          npm audit fix 2>/dev/null || true
          AFTER=$(npm audit --json 2>/dev/null | jq -r '.metadata.vulnerabilities.total // 0' || echo 0)
          FIXED=$((BEFORE - AFTER))

          echo "before=$BEFORE" >> $GITHUB_OUTPUT
          echo "after=$AFTER"   >> $GITHUB_OUTPUT
          echo "fixed=$FIXED"   >> $GITHUB_OUTPUT
          echo "Fixed $FIXED vulnerabilities ($BEFORE → $AFTER remaining)"

          if git diff --quiet package-lock.json package.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No file changes after audit fix"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Fix Branch
        if: steps.fix.outputs.changed == 'true' && steps.check_pr.outputs.pr_exists == 'false'
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: |
          FIX_DATE=$(date +'%Y-%m-%d')
          BRANCH="deps/auto-fix-${FIX_DATE}"

          git config user.name  "${GIT_USER_NAME:-github-actions[bot]}"
          git config user.email "${GIT_USER_EMAIL:-github-actions[bot]@users.noreply.github.com}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "SFDC-1234: npm audit fix — $(date +'%Y-%m-%d') [auto]"
          git push origin "$BRANCH"

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "✅ Pushed branch: $BRANCH"

      - name: Create Pull Request
        if: steps.fix.outputs.changed == 'true' && steps.check_pr.outputs.pr_exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.push.outputs.branch }}
          BEFORE: ${{ steps.fix.outputs.before }}
          AFTER: ${{ steps.fix.outputs.after }}
          FIXED: ${{ steps.fix.outputs.fixed }}
          CRITICAL: ${{ needs.scan.outputs.npm_critical }}
          HIGH: ${{ needs.scan.outputs.npm_high }}
          MODERATE: ${{ needs.scan.outputs.npm_moderate }}
          LOW: ${{ needs.scan.outputs.npm_low }}
          RUN_ID: ${{ github.run_id }}
        run: |
          PR_BODY="## 🔐 Automated Dependency Security Fix\n\n"
          PR_BODY+="_Generated by Dependency Auto-Fix workflow — $(date +'%d-%m-%Y %H:%M IST')_\n\n"
          PR_BODY+="### Vulnerabilities Before Fix\n"
          PR_BODY+="| Severity | Count |\n|---|---|\n"
          PR_BODY+="| 🔴 Critical | $CRITICAL |\n"
          PR_BODY+="| 🟠 High     | $HIGH |\n"
          PR_BODY+="| 🟡 Moderate | $MODERATE |\n"
          PR_BODY+="| 🔵 Low      | $LOW |\n\n"
          PR_BODY+="### Fix Summary\n"
          PR_BODY+="| | Count |\n|---|---|\n"
          PR_BODY+="| Vulnerabilities before | $BEFORE |\n"
          PR_BODY+="| Vulnerabilities after  | $AFTER |\n"
          PR_BODY+="| Fixed by this PR       | **$FIXED** |\n\n"
          PR_BODY+="### What changed\n"
          PR_BODY+="\`npm audit fix\` was run — \`package.json\` and \`package-lock.json\` updated with safe, non-breaking version bumps.\n\n"
          PR_BODY+="> ⚠️ Review changes before merging. If vulnerabilities remain after merge, a force-fix PR may be needed.\n\n"
          PR_BODY+="[View scan run →](https://github.com/${REPO}/actions/runs/${RUN_ID})"

          HTTP=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls" \
            -d "$(jq -n \
              --arg title "🔐 [deps] Auto-fix: $FIXED vulnerabilities resolved ($(date +'%Y-%m-%d'))" \
              --arg body "$(printf '%b' "$PR_BODY")" \
              --arg head "$BRANCH" \
              --arg base "${{ github.ref_name }}" \
              '{title: $title, body: $body, head: $head, base: $base}')")

          if [[ "$HTTP" == "201" ]]; then
            PR_URL=$(jq -r '.html_url' response.json)
            echo "✅ PR created: $PR_URL"
          else
            echo "❌ PR creation failed (HTTP $HTTP)"
            cat response.json
            exit 1
          fi

          # Add labels to PR
          PR_NUMBER=$(jq -r '.number' response.json)
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/labels" \
            -d '{"labels":["dependencies","security","devops-admin"]}' > /dev/null

      - name: Comment on Existing PR
        if: steps.check_pr.outputs.pr_exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.check_pr.outputs.pr_number }}
          BEFORE: ${{ steps.fix.outputs.before }}
          AFTER: ${{ steps.fix.outputs.after }}
          CRITICAL: ${{ needs.scan.outputs.npm_critical }}
          HIGH: ${{ needs.scan.outputs.npm_high }}
          RUN_ID: ${{ github.run_id }}
        run: |
          COMMENT="🔄 **Dependency re-scan** — $(date +'%d-%m-%Y %H:%M IST')\n\n"
          COMMENT+="Still open: Critical=$CRITICAL High=$HIGH | Total=$BEFORE\n"
          COMMENT+="[View run](https://github.com/${REPO}/actions/runs/${RUN_ID})"

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -d "{\"body\": \"$(printf '%b' "$COMMENT")\"}"
          echo "✅ Commented on existing PR #$PR_NUMBER"

  # ─────────────────────────────────────────────────────────────
  # JOB 3: REPORT — GitHub Issue + Step Summary
  # ─────────────────────────────────────────────────────────────
  report:
    runs-on: ubuntu-latest
    needs: [scan, auto_fix]
    if: always() && (needs.scan.outputs.npm_has_vulns == 'true' || needs.scan.outputs.pmd_has_issues == 'true' || needs.scan.outputs.sf_has_outdated == 'true')
    permissions:
      issues: write

    steps:
      - name: Create or Update GitHub Issue
        shell: bash
        env:
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          REPO:         ${{ github.repository }}
          RUN_ID:       ${{ github.run_id }}
          NPM_CRITICAL: ${{ needs.scan.outputs.npm_critical }}
          NPM_HIGH:     ${{ needs.scan.outputs.npm_high }}
          NPM_MODERATE: ${{ needs.scan.outputs.npm_moderate }}
          NPM_LOW:      ${{ needs.scan.outputs.npm_low }}
          NPM_TOTAL:    ${{ needs.scan.outputs.npm_total }}
          NPM_VULNS:    ${{ needs.scan.outputs.npm_has_vulns }}
          SF_OUTDATED:  ${{ needs.scan.outputs.sf_outdated }}
          SF_HAS:       ${{ needs.scan.outputs.sf_has_outdated }}
          PKG_OUTDATED: ${{ needs.scan.outputs.pkg_outdated }}
          PKG_HAS:      ${{ needs.scan.outputs.pkg_has_outdated }}
          PMD_CRITICAL: ${{ needs.scan.outputs.pmd_critical }}
          PMD_HIGH:     ${{ needs.scan.outputs.pmd_high }}
          PMD_MEDIUM:   ${{ needs.scan.outputs.pmd_medium }}
          PMD_HAS:      ${{ needs.scan.outputs.pmd_has_issues }}
        run: |
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          SCAN_DATE=$(date +'%d-%m-%Y %H:%M IST')

          # Check for existing open issue
          EXISTING=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues?labels=dependencies,security&state=open&per_page=1" \
            | jq -r '.[0].number // empty')

          BODY="## 🔐 Dependency & Code Quality Report\n\n"
          BODY+="_Scanned: ${SCAN_DATE}_\n\n"

          if [[ "$NPM_VULNS" == "true" ]]; then
            BODY+="### 📦 npm Vulnerabilities\n"
            BODY+="| Severity | Count |\n|---|---|\n"
            BODY+="| 🔴 Critical | $NPM_CRITICAL |\n"
            BODY+="| 🟠 High     | $NPM_HIGH |\n"
            BODY+="| 🟡 Moderate | $NPM_MODERATE |\n"
            BODY+="| 🔵 Low      | $NPM_LOW |\n"
            BODY+="| **Total**   | **$NPM_TOTAL** |\n\n"
            BODY+="> ✅ An auto-fix PR has been raised — check open PRs with label \`dependencies\`\n\n"
          fi

          if [[ "$SF_HAS" == "true" && -n "$SF_OUTDATED" ]]; then
            BODY+="### 🔧 Outdated Salesforce CLI Plugins\n"
            IFS=',' read -ra PLUGINS <<< "$SF_OUTDATED"
            for P in "${PLUGINS[@]}"; do
              BODY+="- \`$P\`\n"
            done
            BODY+="\n> Run \`sf plugins update\` to update all plugins\n\n"
          fi

          if [[ "$PKG_HAS" == "true" && -n "$PKG_OUTDATED" ]]; then
            BODY+="### 📦 Salesforce Managed Packages (Review Required)\n"
            IFS=',' read -ra PKGS <<< "$PKG_OUTDATED"
            for P in "${PKGS[@]}"; do
              BODY+="- \`$P\`\n"
            done
            BODY+="\n> Review AppExchange for newer versions of pinned packages\n\n"
          fi

          if [[ "$PMD_HAS" == "true" ]]; then
            BODY+="### 🔍 Apex Code Quality (PMD)\n"
            BODY+="| Severity | Count |\n|---|---|\n"
            BODY+="| 🔴 Critical | $PMD_CRITICAL |\n"
            BODY+="| 🟠 High     | $PMD_HIGH |\n"
            BODY+="| 🟡 Medium   | $PMD_MEDIUM |\n\n"
            BODY+="> Run \`sf scanner run --target force-app\` locally to see full details\n\n"
          fi

          BODY+="[View full scan run →](${RUN_URL})"

          TITLE="🔐 [Dependencies] npm:${NPM_TOTAL} vulns | PMD: Critical:${PMD_CRITICAL} High:${PMD_HIGH}"

          if [[ -n "$EXISTING" ]]; then
            # Add comment to existing issue
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues/${EXISTING}/comments" \
              -d "{\"body\": \"$(printf '%b' "$BODY")\"}"
            echo "✅ Commented on existing issue #$EXISTING"
          else
            # Create new issue
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues" \
              -d "$(jq -n \
                --arg title "$TITLE" \
                --arg body "$(printf '%b' "$BODY")" \
                --argjson labels '["dependencies","security","devops-admin"]' \
                '{title: $title, body: $body, labels: $labels}')")
            [[ "$HTTP" == "201" ]] && echo "✅ Issue created" || echo "❌ Issue creation failed (HTTP $HTTP)"
          fi

      - name: Write Step Summary
        if: always()
        shell: bash
        env:
          NPM_CRITICAL: ${{ needs.scan.outputs.npm_critical }}
          NPM_HIGH:     ${{ needs.scan.outputs.npm_high }}
          NPM_MODERATE: ${{ needs.scan.outputs.npm_moderate }}
          NPM_LOW:      ${{ needs.scan.outputs.npm_low }}
          NPM_TOTAL:    ${{ needs.scan.outputs.npm_total }}
          NPM_VULNS:    ${{ needs.scan.outputs.npm_has_vulns }}
          PMD_CRITICAL: ${{ needs.scan.outputs.pmd_critical }}
          PMD_HIGH:     ${{ needs.scan.outputs.pmd_high }}
          PMD_MEDIUM:   ${{ needs.scan.outputs.pmd_medium }}
          PMD_HAS:      ${{ needs.scan.outputs.pmd_has_issues }}
          SF_HAS:       ${{ needs.scan.outputs.sf_has_outdated }}
          SF_OUTDATED:  ${{ needs.scan.outputs.sf_outdated }}
        run: |
          {
            echo "## 🔐 Dependency Auto-Fix Report"
            echo "_Scanned: $(date +'%d-%m-%Y %H:%M IST')_"
            echo ""
            echo "### 📦 npm Vulnerabilities"
            if [[ "$NPM_VULNS" == "true" ]]; then
              echo "| Severity | Count |"
              echo "|---|---|"
              echo "| 🔴 Critical | $NPM_CRITICAL |"
              echo "| 🟠 High     | $NPM_HIGH |"
              echo "| 🟡 Moderate | $NPM_MODERATE |"
              echo "| 🔵 Low      | $NPM_LOW |"
              echo "| **Total**   | **$NPM_TOTAL** |"
              echo ""
              echo "> ✅ Auto-fix PR raised — check open PRs"
            else
              echo "✅ No npm vulnerabilities found"
            fi
            echo ""
            echo "### 🔍 Apex Code Quality (PMD)"
            if [[ "$PMD_HAS" == "true" ]]; then
              echo "| Severity | Count |"
              echo "|---|---|"
              echo "| 🔴 Critical | $PMD_CRITICAL |"
              echo "| 🟠 High     | $PMD_HIGH |"
              echo "| 🟡 Medium   | $PMD_MEDIUM |"
            else
              echo "✅ No PMD issues found"
            fi
            echo ""
            echo "### 🔧 SF CLI Plugins"
            if [[ "$SF_HAS" == "true" ]]; then
              echo "⚠️ Outdated plugins: $SF_OUTDATED"
            else
              echo "✅ All plugins up to date"
            fi
          } >> $GITHUB_STEP_SUMMARY
