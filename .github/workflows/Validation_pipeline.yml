name: Lodha Validation Pipeline

on:
  workflow_dispatch:
    inputs:
      Feature_Branch:
        type: string
        description: >-
          Single: feature/LODHA-123  |  Multiple (comma-separated): feature/LODHA-123,feature/LODHA-456
        required: true
      environment:
        type: choice
        description: Please Select The Validation Environment.
        options:
          - DEV
          - QA
          - UAT
          - PRODUCTION
          - HOTFIX
        default: DEV
        required: true
      testlevel:
        type: choice
        description: Select Test class Run Type.
        options:
          - RunLocalTests
          - RunSpecifiedTests
          - RunAllTestsInOrg
        default: RunSpecifiedTests
        required: true

jobs:
  Validation_Build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SF_ENV_ALIAS: lodhaOrg
      SF_LOGIN_URL_TEST: ${{ secrets.SANDBOX_URL }}
      SF_LOGIN_URL_PROD: ${{ secrets.LOGIN_URL }}

    if: >
      (github.event_name == 'workflow_dispatch' &&
       (
         (github.ref == 'refs/heads/DEV' && github.event.inputs.environment == 'DEV') ||
         (github.ref == 'refs/heads/QA' && github.event.inputs.environment == 'QA') ||
         (github.ref == 'refs/heads/UAT' && github.event.inputs.environment == 'UAT') ||
         (github.ref == 'refs/heads/main' && github.event.inputs.environment == 'PRODUCTION') ||
         (github.ref == 'refs/heads/main' && github.event.inputs.environment == 'HOTFIX')
       ))

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf --version

      - name: Install Salesforce Code Analyzer Plugin
        run: sf plugins install code-analyzer@latest

      - name: Resolve Package - Single or Multiple
        id: resolve-package
        shell: bash
        env:
          FEATURE_INPUT: ${{ github.event.inputs.Feature_Branch }}
          MANIFEST_DIR: ${{ github.workspace }}/manifest/feature
          OUTPUT_DIR: ${{ github.workspace }}/manifest
        run: |
          FEATURE_INPUT=$(echo "$FEATURE_INPUT" | xargs)

          if [[ "$FEATURE_INPUT" == *","* ]]; then
            echo "📦 Multiple packages detected — consolidating..."

            RELEASE_DATE=$(date +'%d%m%Y_%H%M')
            OUTPUT_NAME="Release_${RELEASE_DATE}"
            OUTPUT_PKG="${OUTPUT_DIR}/${OUTPUT_NAME}_package.xml"
            OUTPUT_TEST="${OUTPUT_DIR}/${OUTPUT_NAME}_TestClass.txt"

            echo "=========================================="
            echo "PACKAGE CONSOLIDATION"
            echo "=========================================="
            echo "Packages : $FEATURE_INPUT"
            echo "Output   : $OUTPUT_NAME"
            echo "=========================================="

            IFS=',' read -ra BRANCHES <<< "$FEATURE_INPUT"

            echo ""
            echo "🔍 Validating input files..."
            for BRANCH in "${BRANCHES[@]}"; do
              BRANCH=$(echo "$BRANCH" | xargs | sed 's|^feature/||')
              PKG_FILE="${MANIFEST_DIR}/${BRANCH}_package.xml"
              if [[ ! -f "$PKG_FILE" ]]; then
                echo "❌ Package file not found: $PKG_FILE"
                exit 1
              fi
              echo "  ✅ Found: ${BRANCH}_package.xml"
            done

            MAX_VERSION="0"
            ALL_MEMBERS_RAW=""

            for BRANCH in "${BRANCHES[@]}"; do
              BRANCH=$(echo "$BRANCH" | xargs | sed 's|^feature/||')
              PKG_FILE="${MANIFEST_DIR}/${BRANCH}_package.xml"
              echo "  Processing: ${BRANCH}_package.xml"

              VERSION=$(grep -oP '(?<=<version>)[^<]+' "$PKG_FILE" || echo "0")
              if awk "BEGIN {exit !($VERSION > $MAX_VERSION)}"; then
                MAX_VERSION="$VERSION"
              fi

              IN_BLOCK=0
              CUR_TYPE=""
              CUR_MEMBERS=""
              while IFS= read -r LINE; do
                LINE=$(echo "$LINE" | sed 's/^[[:space:]]*//')
                if echo "$LINE" | grep -q '<types>'; then
                  IN_BLOCK=1; CUR_TYPE=""; CUR_MEMBERS=""
                elif [[ $IN_BLOCK -eq 1 ]]; then
                  if echo "$LINE" | grep -q '<name>'; then
                    CUR_TYPE=$(echo "$LINE" | grep -oP '(?<=<name>)[^<]+')
                  elif echo "$LINE" | grep -q '<members>'; then
                    M=$(echo "$LINE" | grep -oP '(?<=<members>)[^<]+')
                    CUR_MEMBERS+="$M"$'\n'
                  elif echo "$LINE" | grep -q '</types>'; then
                    if [[ -n "$CUR_TYPE" ]]; then
                      while IFS= read -r MEMBER; do
                        [[ -n "$MEMBER" ]] && ALL_MEMBERS_RAW+="${CUR_TYPE}|||${MEMBER}"$'\n'
                      done <<< "$CUR_MEMBERS"
                    fi
                    IN_BLOCK=0; CUR_TYPE=""; CUR_MEMBERS=""
                  fi
                fi
              done < "$PKG_FILE"
            done

            printf '<?xml version="1.0" encoding="UTF-8"?>\n' > "$OUTPUT_PKG"
            printf '<Package xmlns="http://soap.sforce.com/2006/04/metadata">\n' >> "$OUTPUT_PKG"

            SORTED_TYPES=$(echo "$ALL_MEMBERS_RAW" | grep -v '^$' | cut -d'|' -f1 | sort -u)
            while IFS= read -r TYPE_NAME; do
              [[ -z "$TYPE_NAME" ]] && continue
              printf '    <types>\n' >> "$OUTPUT_PKG"
              echo "$ALL_MEMBERS_RAW" | grep -v '^$' | grep -F "${TYPE_NAME}|||" | cut -d'|' -f4 | sort -u | while read -r MEMBER; do
                [[ -n "$MEMBER" ]] && printf '        <members>%s</members>\n' "$MEMBER" >> "$OUTPUT_PKG"
              done
              printf '        <name>%s</name>\n' "$TYPE_NAME" >> "$OUTPUT_PKG"
              printf '    </types>\n' >> "$OUTPUT_PKG"
            done <<< "$SORTED_TYPES"

            printf '    <version>%s</version>\n' "$MAX_VERSION" >> "$OUTPUT_PKG"
            printf '</Package>\n' >> "$OUTPUT_PKG"

            ALL_TESTS=""
            for BRANCH in "${BRANCHES[@]}"; do
              BRANCH=$(echo "$BRANCH" | xargs | sed 's|^feature/||')
              TEST_FILE="${MANIFEST_DIR}/${BRANCH}_TestClass.txt"
              if [[ -f "$TEST_FILE" ]]; then
                CONTENT=$(cat "$TEST_FILE" | tr ' ' '\n' | tr ',' '\n')
                ALL_TESTS+=$'\n'"$CONTENT"
              fi
            done

            UNIQUE_TESTS=$(echo "$ALL_TESTS" | sort -u | grep -v '^$' | tr '\n' ' ' | xargs)
            [[ -n "$UNIQUE_TESTS" ]] && echo "$UNIQUE_TESTS" > "$OUTPUT_TEST"

            echo ""
            echo "=========================================="
            echo "📦 CONSOLIDATED PACKAGE.XML"
            echo "=========================================="
            cat "$OUTPUT_PKG"
            if [[ -f "$OUTPUT_TEST" ]]; then
              echo ""
              echo "=========================================="
              echo "🧪 CONSOLIDATED TESTCLASS.TXT"
              echo "=========================================="
              cat "$OUTPUT_TEST"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git add "${OUTPUT_DIR}/${OUTPUT_NAME}_package.xml"
            [[ -f "$OUTPUT_TEST" ]] && git add "${OUTPUT_DIR}/${OUTPUT_NAME}_TestClass.txt"
            if git diff --cached --quiet; then
              echo "⚠️ No changes to commit"
            else
              git commit -m "chore: consolidated package ${OUTPUT_NAME} [skip ci]"
              git push origin ${{ github.ref_name }}
            fi

            echo "FEATURE_BRANCH=${OUTPUT_NAME}" >> $GITHUB_ENV
            echo "✅ Consolidation complete: $OUTPUT_NAME"

          else
            echo "📄 Single branch detected — using directly: $FEATURE_INPUT"
            FEATURE_INPUT=$(echo "$FEATURE_INPUT" | sed 's|^feature/||')
            echo "FEATURE_BRANCH=feature/${FEATURE_INPUT}" >> $GITHUB_ENV
            echo ""
            echo "=========================================="
            echo "📦 PACKAGE.XML"
            echo "=========================================="
            cat "${MANIFEST_DIR}/${FEATURE_INPUT}_package.xml"
            TEST_FILE="${MANIFEST_DIR}/${FEATURE_INPUT}_TestClass.txt"
            if [[ -f "$TEST_FILE" ]]; then
              echo ""
              echo "=========================================="
              echo "🧪 TESTCLASS.TXT"
              echo "=========================================="
              cat "$TEST_FILE"
            fi
          fi

      - name: Generate JWT Key file
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
          chmod 600 server.key

      - name: Clear Prior Salesforce Sessions
        run: sf org logout --all --no-prompt || true

      - name: Authorize to Salesforce - ${{ github.event.inputs.environment }} Org
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          SF_LOGIN_URL_TEST_VAL: ${{ env.SF_LOGIN_URL_TEST }}
          SF_LOGIN_URL_PROD_VAL: ${{ env.SF_LOGIN_URL_PROD }}
          SF_ALIAS: ${{ env.SF_ENV_ALIAS }}
          KEY_DEV: ${{ secrets.SALESFORCE_CONSUMER_KEY_DEV }}
          KEY_QA: ${{ secrets.SALESFORCE_CONSUMER_KEY_QA }}
          KEY_UAT: ${{ secrets.SALESFORCE_CONSUMER_KEY_UAT }}
          KEY_PROD: ${{ secrets.SALESFORCE_CONSUMER_KEY_PROD }}
          KEY_HOTFIX: ${{ secrets.SALESFORCE_CONSUMER_KEY_HOTFIX }}
          USER_DEV: ${{ secrets.SFDX_AUTH_DEV_USERNAME }}
          USER_QA: ${{ secrets.SFDX_AUTH_QA_USERNAME }}
          USER_UAT: ${{ secrets.SFDX_AUTH_UAT_USERNAME }}
          USER_PROD: ${{ secrets.SFDX_AUTH_PROD_USERNAME }}
          USER_HOTFIX: ${{ secrets.SFDX_AUTH_HOTFIX_USERNAME }}
        run: |
          LOGIN_URL="$SF_LOGIN_URL_TEST_VAL"
          if [[ "$INPUT_ENV" == "PRODUCTION" ]]; then
            LOGIN_URL="$SF_LOGIN_URL_PROD_VAL"
          fi
          case "$INPUT_ENV" in
            DEV)        CLIENT_ID="$KEY_DEV";    USERNAME="$USER_DEV"    ;;
            QA)         CLIENT_ID="$KEY_QA";     USERNAME="$USER_QA"     ;;
            UAT)        CLIENT_ID="$KEY_UAT";    USERNAME="$USER_UAT"    ;;
            PRODUCTION) CLIENT_ID="$KEY_PROD";   USERNAME="$USER_PROD"   ;;
            HOTFIX)     CLIENT_ID="$KEY_HOTFIX"; USERNAME="$USER_HOTFIX" ;;
            *) echo "Unknown environment: $INPUT_ENV"; exit 1 ;;
          esac
          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$USERNAME" \
            --instance-url "$LOGIN_URL" \
            --alias "$SF_ALIAS" \
            --set-default

      - name: Prepare Test Classes
        id: prepare_tests
        shell: bash
        env:
          INPUT_TESTLEVEL: ${{ github.event.inputs.testlevel }}
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          TEST_FILE="${WORKSPACE}/manifest/${FEATURE_BRANCH}_TestClass.txt"
          if [[ "$INPUT_TESTLEVEL" == "RunSpecifiedTests" ]]; then
            if [[ -f "$TEST_FILE" ]]; then
              TEST_CLASSES=$(paste -sd ' ' "$TEST_FILE")
              echo "✅ Test classes: $TEST_CLASSES"
              echo "test_classes=$TEST_CLASSES" >> $GITHUB_OUTPUT
              echo "resolved_testlevel=RunSpecifiedTests" >> $GITHUB_OUTPUT
            else
              echo "⚠️ Test class file not found: $TEST_FILE — falling back to RunLocalTests"
              echo "resolved_testlevel=RunLocalTests" >> $GITHUB_OUTPUT
            fi
          else
            echo "resolved_testlevel=$INPUT_TESTLEVEL" >> $GITHUB_OUTPUT
          fi

      - name: Validate Single Package - ${{ github.event.inputs.environment }} Org
        if: ${{ !contains(github.event.inputs.Feature_Branch, ',') }}
        shell: bash
        env:
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          RESOLVED_TESTLEVEL: ${{ steps.prepare_tests.outputs.resolved_testlevel }}
          TESTS: ${{ steps.prepare_tests.outputs.test_classes }}
          SF_ALIAS: ${{ env.SF_ENV_ALIAS }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          PACKAGE_XML="${WORKSPACE}/manifest/${FEATURE_BRANCH}_package.xml"
          echo "=========================================="
          echo "SINGLE PACKAGE VALIDATION"
          echo "=========================================="
          echo "Package  : $PACKAGE_XML"
          echo "TestLevel: $RESOLVED_TESTLEVEL"
          echo "Tests    : $TESTS"
          echo "=========================================="
          CMD=(sf project deploy validate --manifest "$PACKAGE_XML" --target-org "$SF_ALIAS" --test-level "$RESOLVED_TESTLEVEL" --wait 30 --ignore-warnings --verbose)
          if [[ "$RESOLVED_TESTLEVEL" == "RunSpecifiedTests" && -n "$TESTS" ]]; then
            CMD+=(--tests $TESTS)
          fi
          "${CMD[@]}"

      - name: Validate Consolidated Package - ${{ github.event.inputs.environment }} Org
        if: ${{ contains(github.event.inputs.Feature_Branch, ',') }}
        shell: bash
        env:
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          RESOLVED_TESTLEVEL: ${{ steps.prepare_tests.outputs.resolved_testlevel }}
          TESTS: ${{ steps.prepare_tests.outputs.test_classes }}
          SF_ALIAS: ${{ env.SF_ENV_ALIAS }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          PACKAGE_XML="${WORKSPACE}/manifest/${FEATURE_BRANCH}_package.xml"
          echo "=========================================="
          echo "CONSOLIDATED PACKAGE VALIDATION"
          echo "=========================================="
          echo "Package  : $PACKAGE_XML"
          echo "TestLevel: $RESOLVED_TESTLEVEL"
          echo "Tests    : $TESTS"
          echo "=========================================="
          CMD=(sf project deploy validate --manifest "$PACKAGE_XML" --target-org "$SF_ALIAS" --test-level "$RESOLVED_TESTLEVEL" --wait 30 --ignore-warnings --verbose)
          if [[ "$RESOLVED_TESTLEVEL" == "RunSpecifiedTests" && -n "$TESTS" ]]; then
            CMD+=(--tests $TESTS)
          fi
          "${CMD[@]}"

      - name: Run Salesforce Code Analyzer
        id: run-scanner
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --target force-app
          results-artifact-name: salesforce-code-analyzer-results

      - name: Fail if critical violations found
        if: |
          steps.run-scanner.outputs.exit-code > 0 ||
          steps.run-scanner.outputs.num-sev1-violations > 10 ||
          steps.run-scanner.outputs.num-sev2-violations > 50 ||
          steps.run-scanner.outputs.num-sev3-violations > 500 ||
          steps.run-scanner.outputs.num-violations > 10
        run: exit 0


      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks PII and Secret Scan
        id: gitleaks
        shell: bash
        run: |
          set +e
          gitleaks detect --source . --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --verbose
          set -e

          HAS_PII=0; HAS_SECRET=0; HAS_PROFANITY=0; FINDING_SUMMARY=""

          if [[ -f gitleaks-report.json ]]; then
            HAS_PII=$(jq '[.[] | select(.Tags[]? | test("pii|aadhaar|pan|mobile|passport|bank"))] | length' gitleaks-report.json 2>/dev/null || echo 0)
            HAS_SECRET=$(jq '[.[] | select(.Tags[]? | test("salesforce|aws|key|secret|token|password"))] | length' gitleaks-report.json 2>/dev/null || echo 0)
            HAS_PROFANITY=$(jq '[.[] | select(.Tags[]? | test("profanity"))] | length' gitleaks-report.json 2>/dev/null || echo 0)
            FINDING_SUMMARY=$(jq -r '.[] | "  \(.RuleID) | \(.File):\(.StartLine) | \(.Description)"' gitleaks-report.json 2>/dev/null || echo "")
          fi

          TOTAL=$((HAS_PII + HAS_SECRET + HAS_PROFANITY))

          if [[ $TOTAL -gt 0 ]]; then
            echo ""
            echo "=========================================="
            echo "🚨 PII / SECRET FINDINGS"
            echo "=========================================="
            echo "$FINDING_SUMMARY"
            echo "  PII findings    : $HAS_PII"
            echo "  Secret findings : $HAS_SECRET"
            echo "  Profanity       : $HAS_PROFANITY"
            echo "=========================================="
            echo "has_findings=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No PII, secrets, or profanity detected"
            echo "has_findings=false" >> $GITHUB_OUTPUT
          fi

          echo "has_pii=${HAS_PII}" >> $GITHUB_OUTPUT
          echo "has_secret=${HAS_SECRET}" >> $GITHUB_OUTPUT
          echo "has_profanity=${HAS_PROFANITY}" >> $GITHUB_OUTPUT
          echo "finding_summary<<EOF" >> $GITHUB_OUTPUT
          echo "$FINDING_SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Alert DevOps Admin via GitHub Issue
        if: steps.gitleaks.outputs.has_findings == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINDING_SUMMARY: ${{ steps.gitleaks.outputs.finding_summary }}
          HAS_PII: ${{ steps.gitleaks.outputs.has_pii }}
          HAS_SECRET: ${{ steps.gitleaks.outputs.has_secret }}
          HAS_PROFANITY: ${{ steps.gitleaks.outputs.has_profanity }}
        run: |
          SCAN_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          ISSUE_BODY="## 🚨 PII / Secret / Profanity Detected\n\n"
          ISSUE_BODY+="| Field | Value |\n|---|---|\n"
          ISSUE_BODY+="| **Detected at** | ${SCAN_TIME} |\n"
          ISSUE_BODY+="| **Branch** | ${{ github.ref_name }} |\n"
          ISSUE_BODY+="| **Triggered by** | ${{ github.actor }} |\n"
          ISSUE_BODY+="| **Workflow Run** | [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |\n"
          ISSUE_BODY+="| **PII findings** | ${HAS_PII} |\n"
          ISSUE_BODY+="| **Secret findings** | ${HAS_SECRET} |\n"
          ISSUE_BODY+="| **Profanity findings** | ${HAS_PROFANITY} |\n\n"
          ISSUE_BODY+="### Findings\n\`\`\`\n${FINDING_SUMMARY}\n\`\`\`\n\n"
          ISSUE_BODY+="> **Action required:** Review and remove all flagged content before re-running validation."

          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "$(jq -n \
              --arg title "🚨 [PII/Secret Alert] Detected in ${{ github.ref_name }} by ${{ github.actor }}" \
              --arg body "$(printf '%b' "$ISSUE_BODY")" \
              '{title: $title, body: $body, labels: ["security", "pii-alert", "devops-admin"]}')"

          echo "✅ DevOps Admin alert issue created"

      - name: Rotate Salesforce Secrets if Secret Detected
        if: steps.gitleaks.outputs.has_findings == 'true' && steps.gitleaks.outputs.has_secret != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Secret detected in source — initiating rotation advisory..."
          echo ""
          echo "=========================================="
          echo "SECRET ROTATION CHECKLIST"
          echo "=========================================="
          echo "  1. Revoke the exposed Salesforce Connected App credentials"
          echo "     → Setup > App Manager > [App] > Manage > Revoke"
          echo "  2. Regenerate Consumer Key/Secret in Salesforce"
          echo "  3. Update GitHub Secrets:"
          echo "     → Repo Settings > Secrets > Actions"
          echo "     → Update: SALESFORCE_CONSUMER_KEY_*, SALESFORCE_JWT_SECRET_KEY"
          echo "  4. Re-run JWT auth to verify new credentials work"
          echo "  5. Close the DevOps Admin alert issue once rotated"
          echo "=========================================="
          echo ""

          LATEST_ISSUE=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?labels=pii-alert&state=open&per_page=1" \
            | jq -r '.[0].number // empty')

          if [[ -n "$LATEST_ISSUE" ]]; then
            curl -s -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${LATEST_ISSUE}/comments" \
              -d '{"body": "⚠️ **Automatic Rotation Advisory**\n\nA Salesforce secret was detected. Please:\n1. Revoke the exposed Connected App credentials in Salesforce Setup\n2. Regenerate Consumer Key/Secret\n3. Update `SALESFORCE_CONSUMER_KEY_*` and `SALESFORCE_JWT_SECRET_KEY` in GitHub Secrets\n4. Re-run this workflow to confirm clean scan"}'
            echo "✅ Rotation advisory posted to issue #${LATEST_ISSUE}"
          fi

      - name: Block — Fail on PII, Secret, or Profanity
        if: steps.gitleaks.outputs.has_findings == 'true'
        run: |
          echo ""
          echo "=========================================="
          echo "🚫 VALIDATION BLOCKED"
          echo "=========================================="
          echo "  PII findings    : ${{ steps.gitleaks.outputs.has_pii }}"
          echo "  Secret findings : ${{ steps.gitleaks.outputs.has_secret }}"
          echo "  Profanity       : ${{ steps.gitleaks.outputs.has_profanity }}"
          echo ""
          echo "  Remove all flagged content and re-run validation."
          echo "  DevOps Admin has been notified via GitHub Issue."
          echo "=========================================="
          exit 1

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-pii-report
          path: gitleaks-report.json
          retention-days: 30

      - name: Cleanup
        if: always()
        run: rm -f server.key
