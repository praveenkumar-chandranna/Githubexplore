name: Lodha Salesforce Code Retrieval Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER: workflow_dispatch only.
# Scheduled runs are handled by Retrieve_Scheduler.yml which dispatches
# this workflow on the correct branch (DEV/QA/UAT/main) at the right time.
# Manual runs: Actions → Run workflow → select branch → Run
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      package_path:
        type: string
        description: >
          Relative path to retrieval package.xml. Defaults to manifest/package_retive.xml if blank.
        required: false

jobs:
  Retrieve_And_PR:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      SF_LOGIN_URL_TEST: ${{ secrets.SANDBOX_URL }}
      SF_LOGIN_URL_PROD: ${{ secrets.LOGIN_URL }}
      # gh CLI uses this automatically for all API calls including PR creation
      GH_TOKEN: ${{ secrets.GH_PAT }}

    steps:

      # ── Step 1: Resolve environment, branch name, paths ─────────────────────
      - name: Resolve environment and branch
        id: resolve
        shell: bash
        env:
          EVENT_NAME:    ${{ github.event_name }}
          INPUT_PKG:     ${{ github.event.inputs.package_path }}
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          # Derive ENVIRONMENT from the branch this workflow is running on
          case "$CURRENT_BRANCH" in
            DEV)  ENVIRONMENT="DEV"        ; ORG_LABEL="DEV sandbox"    ;;
            QA)   ENVIRONMENT="QA"         ; ORG_LABEL="QA sandbox"     ;;
            UAT)  ENVIRONMENT="UAT"        ; ORG_LABEL="UAT sandbox"    ;;
            main) ENVIRONMENT="PRODUCTION" ; ORG_LABEL="Production org" ;;
            *) echo "❌ Cannot derive environment from branch: $CURRENT_BRANCH"; exit 1 ;;
          esac

          TARGET_BRANCH="$CURRENT_BRANCH"
          echo "✅ Branch '${TARGET_BRANCH}' → ${ENVIRONMENT} (${ORG_LABEL})"

          PACKAGE_PATH="${INPUT_PKG:-manifest/package_retive.xml}"
          RETRIEVE_DATE=$(TZ='Asia/Kolkata' date +'%d%m%Y_%H%M')
          FEATURE_BRANCH="retrieve/${ENVIRONMENT}Code_${RETRIEVE_DATE}"
          GENERATED_PKG="manifest/retrieve/${ENVIRONMENT}Code_${RETRIEVE_DATE}_package.xml"
          GENERATED_TEST="manifest/retrieve/${ENVIRONMENT}Code_${RETRIEVE_DATE}_TestClass.txt"

          echo "ENVIRONMENT=${ENVIRONMENT}"       >> $GITHUB_OUTPUT
          echo "TARGET_BRANCH=${TARGET_BRANCH}"   >> $GITHUB_OUTPUT
          echo "FEATURE_BRANCH=${FEATURE_BRANCH}" >> $GITHUB_OUTPUT
          echo "RETRIEVE_DATE=${RETRIEVE_DATE}"   >> $GITHUB_OUTPUT
          echo "PACKAGE_PATH=${PACKAGE_PATH}"     >> $GITHUB_OUTPUT
          echo "GENERATED_PKG=${GENERATED_PKG}"   >> $GITHUB_OUTPUT
          echo "GENERATED_TEST=${GENERATED_TEST}" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "RETRIEVAL CONFIGURATION"
          echo "=========================================="
          echo "  Trigger        : $EVENT_NAME"
          echo "  Environment    : $ENVIRONMENT"
          echo "  Target Branch  : $TARGET_BRANCH"
          echo "  Feature Branch : $FEATURE_BRANCH"
          echo "  Retrieve Pkg   : $PACKAGE_PATH"
          echo "  Generated Pkg  : $GENERATED_PKG"
          echo "  Generated Test : $GENERATED_TEST"
          echo "  Triggered by   : ${{ github.actor }}"
          echo "=========================================="

      # ── Step 2: Checkout target env branch ──────────────────────────────────
      - name: Checkout ${{ steps.resolve.outputs.TARGET_BRANCH }} branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Ensure manifest/package_retive.xml exists
        shell: bash
        run: |
          if [[ ! -f "manifest/package_retive.xml" ]]; then
            echo "⚠️  manifest/package_retive.xml not found — fetching from main..."
            git fetch origin main
            git checkout origin/main -- manifest/package_retive.xml
            echo "✅ manifest/package_retive.xml restored from main"
          else
            echo "✅ manifest/package_retive.xml found"
          fi

      # ── Step 3: Tooling setup ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf --version

      # ── Step 4: JWT Auth ─────────────────────────────────────────────────────
      - name: Generate JWT private key file
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
          chmod 600 server.key

      - name: Set org credentials
        id: set-org
        shell: bash
        env:
          ENVIRONMENT:           ${{ steps.resolve.outputs.ENVIRONMENT }}
          SF_LOGIN_URL_TEST_VAL: ${{ env.SF_LOGIN_URL_TEST }}
          SF_LOGIN_URL_PROD_VAL: ${{ env.SF_LOGIN_URL_PROD }}
          KEY_DEV:    ${{ secrets.SALESFORCE_CONSUMER_KEY_DEV }}
          KEY_QA:     ${{ secrets.SALESFORCE_CONSUMER_KEY_QA }}
          KEY_UAT:    ${{ secrets.SALESFORCE_CONSUMER_KEY_UAT }}
          KEY_PROD:   ${{ secrets.SALESFORCE_CONSUMER_KEY_PROD }}
          KEY_HOTFIX: ${{ secrets.SALESFORCE_CONSUMER_KEY_HOTFIX }}
          USER_DEV:    ${{ secrets.SFDX_AUTH_DEV_USERNAME }}
          USER_QA:     ${{ secrets.SFDX_AUTH_QA_USERNAME }}
          USER_UAT:    ${{ secrets.SFDX_AUTH_UAT_USERNAME }}
          USER_PROD:   ${{ secrets.SFDX_AUTH_PROD_USERNAME }}
          USER_HOTFIX: ${{ secrets.SFDX_AUTH_HOTFIX_USERNAME }}
        run: |
          case "$ENVIRONMENT" in
            DEV)        echo "CLIENT_ID=$KEY_DEV"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_DEV"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            QA)         echo "CLIENT_ID=$KEY_QA"     >> $GITHUB_OUTPUT; echo "USERNAME=$USER_QA"     >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            UAT)        echo "CLIENT_ID=$KEY_UAT"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_UAT"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            PRODUCTION) echo "CLIENT_ID=$KEY_PROD"   >> $GITHUB_OUTPUT; echo "USERNAME=$USER_PROD"   >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_PROD_VAL" >> $GITHUB_OUTPUT ;;
            HOTFIX)     echo "CLIENT_ID=$KEY_HOTFIX" >> $GITHUB_OUTPUT; echo "USERNAME=$USER_HOTFIX" >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
          esac

      - name: Clear Prior Salesforce Sessions
        run: sf org logout --all --no-prompt || true

      - name: Authenticate to ${{ steps.resolve.outputs.ENVIRONMENT }} Org
        env:
          CLIENT_ID: ${{ steps.set-org.outputs.CLIENT_ID }}
          USERNAME:  ${{ steps.set-org.outputs.USERNAME }}
          LOGIN_URL: ${{ steps.set-org.outputs.LOGIN_URL }}
        run: |
          sf org login jwt \
            --client-id    "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username     "$USERNAME" \
            --instance-url "$LOGIN_URL" \
            --set-default

      # ── Step 5: Validate retrieval package.xml ───────────────────────────────
      - name: Validate retrieval package.xml exists
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.resolve.outputs.PACKAGE_PATH }}
        run: |
          if [[ ! -f "$PACKAGE_PATH" ]]; then
            echo "❌ package.xml not found: $PACKAGE_PATH"
            exit 1
          fi
          echo "✅ Using package: $PACKAGE_PATH"
          cat "$PACKAGE_PATH"

      # ── Step 6: Retrieve metadata ────────────────────────────────────────────
      - name: Retrieve metadata from ${{ steps.resolve.outputs.ENVIRONMENT }} Org
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.resolve.outputs.PACKAGE_PATH }}
          ORG_USERNAME: ${{ steps.set-org.outputs.USERNAME }}
        run: |
          echo "⬇️  Retrieving metadata using: $PACKAGE_PATH"
          sf project retrieve start \
            --manifest   "$PACKAGE_PATH" \
            --target-org "$ORG_USERNAME" \
            --wait 30
          echo "✅ Retrieval complete"

      - name: Cleanup JWT key
        if: always()
        run: rm -f server.key

      # ── Step 7: Detect changes ───────────────────────────────────────────────
      - name: Check for changes
        id: check-changes
        shell: bash
        run: |
          git add force-app
          CHANGED=$(git diff --cached --name-only | wc -l | xargs)
          echo "changed_count=${CHANGED}" >> $GITHUB_OUTPUT

          if [[ "$CHANGED" -eq 0 ]]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⚠️  No metadata changes — org is already in sync with branch."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ ${CHANGED} file(s) staged:"
            echo "=========================================="
            git diff --cached --name-status
            echo "=========================================="
          fi

      # ── Step 8: Generate package.xml and TestClass.txt ───────────────────────
      - name: Generate package.xml and TestClass.txt
        if: steps.check-changes.outputs.has_changes == 'true'
        id: gen-artifacts
        shell: bash
        env:
          GENERATED_PKG:  ${{ steps.resolve.outputs.GENERATED_PKG }}
          GENERATED_TEST: ${{ steps.resolve.outputs.GENERATED_TEST }}
          PACKAGE_PATH:   ${{ steps.resolve.outputs.PACKAGE_PATH }}
          ORG_USERNAME:   ${{ steps.set-org.outputs.USERNAME }}
        run: |
          mkdir -p "$(dirname "$GENERATED_PKG")"

          API_VERSION=$(grep -oP '(?<=sourceApiVersion": ")[^"]+' sfdx-project.json 2>/dev/null || echo "67.0")

          # ── TYPE_MAP: folder name → Salesforce Metadata API type ─────────────
          declare -A TYPE_MAP
          TYPE_MAP["classes"]="ApexClass"                TYPE_MAP["triggers"]="ApexTrigger"
          TYPE_MAP["lwc"]="LightningComponentBundle"     TYPE_MAP["aura"]="AuraDefinitionBundle"
          TYPE_MAP["pages"]="ApexPage"                   TYPE_MAP["components"]="ApexComponent"
          TYPE_MAP["staticresources"]="StaticResource"   TYPE_MAP["flows"]="Flow"
          TYPE_MAP["objects"]="CustomObject"             TYPE_MAP["layouts"]="Layout"
          TYPE_MAP["permissionsets"]="PermissionSet"     TYPE_MAP["profiles"]="Profile"
          TYPE_MAP["labels"]="CustomLabels"              TYPE_MAP["tabs"]="CustomTab"
          TYPE_MAP["applications"]="CustomApplication"   TYPE_MAP["roles"]="Role"
          TYPE_MAP["groups"]="Group"                     TYPE_MAP["queues"]="Queue"
          TYPE_MAP["reportTypes"]="ReportType"           TYPE_MAP["reports"]="Report"
          TYPE_MAP["dashboards"]="Dashboard"             TYPE_MAP["documents"]="Document"
          TYPE_MAP["email"]="EmailTemplate"              TYPE_MAP["emailservices"]="EmailServicesFunction"
          TYPE_MAP["workflows"]="Workflow"               TYPE_MAP["approvalProcesses"]="ApprovalProcess"
          TYPE_MAP["assignmentRules"]="AssignmentRules"  TYPE_MAP["autoResponseRules"]="AutoResponseRules"
          TYPE_MAP["escalationRules"]="EscalationRules"  TYPE_MAP["sharingRules"]="SharingRules"
          TYPE_MAP["territory2Models"]="Territory2Model" TYPE_MAP["territory2Types"]="Territory2Type"
          TYPE_MAP["territory2"]="Territory2"            TYPE_MAP["territory2Rules"]="Territory2Rule"
          TYPE_MAP["customMetadata"]="CustomMetadata"    TYPE_MAP["settings"]="Settings"
          TYPE_MAP["namedCredentials"]="NamedCredential" TYPE_MAP["remoteSiteSettings"]="RemoteSiteSetting"
          TYPE_MAP["cspTrustedSites"]="CspTrustedSite"  TYPE_MAP["connectedApps"]="ConnectedApp"
          TYPE_MAP["authproviders"]="AuthProvider"       TYPE_MAP["samlssoconfigs"]="SamlSsoConfig"
          TYPE_MAP["sites"]="CustomSite"                 TYPE_MAP["networks"]="Network"
          TYPE_MAP["communities"]="Community"            TYPE_MAP["experiences"]="ExperienceBundle"
          TYPE_MAP["contentassets"]="ContentAsset"       TYPE_MAP["brandingSets"]="BrandingSet"
          TYPE_MAP["navigationMenus"]="NavigationMenu"   TYPE_MAP["managedTopics"]="ManagedTopic"
          TYPE_MAP["topics"]="TopicsForObjects"          TYPE_MAP["globalValueSets"]="GlobalValueSet"
          TYPE_MAP["standardValueSets"]="StandardValueSet" TYPE_MAP["globalValueSetTranslations"]="GlobalValueSetTranslation"
          TYPE_MAP["translations"]="Translations"        TYPE_MAP["objectTranslations"]="CustomObjectTranslation"
          TYPE_MAP["pathAssistants"]="PathAssistant"     TYPE_MAP["compactLayouts"]="CompactLayout"
          TYPE_MAP["flexipages"]="FlexiPage"             TYPE_MAP["quickActions"]="QuickAction"
          TYPE_MAP["listViews"]="ListView"               TYPE_MAP["webLinks"]="WebLink"
          TYPE_MAP["validationRules"]="ValidationRule"   TYPE_MAP["businessProcesses"]="BusinessProcess"
          TYPE_MAP["recordTypes"]="RecordType"           TYPE_MAP["fieldSets"]="FieldSet"
          TYPE_MAP["fields"]="CustomField"               TYPE_MAP["sharingReasons"]="SharingReason"
          TYPE_MAP["sharingRecalculations"]="SharingRecalculation" TYPE_MAP["index"]="Index"
          TYPE_MAP["letterhead"]="Letterhead"            TYPE_MAP["postTemplates"]="PostTemplate"
          TYPE_MAP["callCenters"]="CallCenter"           TYPE_MAP["dataCategoryGroups"]="DataCategoryGroup"
          TYPE_MAP["matchingRules"]="MatchingRule"       TYPE_MAP["duplicateRules"]="DuplicateRule"
          TYPE_MAP["cleanDataServices"]="CleanDataService" TYPE_MAP["feedFilters"]="FeedFilter"
          TYPE_MAP["homePageComponents"]="HomePageComponent" TYPE_MAP["homePageLayouts"]="HomePageLayout"
          TYPE_MAP["installedPackages"]="InstalledPackage" TYPE_MAP["notificationtypes"]="CustomNotificationType"
          TYPE_MAP["bots"]="Bot"                         TYPE_MAP["botVersions"]="BotVersion"
          TYPE_MAP["mlDomains"]="MLDomain"               TYPE_MAP["mlPredictionDefinitions"]="MLPredictionDefinition"
          TYPE_MAP["decisionMatrixDefinitions"]="DecisionMatrixDefinition"
          TYPE_MAP["expressionSetDefinitions"]="ExpressionSetDefinition"
          TYPE_MAP["omniIntegrationProcedures"]="OmniIntegrationProcedure"
          TYPE_MAP["omniScripts"]="OmniScript"           TYPE_MAP["omniUiCard"]="OmniUiCard"
          TYPE_MAP["omniDataTransforms"]="OmniDataTransform"

          # ── SUBFOLDER_MAP: object sub-folder → Metadata API type ─────────────
          declare -A SUBFOLDER_MAP
          SUBFOLDER_MAP["fields"]="CustomField"          SUBFOLDER_MAP["validationRules"]="ValidationRule"
          SUBFOLDER_MAP["recordTypes"]="RecordType"      SUBFOLDER_MAP["layouts"]="Layout"
          SUBFOLDER_MAP["listViews"]="ListView"          SUBFOLDER_MAP["webLinks"]="WebLink"
          SUBFOLDER_MAP["fieldSets"]="FieldSet"          SUBFOLDER_MAP["compactLayouts"]="CompactLayout"
          SUBFOLDER_MAP["businessProcesses"]="BusinessProcess" SUBFOLDER_MAP["sharingReasons"]="SharingReason"
          SUBFOLDER_MAP["index"]="Index"

          # ── strip_ext: remove all known Salesforce file extensions ────────────
          strip_ext() {
            local f="$1"
            f="${f%.cls}"    ; f="${f%.trigger}" ; f="${f%.page}"
            f="${f%.component}"; f="${f%.resource}"; f="${f%.flow-meta.xml}"
            f="${f%.object-meta.xml}"; f="${f%.layout-meta.xml}"
            f="${f%.permissionset-meta.xml}"; f="${f%.profile-meta.xml}"
            f="${f%.labels-meta.xml}"; f="${f%.tab-meta.xml}"
            f="${f%.app-meta.xml}"; f="${f%.role-meta.xml}"
            f="${f%.email-meta.xml}"; f="${f%.workflow-meta.xml}"
            f="${f%.approvalProcess-meta.xml}"; f="${f%.assignmentRules-meta.xml}"
            f="${f%.autoResponseRules-meta.xml}"; f="${f%.escalationRules-meta.xml}"
            f="${f%.sharingRules-meta.xml}"; f="${f%.territory2Model-meta.xml}"
            f="${f%.territory2Type-meta.xml}"; f="${f%.territory2-meta.xml}"
            f="${f%.territory2Rule-meta.xml}"; f="${f%.customMetadata-meta.xml}"
            f="${f%.settings-meta.xml}"; f="${f%.namedCredential-meta.xml}"
            f="${f%.remoteSite-meta.xml}"; f="${f%.cspTrustedSite-meta.xml}"
            f="${f%.connectedApp-meta.xml}"; f="${f%.authprovider-meta.xml}"
            f="${f%.samlssoconfig-meta.xml}"; f="${f%.site-meta.xml}"
            f="${f%.network-meta.xml}"; f="${f%.community-meta.xml}"
            f="${f%.contentasset-meta.xml}"; f="${f%.brandingSet-meta.xml}"
            f="${f%.navigationMenu-meta.xml}"; f="${f%.managedTopic-meta.xml}"
            f="${f%.globalValueSet-meta.xml}"; f="${f%.standardValueSet-meta.xml}"
            f="${f%.translation-meta.xml}"; f="${f%.objectTranslation-meta.xml}"
            f="${f%.pathAssistant-meta.xml}"; f="${f%.flexipage-meta.xml}"
            f="${f%.quickAction-meta.xml}"; f="${f%.reportType-meta.xml}"
            f="${f%.report-meta.xml}"; f="${f%.dashboard-meta.xml}"
            f="${f%.document-meta.xml}"; f="${f%.letterhead-meta.xml}"
            f="${f%.postTemplate-meta.xml}"; f="${f%.callCenter-meta.xml}"
            f="${f%.dataCategoryGroup-meta.xml}"; f="${f%.matchingRule-meta.xml}"
            f="${f%.duplicateRule-meta.xml}"; f="${f%.feedFilter-meta.xml}"
            f="${f%.homePageComponent-meta.xml}"; f="${f%.homePageLayout-meta.xml}"
            f="${f%.installedPackage-meta.xml}"; f="${f%.notiftype-meta.xml}"
            f="${f%.bot-meta.xml}"; f="${f%.botVersion-meta.xml}"
            f="${f%-meta.xml}"; f="${f%.xml}"
            echo "$f"
          }

          # ── Build TYPE_MEMBERS from git diff --cached (new + modified only) ───
          echo "📦 Building package.xml from git diff --cached..."
          declare -A TYPE_MEMBERS

          while IFS= read -r FPATH; do
            [[ -z "$FPATH" ]] && continue
            # Strip leading force-app/main/default/
            REL="${FPATH#force-app/main/default/}"
            [[ "$REL" == "$FPATH" ]] && continue  # not under force-app

            FOLDER=$(echo "$REL" | cut -d'/' -f1)
            REST=$(echo "$REL" | cut -d'/' -f2-)
            FNAME=$(basename "$REST")

            # Objects sub-folder: objects/Account/fields/MyField__c.field-meta.xml
            if [[ "$FOLDER" == "objects" ]]; then
              OBJECT=$(echo "$REST" | cut -d'/' -f1)
              SUBFOLDER=$(echo "$REST" | cut -d'/' -f2)
              if [[ -n "${SUBFOLDER_MAP[$SUBFOLDER]:-}" ]]; then
                MTYPE="${SUBFOLDER_MAP[$SUBFOLDER]}"
                MNAME="${OBJECT}.$(strip_ext "$FNAME")"
              else
                MTYPE="CustomObject"
                MNAME=$(strip_ext "$OBJECT")
              fi
            # LWC / Aura bundles: member = bundle folder name
            elif [[ "$FOLDER" == "lwc" || "$FOLDER" == "aura" ]]; then
              MTYPE="${TYPE_MAP[$FOLDER]}"
              MNAME=$(echo "$REST" | cut -d'/' -f1)
            else
              MTYPE="${TYPE_MAP[$FOLDER]:-}"
              [[ -z "$MTYPE" ]] && continue
              MNAME=$(strip_ext "$FNAME")
            fi

            [[ -z "$MNAME" || "$MNAME" == "*" ]] && continue
            TYPE_MEMBERS["$MTYPE"]+="${MNAME}"$'\n'
          done < <(git diff --cached --name-only)

          echo "  📋 Types from diff: ${!TYPE_MEMBERS[*]}"
          echo "  📋 ApexClass count: $(echo "${TYPE_MEMBERS[ApexClass]:-}" | grep -c '[^[:space:]]' || echo 0)"

          if [[ ${#TYPE_MEMBERS[@]} -eq 0 ]]; then
            echo "⚠️  No force-app metadata found in diff — skipping package.xml"
          else
            PKG_TMP=$(mktemp)
            printf '<?xml version="1.0" encoding="UTF-8"?>\n' >> "$PKG_TMP"
            printf '<Package xmlns="http://soap.sforce.com/2006/04/metadata">\n' >> "$PKG_TMP"
            while IFS= read -r TYPE; do
              [[ -z "$TYPE" ]] && continue
              printf '    <types>\n' >> "$PKG_TMP"
              MEMBERS_SORTED=$(echo "${TYPE_MEMBERS[$TYPE]}" | sort -u | grep -v '^$')
              while IFS= read -r M; do
                [[ -z "$M" ]] && continue
                printf '        <members>%s</members>\n' "$M" >> "$PKG_TMP"
              done <<< "$MEMBERS_SORTED"
              printf '        <name>%s</name>\n' "$TYPE" >> "$PKG_TMP"
              printf '    </types>\n' >> "$PKG_TMP"
            done < <(echo "${!TYPE_MEMBERS[@]}" | tr ' ' '\n' | sort)
            printf '    <version>%s</version>\n' "$API_VERSION" >> "$PKG_TMP"
            printf '</Package>\n' >> "$PKG_TMP"
            mv "$PKG_TMP" "$GENERATED_PKG"
            echo "✅ package.xml ready: $GENERATED_PKG"
            echo ""
            echo "=========================================="
            echo "📦 GENERATED PACKAGE.XML"
            echo "=========================================="
            cat "$GENERATED_PKG"
            echo "=========================================="
          fi

          # ── Generate TestClass.txt ────────────────────────────────────────
          echo ""
          echo "🧪 Scanning for test classes..."

          CLASSES_DIR="force-app/main/default/classes"
          declare -A TEST_CLASS_SET

          # Step A: get changed ApexClass and ApexTrigger members from TYPE_MEMBERS (git diff)
          declare -a PKG_CLASSES
          declare -a PKG_TRIGGERS
          while IFS= read -r CNAME; do
            [[ -n "$CNAME" && "$CNAME" != "*" ]] && PKG_CLASSES+=("$CNAME")
          done <<< "${TYPE_MEMBERS[ApexClass]:-}"
          while IFS= read -r TNAME; do
            [[ -n "$TNAME" && "$TNAME" != "*" ]] && PKG_TRIGGERS+=("$TNAME")
          done <<< "${TYPE_MEMBERS[ApexTrigger]:-}"

          # Step B: build a map of ALL @isTest classes — from disk AND staged new files
          declare -A ALL_TEST_CLASSES
          # Scan ALL .cls files on disk — sf retrieve writes them to working tree
          # Use case-insensitive grep anywhere in file (not just line-start) to catch
          # all valid @isTest placements: standalone line, inline, after modifiers, etc.
          if [[ -d "$CLASSES_DIR" ]]; then
            while IFS= read -r CLSFILE; do
              [[ "$CLSFILE" =~ -meta\.xml$ ]] && continue
              if grep -qiE '@isTest' "$CLSFILE" 2>/dev/null; then
                CNAME=$(basename "$CLSFILE" .cls)
                ALL_TEST_CLASSES["$CNAME"]="$CLSFILE"
              fi
            done < <(find "$CLASSES_DIR" -maxdepth 1 -name '*.cls')
          fi

          echo "  📋 @isTest classes found on disk: ${#ALL_TEST_CLASSES[@]}"

          # Deduplicate PKG_CLASSES
          declare -A _SEEN_CLASSES
          declare -a UNIQUE_PKG_CLASSES
          for _C in "${PKG_CLASSES[@]}"; do
            [[ -z "$_C" ]] && continue
            [[ -n "${_SEEN_CLASSES[$_C]:-}" ]] && continue
            _SEEN_CLASSES["$_C"]=1
            UNIQUE_PKG_CLASSES+=("$_C")
          done

          # Step C: for each class in the package, resolve its test class(es)
          for CNAME in "${UNIQUE_PKG_CLASSES[@]}"; do
            [[ -z "$CNAME" ]] && continue

            # If the class itself is @isTest → add it directly
            if [[ -n "${ALL_TEST_CLASSES[$CNAME]:-}" ]]; then
              TEST_CLASS_SET["$CNAME"]=1
              echo "  ✅ Direct test class: $CNAME"
              continue
            fi

            # Otherwise scan all @isTest classes for a reference to this class
            for TC in "${!ALL_TEST_CLASSES[@]}"; do
              TCPATH="${ALL_TEST_CLASSES[$TC]}"
              if [[ -f "$TCPATH" ]]; then
                CONTENT=$(cat "$TCPATH" 2>/dev/null)
              else
                CONTENT=$(git show ":${TCPATH}" 2>/dev/null)
              fi
              if echo "$CONTENT" | grep -qw "$CNAME"; then
                TEST_CLASS_SET["$TC"]=1
                echo "  ✅ Test class for $CNAME → $TC"
              fi
            done
          done

          # Step D: for each trigger, find test classes using all Salesforce coverage patterns
          # Salesforce standard: triggers are covered by test classes that do DML on the trigger's SObject.
          # Detection chain:
          #   1. Extract SObject from trigger definition: "trigger Foo on Account (...)" → Account
          #   2. Find test classes that reference that SObject (DML coverage)
          #   3. Find test classes that reference any handler class called by the trigger
          #   4. Find test classes that directly mention the trigger name
          for TNAME in "${PKG_TRIGGERS[@]}"; do
            [[ -z "$TNAME" ]] && continue
            echo "  🔍 Resolving test classes for trigger: $TNAME"

            # Read trigger file from disk or staging area
            TRIGGER_FILE="force-app/main/default/triggers/${TNAME}.trigger"
            if [[ -f "$TRIGGER_FILE" ]]; then
              TRIGGER_CONTENT=$(cat "$TRIGGER_FILE" 2>/dev/null)
            else
              TRIGGER_CONTENT=$(git show ":${TRIGGER_FILE}" 2>/dev/null)
            fi

            # Extract SObject name: "trigger FooTrigger on Account (before insert)" → Account
            SOBJECT=$(echo "$TRIGGER_CONTENT" | grep -oiP '\btrigger\b[^(]+\bon\b\s+\K[A-Za-z][A-Za-z0-9_]+' | head -1)

            # Extract all handler/class references from trigger body: ClassName.method() → ClassName
            HANDLER_CLASSES=$(echo "$TRIGGER_CONTENT" | grep -oP '\b[A-Z][a-zA-Z0-9_]+(?=\s*\.)' | sort -u)

            for TC in "${!ALL_TEST_CLASSES[@]}"; do
              TCPATH="${ALL_TEST_CLASSES[$TC]}"
              if [[ -f "$TCPATH" ]]; then
                CONTENT=$(cat "$TCPATH" 2>/dev/null)
              else
                CONTENT=$(git show ":${TCPATH}" 2>/dev/null)
              fi
              [[ -z "$CONTENT" ]] && continue

              MATCHED=0

              # 1. Test class does DML on the trigger SObject → covers trigger implicitly
              if [[ -n "$SOBJECT" ]] && echo "$CONTENT" | grep -qiP "(insert|update|delete|upsert)\s+.*\b${SOBJECT}\b|new\s+${SOBJECT}\s*\("; then
                MATCHED=1
                echo "  ✅ Test class for trigger $TNAME → $TC (DML on $SOBJECT)"
              fi

              # 2. Test class references a handler class that the trigger calls
              if [[ $MATCHED -eq 0 && -n "$HANDLER_CLASSES" ]]; then
                while IFS= read -r HANDLER; do
                  [[ -z "$HANDLER" ]] && continue
                  if echo "$CONTENT" | grep -qw "$HANDLER"; then
                    MATCHED=1
                    echo "  ✅ Test class for trigger $TNAME → $TC (via handler $HANDLER)"
                    break
                  fi
                done <<< "$HANDLER_CLASSES"
              fi

              # 3. Test class directly mentions the trigger name
              if [[ $MATCHED -eq 0 ]] && echo "$CONTENT" | grep -qw "$TNAME"; then
                MATCHED=1
                echo "  ✅ Test class for trigger $TNAME → $TC (direct reference)"
              fi

              [[ $MATCHED -eq 1 ]] && TEST_CLASS_SET["$TC"]=1
            done
          done

          TEST_CLASSES=$(echo "${!TEST_CLASS_SET[@]}" | tr ' ' '\n' | sort | tr '\n' ' ' | xargs)

          if [[ -n "$TEST_CLASSES" ]]; then
            echo "$TEST_CLASSES" > "$GENERATED_TEST"
            echo ""
            echo "✅ TestClass.txt generated: $GENERATED_TEST"
            echo "=========================================="
            echo "🧪 GENERATED TESTCLASS.TXT"
            echo "=========================================="
            cat "$GENERATED_TEST"
            echo "=========================================="
            echo "test_file_created=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  No test classes found for retrieved metadata"
            echo "test_file_created=false" >> $GITHUB_OUTPUT
          fi

      # ── Step 9: Create feature branch, commit, push ──────────────────────────
      - name: Setup SSH Signing Key
        if: steps.check-changes.outputs.has_changes == 'true'
        shell: bash
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: |
          if [[ -z "$SSH_SIGNING_KEY" ]]; then
            echo "❌ SSH_SIGNING_KEY secret is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_SIGNING_KEY" | sed 's/\\n/\n/g' > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          ssh-keygen -y -f ~/.ssh/signing_key > ~/.ssh/signing_key.pub
          chmod 644 ~/.ssh/signing_key.pub
          echo "✅ SSH signing key ready"

      - name: Create feature branch and push
        if: steps.check-changes.outputs.has_changes == 'true'
        shell: bash
        env:
          FEATURE_BRANCH: ${{ steps.resolve.outputs.FEATURE_BRANCH }}
          ENVIRONMENT:    ${{ steps.resolve.outputs.ENVIRONMENT }}
          RETRIEVE_DATE:  ${{ steps.resolve.outputs.RETRIEVE_DATE }}
          GIT_USER_NAME:  ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GH_PAT:         ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO:           ${{ github.repository }}
          ACTOR:          ${{ github.actor }}
          EVENT_NAME:     ${{ github.event_name }}
        run: |
          git config user.name  "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/signing_key.pub
          git config commit.gpgsign true
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${REPO}.git"

          git checkout -b "$FEATURE_BRANCH"
          git add -A

          TRIGGER="scheduled"
          [[ "$EVENT_NAME" == "workflow_dispatch" ]] && TRIGGER="manual by ${ACTOR}"

          git commit -S -m "retrieve(${ENVIRONMENT}): org sync ${RETRIEVE_DATE} [${TRIGGER}]"
          git push origin "$FEATURE_BRANCH"

          echo "✅ SSH-signed commit pushed: $FEATURE_BRANCH"

      - name: Cleanup SSH Signing Key
        if: always()
        run: rm -f ~/.ssh/signing_key ~/.ssh/signing_key.pub

      # ── Step 10: Raise PR using gh CLI (fixes 403) ───────────────────────────
      - name: Raise Pull Request → ${{ steps.resolve.outputs.TARGET_BRANCH }}
        if: steps.check-changes.outputs.has_changes == 'true'
        id: raise-pr
        shell: bash
        env:
          GH_TOKEN:       ${{ secrets.GH_PAT }}
          FEATURE_BRANCH: ${{ steps.resolve.outputs.FEATURE_BRANCH }}
          TARGET_BRANCH:  ${{ steps.resolve.outputs.TARGET_BRANCH }}
          ENVIRONMENT:    ${{ steps.resolve.outputs.ENVIRONMENT }}
          PACKAGE_PATH:   ${{ steps.resolve.outputs.PACKAGE_PATH }}
          GENERATED_PKG:  ${{ steps.resolve.outputs.GENERATED_PKG }}
          GENERATED_TEST: ${{ steps.resolve.outputs.GENERATED_TEST }}
          RETRIEVE_DATE:  ${{ steps.resolve.outputs.RETRIEVE_DATE }}
          CHANGED_COUNT:  ${{ steps.check-changes.outputs.changed_count }}
          TEST_CREATED:   ${{ steps.gen-artifacts.outputs.test_file_created }}
          ACTOR:          ${{ github.actor }}
          EVENT_NAME:     ${{ github.event_name }}
          RUN_ID:         ${{ github.run_id }}
          REPO:           ${{ github.repository }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "❌ GH_PAT secret is not set. Cannot create PR."
            echo "   → Repo Settings → Secrets → Actions → add GH_PAT"
            echo "   → Fine-grained PAT with Contents + Pull Requests read/write"
            exit 1
          fi

          RETRIEVE_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          TRIGGER="Scheduled"
          [[ "$EVENT_NAME" == "workflow_dispatch" ]] && TRIGGER="Manual (${ACTOR})"

          TEST_LINE=""
          [[ "$TEST_CREATED" == "true" ]] && TEST_LINE="| **Test Classes** | \`${GENERATED_TEST}\` |"

          PR_TITLE="⬇️ [Retrieve] ${ENVIRONMENT} org sync | ${RETRIEVE_DATE}"

          PR_BODY_FILE=$(mktemp)
          printf '## Salesforce Metadata Retrieval -- %s\n\n' "$ENVIRONMENT" >> "$PR_BODY_FILE"
          printf '| Field | Value |\n|---|---|\n' >> "$PR_BODY_FILE"
          printf '| **Environment** | `%s` |\n' "$ENVIRONMENT" >> "$PR_BODY_FILE"
          printf '| **Feature Branch** | `%s` |\n' "$FEATURE_BRANCH" >> "$PR_BODY_FILE"
          printf '| **Target Branch** | `%s` |\n' "$TARGET_BRANCH" >> "$PR_BODY_FILE"
          printf '| **Retrieval Package** | `%s` |\n' "$PACKAGE_PATH" >> "$PR_BODY_FILE"
          printf '| **Generated Package** | `%s` |\n' "$GENERATED_PKG" >> "$PR_BODY_FILE"
          [[ -n "$TEST_LINE" ]] && printf '%s\n' "$TEST_LINE" >> "$PR_BODY_FILE"
          printf '| **Files Changed** | %s |\n' "$CHANGED_COUNT" >> "$PR_BODY_FILE"
          printf '| **Retrieved at** | %s |\n' "$RETRIEVE_TIME" >> "$PR_BODY_FILE"
          printf '| **Trigger** | %s |\n' "$TRIGGER" >> "$PR_BODY_FILE"
          printf '| **Workflow Run** | [%s](%s) |\n\n' "$RUN_ID" "$RUN_URL" >> "$PR_BODY_FILE"
          echo '### Review Checklist' >> "$PR_BODY_FILE"
          echo 'Verify retrieved metadata matches expected org changes' >> "$PR_BODY_FILE"
          echo 'Review generated package.xml in `manifest/retrive/`' >> "$PR_BODY_FILE"
          echo 'Review generated TestClass.txt in `manifest/retrive/`' >> "$PR_BODY_FILE"
          echo 'Confirm no unintended config or sensitive data was pulled' >> "$PR_BODY_FILE"
          echo "Approve and merge to keep \`${TARGET_BRANCH}\` in sync with \`${ENVIRONMENT}\` org" >> "$PR_BODY_FILE"

          # gh CLI handles auth via GH_TOKEN env var — no 403 issues
          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body-file "$PR_BODY_FILE" \
            --head  "$FEATURE_BRANCH" \
            --base  "$TARGET_BRANCH" \
            --repo  "$REPO")
          rm -f "$PR_BODY_FILE"

          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT
          echo "✅ PR created: $PR_URL"

      # ── Step 11: Summary ─────────────────────────────────────────────────────
      - name: Summary — No Changes
        if: steps.check-changes.outputs.has_changes == 'false'
        shell: bash
        env:
          ENVIRONMENT:   ${{ steps.resolve.outputs.ENVIRONMENT }}
          TARGET_BRANCH: ${{ steps.resolve.outputs.TARGET_BRANCH }}
        run: |
          echo "=========================================="
          echo "⚠️  NO CHANGES — ORG IN SYNC"
          echo "=========================================="
          echo "  Environment : $ENVIRONMENT"
          echo "  Branch      : $TARGET_BRANCH"
          echo "  Org metadata matches branch. No PR raised."
          echo "=========================================="

      - name: Summary — Retrieval Complete
        if: steps.check-changes.outputs.has_changes == 'true'
        shell: bash
        env:
          ENVIRONMENT:    ${{ steps.resolve.outputs.ENVIRONMENT }}
          TARGET_BRANCH:  ${{ steps.resolve.outputs.TARGET_BRANCH }}
          FEATURE_BRANCH: ${{ steps.resolve.outputs.FEATURE_BRANCH }}
          GENERATED_PKG:  ${{ steps.resolve.outputs.GENERATED_PKG }}
          GENERATED_TEST: ${{ steps.resolve.outputs.GENERATED_TEST }}
          CHANGED_COUNT:  ${{ steps.check-changes.outputs.changed_count }}
          TEST_CREATED:   ${{ steps.gen-artifacts.outputs.test_file_created }}
          PR_URL:         ${{ steps.raise-pr.outputs.pr_url }}
        run: |
          echo "=========================================="
          echo "✅ RETRIEVAL COMPLETE"
          echo "=========================================="
          echo "  Environment     : $ENVIRONMENT"
          echo "  Feature Branch  : $FEATURE_BRANCH"
          echo "  PR Target       : $TARGET_BRANCH"
          echo "  Files Changed   : $CHANGED_COUNT"
          echo "  Generated Pkg   : $GENERATED_PKG"
          echo "  Test Classes    : $( [[ "$TEST_CREATED" == "true" ]] && echo "$GENERATED_TEST" || echo "none found" )"
          echo "  PR              : $PR_URL"
          echo "=========================================="
