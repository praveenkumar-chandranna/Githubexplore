name: Lodha Salesforce Code Retrieval Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER: workflow_dispatch only.
# Scheduled runs are handled by Retrieve_Scheduler.yml which dispatches
# this workflow on the correct branch (DEV/QA/UAT/main) at the right time.
# Manual runs: Actions → Run workflow → select branch → Run
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      package_path:
        type: string
        description: >
          Relative path to retrieval package.xml. Defaults to manifest/package_retive.xml if blank.
        required: false

jobs:
  Retrieve_And_PR:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      SF_LOGIN_URL_TEST: ${{ secrets.SANDBOX_URL }}
      SF_LOGIN_URL_PROD: ${{ secrets.LOGIN_URL }}
      # gh CLI uses this automatically for all API calls including PR creation
      GH_TOKEN: ${{ secrets.GH_PAT }}

    steps:

      # ── Step 1: Resolve environment, branch name, paths ─────────────────────
      - name: Resolve environment and branch
        id: resolve
        shell: bash
        env:
          EVENT_NAME:    ${{ github.event_name }}
          INPUT_PKG:     ${{ github.event.inputs.package_path }}
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          # Derive ENVIRONMENT from the branch this workflow is running on
          case "$CURRENT_BRANCH" in
            DEV)  ENVIRONMENT="DEV"        ; ORG_LABEL="DEV sandbox"    ;;
            QA)   ENVIRONMENT="QA"         ; ORG_LABEL="QA sandbox"     ;;
            UAT)  ENVIRONMENT="UAT"        ; ORG_LABEL="UAT sandbox"    ;;
            main) ENVIRONMENT="PRODUCTION" ; ORG_LABEL="Production org" ;;
            *) echo "❌ Cannot derive environment from branch: $CURRENT_BRANCH"; exit 1 ;;
          esac

          TARGET_BRANCH="$CURRENT_BRANCH"
          echo "✅ Branch '${TARGET_BRANCH}' → ${ENVIRONMENT} (${ORG_LABEL})"

          PACKAGE_PATH="${INPUT_PKG:-manifest/package_retive.xml}"
          RETRIEVE_DATE=$(TZ='Asia/Kolkata' date +'%d%m%Y_%H%M')
          FEATURE_BRANCH="retrieve/${ENVIRONMENT}Code_${RETRIEVE_DATE}"
          GENERATED_PKG="manifest/retrieve/${ENVIRONMENT}Code_${RETRIEVE_DATE}_package.xml"
          GENERATED_TEST="manifest/retrieve/${ENVIRONMENT}Code_${RETRIEVE_DATE}_TestClass.txt"

          echo "ENVIRONMENT=${ENVIRONMENT}"       >> $GITHUB_OUTPUT
          echo "TARGET_BRANCH=${TARGET_BRANCH}"   >> $GITHUB_OUTPUT
          echo "FEATURE_BRANCH=${FEATURE_BRANCH}" >> $GITHUB_OUTPUT
          echo "RETRIEVE_DATE=${RETRIEVE_DATE}"   >> $GITHUB_OUTPUT
          echo "PACKAGE_PATH=${PACKAGE_PATH}"     >> $GITHUB_OUTPUT
          echo "GENERATED_PKG=${GENERATED_PKG}"   >> $GITHUB_OUTPUT
          echo "GENERATED_TEST=${GENERATED_TEST}" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "RETRIEVAL CONFIGURATION"
          echo "=========================================="
          echo "  Trigger        : $EVENT_NAME"
          echo "  Environment    : $ENVIRONMENT"
          echo "  Target Branch  : $TARGET_BRANCH"
          echo "  Feature Branch : $FEATURE_BRANCH"
          echo "  Retrieve Pkg   : $PACKAGE_PATH"
          echo "  Generated Pkg  : $GENERATED_PKG"
          echo "  Generated Test : $GENERATED_TEST"
          echo "  Triggered by   : ${{ github.actor }}"
          echo "=========================================="

      # ── Step 2: Checkout target env branch ──────────────────────────────────
      - name: Checkout ${{ steps.resolve.outputs.TARGET_BRANCH }} branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Ensure manifest/package_retive.xml exists
        shell: bash
        run: |
          if [[ ! -f "manifest/package_retive.xml" ]]; then
            echo "⚠️  manifest/package_retive.xml not found — fetching from main..."
            git fetch origin main
            git checkout origin/main -- manifest/package_retive.xml
            echo "✅ manifest/package_retive.xml restored from main"
          else
            echo "✅ manifest/package_retive.xml found"
          fi

      # ── Step 3: Tooling setup ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf --version

      # ── Step 4: JWT Auth ─────────────────────────────────────────────────────
      - name: Generate JWT private key file
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
          chmod 600 server.key

      - name: Set org credentials
        id: set-org
        shell: bash
        env:
          ENVIRONMENT:           ${{ steps.resolve.outputs.ENVIRONMENT }}
          SF_LOGIN_URL_TEST_VAL: ${{ env.SF_LOGIN_URL_TEST }}
          SF_LOGIN_URL_PROD_VAL: ${{ env.SF_LOGIN_URL_PROD }}
          KEY_DEV:    ${{ secrets.SALESFORCE_CONSUMER_KEY_DEV }}
          KEY_QA:     ${{ secrets.SALESFORCE_CONSUMER_KEY_QA }}
          KEY_UAT:    ${{ secrets.SALESFORCE_CONSUMER_KEY_UAT }}
          KEY_PROD:   ${{ secrets.SALESFORCE_CONSUMER_KEY_PROD }}
          KEY_HOTFIX: ${{ secrets.SALESFORCE_CONSUMER_KEY_HOTFIX }}
          USER_DEV:    ${{ secrets.SFDX_AUTH_DEV_USERNAME }}
          USER_QA:     ${{ secrets.SFDX_AUTH_QA_USERNAME }}
          USER_UAT:    ${{ secrets.SFDX_AUTH_UAT_USERNAME }}
          USER_PROD:   ${{ secrets.SFDX_AUTH_PROD_USERNAME }}
          USER_HOTFIX: ${{ secrets.SFDX_AUTH_HOTFIX_USERNAME }}
        run: |
          case "$ENVIRONMENT" in
            DEV)        echo "CLIENT_ID=$KEY_DEV"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_DEV"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            QA)         echo "CLIENT_ID=$KEY_QA"     >> $GITHUB_OUTPUT; echo "USERNAME=$USER_QA"     >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            UAT)        echo "CLIENT_ID=$KEY_UAT"    >> $GITHUB_OUTPUT; echo "USERNAME=$USER_UAT"    >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
            PRODUCTION) echo "CLIENT_ID=$KEY_PROD"   >> $GITHUB_OUTPUT; echo "USERNAME=$USER_PROD"   >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_PROD_VAL" >> $GITHUB_OUTPUT ;;
            HOTFIX)     echo "CLIENT_ID=$KEY_HOTFIX" >> $GITHUB_OUTPUT; echo "USERNAME=$USER_HOTFIX" >> $GITHUB_OUTPUT; echo "LOGIN_URL=$SF_LOGIN_URL_TEST_VAL" >> $GITHUB_OUTPUT ;;
          esac

      - name: Clear Prior Salesforce Sessions
        run: sf org logout --all --no-prompt || true

      - name: Authenticate to ${{ steps.resolve.outputs.ENVIRONMENT }} Org
        env:
          CLIENT_ID: ${{ steps.set-org.outputs.CLIENT_ID }}
          USERNAME:  ${{ steps.set-org.outputs.USERNAME }}
          LOGIN_URL: ${{ steps.set-org.outputs.LOGIN_URL }}
        run: |
          sf org login jwt \
            --client-id    "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username     "$USERNAME" \
            --instance-url "$LOGIN_URL" \
            --set-default

      # ── Step 5: Validate retrieval package.xml ───────────────────────────────
      - name: Validate retrieval package.xml exists
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.resolve.outputs.PACKAGE_PATH }}
        run: |
          if [[ ! -f "$PACKAGE_PATH" ]]; then
            echo "❌ package.xml not found: $PACKAGE_PATH"
            exit 1
          fi
          echo "✅ Using package: $PACKAGE_PATH"
          cat "$PACKAGE_PATH"

      # ── Step 6: Retrieve metadata ────────────────────────────────────────────
      - name: Retrieve metadata from ${{ steps.resolve.outputs.ENVIRONMENT }} Org
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.resolve.outputs.PACKAGE_PATH }}
          ORG_USERNAME: ${{ steps.set-org.outputs.USERNAME }}
        run: |
          echo "⬇️  Retrieving metadata using: $PACKAGE_PATH"
          sf project retrieve start \
            --manifest   "$PACKAGE_PATH" \
            --target-org "$ORG_USERNAME" \
            --wait 30
          echo "✅ Retrieval complete"

      - name: Cleanup JWT key
        if: always()
        run: rm -f server.key

      # ── Step 7: Detect changes ───────────────────────────────────────────────
      - name: Check for changes
        id: check-changes
        shell: bash
        run: |
          git add force-app
          CHANGED=$(git diff --cached --name-only | wc -l | xargs)
          echo "changed_count=${CHANGED}" >> $GITHUB_OUTPUT

          if [[ "$CHANGED" -eq 0 ]]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⚠️  No metadata changes — org is already in sync with branch."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ ${CHANGED} file(s) staged:"
            echo "=========================================="
            git diff --cached --name-status
            echo "=========================================="
          fi

      # ── Step 8: Generate package.xml and TestClass.txt ───────────────────────
      - name: Generate package.xml and TestClass.txt
        if: steps.check-changes.outputs.has_changes == 'true'
        id: gen-artifacts
        shell: bash
        env:
          GENERATED_PKG:  ${{ steps.resolve.outputs.GENERATED_PKG }}
          GENERATED_TEST: ${{ steps.resolve.outputs.GENERATED_TEST }}
          ORG_USERNAME:   ${{ steps.set-org.outputs.USERNAME }}
        run: |
          mkdir -p "$(dirname "$GENERATED_PKG")"

          API_VERSION=$(grep -oP '(?<=sourceApiVersion": ")[^"]+' sfdx-project.json 2>/dev/null || echo "67.0")

          # ── Generate package.xml from staged changed files ────────────────
          echo "📦 Generating package.xml from changed files..."

          # ── Folder → Metadata API type name ─────────────────────────────
          # Source: Salesforce Metadata API Developer Guide (folder = DX source path segment)
          declare -A TYPE_MAP
          # Bundles — member = component folder name
          TYPE_MAP["lwc"]="LightningComponentBundle"
          TYPE_MAP["aura"]="AuraDefinitionBundle"
          TYPE_MAP["experiences"]="ExperienceBundle"
          # Apex
          TYPE_MAP["classes"]="ApexClass"
          TYPE_MAP["triggers"]="ApexTrigger"
          TYPE_MAP["pages"]="ApexPage"
          TYPE_MAP["components"]="ApexComponent"
          # Objects (top-level; sub-types handled via SUBFOLDER_MAP)
          TYPE_MAP["objects"]="CustomObject"
          # UI / App
          TYPE_MAP["layouts"]="Layout"
          TYPE_MAP["flexipages"]="FlexiPage"
          TYPE_MAP["applications"]="CustomApplication"
          TYPE_MAP["tabs"]="CustomTab"
          TYPE_MAP["globalValueSets"]="GlobalValueSet"
          TYPE_MAP["standardValueSets"]="StandardValueSet"
          TYPE_MAP["pathAssistants"]="PathAssistant"
          TYPE_MAP["quickActions"]="QuickAction"
          TYPE_MAP["listViews"]="ListView"
          TYPE_MAP["compactLayouts"]="CompactLayout"
          # Automation
          TYPE_MAP["flows"]="Flow"
          TYPE_MAP["flowDefinitions"]="FlowDefinition"
          TYPE_MAP["workflows"]="Workflow"
          TYPE_MAP["approvalProcesses"]="ApprovalProcess"
          TYPE_MAP["assignmentRules"]="AssignmentRules"
          TYPE_MAP["autoResponseRules"]="AutoResponseRules"
          TYPE_MAP["escalationRules"]="EscalationRules"
          TYPE_MAP["matchingRules"]="MatchingRules"
          # Security / Access
          TYPE_MAP["permissionsets"]="PermissionSet"
          TYPE_MAP["permissionsetgroups"]="PermissionSetGroup"
          TYPE_MAP["profiles"]="Profile"
          TYPE_MAP["roles"]="Role"
          TYPE_MAP["groups"]="Group"
          TYPE_MAP["queues"]="Queue"
          TYPE_MAP["sharingRules"]="SharingRules"
          TYPE_MAP["sharingCriteriaRules"]="SharingCriteriaRule"
          TYPE_MAP["sharingOwnerRules"]="SharingOwnerRule"
          TYPE_MAP["mutingPermissionSets"]="MutingPermissionSet"
          # Data / Config
          TYPE_MAP["customMetadata"]="CustomMetadata"
          TYPE_MAP["customPermissions"]="CustomPermission"
          TYPE_MAP["labels"]="CustomLabels"
          TYPE_MAP["settings"]="Settings"
          TYPE_MAP["namedCredentials"]="NamedCredential"
          TYPE_MAP["externalCredentials"]="ExternalCredential"
          TYPE_MAP["remoteSiteSettings"]="RemoteSiteSetting"
          TYPE_MAP["cspTrustedSites"]="CspTrustedSite"
          TYPE_MAP["connectedApps"]="ConnectedApp"
          TYPE_MAP["authProviders"]="AuthProvider"
          # Assets / Resources
          TYPE_MAP["staticresources"]="StaticResource"
          TYPE_MAP["contentassets"]="ContentAsset"
          TYPE_MAP["documents"]="Document"
          # Email
          TYPE_MAP["emailTemplates"]="EmailTemplate"
          TYPE_MAP["email"]="EmailTemplate"
          # Reports / Dashboards (folder-based: FolderName/ItemName)
          TYPE_MAP["reportTypes"]="ReportType"
          TYPE_MAP["reports"]="Report"
          TYPE_MAP["dashboards"]="Dashboard"
          # Integrations / Platform Events
          TYPE_MAP["platformEventChannels"]="PlatformEventChannel"
          TYPE_MAP["platformEventChannelMembers"]="PlatformEventChannelMember"
          TYPE_MAP["externalDataSources"]="ExternalDataSource"
          TYPE_MAP["externalServices"]="ExternalService"
          # Einstein / AI
          TYPE_MAP["aiApplications"]="AIApplication"
          TYPE_MAP["aiApplicationConfigs"]="AIApplicationConfig"
          TYPE_MAP["botVersions"]="BotVersion"
          TYPE_MAP["bots"]="Bot"
          TYPE_MAP["mlDomains"]="MLDomain"
          # Misc
          TYPE_MAP["siteDotComSites"]="SiteDotCom"
          TYPE_MAP["sites"]="CustomSite"
          TYPE_MAP["networks"]="Network"
          TYPE_MAP["networkBranding"]="NetworkBranding"
          TYPE_MAP["territory2Models"]="Territory2Model"
          TYPE_MAP["territory2Types"]="Territory2Type"
          TYPE_MAP["territory2"]="Territory2"
          TYPE_MAP["territory2Rules"]="Territory2Rule"
          TYPE_MAP["dataSources"]="DataSource"
          TYPE_MAP["duplicateRules"]="DuplicateRule"
          TYPE_MAP["cleanDataServices"]="CleanDataService"
          TYPE_MAP["corsWhitelistOrigins"]="CorsWhitelistOrigin"
          TYPE_MAP["callCenters"]="CallCenter"
          TYPE_MAP["caseSubjectParticles"]="CaseSubjectParticle"
          TYPE_MAP["communities"]="Community"
          TYPE_MAP["communityTemplateDefinitions"]="CommunityTemplateDefinition"
          TYPE_MAP["communityThemeDefinitions"]="CommunityThemeDefinition"
          TYPE_MAP["notificationTypeConfig"]="NotificationTypeConfig"
          TYPE_MAP["notifTypes"]="NotificationTypeConfig"
          TYPE_MAP["managedTopics"]="ManagedTopic"
          TYPE_MAP["navigationMenus"]="NavigationMenu"
          TYPE_MAP["recommendationStrategies"]="RecommendationStrategy"
          TYPE_MAP["userCriteria"]="UserCriteria"
          TYPE_MAP["moderation"]="ModerationRule"
          TYPE_MAP["wave"]="WaveApplication"
          TYPE_MAP["waveTemplates"]="WaveTemplateBundle"
          TYPE_MAP["waveDashboards"]="WaveDashboard"
          TYPE_MAP["waveDataflows"]="WaveDataflow"
          TYPE_MAP["waveDatasets"]="WaveDataset"
          TYPE_MAP["waveLenses"]="WaveLens"
          TYPE_MAP["waveRecipes"]="WaveRecipe"
          TYPE_MAP["waveXmds"]="WaveXmd"
          TYPE_MAP["omniDataTransforms"]="OmniDataTransform"
          TYPE_MAP["omniIntegrationProcedures"]="OmniIntegrationProcedure"
          TYPE_MAP["omniScripts"]="OmniScript"
          TYPE_MAP["omniUiCard"]="OmniUiCard"
          TYPE_MAP["decisionMatrices"]="DecisionMatrix"
          TYPE_MAP["decisionMatrixVersions"]="DecisionMatrixVersion"
          TYPE_MAP["expressionSetDefinitions"]="ExpressionSetDefinition"
          TYPE_MAP["expressionSetDefinitionVersions"]="ExpressionSetDefinitionVersion"

          # ── Sub-folder types nested under objects/ ────────────────────────
          declare -A SUBFOLDER_MAP
          SUBFOLDER_MAP["fields"]="CustomField"
          SUBFOLDER_MAP["validationRules"]="ValidationRule"
          SUBFOLDER_MAP["recordTypes"]="RecordType"
          SUBFOLDER_MAP["listViews"]="ListView"
          SUBFOLDER_MAP["webLinks"]="WebLink"
          SUBFOLDER_MAP["compactLayouts"]="CompactLayout"
          SUBFOLDER_MAP["businessProcesses"]="BusinessProcess"
          SUBFOLDER_MAP["fieldSets"]="FieldSet"
          SUBFOLDER_MAP["sharingReasons"]="SharingReason"
          SUBFOLDER_MAP["indexes"]="Index"
          SUBFOLDER_MAP["searchLayouts"]="SearchLayouts"

          # ── Strip -meta.xml suffix, preserving dots in the name itself ──
          # e.g. MyClass.cls-meta.xml → MyClass
          #      MyType__mdt.MyRecord.md-meta.xml → MyType__mdt.MyRecord
          #      Account-My Layout.layout-meta.xml → Account-My Layout
          strip_ext() {
            echo "$1" | sed 's/-meta\.xml$//' | sed 's/\.[a-zA-Z0-9_-]*$//'
          }

          declare -A TYPE_MEMBERS
          while IFS= read -r FPATH; do
            [[ -z "$FPATH" ]] && continue
            [[ ! "$FPATH" =~ ^force-app/ ]] && continue
            FOLDER=$(echo "$FPATH" | grep -oP 'force-app/main/default/\K[^/]+')
            [[ -z "$FOLDER" ]] && continue

            META_TYPE="${TYPE_MAP[$FOLDER]:-}"
            [[ -z "$META_TYPE" ]] && continue

            # For bundle types: any file inside the bundle folder → member = bundle folder name
            if [[ "$META_TYPE" == "LightningComponentBundle" || "$META_TYPE" == "AuraDefinitionBundle" || "$META_TYPE" == "ExperienceBundle" || "$META_TYPE" == "WaveTemplateBundle" ]]; then
              MEMBER=$(echo "$FPATH" | grep -oP "force-app/main/default/${FOLDER}/\K[^/]+")
              [[ -z "$MEMBER" ]] && continue
              TYPE_MEMBERS["$META_TYPE"]+="${MEMBER}"$'\n'
              continue
            fi

            # For all non-bundle types: only process -meta.xml files
            [[ ! "$FPATH" =~ -meta\.xml$ ]] && continue

            if [[ "$FOLDER" == "objects" ]]; then
              SUBFOLDER=$(echo "$FPATH" | grep -oP 'force-app/main/default/objects/[^/]+/\K[^/]+')
              OBJ_NAME=$(echo "$FPATH" | grep -oP 'force-app/main/default/objects/\K[^/]+')
              SUB_META_TYPE=""
              [[ -n "$SUBFOLDER" ]] && SUB_META_TYPE="${SUBFOLDER_MAP[$SUBFOLDER]:-}"
              if [[ -n "$SUB_META_TYPE" ]]; then
                META_TYPE="$SUB_META_TYPE"
                MEMBER="${OBJ_NAME}.$(strip_ext "$(basename "$FPATH")")"
              else
                META_TYPE="CustomObject"
                MEMBER="$(strip_ext "$OBJ_NAME")"
              fi
            elif [[ "$META_TYPE" == "Report" || "$META_TYPE" == "Dashboard" || "$META_TYPE" == "EmailTemplate" || "$META_TYPE" == "Document" ]]; then
              MEMBER=$(echo "$FPATH" | grep -oP "force-app/main/default/${FOLDER}/\K[^/]+/[^/]+")
              MEMBER=$(strip_ext "$MEMBER")
            elif [[ "$META_TYPE" == "CustomLabels" ]]; then
              MEMBER="CustomLabels"
            else
              MEMBER=$(strip_ext "$(basename "$FPATH")")
            fi

            [[ -z "$MEMBER" ]] && continue
            TYPE_MEMBERS["$META_TYPE"]+="${MEMBER}"$'\n'
          done < <(git diff --cached --name-only)

          if [[ ${#TYPE_MEMBERS[@]} -eq 0 ]]; then
            echo "⚠️  No force-app metadata found — skipping package.xml"
          else
            PKG_TMP=$(mktemp)
            printf '<?xml version="1.0" encoding="UTF-8"?>\n' >> "$PKG_TMP"
            printf '<Package xmlns="http://soap.sforce.com/2006/04/metadata">\n' >> "$PKG_TMP"
            while IFS= read -r TYPE; do
              [[ -z "$TYPE" ]] && continue
              printf '    <types>\n' >> "$PKG_TMP"
              MEMBERS_SORTED=$(echo "${TYPE_MEMBERS[$TYPE]}" | sort -u | grep -v '^$')
              while IFS= read -r M; do
                [[ -z "$M" ]] && continue
                printf '        <members>%s</members>\n' "$M" >> "$PKG_TMP"
              done <<< "$MEMBERS_SORTED"
              printf '        <name>%s</name>\n' "$TYPE" >> "$PKG_TMP"
              printf '    </types>\n' >> "$PKG_TMP"
            done < <(echo "${!TYPE_MEMBERS[@]}" | tr ' ' '\n' | sort)
            printf '    <version>%s</version>\n' "$API_VERSION" >> "$PKG_TMP"
            printf '</Package>\n' >> "$PKG_TMP"
            mv "$PKG_TMP" "$GENERATED_PKG"
            echo "✅ package.xml ready: $GENERATED_PKG"
            echo ""
            echo "=========================================="
            echo "📦 GENERATED PACKAGE.XML"
            echo "=========================================="
            cat "$GENERATED_PKG"
            echo "=========================================="
          fi

          # ── Generate TestClass.txt ────────────────────────────────────────
          # Strategy:
          # 1. Collect all ApexClass members from the generated package.xml
          # 2. For each class, check if its .cls file on disk has @isTest → it IS a test class
          # 3. For each non-test class, check if a corresponding test class exists on disk
          #    by scanning all @isTest classes whose file content references the class name
          # Result: complete, accurate test class list regardless of naming convention
          echo ""
          echo "🧪 Scanning for test classes..."

          CLASSES_DIR="force-app/main/default/classes"
          declare -A TEST_CLASS_SET

          # Step A: collect all ApexClass members from the package.xml we just generated
          declare -a PKG_CLASSES
          if [[ -f "$GENERATED_PKG" ]]; then
            # Parse package.xml: extract members only from the ApexClass <types> block
            IN_APEX_BLOCK=0
            while IFS= read -r line; do
              [[ "$line" =~ \</types\> ]]          && IN_APEX_BLOCK=0
              [[ "$line" =~ \<name\>ApexClass\</name\> ]] && IN_APEX_BLOCK=1
              if [[ $IN_APEX_BLOCK -eq 1 && "$line" =~ \<members\> ]]; then
                CNAME=$(echo "$line" | sed 's/.*<members>//;s/<\/members>.*//' | xargs)
                [[ -n "$CNAME" && "$CNAME" != "*" ]] && PKG_CLASSES+=("$CNAME")
              fi
            done < "$GENERATED_PKG"
          fi

          # Step B: build a map of ALL @isTest classes — from disk AND staged new files
          declare -A ALL_TEST_CLASSES
          scan_for_istest() {
            local CLSFILE="$1"
            [[ "$CLSFILE" =~ -meta\.xml$ ]] && return
            if grep -qiE '^[[:space:]]*@isTest' "$CLSFILE" 2>/dev/null; then
              CNAME=$(basename "$CLSFILE" .cls)
              ALL_TEST_CLASSES["$CNAME"]="$CLSFILE"
            fi
          }

          # Scan existing files on disk
          if [[ -d "$CLASSES_DIR" ]]; then
            while IFS= read -r CLSFILE; do
              scan_for_istest "$CLSFILE"
            done < <(find "$CLASSES_DIR" -maxdepth 1 -name '*.cls')
          fi

          # Also scan staged (newly retrieved) .cls files not yet on disk
          while IFS= read -r FPATH; do
            [[ "$FPATH" =~ ^force-app/.*classes/.*\.cls$ ]] || continue
            [[ "$FPATH" =~ -meta\.xml$ ]] && continue
            # git show reads the staged content without needing the file on disk
            if git show ":${FPATH}" 2>/dev/null | grep -qiE '^[[:space:]]*@isTest'; then
              CNAME=$(basename "$FPATH" .cls)
              ALL_TEST_CLASSES["$CNAME"]="$FPATH"
            fi
          done < <(git diff --cached --name-only)

          echo "  📋 @isTest classes found on disk: ${#ALL_TEST_CLASSES[@]}"

          # Deduplicate PKG_CLASSES
          declare -A _SEEN_CLASSES
          declare -a UNIQUE_PKG_CLASSES
          for _C in "${PKG_CLASSES[@]}"; do
            [[ -z "$_C" ]] && continue
            [[ -n "${_SEEN_CLASSES[$_C]:-}" ]] && continue
            _SEEN_CLASSES["$_C"]=1
            UNIQUE_PKG_CLASSES+=("$_C")
          done

          # Step C: for each class in the package, resolve its test class(es)
          for CNAME in "${UNIQUE_PKG_CLASSES[@]}"; do
            [[ -z "$CNAME" ]] && continue

            # If the class itself is @isTest → add it directly
            if [[ -n "${ALL_TEST_CLASSES[$CNAME]:-}" ]]; then
              TEST_CLASS_SET["$CNAME"]=1
              echo "  ✅ Direct test class: $CNAME"
              continue
            fi

            # Otherwise scan all @isTest classes for a reference to this class
            for TC in "${!ALL_TEST_CLASSES[@]}"; do
              TCPATH="${ALL_TEST_CLASSES[$TC]}"
              # Read from disk if exists, otherwise from git staging area
              if [[ -f "$TCPATH" ]]; then
                CONTENT=$(cat "$TCPATH" 2>/dev/null)
              else
                CONTENT=$(git show ":${TCPATH}" 2>/dev/null)
              fi
              if echo "$CONTENT" | grep -qw "$CNAME"; then
                TEST_CLASS_SET["$TC"]=1
                echo "  ✅ Test class for $CNAME → $TC"
              fi
            done
          done

          TEST_CLASSES=$(echo "${!TEST_CLASS_SET[@]}" | tr ' ' '\n' | sort | tr '\n' ' ' | xargs)

          if [[ -n "$TEST_CLASSES" ]]; then
            echo "$TEST_CLASSES" > "$GENERATED_TEST"
            echo ""
            echo "✅ TestClass.txt generated: $GENERATED_TEST"
            echo "=========================================="
            echo "🧪 GENERATED TESTCLASS.TXT"
            echo "=========================================="
            cat "$GENERATED_TEST"
            echo "=========================================="
            echo "test_file_created=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  No test classes found for retrieved metadata"
            echo "test_file_created=false" >> $GITHUB_OUTPUT
          fi

      # ── Step 9: Create feature branch, commit, push ──────────────────────────
      - name: Setup SSH Signing Key
        if: steps.check-changes.outputs.has_changes == 'true'
        shell: bash
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: |
          if [[ -z "$SSH_SIGNING_KEY" ]]; then
            echo "❌ SSH_SIGNING_KEY secret is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_SIGNING_KEY" | sed 's/\\n/\n/g' > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          ssh-keygen -y -f ~/.ssh/signing_key > ~/.ssh/signing_key.pub
          chmod 644 ~/.ssh/signing_key.pub
          echo "✅ SSH signing key ready"

      - name: Create feature branch and push
        if: steps.check-changes.outputs.has_changes == 'true'
        shell: bash
        env:
          FEATURE_BRANCH: ${{ steps.resolve.outputs.FEATURE_BRANCH }}
          ENVIRONMENT:    ${{ steps.resolve.outputs.ENVIRONMENT }}
          RETRIEVE_DATE:  ${{ steps.resolve.outputs.RETRIEVE_DATE }}
          GIT_USER_NAME:  ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GH_PAT:         ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO:           ${{ github.repository }}
          ACTOR:          ${{ github.actor }}
          EVENT_NAME:     ${{ github.event_name }}
        run: |
          git config user.name  "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/signing_key.pub
          git config commit.gpgsign true
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${REPO}.git"

          git checkout -b "$FEATURE_BRANCH"
          git add -A

          TRIGGER="scheduled"
          [[ "$EVENT_NAME" == "workflow_dispatch" ]] && TRIGGER="manual by ${ACTOR}"

          git commit -S -m "retrieve(${ENVIRONMENT}): org sync ${RETRIEVE_DATE} [${TRIGGER}]"
          git push origin "$FEATURE_BRANCH"

          echo "✅ SSH-signed commit pushed: $FEATURE_BRANCH"

      - name: Cleanup SSH Signing Key
        if: always()
        run: rm -f ~/.ssh/signing_key ~/.ssh/signing_key.pub

      # ── Step 10: Raise PR using gh CLI (fixes 403) ───────────────────────────
      - name: Raise Pull Request → ${{ steps.resolve.outputs.TARGET_BRANCH }}
        if: steps.check-changes.outputs.has_changes == 'true'
        id: raise-pr
        shell: bash
        env:
          GH_TOKEN:       ${{ secrets.GH_PAT }}
          FEATURE_BRANCH: ${{ steps.resolve.outputs.FEATURE_BRANCH }}
          TARGET_BRANCH:  ${{ steps.resolve.outputs.TARGET_BRANCH }}
          ENVIRONMENT:    ${{ steps.resolve.outputs.ENVIRONMENT }}
          PACKAGE_PATH:   ${{ steps.resolve.outputs.PACKAGE_PATH }}
          GENERATED_PKG:  ${{ steps.resolve.outputs.GENERATED_PKG }}
          GENERATED_TEST: ${{ steps.resolve.outputs.GENERATED_TEST }}
          RETRIEVE_DATE:  ${{ steps.resolve.outputs.RETRIEVE_DATE }}
          CHANGED_COUNT:  ${{ steps.check-changes.outputs.changed_count }}
          TEST_CREATED:   ${{ steps.gen-artifacts.outputs.test_file_created }}
          ACTOR:          ${{ github.actor }}
          EVENT_NAME:     ${{ github.event_name }}
          RUN_ID:         ${{ github.run_id }}
          REPO:           ${{ github.repository }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "❌ GH_PAT secret is not set. Cannot create PR."
            echo "   → Repo Settings → Secrets → Actions → add GH_PAT"
            echo "   → Fine-grained PAT with Contents + Pull Requests read/write"
            exit 1
          fi

          RETRIEVE_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          TRIGGER="Scheduled"
          [[ "$EVENT_NAME" == "workflow_dispatch" ]] && TRIGGER="Manual (${ACTOR})"

          TEST_LINE=""
          [[ "$TEST_CREATED" == "true" ]] && TEST_LINE="| **Test Classes** | \`${GENERATED_TEST}\` |"

          PR_TITLE="⬇️ [Retrieve] ${ENVIRONMENT} org sync | ${RETRIEVE_DATE}"

          PR_BODY_FILE=$(mktemp)
          printf '## Salesforce Metadata Retrieval -- %s\n\n' "$ENVIRONMENT" >> "$PR_BODY_FILE"
          printf '| Field | Value |\n|---|---|\n' >> "$PR_BODY_FILE"
          printf '| **Environment** | `%s` |\n' "$ENVIRONMENT" >> "$PR_BODY_FILE"
          printf '| **Feature Branch** | `%s` |\n' "$FEATURE_BRANCH" >> "$PR_BODY_FILE"
          printf '| **Target Branch** | `%s` |\n' "$TARGET_BRANCH" >> "$PR_BODY_FILE"
          printf '| **Retrieval Package** | `%s` |\n' "$PACKAGE_PATH" >> "$PR_BODY_FILE"
          printf '| **Generated Package** | `%s` |\n' "$GENERATED_PKG" >> "$PR_BODY_FILE"
          [[ -n "$TEST_LINE" ]] && printf '%s\n' "$TEST_LINE" >> "$PR_BODY_FILE"
          printf '| **Files Changed** | %s |\n' "$CHANGED_COUNT" >> "$PR_BODY_FILE"
          printf '| **Retrieved at** | %s |\n' "$RETRIEVE_TIME" >> "$PR_BODY_FILE"
          printf '| **Trigger** | %s |\n' "$TRIGGER" >> "$PR_BODY_FILE"
          printf '| **Workflow Run** | [%s](%s) |\n\n' "$RUN_ID" "$RUN_URL" >> "$PR_BODY_FILE"
          echo '### Review Checklist' >> "$PR_BODY_FILE"
          echo 'Verify retrieved metadata matches expected org changes' >> "$PR_BODY_FILE"
          echo 'Review generated package.xml in `manifest/retrive/`' >> "$PR_BODY_FILE"
          echo 'Review generated TestClass.txt in `manifest/retrive/`' >> "$PR_BODY_FILE"
          echo 'Confirm no unintended config or sensitive data was pulled' >> "$PR_BODY_FILE"
          echo "Approve and merge to keep \`${TARGET_BRANCH}\` in sync with \`${ENVIRONMENT}\` org" >> "$PR_BODY_FILE"

          # gh CLI handles auth via GH_TOKEN env var — no 403 issues
          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body-file "$PR_BODY_FILE" \
            --head  "$FEATURE_BRANCH" \
            --base  "$TARGET_BRANCH" \
            --repo  "$REPO")
          rm -f "$PR_BODY_FILE"

          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT
          echo "✅ PR created: $PR_URL"

      # ── Step 11: Summary ─────────────────────────────────────────────────────
      - name: Summary — No Changes
        if: steps.check-changes.outputs.has_changes == 'false'
        shell: bash
        env:
          ENVIRONMENT:   ${{ steps.resolve.outputs.ENVIRONMENT }}
          TARGET_BRANCH: ${{ steps.resolve.outputs.TARGET_BRANCH }}
        run: |
          echo "=========================================="
          echo "⚠️  NO CHANGES — ORG IN SYNC"
          echo "=========================================="
          echo "  Environment : $ENVIRONMENT"
          echo "  Branch      : $TARGET_BRANCH"
          echo "  Org metadata matches branch. No PR raised."
          echo "=========================================="

      - name: Summary — Retrieval Complete
        if: steps.check-changes.outputs.has_changes == 'true'
        shell: bash
        env:
          ENVIRONMENT:    ${{ steps.resolve.outputs.ENVIRONMENT }}
          TARGET_BRANCH:  ${{ steps.resolve.outputs.TARGET_BRANCH }}
          FEATURE_BRANCH: ${{ steps.resolve.outputs.FEATURE_BRANCH }}
          GENERATED_PKG:  ${{ steps.resolve.outputs.GENERATED_PKG }}
          GENERATED_TEST: ${{ steps.resolve.outputs.GENERATED_TEST }}
          CHANGED_COUNT:  ${{ steps.check-changes.outputs.changed_count }}
          TEST_CREATED:   ${{ steps.gen-artifacts.outputs.test_file_created }}
          PR_URL:         ${{ steps.raise-pr.outputs.pr_url }}
        run: |
          echo "=========================================="
          echo "✅ RETRIEVAL COMPLETE"
          echo "=========================================="
          echo "  Environment     : $ENVIRONMENT"
          echo "  Feature Branch  : $FEATURE_BRANCH"
          echo "  PR Target       : $TARGET_BRANCH"
          echo "  Files Changed   : $CHANGED_COUNT"
          echo "  Generated Pkg   : $GENERATED_PKG"
          echo "  Test Classes    : $( [[ "$TEST_CREATED" == "true" ]] && echo "$GENERATED_TEST" || echo "none found" )"
          echo "  PR              : $PR_URL"
          echo "=========================================="
