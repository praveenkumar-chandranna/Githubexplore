name: PR Validation Against Destination Org

on:
  pull_request:
    branches:
      - DEV
      - QA
      - UAT
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  # Job 1: Check if PR is from main branch
  check_source_branch:
    name: Check PR Source Branch
    runs-on: ubuntu-latest
    outputs:
      should_validate: ${{ steps.verify.outputs.should_validate }}
    
    steps:
      - name: Verify Source Branch
        id: verify
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          echo "PR Source Branch: $SOURCE_BRANCH"
          
          if [[ "$SOURCE_BRANCH" == "main" ]]; then
            echo "❌ PR from 'main' branch detected - SKIPPING validation"
            echo "should_validate=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ PR from '$SOURCE_BRANCH' - ALLOWING validation"
            echo "should_validate=true" >> "$GITHUB_OUTPUT"
          fi

  # Job 2: Skip notification
  notify_main_skip:
    name: Notify - Validation Skipped
    needs: check_source_branch
    if: needs.check_source_branch.outputs.should_validate == 'false'
    runs-on: ubuntu-latest
    
    steps:
      - name: Validation Skipped
        shell: bash
        run: |
          echo "=========================================="
          echo "⚠️  VALIDATION SKIPPED"
          echo "=========================================="
          echo "PR Raised from 'main' branch"
          echo "Please run Validation for Feature Branch"
          echo "=========================================="

  # Job 3: Main validation job
  Pre_Validation_Build:
    needs: check_source_branch
    if: needs.check_source_branch.outputs.should_validate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    outputs:
      has_findings:  ${{ steps.gitleaks.outputs.has_findings }}
      has_pii:       ${{ steps.gitleaks.outputs.has_pii }}
      has_secret:    ${{ steps.gitleaks.outputs.has_secret }}
      has_profanity: ${{ steps.gitleaks.outputs.has_profanity }}
      finding_summary: ${{ steps.gitleaks.outputs.finding_summary }}
      head_ref:      ${{ github.head_ref }}
      base_ref:      ${{ github.base_ref }}
      actor:         ${{ github.actor }}
      pr_number:     ${{ github.event.pull_request.number }}
      run_id:        ${{ github.run_id }}
      repo:          ${{ github.repository }}
      num_violations:    ${{ steps.run-scanner.outputs.num-violations }}
      num_sev1:          ${{ steps.run-scanner.outputs.num-sev1-violations }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Install Salesforce Code Analyzer Plugin
        run: sf plugins install code-analyzer@latest

      - name: Generate JWT Key File
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
          chmod 600 server.key

      - name: Set Source and Destination Branch
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          DEST_BRANCH: ${{ github.base_ref }}
        run: |
          echo "SOURCE_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"
          echo "DEST_BRANCH=$DEST_BRANCH" >> "$GITHUB_ENV"

      - name: Select Salesforce Org Based on Destination Branch
        shell: bash
        env:
          DEST_BRANCH: ${{ env.DEST_BRANCH }}
          AUTH_DEV_USERNAME: ${{ secrets.SFDX_AUTH_DEV_USERNAME }}
          AUTH_QA_USERNAME: ${{ secrets.SFDX_AUTH_QA_USERNAME }}
          AUTH_UAT_USERNAME: ${{ secrets.SFDX_AUTH_UAT_USERNAME }}
          AUTH_PROD_USERNAME: ${{ secrets.SFDX_AUTH_PROD_USERNAME }}
          SANDBOX_URL: ${{ secrets.SANDBOX_URL }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          CONSUMER_KEY_DEV: ${{ secrets.SALESFORCE_CONSUMER_KEY_DEV }}
          CONSUMER_KEY_QA: ${{ secrets.SALESFORCE_CONSUMER_KEY_QA }}
          CONSUMER_KEY_UAT: ${{ secrets.SALESFORCE_CONSUMER_KEY_UAT }}
          CONSUMER_KEY_PROD: ${{ secrets.SALESFORCE_CONSUMER_KEY_PROD }}
        run: |
          case "$DEST_BRANCH" in
            DEV)
              echo "SF_USERNAME=$AUTH_DEV_USERNAME" >> "$GITHUB_ENV"
              echo "SF_INSTANCE_URL=$SANDBOX_URL" >> "$GITHUB_ENV"
              echo "SF_CLIENT_ID=$CONSUMER_KEY_DEV" >> "$GITHUB_ENV"
              echo "TARGET_ORG_NAME=DEV" >> "$GITHUB_ENV"
              echo "🎯 Target Org: DEV"
              ;;
            QA)
              echo "SF_USERNAME=$AUTH_QA_USERNAME" >> "$GITHUB_ENV"
              echo "SF_INSTANCE_URL=$SANDBOX_URL" >> "$GITHUB_ENV"
              echo "SF_CLIENT_ID=$CONSUMER_KEY_QA" >> "$GITHUB_ENV"
              echo "TARGET_ORG_NAME=QA" >> "$GITHUB_ENV"
              echo "🎯 Target Org: QA"
              ;;
            UAT)
              echo "SF_USERNAME=$AUTH_UAT_USERNAME" >> "$GITHUB_ENV"
              echo "SF_INSTANCE_URL=$SANDBOX_URL" >> "$GITHUB_ENV"
              echo "SF_CLIENT_ID=$CONSUMER_KEY_UAT" >> "$GITHUB_ENV"
              echo "TARGET_ORG_NAME=UAT" >> "$GITHUB_ENV"
              echo "🎯 Target Org: UAT"
              ;;
            main)
              echo "SF_USERNAME=$AUTH_PROD_USERNAME" >> "$GITHUB_ENV"
              echo "SF_INSTANCE_URL=$LOGIN_URL" >> "$GITHUB_ENV"
              echo "SF_CLIENT_ID=$CONSUMER_KEY_PROD" >> "$GITHUB_ENV"
              echo "TARGET_ORG_NAME=PRODUCTION" >> "$GITHUB_ENV"
              echo "🎯 Target Org: PRODUCTION"
              ;;
            *)
              echo "❌ Invalid target branch: $DEST_BRANCH"
              exit 1
              ;;
          esac

      - name: Clear Prior Salesforce Sessions
        shell: bash
        run: |
          echo "🧹 Clearing existing Salesforce org sessions..."
          sf org logout --all --no-prompt || true

      - name: Authenticate Salesforce - ${{ env.TARGET_ORG_NAME }} Org
        shell: bash
        run: |
          echo "🔐 Authenticating with Salesforce..."
          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --set-default
          
          if [[ $? -eq 0 ]]; then
            echo "✅ Successfully authenticated with Salesforce"
          else
            echo "❌ Authentication failed"
            exit 1
          fi

      - name: Check if Package Manifest Exists
        id: check_package
        shell: bash
        run: |
          PKG_MANIFEST="${GITHUB_WORKSPACE}/manifest/${SOURCE_BRANCH}_package.xml"
          
          echo "Checking for package manifest at: $PKG_MANIFEST"
          
          if [[ -f "$PKG_MANIFEST" ]]; then
            echo "✅ Package manifest found: $PKG_MANIFEST"
            echo "package_exists=true" >> "$GITHUB_OUTPUT"
            echo "package_path=$PKG_MANIFEST" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Package manifest not found"
            echo "Expected location: $PKG_MANIFEST"
            echo ""
            echo "Please ensure the following file exists in your repository:"
            echo "  manifest/${SOURCE_BRANCH}_package.xml"
            echo ""
            echo "package_exists=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Prepare Test Classes
        id: prepare_manifest
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.check_package.outputs.package_path }}
        run: |
          TEST_CLASS_FILE="${GITHUB_WORKSPACE}/manifest/${SOURCE_BRANCH}_TestClass.txt"

          echo "Checking for test class file at: $TEST_CLASS_FILE"
          
          if [[ -f "$TEST_CLASS_FILE" ]]; then
            TEST_CLASSES=$(<"$TEST_CLASS_FILE")
            
            # Trim leading/trailing whitespace and newlines
            TEST_CLASSES="${TEST_CLASSES#"${TEST_CLASSES%%[![:space:]]*}"}"
            TEST_CLASSES="${TEST_CLASSES%"${TEST_CLASSES##*[![:space:]]}"}"

            if [[ -z "$TEST_CLASSES" ]]; then
              echo "❌ Test class file is empty"
              echo "Expected location: $TEST_CLASS_FILE"
              echo ""
              echo "Please ensure the test class file contains test class names"
              echo "Format: One test class per line or space-separated"
              echo ""
              exit 1
            fi

            echo "✅ Test class file found"
            echo "✅ Test classes detected: $TEST_CLASSES"
            echo "test_classes=$TEST_CLASSES" >> "$GITHUB_OUTPUT"
            echo "test_level=RunSpecifiedTests" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Test class file not found"
            echo "Expected location: $TEST_CLASS_FILE"
            echo ""
            echo "Please ensure the following file exists in your repository:"
            echo "  manifest/${SOURCE_BRANCH}_TestClass.txt"
            echo ""
            echo "Validation requires a test class file with explicit test classes"
            exit 1
          fi
          
          echo "manifest_path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"

      - name: Check API Version in Metadata Files
        shell: bash
        env:
          MIN: ${{ secrets.API_VERSION_MIN }}
        run: |
          FAILED=0
          MIN=${MIN:-60}

          MAX=$(curl -s https://www.salesforce.com/services/data/ | grep -oP '(?<=v)[0-9]+(?=\.0)' | sort -n | tail -1 2>/dev/null || echo "")
          if [[ -z "$MAX" || "$MAX" == "null" ]]; then
            echo "⚠️  Could not fetch latest Salesforce API version — falling back to 67"
            MAX=67
          fi
          echo "📌 API version range: $MIN.0 – $MAX.0"

          while IFS= read -r FILE; do
            VERSION=$(grep -oP '(?<=<apiVersion>)[^<]+' "$FILE" || true)
            if [[ -n "$VERSION" ]]; then
              MAJOR=$(echo "$VERSION" | cut -d'.' -f1)
              if [[ "$MAJOR" -lt "$MIN" || "$MAJOR" -gt "$MAX" ]]; then
                echo "❌ $FILE — apiVersion is $VERSION (accepted range: $MIN.0–$MAX.0)"
                FAILED=1
              fi
            fi
          done < <(find force-app -name "*-meta.xml" 2>/dev/null)

          if [[ $FAILED -eq 1 ]]; then
            echo ""
            echo "❌ One or more files have apiVersion outside accepted range ($MIN.0–$MAX.0). Fix and push again."
            exit 1
          fi

          echo "✅ All metadata files have apiVersion within accepted range ($MIN.0–$MAX.0)"

      - name: Validate Deployment - ${{ env.TARGET_ORG_NAME }} Org
        id: validate
        shell: bash
        env:
          TEST_LEVEL: ${{ steps.prepare_manifest.outputs.test_level }}
          TEST_CLASSES: ${{ steps.prepare_manifest.outputs.test_classes }}
          MANIFEST_PATH: ${{ steps.prepare_manifest.outputs.manifest_path }}
          SF_USERNAME: ${{ env.SF_USERNAME }}
        run: |
          echo ""
          echo "=========================================="
          echo "VALIDATION CONFIGURATION"
          echo "=========================================="
          echo "Package Manifest: $MANIFEST_PATH"
          echo "Test Level: $TEST_LEVEL"
          echo "Test Classes: $TEST_CLASSES"
          echo "=========================================="
          echo ""
          echo "🚀 Starting deployment validation..."
          echo ""
          
          read -ra tests_array <<< "$TEST_CLASSES"

          CMD=(sf project deploy validate --target-org "$SF_USERNAME" --manifest "$MANIFEST_PATH" --wait 60 --ignore-warnings --test-level "$TEST_LEVEL")

          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" && ${#tests_array[@]} -gt 0 ]]; then
            CMD+=(--tests)
            for test in "${tests_array[@]}"; do
              CMD+=("$test")
            done
          fi

          CMD+=(--verbose --coverage-formatters json --results-dir coverage-results)

          echo "Executing command:"
          echo "${CMD[@]}"
          echo ""
          
          set +e
          "${CMD[@]}" 2>&1 | tee deploy-result.txt
          VALIDATION_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "VALIDATION_EXIT_CODE=$VALIDATION_EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Display Validation Result
        shell: bash
        env:
          EXIT_CODE: ${{ steps.validate.outputs.VALIDATION_EXIT_CODE }}
        run: |
          if [[ ! -f deploy-result.txt ]]; then
            echo "❌ No result output generated"
            exit 1
          fi
          
          echo ""
          echo "=========================================="
          echo "VALIDATION RESULT"
          echo "=========================================="
          echo ""

          if [[ "$EXIT_CODE" == "0" ]]; then
            echo "✅ VALIDATION PASSED SUCCESSFULLY"
            echo ""
            echo "The package validation was successful!"
            echo "=========================================="
            exit 0
          else
            echo "❌ VALIDATION FAILED"
            echo ""
            echo "Exit Code: $EXIT_CODE"
            echo ""
            echo "Error details:"
            echo "---"
            grep -i "error\|failed" deploy-result.txt | head -30 || true
            echo "---"
            echo ""
            echo "=========================================="
            exit 1
          fi

      - name: Apex Coverage Gate (75% Lodha Standard)
        uses: ./.github/actions/coverage-gate
        with:
          coverage-results-dir: coverage-results
          minimum-coverage:     '75'
          environment:          ${{ env.TARGET_ORG_NAME }}
          feature-branch:       ${{ github.head_ref }}
          jira-base-url:        ${{ secrets.JIRA_BASE_URL }}
          jira-user-email:      ${{ secrets.JIRA_USER_EMAIL }}
          jira-api-token:       ${{ secrets.ATLASSIAN_API_TOKEN }}
          run-id:               ${{ github.run_id }}
          repo:                 ${{ github.repository }}

      - name: Run Salesforce Code Analyzer
        id: run-scanner
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --target force-app
          output-file: code-analyzer-results.csv
          results-artifact-name: salesforce-code-analyzer-results

      - name: Upload Code Analyzer CSV
        if: always() && hashFiles('code-analyzer-results.csv') != ''
        uses: actions/upload-artifact@v7
        with:
          name: code-analyzer-csv
          path: code-analyzer-results.csv
          retention-days: 30

      - name: Fail if critical violations found
        if: |
          steps.run-scanner.outputs.exit-code > 0 ||
          steps.run-scanner.outputs.num-sev1-violations > 0 ||
          steps.run-scanner.outputs.num-violations > 10
        run: exit 0
                  
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.tag_name // empty' | sed 's/v//')
          if [[ -z "$GITLEAKS_VERSION" ]]; then
            echo "⚠️ Could not fetch latest version, using fallback v8.18.4"
            GITLEAKS_VERSION="8.18.4"
          fi
          echo "📦 Installing Gitleaks v${GITLEAKS_VERSION}"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -O gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks PII and Secret Scan
        id: gitleaks
        shell: bash
        run: |
          set +e
          gitleaks detect --source . --no-git --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --verbose
          GITLEAKS_EXIT=$?
          set -e

          HAS_PII=0; HAS_SECRET=0; HAS_PROFANITY=0; FINDING_SUMMARY=""

          if [[ -f gitleaks-report.json ]]; then
            HAS_PII=$(jq '[.[] | select(.Tags[]? | test("pii|aadhaar|pan|mobile|passport|bank"))] | length' gitleaks-report.json 2>/dev/null || echo 0)
            HAS_SECRET=$(jq '[.[] | select(.Tags[]? | test("salesforce|aws|key|secret|token|password"))] | length' gitleaks-report.json 2>/dev/null || echo 0)
            HAS_PROFANITY=$(jq '[.[] | select(.Tags[]? | test("profanity"))] | length' gitleaks-report.json 2>/dev/null || echo 0)
            FINDING_SUMMARY=$(jq -r '.[] | "  \(.RuleID) | \(.File):\(.StartLine) | \(.Description)"' gitleaks-report.json 2>/dev/null || echo "")
          fi

          TOTAL=$((HAS_PII + HAS_SECRET + HAS_PROFANITY))

          if [[ $TOTAL -gt 0 ]]; then
            echo ""
            echo "=========================================="
            echo "🚨 PII / SECRET FINDINGS"
            echo "=========================================="
            echo "$FINDING_SUMMARY"
            echo "  PII findings    : $HAS_PII"
            echo "  Secret findings : $HAS_SECRET"
            echo "  Profanity       : $HAS_PROFANITY"
            echo "=========================================="
            echo "has_findings=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No PII, secrets, or profanity detected"
            echo "has_findings=false" >> $GITHUB_OUTPUT
          fi

          echo "has_pii=${HAS_PII}" >> $GITHUB_OUTPUT
          echo "has_secret=${HAS_SECRET}" >> $GITHUB_OUTPUT
          echo "has_profanity=${HAS_PROFANITY}" >> $GITHUB_OUTPUT
          echo "finding_summary<<EOF" >> $GITHUB_OUTPUT
          echo "$FINDING_SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment Findings on PR
        if: steps.gitleaks.outputs.has_findings == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINDING_SUMMARY: ${{ steps.gitleaks.outputs.finding_summary }}
          HAS_PII: ${{ steps.gitleaks.outputs.has_pii }}
          HAS_SECRET: ${{ steps.gitleaks.outputs.has_secret }}
          HAS_PROFANITY: ${{ steps.gitleaks.outputs.has_profanity }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SCAN_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          PR_COMMENT="## 🚨 PII / Secret / Profanity Detected\n\n"
          PR_COMMENT+="> **This PR is blocked.** Remove all flagged content before requesting review.\n\n"
          PR_COMMENT+="| Field | Value |\n|---|---|\n"
          PR_COMMENT+="| **Scanned at** | ${SCAN_TIME} |\n"
          PR_COMMENT+="| **Branch** | ${HEAD_REF} |\n"
          PR_COMMENT+="| **Author** | ${ACTOR} |\n"
          PR_COMMENT+="| **PII findings** | ${HAS_PII} |\n"
          PR_COMMENT+="| **Secret findings** | ${HAS_SECRET} |\n"
          PR_COMMENT+="| **Profanity findings** | ${HAS_PROFANITY} |\n\n"
          PR_COMMENT+="### 🔍 Findings\n\`\`\`\n${FINDING_SUMMARY}\n\`\`\`\n\n"
          PR_COMMENT+="### ✅ How to fix\n"
          PR_COMMENT+="- Remove hardcoded PII (Aadhaar, PAN, mobile, email) from source code\n"
          PR_COMMENT+="- Move secrets to GitHub Secrets or Salesforce Named Credentials\n"
          PR_COMMENT+="- Remove any profanity from code, comments, and variable names\n"
          PR_COMMENT+="- Push the fix and the scan will re-run automatically"

          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -d "$(jq -n --arg body "$(printf '%b' "$PR_COMMENT")" '{body: $body}')"

          echo "✅ PR comment posted with findings"

      - name: Alert DevOps Admin via GitHub Issue
        if: steps.gitleaks.outputs.has_findings == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINDING_SUMMARY: ${{ steps.gitleaks.outputs.finding_summary }}
          HAS_PII: ${{ steps.gitleaks.outputs.has_pii }}
          HAS_SECRET: ${{ steps.gitleaks.outputs.has_secret }}
          HAS_PROFANITY: ${{ steps.gitleaks.outputs.has_profanity }}
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SCAN_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          ISSUE_BODY="## 🚨 PII / Secret / Profanity Detected in PR\n\n"
          ISSUE_BODY+="| Field | Value |\n|---|---|\n"
          ISSUE_BODY+="| **Detected at** | ${SCAN_TIME} |\n"
          ISSUE_BODY+="| **PR** | #${PR_NUMBER} |\n"
          ISSUE_BODY+="| **Branch** | ${HEAD_REF} → ${BASE_REF} |\n"
          ISSUE_BODY+="| **Author** | ${ACTOR} |\n"
          ISSUE_BODY+="| **Workflow Run** | [${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID}) |\n"
          ISSUE_BODY+="| **PII findings** | ${HAS_PII} |\n"
          ISSUE_BODY+="| **Secret findings** | ${HAS_SECRET} |\n"
          ISSUE_BODY+="| **Profanity findings** | ${HAS_PROFANITY} |\n\n"
          ISSUE_BODY+="### Findings\n\`\`\`\n${FINDING_SUMMARY}\n\`\`\`\n\n"
          ISSUE_BODY+="> **Action required:** Review PR and ensure author removes all flagged content."

          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${REPO}/issues \
            -d "$(jq -n \
              --arg title "🚨 [PII/Secret Alert] PR #${PR_NUMBER} by ${ACTOR}" \
              --arg body "$(printf '%b' "$ISSUE_BODY")" \
              '{title: $title, body: $body, labels: ["security", "pii-alert", "devops-admin"]}')"

          echo "✅ DevOps Admin alert issue created"

      - name: Rotate Salesforce Secrets if Secret Detected
        if: steps.gitleaks.outputs.has_secret != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Secret detected — initiating rotation advisory..."
          echo "=========================================="
          echo "SECRET ROTATION CHECKLIST"
          echo "=========================================="
          echo "  1. Revoke exposed Salesforce Connected App credentials"
          echo "     → Setup > App Manager > [App] > Manage > Revoke"
          echo "  2. Regenerate Consumer Key/Secret in Salesforce"
          echo "  3. Update GitHub Secrets:"
          echo "     → Repo Settings > Secrets > Actions"
          echo "     → Update: SALESFORCE_CONSUMER_KEY_*, SALESFORCE_JWT_SECRET_KEY"
          echo "  4. Re-run JWT auth to verify new credentials work"
          echo "  5. Close the DevOps Admin alert issue once rotated"
          echo "=========================================="

          LATEST_ISSUE=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?labels=pii-alert&state=open&per_page=1" \
            | jq -r '.[0].number // empty')

          if [[ -n "$LATEST_ISSUE" ]]; then
            curl -s -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${LATEST_ISSUE}/comments" \
              -d '{"body": "⚠️ **Automatic Rotation Advisory**\n\nA Salesforce secret was detected in this PR. Please:\n1. Revoke the exposed Connected App credentials in Salesforce Setup\n2. Regenerate Consumer Key/Secret\n3. Update `SALESFORCE_CONSUMER_KEY_*` and `SALESFORCE_JWT_SECRET_KEY` in GitHub Secrets\n4. Author must remove the secret from code and force-push"}'
            echo "✅ Rotation advisory posted to issue #${LATEST_ISSUE}"
          fi

      - name: Block PR — Fail on PII, Secret, or Profanity
        if: steps.gitleaks.outputs.has_findings == 'true'
        run: |
          echo ""
          echo "=========================================="
          echo "🚫 PR BLOCKED"
          echo "=========================================="
          echo "  PII findings    : ${{ steps.gitleaks.outputs.has_pii }}"
          echo "  Secret findings : ${{ steps.gitleaks.outputs.has_secret }}"
          echo "  Profanity       : ${{ steps.gitleaks.outputs.has_profanity }}"
          echo ""
          echo "  Remove all flagged content and push again."
          echo "  PR author and DevOps Admin have been notified."
          echo "=========================================="
          exit 1

      - name: Upload Gitleaks Report
        if: always() && hashFiles('gitleaks-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-pii-report
          path: gitleaks-report.json
          retention-days: 30

      - name: Remove JWT Key File
        if: always()
        shell: bash
        run: |
          if [[ -f server.key ]]; then
            rm -f server.key
            echo "✅ JWT key file cleaned up"
          fi

  # Job 4: Publish Code Analyzer CSV to Confluence and email
  Publish_Code_Analyzer_Report:
    runs-on: ubuntu-latest
    needs: Pre_Validation_Build
    if: always() && needs.Pre_Validation_Build.result != 'skipped'
    steps:
      - name: Download Code Analyzer CSV
        uses: actions/download-artifact@v4
        with:
          name: code-analyzer-csv
        continue-on-error: true

      - name: Publish to Confluence
        if: env.CONFLUENCE_BASE_URL != '' && env.CONFLUENCE_USER_EMAIL != '' && env.CONFLUENCE_SPACE_KEY != ''
        shell: bash
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
          PR_NUMBER: ${{ needs.Pre_Validation_Build.outputs.pr_number }}
          HEAD_REF: ${{ needs.Pre_Validation_Build.outputs.head_ref }}
          ACTOR: ${{ needs.Pre_Validation_Build.outputs.actor }}
          NUM_VIOLATIONS: ${{ needs.Pre_Validation_Build.outputs.num_violations }}
          NUM_SEV1: ${{ needs.Pre_Validation_Build.outputs.num_sev1 }}
          RUN_ID: ${{ needs.Pre_Validation_Build.outputs.run_id }}
          REPO: ${{ needs.Pre_Validation_Build.outputs.repo }}
        run: |
          SCAN_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M IST')
          PAGE_TITLE="Code Analyzer Report — PR #${PR_NUMBER} (${HEAD_REF})"

          # Build HTML table from CSV if file exists
          if [[ -f code-analyzer-results.csv ]]; then
            TABLE_ROWS=$(awk -F',' 'NR==1 { \
              printf "<tr>"; for(i=1;i<=NF;i++) printf "<th>%s</th>",$i; printf "</tr>"; next \
            } { \
              printf "<tr>"; for(i=1;i<=NF;i++) printf "<td>%s</td>",$i; printf "</tr>" \
            }' code-analyzer-results.csv)
            CSV_TABLE="<table border=\"1\" cellpadding=\"4\" cellspacing=\"0\" style=\"border-collapse:collapse;font-family:monospace;font-size:12px;\">$TABLE_ROWS</table>"
          else
            CSV_TABLE="<p><em>No CSV output generated — no violations found or scanner did not produce output.</em></p>"
          fi

          PAGE_BODY="<h2>Salesforce Code Analyzer Report</h2>\
          <table border='1' cellpadding='6' cellspacing='0' style='border-collapse:collapse;'>\
          <tr><th>Field</th><th>Value</th></tr>\
          <tr><td>Scanned At</td><td>${SCAN_TIME}</td></tr>\
          <tr><td>PR</td><td>#${PR_NUMBER}</td></tr>\
          <tr><td>Branch</td><td>${HEAD_REF}</td></tr>\
          <tr><td>Author</td><td>${ACTOR}</td></tr>\
          <tr><td>Total Violations</td><td>${NUM_VIOLATIONS}</td></tr>\
          <tr><td>Sev1 Violations</td><td>${NUM_SEV1}</td></tr>\
          <tr><td>Workflow Run</td><td><a href='https://github.com/${REPO}/actions/runs/${RUN_ID}'>${RUN_ID}</a></td></tr>\
          </table>\
          <h3>Violation Details</h3>${CSV_TABLE}"

          # Check if page already exists
          EXISTING=$(curl -s -u "${CONFLUENCE_USER_EMAIL}:${CONFLUENCE_API_TOKEN}" \
            "${CONFLUENCE_BASE_URL}/rest/api/content?title=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$PAGE_TITLE")&spaceKey=${CONFLUENCE_SPACE_KEY}&expand=version" \
            | jq -r '.results[0].id // empty')

          if [[ -n "$EXISTING" ]]; then
            CURRENT_VERSION=$(curl -s -u "${CONFLUENCE_USER_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              "${CONFLUENCE_BASE_URL}/rest/api/content/${EXISTING}?expand=version" | jq '.version.number')
            NEW_VERSION=$((CURRENT_VERSION + 1))
            curl -s -X PUT \
              -u "${CONFLUENCE_USER_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "${CONFLUENCE_BASE_URL}/rest/api/content/${EXISTING}" \
              -d "$(jq -n --arg title "$PAGE_TITLE" --arg body "$PAGE_BODY" --argjson version "${NEW_VERSION}" \
                '{version:{number:$version},title:$title,type:"page",body:{storage:{value:$body,representation:"storage"}}}')"
            echo "✅ Confluence page updated: ${EXISTING}"
          else
            curl -s -X POST \
              -u "${CONFLUENCE_USER_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "${CONFLUENCE_BASE_URL}/rest/api/content" \
              -d "$(jq -n --arg title "$PAGE_TITLE" --arg body "$PAGE_BODY" --arg space "$CONFLUENCE_SPACE_KEY" \
                '{type:"page",title:$title,space:{key:$space},body:{storage:{value:$body,representation:"storage"}}}')"
            echo "✅ Confluence page created"
          fi

      - name: Send Code Analyzer Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port:    ${{ secrets.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          subject: "📊 [Code Analyzer] PR #${{ needs.Pre_Validation_Build.outputs.pr_number }} — ${{ needs.Pre_Validation_Build.outputs.head_ref }} | Violations: ${{ needs.Pre_Validation_Build.outputs.num_violations }}"
          to:             ${{ secrets.NOTIFY_EMAILS }}
          from:           "Do not Reply <${{ secrets.GMAIL_USERNAME }}>"
          attachments:    code-analyzer-results.csv
          html_body: |
            <h2>📊 Salesforce Code Analyzer Report</h2>
            <p>The CSV report is attached to this email.</p>
            <table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-family:Arial,sans-serif;">
              <tr><th>Field</th><th>Details</th></tr>
              <tr><td><strong>PR Number</strong></td><td>#${{ needs.Pre_Validation_Build.outputs.pr_number }}</td></tr>
              <tr><td><strong>Branch</strong></td><td>${{ needs.Pre_Validation_Build.outputs.head_ref }} → ${{ needs.Pre_Validation_Build.outputs.base_ref }}</td></tr>
              <tr><td><strong>Author</strong></td><td>${{ needs.Pre_Validation_Build.outputs.actor }}</td></tr>
              <tr><td><strong>Total Violations</strong></td><td>${{ needs.Pre_Validation_Build.outputs.num_violations }}</td></tr>
              <tr><td><strong>Sev1 Violations</strong></td><td>${{ needs.Pre_Validation_Build.outputs.num_sev1 }}</td></tr>
              <tr><td><strong>Workflow Run</strong></td><td><a href="https://github.com/${{ needs.Pre_Validation_Build.outputs.repo }}/actions/runs/${{ needs.Pre_Validation_Build.outputs.run_id }}">View Run</a></td></tr>
              <tr><td><strong>PR Link</strong></td><td><a href="https://github.com/${{ needs.Pre_Validation_Build.outputs.repo }}/pull/${{ needs.Pre_Validation_Build.outputs.pr_number }}">View PR</a></td></tr>
            </table>
            <br/>
            <p style="font-size:12px;color:#888;font-family:Arial,sans-serif;">
              ⚠️ This is an automated notification sent by GitHub Actions. Please do not reply to this email.
            </p>

  # Job 5: Email alert for Gitleaks findings
  Send_Gitleaks_Email:
    runs-on: ubuntu-latest
    needs: Pre_Validation_Build
    if: always() && needs.Pre_Validation_Build.outputs.has_findings == 'true'
    steps:
      - name: Send Gitleaks Alert Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port:    ${{ secrets.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          subject: "🚨 [PII/Secret Alert] PR #${{ needs.Pre_Validation_Build.outputs.pr_number }} by ${{ needs.Pre_Validation_Build.outputs.actor }} — ${{ needs.Pre_Validation_Build.outputs.head_ref }}"
          to:             ${{ secrets.NOTIFY_EMAILS }}
          from:           "Do not Reply <${{ secrets.GMAIL_USERNAME }}>"
          html_body: |
            <h2>🚨 PII / Secret / Profanity Detected in PR</h2>
            <p><strong>Immediate action required.</strong> The following PR has been blocked due to policy violations.</p>
            <table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-family:Arial,sans-serif;">
              <tr><th>Field</th><th>Details</th></tr>
              <tr><td><strong>PR Number</strong></td><td>#${{ needs.Pre_Validation_Build.outputs.pr_number }}</td></tr>
              <tr><td><strong>Branch</strong></td><td>${{ needs.Pre_Validation_Build.outputs.head_ref }} → ${{ needs.Pre_Validation_Build.outputs.base_ref }}</td></tr>
              <tr><td><strong>Author</strong></td><td>${{ needs.Pre_Validation_Build.outputs.actor }}</td></tr>
              <tr><td><strong>PII Findings</strong></td><td>${{ needs.Pre_Validation_Build.outputs.has_pii }}</td></tr>
              <tr><td><strong>Secret Findings</strong></td><td>${{ needs.Pre_Validation_Build.outputs.has_secret }}</td></tr>
              <tr><td><strong>Profanity Findings</strong></td><td>${{ needs.Pre_Validation_Build.outputs.has_profanity }}</td></tr>
              <tr><td><strong>Workflow Run</strong></td><td><a href="https://github.com/${{ needs.Pre_Validation_Build.outputs.repo }}/actions/runs/${{ needs.Pre_Validation_Build.outputs.run_id }}">View Run</a></td></tr>
              <tr><td><strong>PR Link</strong></td><td><a href="https://github.com/${{ needs.Pre_Validation_Build.outputs.repo }}/pull/${{ needs.Pre_Validation_Build.outputs.pr_number }}">View PR</a></td></tr>
            </table>
            <h3>🔍 Findings Detail</h3>
            <pre style="background:#f4f4f4;padding:10px;font-family:monospace;font-size:12px;">${{ needs.Pre_Validation_Build.outputs.finding_summary }}</pre>
            <h3>✅ How to fix</h3>
            <ul>
              <li>Remove hardcoded PII (Aadhaar, PAN, mobile, email) from source code</li>
              <li>Move secrets to GitHub Secrets or Salesforce Named Credentials</li>
              <li>Remove any profanity from code, comments, and variable names</li>
              <li>Push the fix — the scan will re-run automatically</li>
            </ul>
            <br/>
            <p style="font-size:12px;color:#888;font-family:Arial,sans-serif;">
              ⚠️ This is an automated notification sent by GitHub Actions. Please do not reply to this email.
            </p>
