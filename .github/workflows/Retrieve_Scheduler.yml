name: Salesforce Code Retrieval Scheduler

# ─────────────────────────────────────────────────────────────────────────────
# Runs on main (default branch) — GitHub schedules always run on default branch.
# Dispatches Retrieve_And_PR.yml on each env branch at staggered times so
# each branch runs against its own org.
#
#   DEV  branch → 22:30 IST  (17:00 UTC)  |  23:10 IST  (17:40 UTC)
#   QA   branch → 22:40 IST  (17:10 UTC)  |  23:20 IST  (17:50 UTC)
#   UAT  branch → 22:50 IST  (17:20 UTC)  |  23:30 IST  (18:00 UTC)
#   main branch → 23:00 IST  (17:30 UTC)  |  23:40 IST  (18:10 UTC)
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 17 * * *'     # DEV        — 22:30 IST daily
    - cron: '10 17 * * *'    # QA         — 22:40 IST daily
    - cron: '20 17 * * *'    # UAT        — 22:50 IST daily
    - cron: '30 17 * * *'    # PRODUCTION — 23:00 IST daily

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Dispatch retrieval on correct branch
        shell: bash
        env:
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
          REPO:            ${{ github.repository }}
        run: |
          case "$GITHUB_SCHEDULE" in
            '0 17 * * *')    BRANCH="DEV"  ;;
            '10 17 * * *')   BRANCH="QA"   ;;
            '20 17 * * *')   BRANCH="UAT"  ;;
            '30 17 * * *')   BRANCH="main" ;;
            *) echo "❌ Unknown schedule: $GITHUB_SCHEDULE"; exit 1 ;;
          esac

          echo "🚀 Dispatching Retrieve_And_PR on branch: $BRANCH"
          gh workflow run "Retrieve_And_PR.yml" \
            --repo "$REPO" \
            --ref  "$BRANCH"
          echo "✅ Dispatched on $BRANCH"
