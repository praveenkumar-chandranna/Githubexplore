name: Salesforce Code Retrieval Scheduler

# ─────────────────────────────────────────────────────────────────────────────
# Runs on main (default branch) — GitHub schedules always run on default branch.
# Dispatches Retrieve_And_PR.yml on each env branch at staggered times so
# each branch runs against its own org.
#
#   DEV  branch → 10:50 IST  (05:20 UTC)
#   QA   branch → 11:00 IST  (05:30 UTC)
#   UAT  branch → 11:10 IST  (05:40 UTC)
#   main branch → 11:20 IST  (05:50 UTC)
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '20 5 * * *'     # DEV        — 10:50 IST daily
    - cron: '30 5 * * *'     # QA         — 11:00 IST daily
    - cron: '40 5 * * *'     # UAT        — 11:10 IST daily
    - cron: '50 5 * * *'     # PRODUCTION — 11:20 IST daily

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Dispatch retrieval on correct branch
        shell: bash
        env:
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
          REPO:            ${{ github.repository }}
        run: |
          case "$GITHUB_SCHEDULE" in
            '20 5 * * *')    BRANCH="DEV"  ;;
            '30 5 * * *')    BRANCH="QA"   ;;
            '40 5 * * *')    BRANCH="UAT"  ;;
            '50 5 * * *')    BRANCH="main" ;;
            *) echo "❌ Unknown schedule: $GITHUB_SCHEDULE"; exit 1 ;;
          esac

          echo "🚀 Dispatching Retrieve_And_PR on branch: $BRANCH"
          gh workflow run "Retrieve_And_PR.yml" \
            --repo "$REPO" \
            --ref  "$BRANCH"
          echo "✅ Dispatched on $BRANCH"
