name: Retrieval Scheduler

# ─────────────────────────────────────────────────────────────────────────────
# Runs on main (default branch) — GitHub schedules always run on default branch.
# Dispatches Retrieve_And_PR.yml on each env branch at staggered times so
# each branch runs against its own org.
#
#   DEV  branch → 12:45 IST  (07:15 UTC)
#   QA   branch → 12:55 IST  (07:25 UTC)
#   UAT  branch → 13:05 IST  (07:35 UTC)
#   main branch → 13:15 IST  (07:45 UTC)
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '15 7 * * *'     # DEV        — 12:45 IST daily
    - cron: '25 7 * * *'     # QA         — 12:55 IST daily
    - cron: '35 7 * * *'     # UAT        — 13:05 IST daily
    - cron: '45 7 * * *'     # PRODUCTION — 13:15 IST daily

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Dispatch retrieval on correct branch
        shell: bash
        env:
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
          REPO:            ${{ github.repository }}
        run: |
          case "$GITHUB_SCHEDULE" in
            '15 7 * * *')   BRANCH="DEV"  ;;
            '25 7 * * *')   BRANCH="QA"   ;;
            '35 7 * * *')   BRANCH="UAT"  ;;
            '45 7 * * *')   BRANCH="main" ;;
            *) echo "❌ Unknown schedule: $GITHUB_SCHEDULE"; exit 1 ;;
          esac

          echo "🚀 Dispatching Retrieve_And_PR on branch: $BRANCH"
          gh workflow run "Retrieve_And_PR.yml" \
            --repo "$REPO" \
            --ref  "$BRANCH"
          echo "✅ Dispatched on $BRANCH"
