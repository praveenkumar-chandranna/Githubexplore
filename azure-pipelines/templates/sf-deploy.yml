# ── Reusable template: Salesforce deploy ─────────────────────────────────────
parameters:
  - name: packageFile
    type: string
  - name: testLevel
    type: string
    default: RunLocalTests
  - name: sfUsername
    type: string

steps:
  - ${{ if eq(parameters.testLevel, 'RunSpecifiedTests') }}:
    - script: |
        RESULTS_DIR="$(Build.SourcesDirectory)/test-results"
        mkdir -p "$RESULTS_DIR"
        TEST_CLASS_FILE="$(echo '${{ parameters.packageFile }}' | sed 's/_package\.xml$/_TestClass.txt/')"
        if [[ ! -f "$TEST_CLASS_FILE" ]]; then
          echo "❌ Test class file not found: $TEST_CLASS_FILE"; exit 1
        fi
        TEST_CLASSES=$(cat "$TEST_CLASS_FILE")
        echo "🧪 Test classes: $TEST_CLASSES"
        sf project deploy start \
          --manifest   "${{ parameters.packageFile }}" \
          --target-org "${{ parameters.sfUsername }}" \
          --test-level RunSpecifiedTests \
          --tests      $TEST_CLASSES \
          --coverage-formatters json \
          --results-dir "$RESULTS_DIR" \
          --wait       120
      displayName: 'Deploy — RunSpecifiedTests'

  - ${{ if ne(parameters.testLevel, 'RunSpecifiedTests') }}:
    - script: |
        RESULTS_DIR="$(Build.SourcesDirectory)/test-results"
        mkdir -p "$RESULTS_DIR"
        EXTRA_ARGS=""
        if [[ "${{ parameters.testLevel }}" != "NoTestRun" ]]; then
          EXTRA_ARGS="--coverage-formatters json --results-dir $RESULTS_DIR"
        fi
        sf project deploy start \
          --manifest   "${{ parameters.packageFile }}" \
          --target-org "${{ parameters.sfUsername }}" \
          --test-level "${{ parameters.testLevel }}" \
          --wait       120 \
          $EXTRA_ARGS
      displayName: 'Deploy — ${{ parameters.testLevel }}'

  - script: |
      MC_FILE="$(echo '${{ parameters.packageFile }}' | sed 's/_package\.xml$/_MainClass.txt/')"
      if [[ ! -f "$MC_FILE" || ! -s "$MC_FILE" ]]; then
        echo "No MainClass.txt found - skipping coverage check"
        exit 0
      fi
      if [[ "${{ parameters.testLevel }}" == "NoTestRun" ]]; then
        echo "TestLevel is NoTestRun - skipping coverage check"
        exit 0
      fi
      APEX_CLASSES=$(paste -sd ',' "$MC_FILE")
      echo "Checking 85% coverage for: $APEX_CLASSES"
      python3 "$(Build.SourcesDirectory)/scripts/check_coverage.py" \
        --mode local \
        --results-dir "$(Build.SourcesDirectory)/test-results" \
        --classes "$APEX_CLASSES"
    displayName: 'Check 85% Per-Class Apex Coverage'
    condition: succeeded()
