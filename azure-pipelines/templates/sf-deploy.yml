# ── Reusable template: Salesforce deploy ─────────────────────────────────────
parameters:
  - name: packageFile
    type: string
  - name: testLevel
    type: string
    default: RunLocalTests
  - name: sfUsername
    type: string

steps:
  - ${{ if eq(parameters.testLevel, 'RunSpecifiedTests') }}:
    - script: |
        TEST_CLASS_FILE="$(echo '${{ parameters.packageFile }}' | sed 's/_package\.xml$/_TestClass.txt/')"
        if [[ ! -f "$TEST_CLASS_FILE" ]]; then
          echo "❌ Test class file not found: $TEST_CLASS_FILE"; exit 1
        fi
        TEST_CLASSES=$(cat "$TEST_CLASS_FILE")
        echo "🧪 Test classes: $TEST_CLASSES"
        sf project deploy start \
          --manifest   "${{ parameters.packageFile }}" \
          --target-org "${{ parameters.sfUsername }}" \
          --test-level RunSpecifiedTests \
          --tests      $TEST_CLASSES \
          --wait       120
      displayName: 'Deploy — RunSpecifiedTests'

  - ${{ if ne(parameters.testLevel, 'RunSpecifiedTests') }}:
    - script: |
        sf project deploy start \
          --manifest   "${{ parameters.packageFile }}" \
          --target-org "${{ parameters.sfUsername }}" \
          --test-level "${{ parameters.testLevel }}" \
          --wait       120
      displayName: 'Deploy — ${{ parameters.testLevel }}'
