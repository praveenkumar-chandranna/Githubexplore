# ── Reusable template: Salesforce Code Analyzer ──────────────────────────────
parameters:
  - name: targetPath
    type: string
    default: '$(Build.SourcesDirectory)/force-app'

steps:
  - script: |
      sf plugins install @salesforce/plugin-code-analyzer@latest
    displayName: 'Install Salesforce Code Analyzer Plugin'

  - script: |
      sf code-analyzer run \
        --target "${{ parameters.targetPath }}" \
        --output-file "$(Build.SourcesDirectory)/scanner-results.json" \
        --output-file "$(Build.SourcesDirectory)/scanner-results.html" || true
    displayName: 'Run Salesforce Code Analyzer'

  - script: |
      if [[ ! -f "$(Build.SourcesDirectory)/scanner-results.json" ]]; then
        echo "No scanner results found - skipping"
        exit 0
      fi
      IST_TIME=$(TZ='Asia/Kolkata' date +'%d-%m-%Y %H:%M:%S IST')
      JSON="$(Build.SourcesDirectory)/scanner-results.json"

      printf '%s\n' '(if type=="array" then .[] else .violations[]? end) | . as $v | ($v.severity | numbers) as $s | (($v.locations[0].file // $v.fileName // $v.file // "unknown") | split("/") | last) as $f | ($v.locations[0].startLine // $v.line // "?") as $l | select($s <= 3) | "[SEV-"+($s|tostring)+"] "+$f+":"+($l|tostring)+" - "+($v.rule // $v.ruleName // "")+" | "+($v.message|gsub("\n";" ")|gsub("\r";" "))' > /tmp/jq_fail_log.jq
      printf '%s\n' '(if type=="array" then .[] else .violations[]? end) | . as $v | ($v.severity | numbers) as $s | (($v.locations[0].file // $v.fileName // $v.file // "unknown") | split("/") | last) as $f | ($v.locations[0].startLine // $v.line // "?") as $l | select($s > 3) | "[SEV-"+($s|tostring)+"] "+$f+":"+($l|tostring)+" - "+($v.rule // $v.ruleName // "")+" | "+($v.message|gsub("\n";" ")|gsub("\r";" "))' > /tmp/jq_warn_log.jq
      printf '%s\n' '(if type=="array" then .[] else .violations[]? end) | . as $v | ($v.severity | numbers) as $s | (($v.locations[0].file // $v.fileName // $v.file // "unknown") | split("/") | last) as $f | ($v.locations[0].startLine // $v.line // "?") as $l | select($s <= 3) | "| "+$f+" | "+($s|tostring)+" | "+($l|tostring)+" | "+($v.rule // $v.ruleName // "")+" | "+($v.message|gsub("\n";" ")|gsub("\r";" "))+" |"' > /tmp/jq_fail_table.jq
      printf '%s\n' '(if type=="array" then .[] else .violations[]? end) | . as $v | ($v.severity | numbers) as $s | (($v.locations[0].file // $v.fileName // $v.file // "unknown") | split("/") | last) as $f | ($v.locations[0].startLine // $v.line // "?") as $l | select($s > 3) | "| "+$f+" | "+($s|tostring)+" | "+($l|tostring)+" | "+($v.rule // $v.ruleName // "")+" | "+($v.message|gsub("\n";" ")|gsub("\r";" "))+" |"' > /tmp/jq_warn_table.jq

      SEV1=$(jq '[((if type=="array" then .[] else .violations[]? end) | .severity | numbers) | select(. == 1)] | length' "$JSON" 2>/dev/null || echo 0)
      SEV2=$(jq '[((if type=="array" then .[] else .violations[]? end) | .severity | numbers) | select(. == 2)] | length' "$JSON" 2>/dev/null || echo 0)
      SEV3=$(jq '[((if type=="array" then .[] else .violations[]? end) | .severity | numbers) | select(. == 3)] | length' "$JSON" 2>/dev/null || echo 0)
      LOW_INFO=$(jq '[((if type=="array" then .[] else .violations[]? end) | .severity | numbers) | select(. > 3)] | length' "$JSON" 2>/dev/null || echo 0)

      echo "===== Code Analyzer Results (${IST_TIME}) ====="
      echo "Severity 1 (Critical) : $SEV1 violations (threshold: 0)"
      echo "Severity 2 (High)     : $SEV2 violations (threshold: 5)"
      echo "Severity 3 (Moderate) : $SEV3 violations (threshold: 10)"
      echo "Severity 4-5 (Low/Info): $LOW_INFO violations (WARN only)"
      echo ""
      echo "===== Severity 1-3 Violations (FAIL) ====="
      jq -rf /tmp/jq_fail_log.jq "$JSON" 2>/dev/null || true
      echo ""
      echo "===== Severity 4-5 Violations (WARN) ====="
      jq -rf /tmp/jq_warn_log.jq "$JSON" 2>/dev/null || true

      SUMMARY="$(Build.SourcesDirectory)/scanner-summary.md"
      [[ "$SEV1" -gt 0  ]] && S1="FAIL" || S1="OK"
      [[ "$SEV2" -gt 5  ]] && S2="FAIL" || S2="OK"
      [[ "$SEV3" -gt 10 ]] && S3="FAIL" || S3="OK"
      FAIL_COUNT=$(( SEV1 + SEV2 + SEV3 ))
      {
        echo "## Salesforce Code Analyzer Results"
        echo ""
        echo "**Run Time:** ${IST_TIME}"
        echo ""
        echo "| Severity | Count | Threshold | Status |"
        echo "|---|---|---|---|"
        echo "| Severity 1 - Critical | $SEV1 | 0 | $S1 |"
        echo "| Severity 2 - High | $SEV2 | 5 | $S2 |"
        echo "| Severity 3 - Moderate | $SEV3 | 10 | $S3 |"
        echo "| Severity 4-5 - Low/Info | $LOW_INFO | WARN only | OK |"
        echo ""
        echo "### Severity 1-3 Violations"
        if [[ "$FAIL_COUNT" -gt 0 ]]; then
          echo "| Class | Severity | Line | Rule | Message |"
          echo "|---|---|---|---|---|"
          jq -rf /tmp/jq_fail_table.jq "$JSON" 2>/dev/null
        else
          echo "_No violations found._"
        fi
        echo ""
        echo "### Severity 4-5 Violations (WARN)"
        if [[ "$LOW_INFO" -gt 0 ]]; then
          echo "| Class | Severity | Line | Rule | Message |"
          echo "|---|---|---|---|---|"
          jq -rf /tmp/jq_warn_table.jq "$JSON" 2>/dev/null
        else
          echo "_No violations found._"
        fi
      } > "$SUMMARY"
      echo "##vso[task.uploadsummary]$SUMMARY"

      HTML="$(Build.SourcesDirectory)/scanner-results.html"
      if [[ -f "$HTML" ]]; then
        sed -i "s|<body>|<body><p style='font-family:sans-serif;padding:8px;background:#f0f0f0'><strong>Scan Time (IST):</strong> ${IST_TIME}</p>|" "$HTML" || true
      fi

      FAILED=0
      [[ "$SEV1" -gt 0  ]] && { echo "FAIL: Severity 1 count $SEV1 exceeds threshold of 0";  FAILED=1; }
      [[ "$SEV2" -gt 5  ]] && { echo "FAIL: Severity 2 count $SEV2 exceeds threshold of 5";  FAILED=1; }
      [[ "$SEV3" -gt 10 ]] && { echo "FAIL: Severity 3 count $SEV3 exceeds threshold of 10"; FAILED=1; }
      if [[ "$FAILED" -eq 1 ]]; then
        echo "PIPELINE FAILED: Violation count exceeded threshold. Fix before deploying."
        exit 1
      fi
      echo "Code analysis passed - all violation counts within thresholds."
    displayName: 'Enforce Severity Thresholds (Fail on 1-3, Warn on 4-5)'

  - script: |
      IST_TS=$(TZ='Asia/Kolkata' date +'%d%m%Y_%H%M%S')
      echo "##vso[task.setvariable variable=SCAN_TS]$IST_TS"
    displayName: 'Set Artifact Timestamp'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Code Analyzer Results'
    condition: always()
    inputs:
      targetPath: '$(Build.SourcesDirectory)/scanner-results.html'
      artifact: 'code-analyzer-results_$(SCAN_TS)'
