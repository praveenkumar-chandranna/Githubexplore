# ══════════════════════════════════════════════════════════════════════════════
# Salesforce PROD — Deployment Pipeline (validate + deploy)
# Always checks out from master branch regardless of pipeline version selected
# ⚠️  Deploy stage requires manual approval via Azure DevOps Environment gate
#     Setup: Pipelines → Environments → PROD → Approvals and checks → Add → Approvals
# ══════════════════════════════════════════════════════════════════════════════

trigger: none

parameters:
  - name: FEATURE_BRANCHNAME
    displayName: 'Feature branch name (used to locate package.xml)'
    type: string

  - name: TEST_LEVEL
    displayName: 'Test Level'
    type: string
    default: RunSpecifiedTests
    values:
      - RunLocalTests
      - RunAllTestsInOrg
      - RunSpecifiedTests

variables:
  - group: SF-PROD-Credentials
  - name: PACKAGE_FILE
    value: 'manifest/${{ parameters.FEATURE_BRANCHNAME }}_package.xml'
  - name: ORG_ALIAS
    value: 'PROD'

pool:
  vmImage: ubuntu-latest

stages:

  - stage: Setup
    displayName: 'Setup & Auth'
    jobs:
      - job: SetupJob
        displayName: 'Install SF CLI + JWT Auth'
        steps:
          - checkout: self
            ref: refs/heads/master
            fetchDepth: 0
          - script: |
              npm install -g @salesforce/cli@latest
              sf --version
            displayName: 'Install Salesforce CLI'
          - script: |
              printf '%s' "$(SF_JWT_KEY)" > $(Agent.TempDirectory)/server.key
              chmod 600 $(Agent.TempDirectory)/server.key
            displayName: 'Write JWT key'
          - template: templates/sf-auth.yml
            parameters:
              sfUsername:    $(SF_USERNAME)
              sfConsumerKey: $(SF_CONSUMER_KEY)
              sfInstanceUrl: $(SF_INSTANCE_URL)
              serverKeyFile: $(Agent.TempDirectory)/server.key
              orgAlias:      $(ORG_ALIAS)
          - script: rm -f $(Agent.TempDirectory)/server.key
            displayName: 'Cleanup JWT key'
            condition: always()
          - script: |
              if [[ ! -f "$(PACKAGE_FILE)" ]]; then
                echo "❌ package.xml not found: $(PACKAGE_FILE)"; exit 1
              fi
              echo "✅ Found: $(PACKAGE_FILE)"
              cat "$(PACKAGE_FILE)"
            displayName: 'Validate package.xml exists'

  - stage: CodeAnalyzer
    displayName: 'Code Analyzer'
    dependsOn: Setup
    jobs:
      - job: CodeAnalyzerJob
        displayName: 'Run Code Analyzer'
        steps:
          - checkout: self
            ref: refs/heads/master
            fetchDepth: 0
          - script: npm install -g @salesforce/cli@latest
            displayName: 'Install Salesforce CLI'
          - template: templates/code-analyzer.yml
            parameters:
              targetPath: '$(Build.SourcesDirectory)/force-app'

  - stage: Validate
    displayName: 'Validate (checkonly) → PROD'
    dependsOn: CodeAnalyzer
    jobs:
      - job: ValidateJob
        displayName: 'Salesforce Validate'
        steps:
          - checkout: self
            ref: refs/heads/master
            fetchDepth: 0
          - script: npm install -g @salesforce/cli@latest
            displayName: 'Install Salesforce CLI'
          - script: |
              printf '%s' "$(SF_JWT_KEY)" > $(Agent.TempDirectory)/server.key
              chmod 600 $(Agent.TempDirectory)/server.key
            displayName: 'Write JWT key'
          - template: templates/sf-auth.yml
            parameters:
              sfUsername:    $(SF_USERNAME)
              sfConsumerKey: $(SF_CONSUMER_KEY)
              sfInstanceUrl: $(SF_INSTANCE_URL)
              serverKeyFile: $(Agent.TempDirectory)/server.key
              orgAlias:      $(ORG_ALIAS)
          - script: rm -f $(Agent.TempDirectory)/server.key
            displayName: 'Cleanup JWT key'
            condition: always()
          - template: templates/sf-validate.yml
            parameters:
              packageFile: $(PACKAGE_FILE)
              testLevel:   ${{ parameters.TEST_LEVEL }}
              sfUsername:  $(SF_USERNAME)

  # ── Deploy stage pauses here for manual approval ────────────────────────────
  - stage: Deploy
    displayName: 'Deploy → PROD  ⚠️ Requires Approval'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: 'Salesforce Deploy → PROD'
        environment: 'PROD'           # ← configure approval gate on this environment
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  ref: refs/heads/master
                  fetchDepth: 0
                - script: npm install -g @salesforce/cli@latest
                  displayName: 'Install Salesforce CLI'
                - script: |
                    printf '%s' "$(SF_JWT_KEY)" > $(Agent.TempDirectory)/server.key
                    chmod 600 $(Agent.TempDirectory)/server.key
                  displayName: 'Write JWT key'
                - template: templates/sf-auth.yml
                  parameters:
                    sfUsername:    $(SF_USERNAME)
                    sfConsumerKey: $(SF_CONSUMER_KEY)
                    sfInstanceUrl: $(SF_INSTANCE_URL)
                    serverKeyFile: $(Agent.TempDirectory)/server.key
                    orgAlias:      $(ORG_ALIAS)
                - script: rm -f $(Agent.TempDirectory)/server.key
                  displayName: 'Cleanup JWT key'
                  condition: always()
                - template: templates/sf-deploy.yml
                  parameters:
                    packageFile: $(PACKAGE_FILE)
                    testLevel:   ${{ parameters.TEST_LEVEL }}
                    sfUsername:  $(SF_USERNAME)
