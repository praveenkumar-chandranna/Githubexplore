# ══════════════════════════════════════════════════════════════════════════════
# Salesforce PROD — Quick Deploy Pipeline
# Deploys a previously validated deployment using its validation job ID.
# No tests are re-run — validation pipeline already verified 85% coverage.
# ⚠️  Deploy stage requires manual approval via Azure DevOps Environment gate
#     Setup: Pipelines → Environments → PROD → Approvals and checks → Add → Approvals
# ══════════════════════════════════════════════════════════════════════════════

trigger: none

parameters:
  - name: FEATURE_BRANCHNAME
    displayName: 'Feature branch name (used to locate package.xml)'
    type: string

  - name: VALIDATION_JOB_ID
    displayName: 'Validation Job ID (from successful PROD validation pipeline run)'
    type: string

variables:
  - group: SF-PROD-Credentials
  - name: PACKAGE_FILE
    value: 'manifest/${{ parameters.FEATURE_BRANCHNAME }}_package.xml'
  - name: ORG_ALIAS
    value: 'PROD'

pool:
  vmImage: ubuntu-latest

stages:

  - stage: Setup
    displayName: 'Setup & Auth'
    jobs:
      - job: SetupJob
        displayName: 'Install SF CLI + JWT Auth'
        steps:
          - checkout: self
            ref: refs/heads/master
            fetchDepth: 0
          - script: |
              npm install -g @salesforce/cli@latest
              sf --version
            displayName: 'Install Salesforce CLI'
          - script: |
              printf '%s' "$(SF_JWT_KEY)" > $(Agent.TempDirectory)/server.key
              chmod 600 $(Agent.TempDirectory)/server.key
            displayName: 'Write JWT key'
          - template: ../templates/sf-auth.yml
            parameters:
              sfUsername:    $(SF_USERNAME)
              sfConsumerKey: $(SF_CONSUMER_KEY)
              sfInstanceUrl: $(SF_INSTANCE_URL)
              serverKeyFile: $(Agent.TempDirectory)/server.key
              orgAlias:      $(ORG_ALIAS)
          - script: rm -f $(Agent.TempDirectory)/server.key
            displayName: 'Cleanup JWT key'
            condition: always()
          - script: |
              if [[ ! -f "$(PACKAGE_FILE)" ]]; then
                echo "❌ package.xml not found: $(PACKAGE_FILE)"; exit 1
              fi
              echo "✅ Found: $(PACKAGE_FILE)"
              cat "$(PACKAGE_FILE)"
            displayName: 'Validate package.xml exists'
          - script: |
              if [[ -z "${{ parameters.VALIDATION_JOB_ID }}" ]]; then
                echo "❌ VALIDATION_JOB_ID is required for quick deploy"; exit 1
              fi
              echo "✅ Validation Job ID: ${{ parameters.VALIDATION_JOB_ID }}"
            displayName: 'Validate Job ID provided'

  # ── Deploy stage pauses here for manual approval ────────────────────────────
  - stage: QuickDeploy
    displayName: 'Quick Deploy → PROD  ⚠️ Requires Approval'
    dependsOn: Setup
    condition: succeeded()
    jobs:
      - deployment: QuickDeployJob
        displayName: 'Salesforce Quick Deploy → PROD'
        environment: 'PROD'           # ← configure approval gate on this environment
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  ref: refs/heads/master
                  fetchDepth: 0
                - script: npm install -g @salesforce/cli@latest
                  displayName: 'Install Salesforce CLI'
                - script: |
                    printf '%s' "$(SF_JWT_KEY)" > $(Agent.TempDirectory)/server.key
                    chmod 600 $(Agent.TempDirectory)/server.key
                  displayName: 'Write JWT key'
                - template: ../templates/sf-auth.yml
                  parameters:
                    sfUsername:    $(SF_USERNAME)
                    sfConsumerKey: $(SF_CONSUMER_KEY)
                    sfInstanceUrl: $(SF_INSTANCE_URL)
                    serverKeyFile: $(Agent.TempDirectory)/server.key
                    orgAlias:      $(ORG_ALIAS)
                - script: rm -f $(Agent.TempDirectory)/server.key
                  displayName: 'Cleanup JWT key'
                  condition: always()
                - script: |
                    echo "🚀 Starting Quick Deploy with Job ID: ${{ parameters.VALIDATION_JOB_ID }}"
                    sf project deploy quick \
                      --job-id     "${{ parameters.VALIDATION_JOB_ID }}" \
                      --target-org "$(SF_USERNAME)" \
                      --wait       120
                  displayName: 'Quick Deploy → PROD'
