# ══════════════════════════════════════════════════════════════════════════════
# Salesforce — Code Analyzer Pipeline
# Manual trigger only — runs on whichever branch is selected at run time.
# ══════════════════════════════════════════════════════════════════════════════

trigger: none
pr:    none

pool:
  vmImage: ubuntu-latest

stages:

  - stage: CodeAnalyzer
    displayName: 'Salesforce Code Analyzer'
    jobs:
      - job: CodeAnalyzerJob
        displayName: 'Scan — $(Build.SourceBranchName)'
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              npm install -g @salesforce/cli@latest
              sf --version
            displayName: 'Install Salesforce CLI'

          - template: templates/code-analyzer.yml
            parameters:
              targetPath: '$(Build.SourcesDirectory)/force-app'
