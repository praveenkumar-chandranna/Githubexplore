# ══════════════════════════════════════════════════════════════════════════════
# Salesforce — Unified Validation Pipeline (checkonly)
# Org mapping:  Dev → Dev branch | QA → QA branch | UAT → UAT branch | PROD → master
# Inputs:       ORG_NAME, FEATURE_BRANCHNAME, TEST_LEVEL
# ══════════════════════════════════════════════════════════════════════════════

trigger: none

parameters:
  - name: ORG_NAME
    displayName: 'Target Org'
    type: string
    values:
      - Dev
      - QA
      - UAT
      - PROD

  - name: FEATURE_BRANCHNAME
    displayName: 'Feature branch name (used to locate package.xml)'
    type: string

  - name: TEST_LEVEL
    displayName: 'Test Level'
    type: string
    default: RunLocalTests
    values:
      - RunLocalTests
      - RunAllTestsInOrg
      - RunSpecifiedTests

variables:
  # ── Variable group: load credentials for the selected org ──────────────────
  - ${{ if eq(parameters.ORG_NAME, 'Dev') }}:
    - group: SF-Dev-Credentials
  - ${{ if eq(parameters.ORG_NAME, 'QA') }}:
    - group: SF-QA-Credentials
  - ${{ if eq(parameters.ORG_NAME, 'UAT') }}:
    - group: SF-UAT-Credentials
  - ${{ if eq(parameters.ORG_NAME, 'PROD') }}:
    - group: SF-PROD-Credentials

  # ── Branch mapping ─────────────────────────────────────────────────────────
  - name: TARGET_BRANCH
    ${{ if eq(parameters.ORG_NAME, 'Dev') }}:
      value: 'Dev'
    ${{ if eq(parameters.ORG_NAME, 'QA') }}:
      value: 'QA'
    ${{ if eq(parameters.ORG_NAME, 'UAT') }}:
      value: 'UAT'
    ${{ if eq(parameters.ORG_NAME, 'PROD') }}:
      value: 'master'

  - name: PACKAGE_FILE
    value: 'manifest/${{ parameters.FEATURE_BRANCHNAME }}_package.xml'

  - name: ORG_ALIAS
    value: ${{ parameters.ORG_NAME }}

pool:
  vmImage: ubuntu-latest

stages:

  - stage: Setup
    displayName: 'Setup & Auth'
    jobs:
      - job: SetupJob
        displayName: 'Install SF CLI + JWT Auth'
        steps:
          - checkout: self
            ref: refs/heads/$(TARGET_BRANCH)
            fetchDepth: 0
          - script: |
              npm install -g @salesforce/cli@latest
              sf --version
            displayName: 'Install Salesforce CLI'
          - script: |
              printf '%s' "$(SF_JWT_KEY)" > $(Agent.TempDirectory)/server.key
              chmod 600 $(Agent.TempDirectory)/server.key
            displayName: 'Write JWT key'
          - template: ../templates/sf-auth.yml
            parameters:
              sfUsername:    $(SF_USERNAME)
              sfConsumerKey: $(SF_CONSUMER_KEY)
              sfInstanceUrl: $(SF_INSTANCE_URL)
              serverKeyFile: $(Agent.TempDirectory)/server.key
              orgAlias:      $(ORG_ALIAS)
          - script: rm -f $(Agent.TempDirectory)/server.key
            displayName: 'Cleanup JWT key'
            condition: always()
          - script: |
              echo "🌍 Org        : ${{ parameters.ORG_NAME }}"
              echo "🌿 Branch     : $(TARGET_BRANCH)"
              echo "📦 Package    : $(PACKAGE_FILE)"
              if [[ ! -f "$(PACKAGE_FILE)" ]]; then
                echo "❌ package.xml not found: $(PACKAGE_FILE)"; exit 1
              fi
              echo "✅ Found: $(PACKAGE_FILE)"
              cat "$(PACKAGE_FILE)"
            displayName: 'Validate package.xml exists'
          - ${{ if eq(parameters.TEST_LEVEL, 'RunSpecifiedTests') }}:
            - script: |
                TEST_CLASS_FILE="manifest/${{ parameters.FEATURE_BRANCHNAME }}_TestClass.txt"
                if [[ ! -f "$TEST_CLASS_FILE" ]]; then
                  echo "❌ TestClass.txt not found: $TEST_CLASS_FILE"; exit 1
                fi
                echo "✅ Found test classes:"
                cat "$TEST_CLASS_FILE"
              displayName: 'Validate TestClass.txt exists'

  - stage: CodeAnalyzer
    displayName: 'Code Analyzer'
    dependsOn: Setup
    jobs:
      - job: CodeAnalyzerJob
        displayName: 'Run Code Analyzer'
        steps:
          - checkout: self
            ref: refs/heads/$(TARGET_BRANCH)
            fetchDepth: 0
          - script: npm install -g @salesforce/cli@latest
            displayName: 'Install Salesforce CLI'
          - template: ../templates/code-analyzer.yml
            parameters:
              targetPath: '$(Build.SourcesDirectory)/force-app'

  - stage: Validate
    displayName: 'Validate (checkonly) → ${{ parameters.ORG_NAME }}'
    dependsOn: CodeAnalyzer
    jobs:
      - job: ValidateJob
        displayName: 'Salesforce Validate → ${{ parameters.ORG_NAME }}'
        steps:
          - checkout: self
            ref: refs/heads/$(TARGET_BRANCH)
            fetchDepth: 0
          - script: npm install -g @salesforce/cli@latest
            displayName: 'Install Salesforce CLI'
          - script: |
              printf '%s' "$(SF_JWT_KEY)" > $(Agent.TempDirectory)/server.key
              chmod 600 $(Agent.TempDirectory)/server.key
            displayName: 'Write JWT key'
          - template: ../templates/sf-auth.yml
            parameters:
              sfUsername:    $(SF_USERNAME)
              sfConsumerKey: $(SF_CONSUMER_KEY)
              sfInstanceUrl: $(SF_INSTANCE_URL)
              serverKeyFile: $(Agent.TempDirectory)/server.key
              orgAlias:      $(ORG_ALIAS)
          - script: rm -f $(Agent.TempDirectory)/server.key
            displayName: 'Cleanup JWT key'
            condition: always()
          - template: ../templates/sf-validate.yml
            parameters:
              packageFile: $(PACKAGE_FILE)
              testLevel:   ${{ parameters.TEST_LEVEL }}
              sfUsername:  $(SF_USERNAME)
